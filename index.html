<title>Coral Cove</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800;900&display=swap">
<style>
  :root{
    --deep:#0a3d4a; --deep-2:#0d5262; --lagoon:#1c8c93; --lagoon-light:#4fb3ba;
    --foam:#f4fbf9; --foam-2:#e7f4f1; --coral:#ff7a5c; --coral-dark:#e8593c;
    --sun:#ffc94d; --sun-dark:#e8a716; --seaweed:#2f6d5c;
    --ink:#0b2b33; --ink-soft:#4a6a70;
    --surface:#ffffff; --border:#d3ece6;
    --shadow:0 10px 26px rgba(10,61,74,.14);
    --shadow-sm:0 4px 12px rgba(10,61,74,.10);
    --r-lg:28px; --r-md:18px; --r-sm:12px;
    --ok-bg:#eafaf3; --ok-ink:#1f7a5c; --bad-bg:#fdeceb; --bad-ink:#c65b46;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --foam:#07232a; --foam-2:#0c2e36; --surface:#0f3942; --border:#17515f;
      --ink:#eaf6f4; --ink-soft:#a9cbc7; --lagoon-light:#5fc2c9; --seaweed:#74d1b3;
      --shadow:0 10px 26px rgba(0,0,0,.45); --shadow-sm:0 4px 12px rgba(0,0,0,.35);
      --ok-bg:#123b2d; --ok-ink:#74d1b3; --bad-bg:#3a1f1a; --bad-ink:#ff8a72;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --foam:#07232a; --foam-2:#0c2e36; --surface:#0f3942; --border:#17515f;
    --ink:#eaf6f4; --ink-soft:#a9cbc7; --lagoon-light:#5fc2c9; --seaweed:#74d1b3;
    --shadow:0 10px 26px rgba(0,0,0,.45); --shadow-sm:0 4px 12px rgba(0,0,0,.35);
    --ok-bg:#123b2d; --ok-ink:#74d1b3; --bad-bg:#3a1f1a; --bad-ink:#ff8a72;
    color-scheme: dark;
  }

  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--foam); color:var(--ink);
    font-family:'Nunito',system-ui,-apple-system,sans-serif;
    min-height:100%;
    padding-inline: max(16px, env(safe-area-inset-left,0px)) max(16px, env(safe-area-inset-right,0px));
  }
  html,body{height:100%;}
  h1,h2,h3,.display{ font-family:'Baloo 2', system-ui, sans-serif; text-wrap:balance; }
  button{ font-family:inherit; }
  .tabular{ font-variant-numeric: tabular-nums; }
  [hidden]{ display:none !important; }
  a{ color:inherit; }

  #app{ max-width:760px; margin:0 auto; padding-block:20px 40px; position:relative; }

  /* ---------- top bar / stats ---------- */
  .topbar{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:18px; flex-wrap:wrap; }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand-title{ font-size:1.7rem; font-weight:800; color:var(--deep); margin:0; }
  :root:not([data-theme="light"]) .brand-title{ }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .brand-title{ color:var(--lagoon-light);} }
  :root[data-theme="dark"] .brand-title{ color:var(--lagoon-light); }
  .brand-tag{ margin:0; font-size:.85rem; color:var(--ink-soft); font-weight:600; }

  .stats-row{ display:flex; gap:8px; }
  .pill{
    display:flex; align-items:center; gap:6px; background:var(--surface); border:1px solid var(--border);
    padding:8px 12px; border-radius:999px; font-weight:800; font-size:.95rem; box-shadow:var(--shadow-sm);
  }
  .pill .icon{ font-size:1.05rem; }
  .pill.streak{ color:var(--coral-dark); }
  .pill.stars{ color:var(--sun-dark); }

  /* ---------- back nav ---------- */
  .nav-row{ display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  .back-btn{
    display:flex; align-items:center; gap:6px; background:var(--surface); border:1px solid var(--border);
    color:var(--ink); font-weight:800; padding:9px 14px 9px 10px; border-radius:999px; cursor:pointer; box-shadow:var(--shadow-sm);
  }
  .back-btn:hover{ background:var(--foam-2); }
  .nav-title{ font-weight:800; font-size:1.25rem; color:var(--deep); }
  :root[data-theme="dark"] .nav-title, @media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .nav-title{color:var(--lagoon-light);}}

  /* ---------- mascot ---------- */
  .mascot-wrap{ display:flex; justify-content:center; margin: 6px 0 10px; }
  .mascot{ width:104px; height:104px; animation: bob 3.2s ease-in-out infinite; filter: drop-shadow(0 6px 10px rgba(10,61,74,.18)); }
  .mascot.big{ width:150px; height:150px; }
  .mascot.celebrate{ animation: wiggle .6s ease-in-out 2; }
  @keyframes bob{ 0%,100%{ transform: translateY(0) rotate(-2deg);} 50%{ transform: translateY(-8px) rotate(2deg);} }
  @keyframes wiggle{ 0%,100%{ transform: rotate(0) scale(1);} 25%{ transform: rotate(-8deg) scale(1.05);} 75%{ transform: rotate(8deg) scale(1.05);} }
  @media (prefers-reduced-motion: reduce){ .mascot, .mascot.celebrate{ animation:none; } }

  /* ---------- decorative bubbles ---------- */
  .bubbles{ position:absolute; inset:0; overflow:hidden; pointer-events:none; z-index:0; border-radius:inherit; }
  .bubble{ position:absolute; bottom:-40px; border-radius:50%; background:radial-gradient(circle at 30% 30%, rgba(255,255,255,.85), rgba(255,255,255,.05) 70%); opacity:.5; animation: rise linear infinite; }
  @keyframes rise{ 0%{ transform:translateY(0); opacity:.55;} 90%{opacity:.35;} 100%{ transform:translateY(-380px); opacity:0; } }
  @media (prefers-reduced-motion: reduce){ .bubble{ animation:none; display:none; } }

  /* ---------- banner ---------- */
  .banner{
    background:var(--sun); color:#4a3300; font-weight:700; font-size:.88rem;
    padding:10px 14px; border-radius:var(--r-sm); margin-bottom:16px; box-shadow:var(--shadow-sm);
  }

  /* ---------- deck grid ---------- */
  .deck-grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(210px,1fr)); gap:14px; }
  .deck-card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg);
    padding:18px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:10px;
    position:relative; overflow:hidden;
  }
  .deck-emoji{ font-size:2.4rem; line-height:1; }
  .deck-name{ font-family:'Baloo 2',sans-serif; font-weight:700; font-size:1.15rem; margin:0; color:var(--deep); }
  :root[data-theme="dark"] .deck-name{ color:var(--lagoon-light); }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .deck-name{ color:var(--lagoon-light);} }
  .deck-meta{ font-size:.85rem; color:var(--ink-soft); font-weight:700; }
  .deck-badge{
    align-self:flex-start; font-size:.78rem; font-weight:800; padding:4px 10px; border-radius:999px;
    background:var(--foam-2); color:var(--seaweed);
  }
  .deck-badge.due{ background:var(--coral); color:#fff; }
  .deck-actions{ display:flex; gap:8px; margin-top:auto; }

  /* Archived decks — visible only in Manage Decks mode, never to a student. */
  .deck-card.archived{
    border:2px solid var(--sun-dark);
    box-shadow:0 0 0 3px rgba(255,201,77,.35), 0 0 18px 2px rgba(255,201,77,.55);
    animation:archiveGlow 2.6s ease-in-out infinite;
  }
  @keyframes archiveGlow{
    0%,100%{ box-shadow:0 0 0 3px rgba(255,201,77,.30), 0 0 14px 1px rgba(255,201,77,.45); }
    50%{ box-shadow:0 0 0 3px rgba(255,201,77,.45), 0 0 22px 4px rgba(255,201,77,.75); }
  }
  .archived-tag{
    position:absolute; top:10px; right:-30px; background:var(--sun-dark); color:#4a3300; font-size:.68rem; font-weight:800;
    padding:3px 34px; transform:rotate(38deg); box-shadow:var(--shadow-sm);
  }

  /* Manage Decks filter tabs -- All / Live / Archived, replacing what used to be a separate archive page. */
  .filter-tabs{ display:flex; gap:8px; flex-wrap:wrap; margin:4px 0 14px; }
  .filter-tab{
    border:none; border-radius:999px; background:var(--foam-2); color:var(--ink); font-weight:800;
    font-size:.85rem; padding:8px 14px; cursor:pointer; transition:transform .12s ease, background .15s ease;
  }
  .filter-tab:active{ transform:scale(.96); }
  .filter-tab.active{ background:var(--lagoon); color:#fff; }
  .filter-tab .filter-count{ opacity:.75; font-weight:700; margin-left:2px; }
  .filter-tab.active .filter-count{ opacity:.9; }
  /* Subject tabs -- Reading / Math / Korean / etc. Coral accent so they read as a distinct row from
     the lagoon-colored Live/Archived filter above them when both are showing (Manage Decks). */
  .subject-tabs{ display:flex; gap:8px; flex-wrap:wrap; margin:-2px 0 14px; }
  .subject-tab{
    border:none; border-radius:999px; background:var(--foam-2); color:var(--ink); font-weight:800;
    font-size:.85rem; padding:8px 14px; cursor:pointer; transition:transform .12s ease, background .15s ease;
  }
  .subject-tab:active{ transform:scale(.96); }
  .subject-tab.active{ background:var(--coral); color:#fff; }
  .subject-tab .filter-count{ opacity:.75; font-weight:700; margin-left:2px; }
  .subject-tab.active .filter-count{ opacity:.9; }
  .empty-filter-note{
    color:var(--ink-soft); font-weight:700; text-align:center; padding:28px 12px; font-size:.95rem;
  }
  .btn{
    border:none; border-radius:999px; font-weight:800; cursor:pointer; padding:10px 16px; font-size:.92rem;
    transition: transform .12s ease;
  }
  .btn:active{ transform: scale(.96); }
  .btn:focus-visible, .back-btn:focus-visible, .icon-btn:focus-visible, input:focus-visible, textarea:focus-visible{
    outline: 3px solid var(--sun-dark); outline-offset: 2px;
  }
  .btn-primary{ background:var(--lagoon); color:#fff; box-shadow:0 4px 0 var(--deep); }
  .btn-primary:active{ box-shadow:0 2px 0 var(--deep); transform: translateY(2px) scale(.98); }
  .btn-ghost{ background:var(--foam-2); color:var(--ink); }
  .btn-coral{ background:var(--coral); color:#fff; box-shadow:0 4px 0 var(--coral-dark); }
  .btn-coral:active{ box-shadow:0 2px 0 var(--coral-dark); transform: translateY(2px) scale(.98); }
  .icon-btn{ background:var(--foam-2); border:none; width:38px; height:38px; border-radius:50%; cursor:pointer; font-size:1rem; }
  .icon-btn:hover{ background:var(--border); }

  .add-deck-card{
    background:transparent; border:2px dashed var(--border); border-radius:var(--r-lg); min-height:150px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; cursor:pointer; color:var(--ink-soft);
    font-weight:800; font-family:'Baloo 2',sans-serif;
  }
  .add-deck-card:hover{ border-color:var(--lagoon-light); color:var(--lagoon); }
  .add-deck-card .plus{ font-size:1.8rem; }

  /* ---------- study ---------- */
  .progress-track{ display:flex; gap:6px; justify-content:center; margin:6px 0 18px; flex-wrap:wrap; }
  .dot{ width:10px; height:10px; border-radius:50%; background:var(--border); }
  .dot.done{ background:var(--seaweed); }
  .dot.current{ background:var(--coral); transform:scale(1.3); }

  /* ---------- swim-progress critter bar ---------- */
  .critter-label{ text-align:center; font-size:.78rem; font-weight:800; color:var(--ink-soft); margin:4px 0 6px; }
  .critter-track{ position:relative; height:16px; background:var(--foam-2); border:1px solid var(--border); border-radius:999px; margin:0 26px 34px; }
  .critter-track-fill{ position:absolute; top:0; left:0; height:100%; border-radius:999px; background:linear-gradient(90deg, var(--lagoon-light), var(--lagoon)); transition:width .5s cubic-bezier(.34,1.4,.64,1); }
  .critter-swim{ position:absolute; top:50%; left:0; width:44px; height:44px; transform:translate(-50%,-50%); transition:left .5s cubic-bezier(.34,1.4,.64,1); filter:drop-shadow(0 2px 4px rgba(10,61,74,.28)); }
  .critter-swim svg{ width:100%; height:100%; display:block; }
  .critter-swim.oops{ animation:critterOops .5s ease; }
  @keyframes critterOops{
    0%{ transform:translate(-50%,-50%) rotate(0deg); }
    25%{ transform:translate(-50%,-50%) rotate(-10deg); }
    50%{ transform:translate(-50%,-50%) rotate(7deg); }
    75%{ transform:translate(-50%,-50%) rotate(-4deg); }
    100%{ transform:translate(-50%,-50%) rotate(0deg); }
  }

  .stage{
    position:relative; min-height:320px; border-radius:var(--r-lg); background:linear-gradient(180deg, var(--foam-2), var(--foam));
    border:1px solid var(--border); padding:26px 16px 30px; overflow:hidden;
    animation:stageEnter .32s cubic-bezier(.22,1,.36,1) both;
    /* Swiping/dragging over card text shouldn't start a native text selection or drag — that can
       steal the pointer gesture from our own swipe handling. */
    -webkit-user-select:none; user-select:none; -webkit-user-drag:none;
  }
  .stage img, .stage *{ -webkit-user-drag:none; }
  /* TikTok-style vertical feed: each new card whooshes up into place; answering the current one
     sends it whooshing up and out before the next one arrives — see .stage-exit, toggled in JS. */
  @keyframes stageEnter{
    0%{ transform:translateY(38px); opacity:0; }
    100%{ transform:translateY(0); opacity:1; }
  }
  .stage.stage-exit{
    animation:stageExit .2s cubic-bezier(.4,0,1,1) both;
    pointer-events:none; /* locked — no further taps land while the card is on its way out */
  }
  @keyframes stageExit{
    0%{ transform:translateY(0); opacity:1; }
    100%{ transform:translateY(-46px); opacity:0; }
  }
  /* Swipe back to review the one card just answered — a mirror-image transition: exits down,
     enters from above, so "backward" always reads as the opposite motion of "forward". */
  .stage.stage-exit-down{
    animation:stageExitDown .2s cubic-bezier(.4,0,1,1) both;
    pointer-events:none;
  }
  @keyframes stageExitDown{
    0%{ transform:translateY(0); opacity:1; }
    100%{ transform:translateY(46px); opacity:0; }
  }
  .stage.stage-peek{
    animation:stagePeekEnter .32s cubic-bezier(.22,1,.36,1) both;
    border:2px solid var(--sun-dark);
    box-shadow:0 0 0 3px rgba(255,201,77,.28);
    cursor:pointer;
  }
  @keyframes stagePeekEnter{
    0%{ transform:translateY(-38px); opacity:0; }
    100%{ transform:translateY(0); opacity:1; }
  }
  /* Live drag state: JS drives the transform directly, so no CSS transition should fight it;
     stage-snapback re-enables one, briefly, purely to animate the release-and-cancel bounce. */
  .stage.stage-dragging{ transition:none; touch-action:none; }
  .stage.stage-snapback{ transition:transform .25s cubic-bezier(.34,1.4,.64,1); transform:translateY(0); }
  .peek-badge{ text-align:center; font-weight:800; font-size:.95rem; margin-top:14px; position:relative; z-index:1; }
  .peek-badge.peek-right{ color:var(--ok-ink); }
  .peek-badge.peek-wrong{ color:var(--bad-ink); }
  @media (prefers-reduced-motion: reduce){
    .stage{ animation:none; }
    .stage.stage-exit{ animation:none; }
    .stage.stage-exit-down{ animation:none; }
    .stage.stage-peek{ animation:none; }
  }

<script>
(function(){
  "use strict";

  /* ============ scheduler (Anki-style SM-2) ============ */
  var LEARN_STEPS_MIN = [1, 10];      // new cards step through these (minutes) before graduating
  var RELEARN_STEPS_MIN = [10];       // a lapsed review card steps through these before returning to review
  var GRADUATING_DAYS = 1;            // interval a card gets when it finishes the learn steps on "Good"
  var EASY_GRADUATE_DAYS = 4;         // interval a card gets when "Easy" skips the remaining learn steps
  var EASE_START = 2.5;
  var EASE_MIN = 1.3;
  var HARD_INTERVAL_MULT = 1.2;

  var LAPSE_MIN_DAYS = 1;             // interval a card gets after relearning from a lapse — deliberately NOT scaled

  var LEECH_THRESHOLD = 8;            // lapses at which a card is flagged as a "leech" (needs extra practice)

  // Parents can pick one of these in Manage Decks → ⚙️ Settings. App-wide, not per-deck. Three
  // dimensions per level, all pulling in the same direction as the level gets harder:
  //  - roundSize: more questions per sitting.
  //  - intervalMult: how far out a card gets pushed once it's answered well — a bigger multiplier
  //    means a longer gap before it's tested again, which is a truer test of real retention rather
  //    than short-term memorization. (Deliberately NOT applied to the post-lapse recovery interval
  //    above, or to the struggle-shrink below, so this only stretches cards that are going well.)
  //  - struggleShrink: when a card is missed several times in a row, each consecutive miss shrinks
  //    its relearn delay by this factor (struggleShrink^consecutiveMisses) and cuts deeper into its
  //    ease, so it comes back sooner and more often relative to cards that aren't a struggle — the
  //    "if it seems like they're struggling, reinforce it more" behavior, strongest on Hard.
  var DIFFICULTIES = [
    {
      id: 'easy',
      icon: '🌱',
      name: 'Easy',
      roundSize: 4,
      intervalMult: 0.7,
      strugglePenalty: 0.08,
      struggleShrink: 0.8,
      blurb: '4 questions a round, and reviews come back a bit sooner across the board — gentle repetition rather than a real stretch on memory.'
    },
    {
      id: 'medium',
      icon: '🌊',
      name: 'Medium',
      roundSize: 6,
      intervalMult: 1.0,
      strugglePenalty: 0.20,
      struggleShrink: 0.55,
      blurb: 'The default — 6 questions a round with standard spacing.'
    },
    {
      id: 'hard',
      icon: '🔥',
      name: 'Hard',
      roundSize: 10,
      intervalMult: 1.4,
      strugglePenalty: 0.35,
      struggleShrink: 0.3,
      blurb: '10 questions a round, and cards you know well get spaced out further — a real test of long-term memory. Cards you keep missing get drilled far more often than the rest.'
    }
  ];

  function currentDifficulty(){
    var id = S.settings.difficulty || 'medium';
    for(var i=0;i<DIFFICULTIES.length;i++){ if(DIFFICULTIES[i].id === id) return DIFFICULTIES[i]; }
    return DIFFICULTIES[1];

  // ---------- gradual new-card introduction ----------
  // A deck with only a handful of cards (the built-in decks) should behave exactly like before:
  // every card available right away. A big deck (like a 300-word vocabulary set) should NOT dump
  // every unseen card into the pool at once — that's overwhelming and defeats spaced repetition,
  // which relies on a card being reviewed a few times while it's still fresh. Instead, only a
  // limited number of cards are ever "in flight" (introduced but not yet solidly known) for a
  // given deck at once; a brand-new card is unlocked only once an earlier one graduates out of
  // that window by becoming well-established.
  var NEW_CARD_WINDOW = 15;      // max cards "in flight" (being learned/reviewed, not yet mastered)
                                  // per deck at any one time. Every built-in deck has well under
                                  // this many cards total, so this never engages for them — it only
                                  // kicks in once a deck is bigger than its own natural window.
  var MASTERY_INTERVAL_DAYS = 7; // a review-state card frees its window slot once its interval
                                  // reaches this many days — "known well enough" to stop blocking
                                  // the next unseen card, even though it's still scheduled to come
                                  // back for review later.

  function cardState(c){ return c.state || ((c.interval||0) > 0 ? 'review' : 'new'); }

  // Builds the pool startStudy() draws a round from: cards already due for review, plus as many
  // not-yet-seen cards as the deck's new-card window currently allows. Replaces the older "every
  // card with a due timestamp in the past" pool, which — for a huge deck — meant literally every
  // unseen card (due defaults to "now") was fair game from the very first round.
  function buildStudyPool(cards){
    var now = Date.now();
    var reviewDue = cards.filter(function(c){
      var st = cardState(c);
      return st !== 'new' && (c.due||0) <= now;
    });
    var newCards = cards.filter(function(c){ return cardState(c) === 'new'; })
      .sort(function(a,b){ return (a.createdAt||0) - (b.createdAt||0); }); // deck's own curriculum order

      var st = cardState(c);
      if(st === 'new') return false;
      if(st === 'review' && (c.interval||0) >= MASTERY_INTERVAL_DAYS) return false;

      // between due timestamps). Rather than leave the round empty, let one new card through so
      // studying never dead-ends; still just one at a time, so the gradual-introduction spirit holds.
      pool = newCards.length ? newCards.slice(0, 1) : cards;

    return pool;

  // S.settings.algorithm and is app-wide (not per-deck). Two axes differ on purpose: how the
  // scheduling math works (adaptive SM-2 vs. fixed Leitner boxes), and whether answer speed factors
  // into grading at all (only 'sm2_speed' looks at elapsed time).
  var ALGORITHMS = [
    {
      id: 'sm2_speed',
      icon: '⚡',
      name: 'Standard + Speed',
      blurb: 'Adaptive scheduling (like Anki) that also factors in how fast an answer came — quick, confident answers get spaced out further than slow, hesitant ones. This is the default.'
    },
    {
      id: 'sm2_plain',
      icon: '🎯',
      name: 'Standard (Accuracy Only)',
      blurb: 'The same adaptive scheduling engine, but only right vs. wrong matters — how long it took to answer has no effect on when a card comes back.'
    },
    {
      id: 'leitner',
      icon: '🗃️',
      name: 'Simple Boxes',
      blurb: 'A simpler, more predictable system — a card moves up one box after a correct answer and back to box 1 after a miss. Easier to see why a card is showing up again.'
    }
  ];

  function fuzzedDays(days){
    if(days < 2) return days;
    var pct = days < 7 ? 0.25 : (days < 30 ? 0.15 : 0.05);
    var delta = days * pct;
    return Math.max(1, Math.round(days + (Math.random()*2 - 1) * delta));
  }

  function gradeCard(card, rating, now, diff){
    now = now || Date.now();
    diff = diff || currentDifficulty();
    var ease = card.ease || EASE_START;
    var interval = card.interval || 0;
    var reps = card.reps || 0;
    var lapses = card.lapses || 0;
    var state = card.state || (interval > 0 ? 'review' : 'new');
    var step = card.learningStep || 0;
    var isLeech = !!card.isLeech;
    var priorStreak = card.strugglingStreak || 0; // consecutive misses BEFORE this answer
    var streak = (rating === 'again') ? priorStreak + 1 : 0; // returned/persisted streak, after this answer
    var due;

    function minutesFromNow(m){ return now + m*60000; }
    function daysFromNow(d){ return now + d*86400000; }
    // Each consecutive miss on this card shrinks its relearn delay further — struggleShrink^priorStreak,
    // capped so it never collapses to near-zero. A single miss (priorStreak 0 going in) is unaffected —
    // this only kicks in once a card is already being missed repeatedly, which is the "seems like
    // they're struggling" signal, not a one-off wrong answer.
    function struggleMinutes(baseMin){
      return baseMin * Math.pow(diff.struggleShrink, Math.min(priorStreak, 3));
    }

    if(state === 'new' || state === 'learning'){
      if(rating === 'again'){
        step = 0; state = 'learning';
        due = minutesFromNow(struggleMinutes(LEARN_STEPS_MIN[0]));
      } else if(rating === 'hard'){
        state = 'learning';
        due = minutesFromNow(LEARN_STEPS_MIN[step] || LEARN_STEPS_MIN[LEARN_STEPS_MIN.length-1]);
      } else if(rating === 'good'){
        step += 1;
        if(step >= LEARN_STEPS_MIN.length){
          state = 'review'; interval = Math.max(1, Math.round(GRADUATING_DAYS * diff.intervalMult)); reps += 1; step = 0;
          due = daysFromNow(interval);
        } else {
          state = 'learning';
          due = minutesFromNow(LEARN_STEPS_MIN[step]);
        }
      } else { // easy — skip remaining steps, graduate now
        state = 'review'; interval = Math.max(1, Math.round(EASY_GRADUATE_DAYS * diff.intervalMult)); reps += 1; step = 0;
        due = daysFromNow(interval);
      }
    } else if(state === 'relearning'){
      if(rating === 'again'){
        step = 0; state = 'relearning';
        due = minutesFromNow(struggleMinutes(RELEARN_STEPS_MIN[0]));
      } else if(rating === 'hard'){
        state = 'relearning';
        due = minutesFromNow(RELEARN_STEPS_MIN[step] || RELEARN_STEPS_MIN[RELEARN_STEPS_MIN.length-1]);
      } else {
        step += 1;
        if(step >= RELEARN_STEPS_MIN.length || rating === 'easy'){
          // Deliberately NOT scaled by intervalMult (see the note by LAPSE_MIN_DAYS above) — a card
          // that just recovered from a lapse gets rechecked promptly regardless of difficulty.
          state = 'review'; interval = LAPSE_MIN_DAYS; step = 0;
          due = daysFromNow(interval);
        } else {
          state = 'relearning';
          due = minutesFromNow(RELEARN_STEPS_MIN[step]);
        }

    } else { // review
      if(rating === 'again'){
        lapses += 1;
        ease = Math.max(EASE_MIN, ease - diff.strugglePenalty);
        state = 'relearning'; step = 0;
        due = minutesFromNow(struggleMinutes(RELEARN_STEPS_MIN[0]));
        if(lapses >= LEECH_THRESHOLD) isLeech = true;
      } else if(rating === 'hard'){
        ease = Math.max(EASE_MIN, ease - 0.15);
        interval = fuzzedDays(Math.max(interval + 1, Math.round(interval * HARD_INTERVAL_MULT * diff.intervalMult)));
        reps += 1;
        due = daysFromNow(interval);
      } else if(rating === 'good'){
        interval = fuzzedDays(Math.max(interval + 1, Math.round(interval * ease * diff.intervalMult)));

  function buildSubjectTabs(decks){

  function todayISO(d){ d = d || new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function shuffle(arr){ var a = arr.slice(); for(var i=a.length-1;i>0;i--){ var j = Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }

  /* ============ rendering ============ */
  var app = document.getElementById('app');
  app.innerHTML = '<div class="lock-screen"><h2>🌊 Loading Coral Cove…</h2></div>';

  function render(){
    if(!S.booted) return; // wait for settings to load before showing anything (avoids a lock-screen flash)
    if(S.pinPromptFor === 'setup') return renderPinSetup();
    if(S.pinPromptFor) return renderPinPad(S.pinPromptFor);
    if(!S.settings.pinHash) return renderPinSetup(); // safety net — no PIN saved yet
    if(S.view === 'sessionResults') return renderSessionResults();
    if(S.managingDecks) return (S.view === 'editor') ? renderEditor() : (S.view === 'stats' ? renderStats() : (S.view === 'deckStats' ? renderDeckStats() : (S.view === 'settings' ? renderSettingsPage() : renderHome())));
    if(!S.sessionActive) return renderLocked();
    if(S.view === 'home') return renderHome();
    if(S.view === 'study') return renderStudy();
    if(S.view === 'editor') return renderEditor();
    if(S.view === 'summary') return renderSummary();
    if(S.view === 'stats') return renderStats();
    if(S.view === 'deckStats') return renderDeckStats();
  }

  function ctrlRowHTML(){
    var soundIcon = Sound.isEnabled() ? '🔊' : '🔇';
    return '' +
      '<div class="ctrl-row">' +
        '<button type="button" class="icon-btn" data-act="toggle-sound" aria-label="Turn sound '+(Sound.isEnabled()?'off':'on')+'" title="Sound">'+soundIcon+'</button>' +
        '<button type="button" class="icon-btn" data-act="end-session" aria-label="End session" title="End session">🔒</button>' +
      '</div>';
  }
  function wireCtrlRow(){
    var s = app.querySelector('[data-act="toggle-sound"]');
    if(s) s.addEventListener('click', function(){ Sound.setEnabled(!Sound.isEnabled()); render(); });
    var e = app.querySelector('[data-act="end-session"]');
    if(e) e.addEventListener('click', function(){
      if(S.adultUnlocked){ endSessionNow(); return; }
      S.pinInput=''; S.pinError=''; S.pinShake=false; S.pinPromptFor='end'; render();
    });
  }

  /* ---------- LOCK SCREEN + PIN PAD ---------- */
  function renderLocked(){
    app.innerHTML = '' +
      '<div class="mascot-wrap">'+mascotSVG('big')+'</div>' +
      '<div class="lock-screen">' +
        '<h2>🔒 Coral Cove is resting</h2>' +
        '<p>Ask a grown-up to start today\'s session.</p>' +
        '<button type="button" class="btn btn-primary" data-act="ask-start">I\'m a grown-up — Start Session</button>' +
        '<button type="button" class="btn btn-ghost" data-act="ask-manage" style="margin-top:10px;">🔧 Manage Decks</button>' +
      '</div>';
    app.querySelector('[data-act="ask-start"]').addEventListener('click', function(){
      Sound.unlock();
      if(S.adultUnlocked){ beginSession(); return; }
      S.pinInput=''; S.pinError=''; S.pinShake=false;
      S.pinPromptFor = 'start';
      render();
    });
    app.querySelector('[data-act="ask-manage"]').addEventListener('click', function(){
      Sound.unlock();
      if(S.adultUnlocked){ enterManageMode(); return; }
      S.pinInput=''; S.pinError=''; S.pinShake=false;
      S.pinPromptFor = 'manage';
      render();
    });
  }

  function pinPadHTML(title, sub, cancelLabel){
    var dots = '';
    for(var i=0;i<4;i++){ dots += '<span class="pin-dot '+(i<S.pinInput.length?'filled':'')+'"></span>'; }
    var keyHTML = [1,2,3,4,5,6,7,8,9].map(function(k){
      return '<button type="button" class="pin-key" data-digit="'+k+'">'+k+'</button>';
    }).join('');
    keyHTML += '<button type="button" class="pin-key" data-act="pin-back" aria-label="Backspace">⌫</button>';
    keyHTML += '<button type="button" class="pin-key" data-digit="0">0</button>';
    keyHTML += '<span></span>';
    return '' +
      '<div class="lock-screen">' +
        '<h2>'+title+'</h2>' +
        '<p>'+sub+'</p>' +
        '<div class="pin-wrap">' +
          '<div class="pin-dots '+(S.pinShake?'shake':'')+'">'+dots+'</div>' +
          '<div class="pin-error">'+(S.pinError||'&nbsp;')+'</div>' +
          '<div class="pin-grid">'+keyHTML+'</div>' +
          (cancelLabel ? '<button type="button" class="pin-cancel" data-act="pin-cancel">'+cancelLabel+'</button>' : '') +
        '</div>' +
      '</div>';
  }

  function wirePinKeys(onFilled, onCancel){
    app.querySelectorAll('[data-digit]').forEach(function(b){
      b.addEventListener('click', function(){
        if(S.pinInput.length >= 4) return;
        Sound.tap();
        S.pinInput += b.dataset.digit;
        S.pinError = ''; S.pinShake = false;
        var filled = S.pinInput.length === 4;
        render();
        if(filled) setTimeout(onFilled, 220);
      });
    });
    var back = app.querySelector('[data-act="pin-back"]');
    if(back) back.addEventListener('click', function(){
      if(!S.pinInput.length) return;
      Sound.tap();
      S.pinInput = S.pinInput.slice(0, -1);
      S.pinError = '';
      render();
    });
    var cancel = app.querySelector('[data-act="pin-cancel"]');
    if(cancel && onCancel) cancel.addEventListener('click', onCancel);
  }

  function shakeAndClear(msg){
    S.pinError = msg;
    S.pinShake = true;
    S.pinInput = '';
    Sound.wrong();
    render();
    setTimeout(function(){ S.pinShake = false; render(); }, 420);
  }

  function renderPinSetup(){
    var step = S.pinSetupStep || 1;
    var title = step === 1 ? '🔐 Create a Parent PIN' : '🔐 Confirm your PIN';
    var sub = step === 1
      ? 'Choose 4 digits. You\'ll use this PIN to start and end sessions, and to edit decks.'
      : 'Enter the same 4 digits again to confirm.';
    app.innerHTML = pinPadHTML(title, sub, null);
    wirePinKeys(submitPinSetup, null);
  }

  function submitPinSetup(){
    var step = S.pinSetupStep || 1;
    if(step === 1){
      S.pinSetupFirst = S.pinInput;
      S.pinInput = '';
      S.pinSetupStep = 2;
      render();
      return;
    }
    if(S.pinInput === S.pinSetupFirst){
      var newSettings = Object.assign({}, S.settings, { pinHash: pinHash(S.pinInput) });
      S.settings = newSettings;
      S.store.setSettings(newSettings).then(function(){
        S.pinInput = ''; S.pinSetupStep = 1; S.pinSetupFirst = '';
        S.pinPromptFor = null;
        render();
      });
    } else {
      S.pinSetupStep = 1;
      S.pinSetupFirst = '';
      shakeAndClear('Those don\'t match — let\'s try again.');
    }
  }

  function pinPadTitles(kind){
    if(kind === 'start') return ['🔐 Start Session', 'Ask a grown-up to enter the PIN to begin.'];
    if(kind === 'end') return ['🔐 End Session', 'Enter the PIN to finish and lock Coral Cove.'];
    if(kind === 'exit') return ['🔐 Leave This Deck?', 'Ask a grown-up to enter the PIN to head back before finishing.'];
    if(kind === 'manage') return ['🔐 Manage Decks', 'Enter the PIN to add or edit decks.'];
    return ['🔐 Parent PIN', 'Enter the PIN to edit decks.'];
  }

  function renderPinPad(kind){
    var t = pinPadTitles(kind);
    app.innerHTML = pinPadHTML(t[0], t[1], 'Cancel');
    wirePinKeys(function(){ submitPin(kind); }, function(){ cancelPinPrompt(kind); });
  }

  // ---- the actual actions each PIN kind unlocks, pulled out so an already-unlocked grown-up can
  // jump straight here without the PIN pad ever appearing (see S.adultUnlocked). ----
  function beginSession(){
    S.sessionTally = defaultTally();
    S.sessionActive = true;
    var startSettings = Object.assign({}, S.settings, { sessionActive: true, sessionStartedAt: S.sessionTally.startedAt });
    S.settings = startSettings;
    Promise.all([S.store.setSettings(startSettings), S.store.setSessionTally(S.sessionTally)]).then(function(){
      Sound.sessionStart();
      S.pinPromptFor = null;
      S.view = 'home';
      render();
    });
  }
  function endSessionNow(){
    var tally = S.sessionTally || defaultTally();
    S.finishedTally = Object.assign({}, tally, { endedAt: Date.now() });
    S.sessionActive = false;
    var endSettings = Object.assign({}, S.settings, { sessionActive: false });
    S.settings = endSettings;
    Promise.all([S.store.setSettings(endSettings), S.store.setSessionTally(S.finishedTally)]).then(function(){
      Sound.sessionEnd();
      S.pinPromptFor = null;
      S.view = 'sessionResults';
      render();
    });
  }
  function enterManageMode(){
    S.pinPromptFor = null;
    S.managingDecks = true;
    S.view = 'home';
    refreshDueCounts().then(render);
  }

  function submitPin(kind){
    var ok = !!S.settings.pinHash && pinHash(S.pinInput) === S.settings.pinHash;
    if(!ok){
      shakeAndClear('That\'s not it — try again.');
      return;
    }
    S.pinInput = ''; S.pinError = ''; S.pinShake = false;
    // The mid-round exit guard ('exit') deliberately never grants this -- it's the one prompt
    // that's supposed to keep asking every time, so a kid can't quit a round unsupervised just
    // because a grown-up unlocked something earlier.
    if(kind !== 'exit') S.adultUnlocked = true;
    if(kind === 'start'){
      beginSession();
    } else if(kind === 'end'){
      endSessionNow();
    } else if(kind === 'edit'){
      S.pinPromptFor = null;
      var pe = S.pendingEdit || {};
      S.pendingEdit = null;
      openEditorUnlocked(pe.deckId, pe.focusName);
    } else if(kind === 'exit'){
      S.pinPromptFor = null;
      goHome();
    } else if(kind === 'manage'){
      enterManageMode();
    }
  }

  function cancelPinPrompt(kind){
    S.pinInput = ''; S.pinError = ''; S.pinShake = false;
    if(kind === 'edit') S.pendingEdit = null;
    S.pinPromptFor = null;
    render();
  }

  function goLocked(){
    S.view = 'home';
    S.currentDeckId = null;
    S.finishedTally = null;
    if(S.unsubCards){ S.unsubCards(); S.unsubCards = null; }
    render();
  }

  function renderSessionResults(){
    var t = S.finishedTally || defaultTally();
    var mins = t.endedAt ? Math.max(1, Math.round((t.endedAt - t.startedAt) / 60000)) : 0;
    var total = t.reviewedCount || 0;
    var right = Math.max(0, total - (t.again || 0));
    var accuracy = total > 0 ? Math.round((right / total) * 100) : 0;
    var deckNames = (t.decksStudied || []).map(function(id){
      var d = S.decks.find(function(x){ return x.id === id; });
      return d ? (d.emoji + ' ' + esc(d.name)) : null;
    }).filter(Boolean);
    app.innerHTML = '' +
      '<div class="mascot-wrap">'+mascotSVG('big celebrate')+'</div>' +
      '<div class="summary-card">' +
        '<h2>🎉 Session complete!</h2>' +
        '<div class="summary-stats">' +
          '<div class="summary-stat"><span class="num tabular">'+right+' / '+total+'</span><span class="label">Right</span></div>' +
          '<div class="summary-stat"><span class="num tabular">'+accuracy+'%</span><span class="label">Accuracy</span></div>' +
          '<div class="summary-stat"><span class="num tabular">'+mins+'</span><span class="label">Minutes</span></div>' +
        '</div>' +
        (deckNames.length ? '<div class="session-decklist">Decks studied: '+deckNames.join(', ')+'</div>' : '') +
        '<button type="button" class="btn btn-primary" data-act="done">Done</button>' +
      '</div>';
    app.querySelector('[data-act="done"]').addEventListener('click', goLocked);
  }

  function subscribeDecks(){
    if(S.unsubDecks) S.unsubDecks();
    S.unsubDecks = S.store.listenDecks(function(decks){
      S.decks = decks;
      if(!S.booted) return;
      if(S.view === 'home'){ refreshDueCounts().then(render); } else { render(); }
    });
  }

  function refreshDueCounts(){
    var now = Date.now();
    return Promise.all(S.decks.map(function(d){
      return S.store.getCardsOnce(d.id).then(function(cards){
        var due = cards.filter(function(c){ return (c.due||0) <= now; }).length;
        S.dueCounts[d.id] = { due: due, total: cards.length };
      });
    }));
  }

  function goHome(){
    S.view = 'home';
    S.currentDeckId = null;
    if(S.unsubCards){ S.unsubCards(); S.unsubCards = null; }
    refreshDueCounts().then(render);
  }

  function exitManager(){
    S.managingDecks = false;
    S.view = 'home';
    S.currentDeckId = null;
    if(S.unsubCards){ S.unsubCards(); S.unsubCards = null; }
    render();
  }

  /* ---------- HOME ---------- */
  var DECK_FILTERS = [
    { id: 'all', label: 'All decks' },
    { id: 'live', label: 'Live' },
    { id: 'archived', label: 'Archived' }
  ];

  function renderHome(){
    var managing = S.managingDecks;
    var banner = S.store.live ? '' : '<div class="banner">🌟 Offline copy — starts with your current decks, but new progress here won\'t save once you close this page.</div>';
    // Archived decks are a parent-only concept: a kid in a study session never sees them at all,
    // not even as a locked/greyed-out tile — they're filtered out before the deck grid is built.
    var visibleDecks = managing ? S.decks : S.decks.filter(function(d){ return !d.archived; });
    var filterTabsHTML = '';
    if(managing){
      var filter = S.deckFilter || 'all';
      visibleDecks = visibleDecks.filter(function(d){
        if(filter === 'live') return !d.archived;
        if(filter === 'archived') return !!d.archived;
        return true;
      });
      var tabsHTML = DECK_FILTERS.map(function(f){
        var count = S.decks.filter(function(d){
          if(f.id === 'live') return !d.archived;
          if(f.id === 'archived') return !!d.archived;
          return true;
        }).length;
        return '<button type="button" class="filter-tab'+(filter===f.id?' active':'')+'" data-filter="'+f.id+'">'+f.label+' <span class="filter-count">'+count+'</span></button>';
      }).join('');
      filterTabsHTML = '<div class="filter-tabs" role="tablist" aria-label="Filter decks">'+tabsHTML+'</div>';
    }
    // Subject tabs (Reading / Math / Korean / ...) sit below the archive filter and apply to both
    // the kid home screen and Manage Decks -- built from whatever's actually tagged in the current
    // scope (already narrowed by the Live/Archived filter above), so they only ever show subjects
    // that have at least one deck behind them right now.
    var subjectTabsHTML = '';
    var subjectTabs = buildSubjectTabs(visibleDecks);
    if(subjectTabs){
      if(S.subjectFilter !== 'all' && !subjectTabs.some(function(t){ return t.id === S.subjectFilter; })){
        S.subjectFilter = 'all'; // the tagged deck we were filtered to is gone (archived/edited/deleted)
      }
      var subjFilter = S.subjectFilter || 'all';
      var subjChips = '<button type="button" class="subject-tab'+(subjFilter==='all'?' active':'')+'" data-subject-filter="all">🌈 All <span class="filter-count">'+visibleDecks.length+'</span></button>' +
        subjectTabs.map(function(t){
          return '<button type="button" class="subject-tab'+(subjFilter===t.id?' active':'')+'" data-subject-filter="'+esc(t.id)+'">'+t.icon+' '+esc(t.label)+' <span class="filter-count">'+t.count+'</span></button>';
        }).join('');
      subjectTabsHTML = '<div class="subject-tabs" role="tablist" aria-label="Filter by subject">'+subjChips+'</div>';
      if(subjFilter !== 'all'){
        visibleDecks = visibleDecks.filter(function(d){ return d.subject && subjectMeta(d.subject).id === subjFilter; });
      }
    } else {
      S.subjectFilter = 'all';
    }
    if(managing){
      // Most recently studied or edited first; decks that have never been opened fall to the back,
      // ordered among themselves by the deck's original creation order.
      visibleDecks = visibleDecks.slice().sort(function(a, b){
        var diff = (b.lastOpenedAt || 0) - (a.lastOpenedAt || 0);
        return diff !== 0 ? diff : ((a.order || 0) - (b.order || 0));
      });
    }
    var deckTiles = visibleDecks.map(function(d){
      var dc = S.dueCounts[d.id] || { due:0, total:0 };
      var archived = !!d.archived;
      var badge = dc.total === 0
        ? '<span class="deck-badge">No cards yet</span>'
        : (dc.due > 0
          ? '<span class="deck-badge due">'+dc.due+' to review</span>'
          : '<span class="deck-badge">All caught up! 🎉</span>');
      return '' +
      '<div class="deck-card'+(managing && archived ? ' archived' : '')+'">' +
        (managing && archived ? '<span class="archived-tag">📦 Archived</span>' : '') +
        '<div class="deck-emoji">'+d.emoji+'</div>' +
        '<h3 class="deck-name">'+esc(d.name)+'</h3>' +
        '<div class="deck-meta">'+dc.total+' card'+(dc.total===1?'':'s')+'</div>' +
        badge +
        '<div class="deck-actions">' +
          '<button class="btn btn-primary" data-act="study" data-deck="'+d.id+'" '+(dc.total===0?'disabled':'')+'>Dive In</button>' +
          (managing ? '<button class="icon-btn" data-act="edit-deck" data-deck="'+d.id+'" title="Edit deck" aria-label="Edit '+esc(d.name)+'">✏️</button>' : '') +
          (managing ? '<button class="icon-btn" data-act="toggle-archive" data-deck="'+d.id+'" title="'+(archived?'Unarchive':'Archive')+' deck" aria-label="'+(archived?'Unarchive':'Archive')+' '+esc(d.name)+'">'+(archived?'📤':'📦')+'</button>' : '') +
        '</div>' +
      '</div>';
    }).join('');

    app.innerHTML = '' +
      '<div class="topbar">' +
        '<div class="brand">' +
          '<div class="brand-block">' +
            '<h1 class="brand-title">Coral Cove</h1>' +
            '<p class="brand-tag">'+(managing ? '🔧 Managing decks — kids can\'t see this screen' : 'Dive in and practice!')+'</p>' +
          '</div>' +
        '</div>' +
        '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">' +
          (managing ? '' :
          '<div class="stats-row">' +
            '<div class="pill streak"><span class="icon">🌊</span><span class="tabular">'+S.stats.streak+'</span></div>' +
            '<div class="pill stars"><span class="icon">⭐</span><span class="tabular">'+S.stats.stars+'</span></div>' +
          '</div>') +
          (managing ? '<button type="button" class="icon-btn" data-act="open-settings" title="Settings" aria-label="Study settings">⚙️</button>' : '') +
          '<button type="button" class="icon-btn" data-act="open-stats" title="Progress" aria-label="View progress">📊</button>' +
          (managing ? '<button type="button" class="btn btn-ghost" data-act="exit-manager">✅ Done</button>' : ctrlRowHTML()) +
        '</div>' +
      '</div>' +
      '<div class="mascot-wrap">'+mascotSVG('')+'</div>' +
      banner +
      filterTabsHTML +
      subjectTabsHTML +
      (!visibleDecks.length ? '<div class="empty-filter-note">'+(managing && S.deckFilter==='archived' ? 'No archived decks.' : (subjectTabs && S.subjectFilter!=='all' ? 'No decks tagged with this subject yet.' : 'No decks here.'))+'</div>' : '') +
      '<div class="deck-grid">' +
        deckTiles +
        (managing ? '<button type="button" class="add-deck-card" data-act="new-deck"><span class="plus">＋</span><span>New Deck</span></button>' : '') +
      '</div>';

    app.querySelectorAll('[data-act="study"]').forEach(function(b){ b.addEventListener('click', function(){ startStudy(b.dataset.deck); }); });
    app.querySelector('[data-act="open-stats"]').addEventListener('click', openStats);
    app.querySelectorAll('[data-subject-filter]').forEach(function(b){
      b.addEventListener('click', function(){
        if(S.subjectFilter === b.dataset.subjectFilter) return;
        S.subjectFilter = b.dataset.subjectFilter;
        render();
      });
    });
    if(managing){
      app.querySelectorAll('[data-act="edit-deck"]').forEach(function(b){ b.addEventListener('click', function(){ openEditor(b.dataset.deck); }); });
      app.querySelectorAll('[data-act="toggle-archive"]').forEach(function(b){
        b.addEventListener('click', function(){
          var d = S.decks.find(function(x){ return x.id === b.dataset.deck; });
          S.store.updateDeck(b.dataset.deck, { archived: !(d && d.archived) });
        });
      });
      app.querySelectorAll('[data-filter]').forEach(function(b){
        b.addEventListener('click', function(){
          if(S.deckFilter === b.dataset.filter) return;
          S.deckFilter = b.dataset.filter;
          render();
        });
      });
      var newBtn = app.querySelector('[data-act="new-deck"]');
      if(newBtn) newBtn.addEventListener('click', createDeck);
      var settingsBtn = app.querySelector('[data-act="open-settings"]');
      if(settingsBtn) settingsBtn.addEventListener('click', function(){ S.view = 'settings'; render(); });
      var doneBtn = app.querySelector('[data-act="exit-manager"]');
      if(doneBtn) doneBtn.addEventListener('click', exitManager);
    } else {
      wireCtrlRow();
    }
  }

  function createDeck(){
    var emoji = DECK_EMOJI[Math.floor(Math.random()*DECK_EMOJI.length)];
    S.store.addDeck({ name: 'New Deck', emoji: emoji, order: S.decks.length }).then(function(id){
      openEditor(id, true);
    });
  }

  /* ---------- STUDY ---------- */
  // Round length now comes from the parent-set difficulty (Easy 4 / Medium 6 / Hard 10) rather than
  // a fixed constant — see DIFFICULTIES up top.

  function startStudy(deckId){
    S.currentDeckId = deckId;
    S.store.updateDeck(deckId, { lastOpenedAt: Date.now() }); // drives the Manage Decks "most recently opened" order
    S.store.getCardsOnce(deckId).then(function(cards){
      var pool = buildStudyPool(cards);
      S.studyQueue = shuffle(pool).slice(0, currentDifficulty().roundSize);
      S.studyTotal = S.studyQueue.length;
      S.sessionReviewed = 0;
      S.sessionStars = 0;
      S.roundTally = { again: 0, hard: 0, good: 0, easy: 0 };
      S.view = 'study';
      S.cardFlipped = false;
      S.choiceState = null;
      S.currentCardId = null;
      S.cardShownAt = null;
      S.cardFlippedAt = null;
      S.transitioning = false;
      S.peeking = false;
      S.lastAnsweredCard = null;
      S.critterPrevPct = 0;
      render();
    });
  }

  var OUTCOME_ROW_HTML = '' +
    '<div class="grade-row outcome-row" style="position:relative;z-index:1;">' +
      '<button class="grade-btn grade-wrong" data-outcome="wrong"><span class="emoji">🦀</span>Not quite</button>' +
      '<button class="grade-btn grade-right" data-outcome="right"><span class="emoji">🐬</span>Got it right!</button>' +
    '</div>';

  // On Hard difficulty, the simple right/wrong self-report is replaced with real Anki-style
  // self-grading — four options describing how hard the card actually was, same spirit as Anki's
  // own Again/Hard/Good/Easy buttons. The child's own tap IS the rating here, so it also bypasses
  // autoRating()'s response-time guesswork for these two modes (flip and read) while Hard is on.
  var ANKI_ROW_HTML = '' +
    '<div class="grade-row" style="position:relative;z-index:1;">' +
      '<button class="grade-btn grade-again" data-rating="again"><span class="emoji">🦀</span>Again</button>' +
      '<button class="grade-btn grade-hard" data-rating="hard"><span class="emoji">🐢</span>Hard</button>' +
      '<button class="grade-btn grade-good" data-rating="good"><span class="emoji">🐬</span>Good</button>' +
      '<button class="grade-btn grade-easy" data-rating="easy"><span class="emoji">🐳</span>Easy</button>' +
    '</div>';

  function outcomeRowHTML(){
    return currentDifficulty().id === 'hard' ? ANKI_ROW_HTML : OUTCOME_ROW_HTML;
  }

  // The read-only "swipe back" view of the one card the kid most recently answered. No inputs are
  // interactive here — it's a look, not a redo — so there's no route to change a grade already
  // recorded. Mirrors the live layout for each mode, just frozen in its answered state.
  function buildPeekInner(rec){
    var badge = rec.correct
      ? '<div class="peek-badge peek-right">✅ That one was right!</div>'
      : '<div class="peek-badge peek-wrong">🦀 That one was marked not quite</div>';
    var body;
    if(rec.mode === 'choice'){
      var optsHTML = (rec.choiceOptions||[]).map(function(opt){
        var cls = 'choice-btn';
        if(opt === rec.back) cls += ' correct';
        else if(opt === rec.chosenText) cls += ' wrong';
        return '<button type="button" class="'+cls+'" disabled>'+esc(opt)+'</button>';
      }).join('');
      body = '' +
        '<div class="flip-scene" style="position:relative;z-index:1;">' +
          '<div class="face face-front read-face"><div class="read-label">🔢 Last question</div><div class="card-text">'+esc(rec.front)+'</div></div>' +
        '</div>' +
        '<div class="choice-row">'+optsHTML+'</div>';
    } else if(rec.mode === 'read'){
      body = '' +
        '<div class="flip-scene" style="position:relative;z-index:1;">' +
          '<div class="face face-front read-face">' +
            '<div class="read-label">📖 Last question</div>' +
            '<div class="card-text">'+esc(rec.front)+'</div>' +
            (rec.note?'<div class="card-note dim">'+esc(rec.note)+'</div>':'') +
          '</div>' +
        '</div>';
    } else {
      body = '' +
        '<div class="flip-scene" style="position:relative;z-index:1;">' +
          '<div class="flip-card flipped">' +
            '<div class="face face-front"><div class="card-text">'+esc(rec.front)+'</div></div>' +
            '<div class="face face-back"><div class="card-text">'+esc(rec.back)+'</div>'+(rec.note?'<div class="card-note">'+esc(rec.note)+'</div>':'')+'</div>' +
          '</div>' +
        '</div>';
    }
    return '' +
      '<div class="peek-wrap">' +
        body +
        badge +
        '<div class="flip-hint" style="position:relative;z-index:1;">⬆️ Swipe up (or tap) to continue</div>' +
      '</div>';
  }

  // Drag-to-swipe, TikTok style: live-follows the finger, snaps back if it doesn't clear the
  // threshold. Direction is asymmetric on purpose — forward is never draggable (answering is the
  // only way past the current card), backward only reaches the one card just answered.
  function wireSwipe(stageEl){
    if(!stageEl) return;
    var dragging = false, startY = 0, dy = 0, activePointerId = null;
    var DRAG_MAX = 120, COMMIT = 62;
    function canPeekBack(){ return !S.peeking && !!S.lastAnsweredCard && !S.transitioning; }
    function canReturnForward(){ return S.peeking && !S.transitioning; }
    function pointY(e){ return e.touches && e.touches.length ? e.touches[0].clientY : e.clientY; }
    // Track the drag on `document` rather than relying on setPointerCapture: this keeps
    // following the finger/mouse even if it drifts outside the card bounds mid-swipe, and
    // guarantees onUp always fires (no stuck drag state) regardless of where the release lands.
    function onDown(e){
      if(S.transitioning || (!canPeekBack() && !canReturnForward())) return;
      dragging = true; dy = 0; startY = pointY(e);
      activePointerId = e.pointerId != null ? e.pointerId : null;
      stageEl.style.animation = 'none'; // don't fight the entrance animation with a live drag transform
      stageEl.classList.add('stage-dragging');
      document.addEventListener('pointermove', onMove);
      document.addEventListener('pointerup', onUp);
      document.addEventListener('pointercancel', onUp);
    }
    function onMoveRaw(y){
      dy = y - startY;
      var t;
      if(dy >= 0){ t = canPeekBack() ? Math.min(dy, DRAG_MAX) : Math.min(dy, DRAG_MAX) * 0.22; }
      else { t = canReturnForward() ? Math.max(dy, -DRAG_MAX) : Math.max(dy, -DRAG_MAX) * 0.22; }
      stageEl.style.transform = 'translateY('+t+'px)';
    }
    function onMove(e){
      if(!dragging) return;
      if(activePointerId != null && e.pointerId != null && e.pointerId !== activePointerId) return;
      onMoveRaw(pointY(e));
      if(e.cancelable) e.preventDefault();
    }
    function onUp(e){
      if(!dragging) return;
      if(activePointerId != null && e && e.pointerId != null && e.pointerId !== activePointerId) return;
      dragging = false;
      activePointerId = null;
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', onUp);
      document.removeEventListener('pointercancel', onUp);
      stageEl.classList.remove('stage-dragging');
      var goBack = dy > COMMIT && canPeekBack();
      var goForward = dy < -COMMIT && canReturnForward();
      // A real drag (even one that snaps back short of the threshold) shouldn't also be read as
      // a tap by the peek view's tap-to-return handler, which fires right after via 'click'.
      stageEl.__justDragged = Math.abs(dy) > 6;
      stageEl.style.transform = '';
      if(goBack) peekBack();
      else if(goForward) returnFromPeek();
      else {
        stageEl.classList.add('stage-snapback');
        setTimeout(function(){ stageEl.classList.remove('stage-snapback'); }, 220);
      }
      dy = 0;
    }
    stageEl.addEventListener('pointerdown', onDown);
    // Guard against the browser starting a native text/element drag mid-swipe, which can steal
    // the gesture and stop delivering further pointer events to us.
    stageEl.addEventListener('dragstart', function(e){ e.preventDefault(); });
    // Trackpad/mouse-wheel as a desktop-friendly equivalent to a swipe.
    stageEl.addEventListener('wheel', function(e){
      if(S.transitioning) return;
      if(e.deltaY < -14 && canReturnForward()){ e.preventDefault(); returnFromPeek(); }
      else if(e.deltaY > 14 && canPeekBack()){ e.preventDefault(); peekBack(); }
    }, { passive:false });
  }

  function peekBack(){
    if(S.transitioning || S.peeking || !S.lastAnsweredCard) return;
    S.transitioning = true;
    var stageEl = app.querySelector('.stage');
    if(stageEl) stageEl.classList.add('stage-exit-down');
    setTimeout(function(){
      S.transitioning = false;
      S.peeking = true;
      render();
    }, 200);
  }

  function returnFromPeek(){
    if(S.transitioning || !S.peeking) return;
    S.transitioning = true;
    var stageEl = app.querySelector('.stage');
    if(stageEl) stageEl.classList.add('stage-exit');
    setTimeout(function(){
      S.transitioning = false;
      S.peeking = false;
      render();
    }, 200);
  }

  function renderStudy(){
    var deck = S.decks.find(function(d){ return d.id === S.currentDeckId; }) || {name:'Deck', emoji:'🌊'};
    if(!S.studyQueue.length){
      finishStudy();
      return;
    }
    var card = S.studyQueue[0];
    if(S.currentCardId !== card.id){
      // A new card is on stage — reset per-card UI state and start the response-time clock.
      S.currentCardId = card.id;
      S.cardShownAt = Date.now();
      S.cardFlippedAt = null;
      S.cardFlipped = false;
      S.choiceState = null;
    }
    var mode = card.mode === 'read' ? 'read' : (card.mode === 'choice' ? 'choice' : 'flip');
    var peeking = S.peeking && !!S.lastAnsweredCard;
    var doneCount = S.sessionReviewed;
    var labelCount = peeking ? doneCount : (doneCount + 1);
    var progressBase = peeking ? Math.max(0, doneCount - 1) : doneCount;
    var progressPct = S.studyTotal > 0 ? Math.min(100, Math.max(0, Math.round((progressBase / S.studyTotal) * 100))) : 0;
    // The critter bar/fill are recreated from scratch on every render() (this whole screen is one
    // big innerHTML replace), so a plain CSS width/left transition never has a "before" state to
    // animate from — it just snaps. To make it travel smoothly instead, paint the bar at wherever
    // it last visually landed, then nudge it to the real value a frame later so the CSS transition
    // (already defined on .critter-track-fill / .critter-swim) has something to interpolate between.
    var startPct = S.critterPrevPct || 0;
    var critterHTML = '' +
      '<div class="critter-label">'+(peeking ? 'Reviewing question ' : 'Question ')+labelCount+' of '+S.studyTotal+'</div>' +
      '<div class="critter-track">' +
        '<div class="critter-track-fill" style="width:'+startPct+'%"></div>' +
        '<div class="critter-swim'+(S.lastOutcomeWrong?' oops':'')+'" style="left:'+startPct+'%">'+critterSVG(S.lastOutcomeWrong)+'</div>' +
      '</div>';

    var stageInner;
    if(peeking){
      stageInner = buildPeekInner(S.lastAnsweredCard);
    } else if(mode === 'read'){
      stageInner = '' +
        '<div class="flip-scene" style="position:relative;z-index:1;">' +
          '<div class="face face-front read-face">' +
            '<div class="read-label">📖 Read it out loud</div>' +
            '<div class="card-text">'+esc(card.front)+'</div>' +
            (card.note?'<div class="card-note dim">'+esc(card.note)+'</div>':'') +
          '</div>' +
        '</div>' +
        '<div class="flip-hint" style="position:relative;z-index:1;">'+(currentDifficulty().id === 'hard' ? 'How well did they know it?' : 'Did they read it right?')+'</div>' +
        outcomeRowHTML();
    } else if(mode === 'choice'){
      if(!S.choiceState || S.choiceState.cardId !== card.id){
        S.choiceState = { cardId: card.id, options: shuffle([card.back].concat(card.choices||[])), selected: null };
      }
      var cs = S.choiceState;
      var pickedCorrect = cs.selected != null && cs.options[cs.selected] === card.back;
      var optsHTML = cs.options.map(function(opt, idx){
        var cls = 'choice-btn';
        if(cs.selected != null){
          if(opt === card.back) cls += ' correct';
          else if(idx === cs.selected) cls += ' wrong';
        }
        return '<button type="button" class="'+cls+'" data-choice-idx="'+idx+'" '+(cs.selected!=null?'disabled':'')+'>'+esc(opt)+'</button>';
      }).join('');
      var choiceFeedback = cs.selected == null
        ? '<div class="flip-hint" style="position:relative;z-index:1;">Tap an answer</div>'
        : '<div class="choice-feedback '+(pickedCorrect?'ok':'no')+'">'+(pickedCorrect ? 'Nice job! 🎉' : 'Good try — that one\'s tricky!')+'</div>';
      stageInner = '' +
        '<div class="flip-scene" style="position:relative;z-index:1;">' +
          '<div class="face face-front read-face">' +
            '<div class="read-label">🔢 Pick the answer</div>' +
            '<div class="card-text">'+esc(card.front)+'</div>' +
          '</div>' +
        '</div>' +
        '<div class="choice-row">'+optsHTML+'</div>' +
        choiceFeedback;
    } else {
      stageInner = '' +
        '<div class="flip-scene" style="position:relative;z-index:1;">' +
          '<div class="flip-card '+(S.cardFlipped?'flipped':'')+'" id="flipCard">' +
            '<div class="face face-front"><div class="card-text">'+esc(card.front)+'</div></div>' +
            '<div class="face face-back"><div class="card-text">'+esc(card.back)+'</div>'+(card.note?'<div class="card-note">'+esc(card.note)+'</div>':'')+(Speech.isSupported()?'<button type="button" class="replay-audio-btn" data-act="replay-audio">🔊 Hear it again</button>':'')+'</div>' +
          '</div>' +
        '</div>' +
        '<div class="flip-hint" style="position:relative;z-index:1;">'+(S.cardFlipped ? (currentDifficulty().id === 'hard' ? 'How well did you know it?' : 'Be honest — did you get it right?') : 'Tap the card to flip it')+'</div>' +
        (S.cardFlipped ? outcomeRowHTML() : '');
    }

    app.innerHTML = '' +
      '<div class="nav-row">' +
        '<button class="back-btn" data-act="exit-study">⟵ Lagoon</button>' +
        '<span class="nav-title">'+deck.emoji+' '+esc(deck.name)+'</span>' +
        ctrlRowHTML() +
      '</div>' +
      critterHTML +
      '<div class="stage'+(peeking?' stage-peek':'')+'">' +
        bubblesHTML(8) +
        stageInner +
      '</div>';

    // Now that the bar exists in the DOM at startPct, bump it to the real value on the next frame
    // so the CSS transition actually plays instead of the value just appearing already-set. Double
    // rAF (rather than one) makes sure the browser has painted the starting position first — a
    // single rAF can land in the same paint as the innerHTML write and skip straight to the target.
    (function(){
      var fillEl = app.querySelector('.critter-track-fill');
      var swimEl = app.querySelector('.critter-swim');
      requestAnimationFrame(function(){
        requestAnimationFrame(function(){
          if(fillEl) fillEl.style.width = progressPct + '%';
          if(swimEl) swimEl.style.left = progressPct + '%';
        });
      });
    })();
    S.critterPrevPct = progressPct;

    app.querySelector('[data-act="exit-study"]').addEventListener('click', function(){
      // Leaving a deck before finishing the round needs a grown-up's PIN — finishing normally
      // (via the summary screen's own buttons) does not, so this only guards the early exit.
      S.pinInput=''; S.pinError=''; S.pinShake=false;
      S.pinPromptFor = 'exit';
      render();
    });
    wireCtrlRow();
    var stageEl = app.querySelector('.stage');
    wireSwipe(stageEl);
    // A short drag that snaps back (didn't clear the swipe threshold) can still end with
    // mousedown/up landing on the same tappable element — consumed once so it isn't also read
    // as a tap that flips the card or picks an answer.
    function dragJustHappened(){
      if(stageEl.__justDragged){ stageEl.__justDragged = false; return true; }
      return false;
    }
    if(peeking){
      // Reviewing the last card is not interactive — tapping it (same as swiping up) just returns
      // to the live, unanswered card. Ignore the synthetic click that follows a real drag release
      // (mousedown/up on the same element still fires 'click' even after a big pointer move).
      stageEl.addEventListener('click', function(){
        if(dragJustHappened()) return;
        returnFromPeek();
      });
      return;
    }
    var flip = document.getElementById('flipCard');
    if(flip){
      flip.addEventListener('click', function(){
        if(dragJustHappened()) return;
        if(S.cardFlipped || S.transitioning) return;
        S.cardFlipped = true;
        S.cardFlippedAt = Date.now();
        Sound.flip();
        render();
        Speech.speak(card.back); // read the revealed answer aloud automatically
      });
    }
    var replayBtn = app.querySelector('[data-act="replay-audio"]');
    if(replayBtn) replayBtn.addEventListener('click', function(e){ e.stopPropagation(); Speech.speak(card.back); });
    app.querySelectorAll('[data-choice-idx]').forEach(function(b){
      b.addEventListener('click', function(){
        if(dragJustHappened()) return;
        if(S.choiceState.selected != null || S.transitioning) return;
        S.choiceState.selected = parseInt(b.dataset.choiceIdx, 10);
        var chosen = S.choiceState.options[S.choiceState.selected];
        var correct = chosen === card.back;
        var elapsed = Date.now() - (S.cardShownAt || Date.now());
        if(correct) Sound.correct(); else Sound.wrong();
        render();
        // Fully automatic: the app already knows right vs. wrong from the tap, so it grades itself —
        // pause just long enough for the correct/wrong highlight to register, then move on.
        setTimeout(function(){ grade(autoRating('choice', correct, elapsed), true); }, 1100);
      });
    });
    app.querySelectorAll('[data-outcome]').forEach(function(b){
      b.addEventListener('click', function(e){
        e.stopPropagation();
        if(dragJustHappened()) return;
        if(S.transitioning) return;
        var correct = b.dataset.outcome === 'right';
        var clock = mode === 'flip' ? (S.cardFlippedAt || S.cardShownAt) : S.cardShownAt;
        var elapsed = Date.now() - (clock || Date.now());
        grade(autoRating(mode, correct, elapsed));
      });
    });
    // Hard-difficulty Anki-style grading buttons (Again/Hard/Good/Easy) — the child's own tap IS
    // the rating, so this skips autoRating()'s response-time guesswork entirely.
    app.querySelectorAll('[data-rating]').forEach(function(b){
      b.addEventListener('click', function(e){
        e.stopPropagation();
        if(dragJustHappened()) return;
        if(S.transitioning) return;
        grade(b.dataset.rating);
      });
    });
  }

  // The only entry point that advances a card. Answering (an outcome tap, or a choice pick) is the
  // sole trigger — there is no swipe-to-skip and no tap-anywhere-to-continue, so a card is locked in
  // place until it's actually answered. Once answered, this plays the TikTok-style exit slide on the
  // current card and locks out any further taps for that brief window before the next card lands.
  function grade(rating, skipSound){
    if(S.transitioning) return;
    S.transitioning = true;
    var stageEl = app.querySelector('.stage');
    if(stageEl) stageEl.classList.add('stage-exit');
    setTimeout(function(){
      S.transitioning = false;
      commitGrade(rating, skipSound);
    }, 200);
  }

  function commitGrade(rating, skipSound){
    var card = S.studyQueue.shift();
    // 'leitner' uses its own fixed-box engine; the other two options share the SM-2 engine and only
    // differ upstream, in whether autoRating() let response time influence the rating at all. Either
    // way, the parent-set difficulty (round size aside) shapes how far a good answer is spaced out
    // and how hard a struggling card gets reinforced — see DIFFICULTIES up top.
    var algo = S.settings.algorithm || 'sm2_speed';
    var diff = currentDifficulty();
    var updates = (algo === 'leitner') ? gradeCardLeitner(card, rating !== 'again', Date.now(), diff) : gradeCard(card, rating, Date.now(), diff);
    // Cumulative right/wrong counters, independent of the scheduling algorithm above -- these are
    // what the Progress page's per-deck "topics" breakdown groups by category and sums.
    updates.timesSeen = (card.timesSeen || 0) + 1;
    updates.timesCorrect = (card.timesCorrect || 0) + (rating !== 'again' ? 1 : 0);
    S.store.updateCard(S.currentDeckId, card.id, updates);
    S.sessionReviewed += 1;
    S.sessionStars += STARS[rating];
    // Snapshot this card as the one swipe-back target — captured before choiceState/cardFlipped
    // reset below, and overwritten on every answer, so there's always exactly one card of "undo peek."
    var gradedMode = card.mode === 'read' ? 'read' : (card.mode === 'choice' ? 'choice' : 'flip');
    S.lastAnsweredCard = {
      front: card.front,
      back: card.back,
      note: card.note || '',
      mode: gradedMode,
      correct: rating !== 'again',
      rating: rating,
      choiceOptions: (gradedMode === 'choice' && S.choiceState) ? S.choiceState.options.slice() : null,
      chosenText: (gradedMode === 'choice' && S.choiceState && S.choiceState.selected != null) ? S.choiceState.options[S.choiceState.selected] : null
    };
    S.peeking = false;
    // The swim-progress critter frowns for a beat right after a miss, then goes back to smiling —
    // it still swims forward the same step either way, so a wrong answer never looks like no progress.
    S.lastOutcomeWrong = (rating === 'again');
    if(S.lastOutcomeWrong){
      setTimeout(function(){ S.lastOutcomeWrong = false; if(S.view === 'study') render(); }, 900);
    }
    if(S.roundTally) S.roundTally[rating] = (S.roundTally[rating] || 0) + 1;
    if(!skipSound){
      if(rating === 'again') Sound.wrong();
      else if(rating === 'hard') Sound.tap();
      else Sound.correct();
    }
    if(S.sessionTally){
      S.sessionTally.reviewedCount += 1;
      S.sessionTally.starsEarned += STARS[rating];
      S.sessionTally[rating] = (S.sessionTally[rating] || 0) + 1;
      if(S.currentDeckId && S.sessionTally.decksStudied.indexOf(S.currentDeckId) === -1){
        S.sessionTally.decksStudied.push(S.currentDeckId);
      }
      S.store.setSessionTally(S.sessionTally);
    }
    // Rounds are meant to be a strict, predictable length (the chosen difficulty's roundSize) — a
    // missed card is NOT requeued into the same round (that used to inflate a round past its size).
    // It's simply due again shortly per the schedule and will resurface on the next round/Play Again.
    var stillLearning = updates.state === 'learning' || updates.state === 'relearning';
    S.cardFlipped = false;
    S.choiceState = null;
    S.currentCardId = null; // forces the next renderStudy() to treat the next card (even a re-queued one) as freshly shown
    if(S.dueCounts[S.currentDeckId]){
      S.dueCounts[S.currentDeckId].due = Math.max(0, S.dueCounts[S.currentDeckId].due - (stillLearning?0:1));
    }
    render();
  }

  function finishStudy(){
    var t = S.roundTally || { again:0, hard:0, good:0, easy:0 };
    var total = S.sessionReviewed;
    var right = Math.max(0, total - t.again);
    var deck = S.decks.find(function(d){ return d.id === S.currentDeckId; });
    var historyEntry = {
      deckId: S.currentDeckId,
      deckName: deck ? deck.name : 'Deck',
      deckEmoji: deck ? deck.emoji : '🌊',
      total: total,
      right: right,
      accuracy: total > 0 ? Math.round((right / total) * 100) : 0
    };
    S.store.getStats().then(function(stats){
      var today = todayISO();
      var newStreak = stats.streak || 0;
      if(stats.lastReviewDateISO !== today){
        var y = new Date(); y.setDate(y.getDate()-1);
        newStreak = (stats.lastReviewDateISO === todayISO(y)) ? (stats.streak||0) + 1 : 1;
      }
      var newStats = {
        streak: newStreak,
        stars: (stats.stars||0) + S.sessionStars,
        lastReviewDateISO: today,
        totalReviews: (stats.totalReviews||0) + S.sessionReviewed
      };
      return S.store.setStats(newStats).then(function(){ S.stats = newStats; });
    }).then(function(){
      return S.store.addHistoryEntry(historyEntry);
    }).then(function(){
      S.view = 'summary';
      render();
    });
  }

  /* ---------- STATS PAGE ---------- */
  function openStats(){
    S.view = 'stats';
    S.statsData = null; // shows the loading state until the fetch below resolves
    render();
    var deckList = S.managingDecks ? S.decks : S.decks.filter(function(d){ return !d.archived; });
    Promise.all([
      S.store.getHistoryOnce(),
      Promise.all(deckList.map(function(d){
        return S.store.getCardsOnce(d.id).then(function(cards){
          var total = cards.length;
          var mastered = cards.filter(function(c){ return (c.reps||0) > 0 && (c.interval||0) >= 4; }).length;
          // Cards are kept on the entry (not just the total/mastered counts) so the per-deck drill-down
          // (renderDeckStats) can build its "topics" breakdown without a second round-trip.
          return { id: d.id, name: d.name, emoji: d.emoji, total: total, mastered: mastered, cards: cards };
        });
      }))
    ]).then(function(results){
      var history = results[0].slice().sort(function(a,b){ return (a.endedAt||0)-(b.endedAt||0); });
      S.statsData = { history: history, perDeck: results[1] };
      if(S.view === 'stats' || S.view === 'deckStats') render();

  // Groups a deck's cards by their optional "Topic" tag and sums each topic's cumulative right/seen
  // counts (tracked on every graded answer in commitGrade). Untagged cards are left out entirely --
  // an "Uncategorized: 100%" row would just be noise, not a useful topic breakdown. Sorted strongest
  // topic first, so a parent can see at a glance what's landed and what still needs practice.
  function categoryBreakdown(cards){
    var buckets = {};
    (cards||[]).forEach(function(c){
      var cat = (c.category||'').trim();
      var seen = c.timesSeen || 0;
      if(!cat || !seen) return;
      if(!buckets[cat]) buckets[cat] = { category: cat, seen: 0, correct: 0 };
      buckets[cat].seen += seen;
      buckets[cat].correct += (c.timesCorrect || 0);
    });
    var rows = Object.keys(buckets).map(function(k){
      var b = buckets[k];
      return { category: b.category, seen: b.seen, correct: b.correct, accuracy: b.seen > 0 ? Math.round((b.correct/b.seen)*100) : 0 };
    });
    rows.sort(function(a,b){ return b.accuracy - a.accuracy; });
    return rows;
  }

  // Aggregates raw per-round history entries into one point per calendar day (summed right/total
  // across every round finished that day), which is what the long-term trend chart plots -- a
  // per-round view gets noisy fast, but a daily view stays readable across weeks or months.
  function aggregateHistoryByDay(history){
    var byDay = {};
    (history||[]).forEach(function(h){
      var d = new Date(h.endedAt || 0);
      var iso = todayISO(d);
      if(!byDay[iso]){
        byDay[iso] = { iso: iso, ts: new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime(), right:0, total:0, rounds:0 };
      }
      byDay[iso].right += h.right || 0;
      byDay[iso].total += h.total || 0;
      byDay[iso].rounds += 1;
    });
    return Object.keys(byDay).map(function(k){ return byDay[k]; }).sort(function(a,b){ return a.ts - b.ts; });
  }

  // Hand-rolled inline SVG line+area chart (no chart library — this app stays a single dependency-
  // free file) showing accuracy by day across the ENTIRE history, not just the most recent rounds.
  // Capped to the most recent 60 days so the chart stays legible once a family has been using the
  // app for a long stretch; older days are still counted in "days of practice" below the chart.
  function renderLongTermTrend(history){
    if(!history || !history.length){
      return '<div class="trend-wrap"><div class="trend-empty">Finish a few rounds to start seeing a long-term trend! 🌊</div></div>';
    }
    var allDays = aggregateHistoryByDay(history);
    var days = allDays.slice(-60);
    var n = days.length;
    var W = 600, H = 160, padL = 30, padR = 10, padT = 10, padB = 4;
    var plotW = W - padL - padR, plotH = H - padT - padB;
    function xAt(i){ return n > 1 ? padL + (i/(n-1))*plotW : padL + plotW/2; }
    function yAt(pct){ return padT + (1 - pct/100) * plotH; }
    var pts = days.map(function(d, i){
      var pct = d.total > 0 ? Math.round((d.right/d.total)*100) : 0;
      return { x: xAt(i), y: yAt(pct), pct: pct, day: d };
    });
    var pathD = pts.map(function(p,i){ return (i===0?'M':'L')+p.x.toFixed(1)+','+p.y.toFixed(1); }).join(' ');
    var areaD = pathD + ' L'+pts[pts.length-1].x.toFixed(1)+','+(padT+plotH)+' L'+pts[0].x.toFixed(1)+','+(padT+plotH)+' Z';
    var gridHTML = [0,50,100].map(function(pct){
      var y = yAt(pct);
      return '<line x1="'+padL+'" y1="'+y.toFixed(1)+'" x2="'+(W-padR)+'" y2="'+y.toFixed(1)+'" stroke="var(--border)" stroke-width="1" stroke-dasharray="3,3"/>' +
        '<text x="2" y="'+(y+3).toFixed(1)+'" font-size="9" fill="var(--ink-soft)">'+pct+'</text>';
    }).join('');
    var ptsHTML = pts.map(function(p){
      var dd = new Date(p.day.ts);
      var label = (dd.getMonth()+1)+'/'+dd.getDate();
      var tip = esc('🗓️ '+label+' — '+p.pct+'% ('+p.day.right+'/'+p.day.total+' across '+p.day.rounds+' round'+(p.day.rounds===1?'':'s')+')');
      return '<circle class="trend-pt" cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="4" tabindex="0" data-tip="'+tip+'"/>';
    }).join('');
    var firstLabel = (function(){ var dd = new Date(days[0].ts); return (dd.getMonth()+1)+'/'+dd.getDate(); })();
    var lastLabel = (function(){ var dd = new Date(days[days.length-1].ts); return (dd.getMonth()+1)+'/'+dd.getDate(); })();
    var noteExtra = allDays.length > days.length ? ' (showing the most recent '+days.length+')' : '';
    return '' +
      '<div class="trend-wrap trend-long">' +
        '<svg class="trend-svg" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" role="img" aria-label="Accuracy by day, over time">' +
          gridHTML +
          '<path d="'+areaD+'" fill="var(--lagoon)" fill-opacity="0.14" stroke="none"/>' +
          '<path d="'+pathD+'" fill="none" stroke="var(--lagoon)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>' +
          ptsHTML +
        '</svg>' +
        (n > 1 ? '<div class="trend-axis"><span>'+firstLabel+'</span><span>'+lastLabel+'</span></div>' : '') +
        '<p class="trend-long-note">🌱 '+allDays.length+' day'+(allDays.length===1?'':'s')+' of practice so far'+noteExtra+'</p>' +
      '</div>';
  }

  // Shared tooltip wiring for both the short-term bar chart and the long-term SVG points -- both
  // kinds of chart mark tell you what they need with a `data-tip` attribute.
  function wireChartTips(){
    var tip = document.getElementById('chartTip');
    if(!tip) return;
    app.querySelectorAll('.trend-bar, .trend-pt').forEach(function(b){
      function show(){
        tip.textContent = b.dataset.tip;
        var r = b.getBoundingClientRect();
        tip.style.left = (r.left + r.width/2) + 'px';
        tip.style.top = r.top + 'px';
        tip.classList.add('show');
      }
      function hide(){ tip.classList.remove('show'); }
      b.addEventListener('mouseenter', show);
      b.addEventListener('mouseleave', hide);
      b.addEventListener('focus', show);
      b.addEventListener('blur', hide);
      b.addEventListener('touchstart', function(){ show(); setTimeout(hide, 1500); }, {passive:true});
    });
  }

    deckHistory.forEach(function(h){ right += h.right||0; total += h.total||0; });
