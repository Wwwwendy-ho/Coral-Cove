      gain.gain.value = 0.35; // swept by lfo2 below, between roughly 0.10-0.60 -- the "swell"
      noise.connect(filter); filter.connect(gain); gain.connect(dest);
      var lfo1 = c.createOscillator(); lfo1.frequency.value = 0.11; // ~9s wash-in/wash-out cycle
      var lfoGain1 = c.createGain(); lfoGain1.gain.value = 350;
      lfo1.connect(lfoGain1); lfoGain1.connect(filter.frequency);
      var lfo2 = c.createOscillator(); lfo2.frequency.value = 0.11;
      var lfoGain2 = c.createGain(); lfoGain2.gain.value = 0.25;
      lfo2.connect(lfoGain2); lfoGain2.connect(gain.gain);
      noise.start(); lfo1.start(); lfo2.start();
      nodes.push(noise, filter, gain, lfo1, lfoGain1, lfo2, lfoGain2);
    }

    function playRain(c, dest){
      var noise = c.createBufferSource();
      noise.buffer = makeNoiseBuffer(c, 4);
      noise.loop = true;
      var filter = c.createBiquadFilter();
      filter.type = 'highpass';
      filter.frequency.value = 1800; // a steady hiss-y patter, no swell -- rain doesn't breathe like waves do
      var gain = c.createGain();
      gain.gain.value = 0.22;
      noise.connect(filter); filter.connect(gain); gain.connect(dest);
      noise.start();
      nodes.push(noise, filter, gain);
    }

    function playHum(c, dest){
      var o1 = c.createOscillator(); o1.type = 'sine'; o1.frequency.value = 68;
      var o2 = c.createOscillator(); o2.type = 'sine'; o2.frequency.value = 71; // slightly detuned -> a slow warm "beat"
      var gain = c.createGain(); gain.gain.value = 0.22;
      var lfo = c.createOscillator(); lfo.frequency.value = 0.08;
      var lfoGain = c.createGain(); lfoGain.gain.value = 0.10;
      lfo.connect(lfoGain); lfoGain.connect(gain.gain);
      o1.connect(gain); o2.connect(gain); gain.connect(dest);
      o1.start(); o2.start(); lfo.start();
      nodes.push(o1, o2, gain, lfo, lfoGain);
      // Occasional random "bubble" blips rising up through the deep hum.
      function bubble(){
        burst(c, dest, 260 + Math.random()*160, 0.18, 'sine', 0.10);
        timers.push(setTimeout(bubble, 900 + Math.random()*1600));
      }
      timers.push(setTimeout(bubble, 700));
    }

    function playBouncyTune(c, dest){
      // A short, catchy, very repetitive 4-note loop -- the "children's-song" feel the tune is for.
      loopNotes(c, dest, [
        { freq:523, dur:0.26, type:'triangle', gain:0.5 },
        { freq:659, dur:0.26, type:'triangle', gain:0.5 },
        { freq:784, dur:0.26, type:'triangle', gain:0.5 },
        { freq:659, dur:0.26, type:'triangle', gain:0.5 }
      ]);
    }

    function playChimes(c, dest){
      // Sparser, higher, bell-like -- sine tones with rests, so it reads as chimes rather than a tune.
      loopNotes(c, dest, [
        { freq:1568, dur:0.55, type:'sine', gain:0.28 },
        { freq:0,    dur:0.30 },
        { freq:1047, dur:0.55, type:'sine', gain:0.26 },
        { freq:0,    dur:0.30 },
        { freq:1319, dur:0.55, type:'sine', gain:0.27 },
        { freq:0,    dur:0.45 }
      ]);
    }

    function playPop(c, dest){
      // Bouncy, syncopated "pop" blips -- square-ish and playful, a bit bubblier than the chimes.
      loopNotes(c, dest, [
        { freq:392, dur:0.18, type:'square', gain:0.22 },
        { freq:0,   dur:0.10 },
        { freq:587, dur:0.16, type:'square', gain:0.22 },
        { freq:784, dur:0.20, type:'square', gain:0.24 },
        { freq:0,   dur:0.14 },
        { freq:523, dur:0.18, type:'square', gain:0.22 }
      ]);
    }

    function clearTimers(){
      timers.forEach(function(id){ clearTimeout(id); });
      timers = [];
    }

    function stop(){
      clearTimers();
      var oldMaster = master, oldNodes = nodes;
      master = null; nodes = []; currentId = null;
      if(!oldMaster) return;
      try {
        var c = Sound.getCtx();
        var now = c ? c.currentTime : 0;
        oldMaster.gain.cancelScheduledValues(now);
        oldMaster.gain.setValueAtTime(oldMaster.gain.value, now);
        oldMaster.gain.linearRampToValueAtTime(0.0001, now + 0.15); // quick fade -- avoids a click on stop
      } catch(e){}
      setTimeout(function(){
        oldNodes.forEach(function(n){ try{ n.stop && n.stop(); }catch(e){} try{ n.disconnect && n.disconnect(); }catch(e){} });
        try { oldMaster.disconnect(); } catch(e){}
      }, 200);
    }

    function play(id){
      var track = SOUND_TRACKS.filter(function(t){ return t.id === id; })[0];
      if(!track) return;
      stop();
      var c = Sound.getCtx();
      if(!c) return;
      master = c.createGain();
      master.gain.value = 0.0001;
      master.connect(c.destination);
      master.gain.linearRampToValueAtTime(1, c.currentTime + 0.5);
      nodes = [];
      currentId = id;
      if(track.kind === 'noise-waves') playWaves(c, master);
      else if(track.kind === 'noise-rain') playRain(c, master);
      else if(track.kind === 'noise-hum') playHum(c, master);
      else if(track.kind === 'music-bouncy') playBouncyTune(c, master);
      else if(track.kind === 'music-chimes') playChimes(c, master);
      else if(track.kind === 'music-pop') playPop(c, master);
    }

    return { play: play, stop: stop, current: function(){ return currentId; } };
  })();

  /* ============ tiny non-cryptographic PIN hash ============ */
  /* Not real security — just stops a curious kid from reading the PIN straight out of the saved data. */
  function pinHash(str){
    var h = 5381;
    str = String(str || '');
    for(var i = 0; i < str.length; i++){ h = ((h * 33) ^ str.charCodeAt(i)) >>> 0; }
    return h.toString(36);
  }

  /* ============ store adapter (db capability, with in-memory fallback) ============ */
  // A save/delete that fails against the live db capability used to fail SILENTLY -- the edit/trash
  // buttons in the deck editor looked like they "just didn't work" because nothing told the grown-up
  // anything went wrong. Every live write below is now wrapped with reportStoreError() so a failure
  // surfaces as a small dismissible banner instead of doing nothing.
  function reportStoreError(action){
    return function(err){
      console.error('[Coral Cove] '+action+' failed', err);
      S.storeError = (action.charAt(0).toUpperCase()+action.slice(1)) + ' didn\'t save. Check your connection and try again.';
      render();
      throw err;
    };
  }

  var store = (function(){
    // Profiles are top-level; everything else (decks/cards/stats/settings/session/history/badges) is
    // scoped under 'profiles/<id>/...' so each profile has its own fully separate deck library and
    // progress. `pid` is the currently active profile -- set once via setActiveProfile() whenever a
    // profile is entered, then read by every scoped method below at call time (not bound in a closure),
    // so switching profiles mid-session (after a full sign-out through the picker) just works.
    var mem = { profiles: [], profileListeners: [], pinHash: null, byProfile: {}, nextId: 1 };
    var db = null;
    var live = false;
    var pid = null;

    function memId(){ return 'local-' + (mem.nextId++); }
    function notifyProfiles(){ mem.profileListeners.forEach(function(cb){ cb(mem.profiles.slice()); }); }
    function ensureProfileMem(id){
      if(!mem.byProfile[id]) mem.byProfile[id] = {
        decks: [], cards: {}, deckListeners: [], cardListeners: {},
        stats: { streak:0, stars:0, lastReviewDateISO:null, totalReviews:0, unlockedSounds:[] },
        settings: { sessionActive:false, sessionStartedAt:null, algorithm:'sm2_speed', difficulty:'medium' },
        sessionTally: null, history: [], badges: {}
      };
      return mem.byProfile[id];
    }
    function notifyDecks(m){ m.deckListeners.forEach(function(cb){ cb(m.decks.slice()); }); }
    function notifyCards(m, deckId){ (m.cardListeners[deckId]||[]).forEach(function(cb){ cb((m.cards[deckId]||[]).slice()); }); }

    function api(){
      return {
        live: live,
        setActiveProfile: function(id){ pid = id; },
        /* ---------- profiles (top-level, never profile-scoped) ---------- */
        listenProfiles: function(cb){
          if(live){
            return db.collection('profiles').orderBy('order','asc').onSnapshot(function(snap){
              cb(snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); }));
            }, function(err){
              console.error('[Coral Cove] profile sync lost', err);
              S.storeError = 'Lost connection while syncing profiles — please reload the page.';
              render();
            });
          }
          mem.profileListeners.push(cb);
          cb(mem.profiles.slice());
          return function(){ mem.profileListeners = mem.profileListeners.filter(function(x){ return x!==cb; }); };
        },
        addProfile: function(data){
          data = Object.assign({ createdAt: Date.now() }, data);
          if(live) return db.collection('profiles').add(data).then(function(ref){ return ref.id; }).catch(reportStoreError('create profile'));
          var id = memId();
          mem.profiles.push(Object.assign({id:id}, data));
          notifyProfiles();
          return Promise.resolve(id);
        },
        updateProfile: function(id, data){
          if(live) return db.collection('profiles').doc(id).update(data).catch(reportStoreError('save profile'));
          var p = mem.profiles.find(function(x){ return x.id===id; });
          if(p) Object.assign(p, data);
          notifyProfiles();
          return Promise.resolve();
        },
        // Cascades through every scoped collection/doc a profile owns before removing the profile
        // doc itself -- there's no server-side recursive delete here, so each piece is enumerated
        // and removed by hand. Best-effort on the scoped docs (a doc that was never created is fine
        // to "fail" deleting); the deck/card sweep and the final profile-doc delete report errors.
        deleteProfile: function(id){
          if(live){
            var base = 'profiles/'+id;
            function safeDoc(path){ return db.doc(path).delete().catch(function(){}); }
            return db.collection(base+'/decks').get().then(function(snap){
              return Promise.all(snap.docs.map(function(d){
                var deckId = d.id;
                var cardsPath = base+'/decks/'+deckId+'/cards';
                return db.collection(cardsPath).get().then(function(cardSnap){
                  return Promise.all(cardSnap.docs.map(function(c){ return db.collection(cardsPath).doc(c.id).delete(); }));
                }).then(function(){ return db.collection(base+'/decks').doc(deckId).delete(); });
              }));
            }).then(function(){
              return db.collection(base+'/history').get().then(function(snap){
                return Promise.all(snap.docs.map(function(d){ return db.collection(base+'/history').doc(d.id).delete(); }));
              });
            }).then(function(){
              return Promise.all([ safeDoc(base+'/stats/summary'), safeDoc(base+'/settings/study'), safeDoc(base+'/session/current'), safeDoc(base+'/badges/summary') ]);
            }).then(function(){
              return db.collection('profiles').doc(id).delete();
            }).catch(reportStoreError('delete profile'));
          }
          mem.profiles = mem.profiles.filter(function(x){ return x.id!==id; });
          delete mem.byProfile[id];
          notifyProfiles();
          return Promise.resolve();
        },
        /* ---------- app-wide parent PIN (not per-profile) ---------- */
        getPin: function(){
          if(live) return db.doc('settings/pin').get().then(function(snap){ return snap.exists ? (snap.data().pinHash||null) : null; });
          return Promise.resolve(mem.pinHash);
        },
        setPin: function(hash){
          if(live) return db.doc('settings/pin').set({ pinHash: hash });
          mem.pinHash = hash;
          return Promise.resolve();
        },
        /* ---------- everything below is scoped to the active profile (pid) ---------- */
        listenDecks: function(cb){
          var scope = pid;
          if(live){
            return db.collection('profiles/'+scope+'/decks').orderBy('order','asc').onSnapshot(function(snap){
              cb(snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); }));
            }, function(err){
              // onSnapshot errors are terminal -- this listener is now dead and will never fire again.
              // Falling back to the (always-empty, in live mode) in-memory store used to silently wipe
              // every deck from the screen. Keep whatever was last shown instead, and tell the grown-up.
              console.error('[Coral Cove] deck sync lost', err);
              S.storeError = 'Lost connection while syncing your decks — please reload the page.';
              render();
            });
          }
          var m = ensureProfileMem(scope);
          m.deckListeners.push(cb);
          cb(m.decks.slice());
          return function(){ m.deckListeners = m.deckListeners.filter(function(x){ return x!==cb; }); };
        },
        addDeck: function(data){
          data = Object.assign({ createdAt: Date.now() }, data);
          if(live) return db.collection('profiles/'+pid+'/decks').add(data).then(function(ref){ return ref.id; }).catch(reportStoreError('create deck'));
          var m = ensureProfileMem(pid);
          var id = memId();
          m.decks.push(Object.assign({id:id}, data));
          m.cards[id] = [];
          notifyDecks(m);
          return Promise.resolve(id);
        },
        updateDeck: function(id, data){
          if(live) return db.collection('profiles/'+pid+'/decks').doc(id).update(data).catch(reportStoreError('save deck'));
          var m = ensureProfileMem(pid);
          var d = m.decks.find(function(x){ return x.id===id; });
          if(d) Object.assign(d, data);
          notifyDecks(m);
          return Promise.resolve();
        },
        deleteDeck: function(id){
          if(live){
            var cardsPath = 'profiles/'+pid+'/decks/'+id+'/cards';
            return db.collection(cardsPath).get().then(function(snap){
              return Promise.all(snap.docs.map(function(d){ return d.ref ? d.ref.delete() : db.collection(cardsPath).doc(d.id).delete(); }));
            }).then(function(){ return db.collection('profiles/'+pid+'/decks').doc(id).delete(); }).catch(reportStoreError('delete deck'));
          }
          var m = ensureProfileMem(pid);
          m.decks = m.decks.filter(function(x){ return x.id!==id; });
          delete m.cards[id];
          notifyDecks(m);
          return Promise.resolve();
        },
        getCardsOnce: function(deckId){
          if(live){
            return db.collection('profiles/'+pid+'/decks/'+deckId+'/cards').get().then(function(snap){
              return snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
            });
          }
          return Promise.resolve((ensureProfileMem(pid).cards[deckId]||[]).slice());
        },
        listenCards: function(deckId, cb){
          var scope = pid;
          if(live){
            return db.collection('profiles/'+scope+'/decks/'+deckId+'/cards').onSnapshot(function(snap){
              cb(snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); }));
            }, function(err){
              // Same terminal-error issue as listenDecks above: don't blank the real card list with
              // an always-empty in-memory fallback -- keep showing the last-known cards and surface it.
              console.error('[Coral Cove] card sync lost', err);
              S.storeError = 'Lost connection while syncing this deck\'s cards — please reload the page.';
              render();
            });
          }
          var m = ensureProfileMem(scope);
          if(!m.cardListeners[deckId]) m.cardListeners[deckId] = [];
          m.cardListeners[deckId].push(cb);
          cb((m.cards[deckId]||[]).slice());
          return function(){ m.cardListeners[deckId] = (m.cardListeners[deckId]||[]).filter(function(x){ return x!==cb; }); };
        },
        addCard: function(deckId, data){
          data = Object.assign({ due: Date.now(), interval:0, ease:2.5, reps:0, lapses:0, state:'new', learningStep:0, createdAt: Date.now() }, data);
          if(live) return db.collection('profiles/'+pid+'/decks/'+deckId+'/cards').add(data).catch(reportStoreError('save card'));
          var m = ensureProfileMem(pid);
          var id = memId();
          if(!m.cards[deckId]) m.cards[deckId] = [];
          m.cards[deckId].push(Object.assign({id:id}, data));
          notifyCards(m, deckId);
          return Promise.resolve();
        },
        updateCard: function(deckId, cardId, data){
          if(live) return db.collection('profiles/'+pid+'/decks/'+deckId+'/cards').doc(cardId).update(data).catch(reportStoreError('save card'));
          var m = ensureProfileMem(pid);
          var arr = m.cards[deckId]||[];
          var c = arr.find(function(x){ return x.id===cardId; });
          if(c) Object.assign(c, data);
          notifyCards(m, deckId);
          return Promise.resolve();
        },
        deleteCard: function(deckId, cardId){
          if(live) return db.collection('profiles/'+pid+'/decks/'+deckId+'/cards').doc(cardId).delete().catch(reportStoreError('delete card'));
          var m = ensureProfileMem(pid);
          m.cards[deckId] = (m.cards[deckId]||[]).filter(function(x){ return x.id!==cardId; });
          notifyCards(m, deckId);
          return Promise.resolve();
        },
        getStats: function(){
          if(live) return db.doc('profiles/'+pid+'/stats/summary').get().then(function(snap){
            return snap.exists ? snap.data() : { streak:0, stars:0, lastReviewDateISO:null, totalReviews:0, unlockedSounds:[] };
          });
          return Promise.resolve(Object.assign({}, ensureProfileMem(pid).stats));
        },
        setStats: function(data){
          if(live) return db.doc('profiles/'+pid+'/stats/summary').set(data);
          ensureProfileMem(pid).stats = Object.assign({}, data);
          return Promise.resolve();
        },
        getSettings: function(){
          if(live) return db.doc('profiles/'+pid+'/settings/study').get().then(function(snap){
            return snap.exists ? snap.data() : { sessionActive:false, sessionStartedAt:null, algorithm:'sm2_speed', difficulty:'medium' };
          });
          return Promise.resolve(Object.assign({}, ensureProfileMem(pid).settings));
        },
        setSettings: function(data){
          if(live) return db.doc('profiles/'+pid+'/settings/study').set(data);
          ensureProfileMem(pid).settings = Object.assign({}, data);
          return Promise.resolve();
        },
        getSessionTally: function(){
          if(live) return db.doc('profiles/'+pid+'/session/current').get().then(function(snap){
            return snap.exists ? snap.data() : null;
          });
          var t = ensureProfileMem(pid).sessionTally;
          return Promise.resolve(t ? Object.assign({}, t) : null);
        },
        setSessionTally: function(data){
          if(live) return db.doc('profiles/'+pid+'/session/current').set(data);
          ensureProfileMem(pid).sessionTally = Object.assign({}, data);
          return Promise.resolve();
        },
        // A permanent, append-only log of finished study rounds — this is what powers the
        // overall Stats page's trend chart. Never overwritten, unlike sessionTally above.
        addHistoryEntry: function(data){
          data = Object.assign({ endedAt: Date.now() }, data);
          if(live) return db.collection('profiles/'+pid+'/history').add(data);
          var m = ensureProfileMem(pid);
          var id = memId();
          m.history.push(Object.assign({id:id}, data));
          return Promise.resolve();
        },
        getHistoryOnce: function(){
          if(live) return db.collection('profiles/'+pid+'/history').get().then(function(snap){
            return snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
          });
          return Promise.resolve(ensureProfileMem(pid).history.slice());
        },
        // Badge gallery -- a single doc per profile mapping badgeId -> earnedAt (ms timestamp).
        // Absent/false-y entries just mean "not earned yet", so the doc only ever grows.
        getBadges: function(){
          if(live) return db.doc('profiles/'+pid+'/badges/summary').get().then(function(snap){
            return snap.exists ? snap.data() : {};
          });
          return Promise.resolve(Object.assign({}, ensureProfileMem(pid).badges));
        },
        setBadges: function(data){
          if(live) return db.doc('profiles/'+pid+'/badges/summary').set(data);
          ensureProfileMem(pid).badges = Object.assign({}, data);
          return Promise.resolve();
        }
      };
    }

    return {
      init: function(){
        if(!(window.claude && window.claude.use)) return Promise.resolve(api());
        return window.claude.use('db').then(function(handle){
          if(handle){ db = handle; live = true; }
          return api();
        }).catch(function(){ return api(); });
      }
    };
  })();

  /* ============ photo uploads (assets capability) ============ */
  // Only available inside the live published app (claude.ai) -- the offline export and any old
  // in-memory "try it out" preview never get a handle here, so photo upload is hidden there and
  // existing photos still just display fine (they're plain https image URLs once uploaded).
  var Assets = (function(){
    var handle = null;
    return {
      init: function(){
        if(!(window.claude && window.claude.use)) return Promise.resolve(null);
        return window.claude.use('assets').then(function(h){ handle = h; return h; }).catch(function(){ handle = null; return null; });
      },
      available: function(){ return !!handle; },
      upload: function(blob){ return handle ? handle.upload(blob) : Promise.reject(new Error('Photo uploads are only available in the live app.')); },
      remove: function(id){
        if(!handle || !id) return Promise.resolve();
        // Best-effort: an old/abandoned photo failing to delete just leaves a harmless orphan in
        // the artifact's asset storage -- never worth surfacing an error banner for.
        return handle.delete(id).catch(function(err){ console.warn('[Coral Cove] could not delete photo asset', err); });
      }
    };
  })();

  // Shrinks a photo to a reasonable size before upload (most phone photos are far larger than a
  // flashcard ever needs to display). Images already smaller than the cap are uploaded untouched.
  // PNG stays PNG (keeps transparency); anything else becomes a JPEG to keep storage/light.
  function downscalePhoto(file, maxDim){
    return new Promise(function(resolve){
      var img = new Image();
      var url = URL.createObjectURL(file);
      img.onload = function(){
        URL.revokeObjectURL(url);
        var w = img.naturalWidth, h = img.naturalHeight;
        if(!w || !h || Math.max(w, h) <= maxDim){ resolve(file); return; }
        var scale = maxDim / Math.max(w, h);
        var outW = Math.max(1, Math.round(w*scale)), outH = Math.max(1, Math.round(h*scale));
        var canvas = document.createElement('canvas');
        canvas.width = outW; canvas.height = outH;
        var ctx = canvas.getContext('2d');
        if(!ctx){ resolve(file); return; }
        ctx.drawImage(img, 0, 0, outW, outH);
        var outType = file.type === 'image/png' ? 'image/png' : 'image/jpeg';
        canvas.toBlob(function(blob){ resolve(blob || file); }, outType, 0.85);
      };
      img.onerror = function(){ URL.revokeObjectURL(url); resolve(file); };
      img.src = url;
    });
  }

  /* ============ app state ============ */
  var S = {
    store: null,
    view: 'home',
    decks: [],
    dueCounts: {},
    currentDeckId: null,
    stats: { streak:0, stars:0, lastReviewDateISO:null, totalReviews:0, unlockedSounds:[] },
    studyQueue: [],
    studyTotal: 0,
    sessionReviewed: 0,
    sessionStars: 0,
    roundTally: null,
    unsubDecks: null,
    unsubCards: null,
    emojiPickerOpen: false,
    addCardOpen: false,
    choiceState: null,
    dragState: null,        // { cardId, options, dropped, correct } -- 'match'/'blank' mode's drag-to-answer state, parallel to choiceState above
    timedChoiceState: null, // { cardId, direction, prompt, answer, options, selected, totalSeconds, deadline, secondsAdded, expired } -- 'timedchoice' mode's per-card round state
    timedChoiceAllCards: [], // every card in the deck currently being studied, used to source cross-card distractor options for 'timedchoice' mode when a card has no manual `choices` of its own
    timedChoiceDirection: null, // 'fwd' (front shown as the question, back-side text as the answer/options) | 'rev' (back shown as the question, front-side text as the answer/options) -- re-rolled every TIMED_CHOICE_GROUP_SIZE cards
    timedChoiceGroupLeft: 0, // cards left in the current direction "streak" before the next reroll
    timedChoiceTimerHandle: null, // setInterval id driving the on-screen countdown bar for 'timedchoice' mode
    feedQueue: [],           // shuffled card list for the current Word Feed session (S.view === 'feed')
    feedIndex: 0,            // unbounded, wrapped with modulo at render time so swiping loops forever
    feedLastSpokenId: null,  // the card id last spoken aloud, so a re-render doesn't repeat the same word
    storyQueue: [],          // ordered { id, front } word tokens for the current Story Mode session (S.view === 'story')
    storyIndex: 0,           // unbounded, wrapped with modulo at render time so swiping loops back to the start
    storyLastSpokenId: null, // the token id last spoken aloud, so a re-render doesn't repeat the same word
    equationQueue: [],       // shuffled card list for the current Equation Feed session (S.view === 'equationFeed')
    equationIndex: 0,        // unbounded, wrapped with modulo at render time, same as feedIndex/storyIndex above
    equationSettledId: null, // the card id the reveal timer is currently scheduled/fired for, so a re-render doesn't restart it
    equationRevealed: false, // true once the current card's answer has been spoken + bounced onto the screen
    langQueue: [],           // shuffled queue of the currently-unlocked cards for Language Feed (S.view === 'langFeed')
    langIndex: 0,            // unbounded, wrapped with modulo at render time, same as feedIndex/equationIndex above
    langSettledId: null,     // the card id the reveal timer is currently scheduled/fired for, so a re-render doesn't restart it
    langRevealed: false,     // true once the current card's translation has faded in
    langSeenIds: null,       // Set of card ids seen at least once THIS SESSION, used only to decide when to unlock the next batch -- reset every startLangFeed(), never persisted
    langSorted: [],          // every card in the deck, sorted by its `order` field, oldest/introduced-first -- the full pool batches are drawn from
    langUnlockedCount: 0,    // mirrors deck.langUnlockedCount for the active session; bumped (and persisted back) as batches unlock
    langBatchSize: 5,        // mirrors deck.langBatchSize for the active session
    langTotalCards: 0,       // langSorted.length, cached for convenience
    langJustUnlocked: false, // true for one render right after a new batch unlocks, to show the little toast
    feedSoundId: null,       // the ambient sound/music track currently playing over Word Feed, or null for none -- session-only, never persisted (so the feed always opens quiet, not autoplaying whatever was picked last time)
    soundPickerOpen: false,  // true while the Word Feed sound-shop panel is showing
    soundBuyError: null,     // a locked track's id, briefly, right after tapping it without enough stars -- drives that one tile's shake
    currentCardId: null,
    cardShownAt: null,
    cardFlippedAt: null,
    settings: { sessionActive:false, sessionStartedAt:null, algorithm:'sm2_speed', difficulty:'medium', readingSupport:false },
    pinHash: null,          // app-wide parent PIN hash -- no longer nested inside per-profile settings
    profiles: [],           // every profile's top-level metadata (name/mode/photo/order), loaded once at boot
    unsubProfiles: null,
    activeProfileId: null,  // null = showing the profile picker; otherwise the id of the profile in use
    profile: null,          // the active profile's own record (kept in sync with S.profiles)
    profileLoading: false,  // true for the brief window between choosing a profile and its data arriving
    managingProfiles: false,// true while the PIN-unlocked "add/remove profiles" screen is showing
    creatingProfile: false, // true while the new-profile form is showing
    newProfileDraft: null,  // { name, mode, photoId, photoUrl } while creatingProfile is true
    profilePhotoUploading: false, // true while a picked profile photo is being downscaled + uploaded
    pendingModeSwitch: null,// the mode a child-initial profile is about to switch to, once its PIN clears
    badges: {},             // { badgeId: earnedAtMs } for the active profile, loaded on enterProfile
    justEarnedBadges: [],   // badge ids earned by the round just finished, so the summary screen can celebrate them
    sessionActive: false,
    sessionTally: null,
    finishedTally: null,
    managingDecks: false,   // true only while a grown-up has unlocked deck management from the resting screen
    editMode: false,        // true while the Live/Archived + deck-editing controls are showing -- Adult
                             // Mode can flip this on freely; Child Mode has to clear the PIN first
    deckFilter: 'all',      // 'all' | 'live' | 'archived' -- which decks the Manage Decks grid shows
    subjectFilter: 'all',   // 'all' | a subject id/custom string -- which subject tab is selected on the deck grid
    statsData: null,        // lazily loaded { perDeck, history } for the Stats page
    statsDeckId: null,      // set while viewing the per-deck drill-down (S.view === 'deckStats')
    lastOutcomeWrong: false, // briefly true right after a wrong answer, so the swim-progress critter can frown
    transitioning: false,   // true for the brief window a card is sliding out — locks input until the next card lands
    peeking: false,         // true while showing the read-only "last answered card" view (swiped back to review it)
    lastAnsweredCard: null, // { front, back, note, mode, correct, rating, choiceOptions, chosenText } for the ONE card behind the current one — replaced every time a new card is answered
    critterPrevPct: 0,      // progress % the critter bar last visually landed on — renderStudy() starts the bar there and animates to the new %, since a fresh app.innerHTML render can't transition on its own
    pinPromptFor: null,     // null | 'start' | 'end' | 'edit' | 'exit' | 'switch' | 'manageProfiles' | 'modeSwitch'
    pinInput: '',
    pinError: '',
    pinShake: false,
    pendingEdit: null,
    booted: false,
    storeError: null,      // set when a live save/sync fails, so the grown-up sees WHY a button seemed to do nothing
    assetsAvailable: false, // true once the `assets` capability resolves -- gates the photo-upload UI
    photoUploading: false,  // true while a picked photo is being downscaled + uploaded
    cardFormOriginalPhotoId: '' // the photoId the card had (or '') when the current add/edit form opened --
                                 // lets Save/Cancel know which photo, if any, is now an orphan to clean up
    // No "PIN setup" and no "unlock once per visit" flag anymore -- the PIN is a fixed 3207 and
    // Adult Mode (Manage Decks / Settings / Progress) never asks for it at all. Only Child Mode --
    // starting a session, ending one, and the mid-round "leave this deck?" guard -- ever prompts,
    // and it prompts every single time on purpose, since that's the one thing the PIN is for now.
  };

  function defaultTally(){
    return { startedAt: Date.now(), endedAt: null, reviewedCount: 0, starsEarned: 0, again: 0, hard: 0, good: 0, easy: 0, decksStudied: [] };
  }

  var DECK_EMOJI = ['🐢','🐬','🐳','🦀','🐠','🦈','🦞','🐙','🌊','🐚','🦑','⭐'];

  // Preset subjects a deck can be tagged with, shown as chips in the deck editor and as tabs on the
  // deck grid. A deck can also carry a custom subject (any typed text) instead of one of these ids --
  // subjectMeta() below resolves either kind to a display icon+label.
  var SUBJECTS = [
    { id:'reading', icon:'📖', label:'Reading' },
    { id:'math', icon:'🔢', label:'Math' },
    { id:'korean', icon:'🇰🇷', label:'Korean' },
    { id:'science', icon:'🔬', label:'Science' },
    { id:'life', icon:'🌱', label:'Life Skills' },
    { id:'other', icon:'✨', label:'Other' }
  ];
  function subjectMeta(subject){
    if(!subject) return null;
    var preset = SUBJECTS.find(function(s){ return s.id === subject; });
    if(preset) return preset;
    return { id: subject, icon:'🏷️', label: subject }; // a parent-typed custom subject: the text IS the id
  }
  // Builds the tab list for whichever deck set is currently in view (kid home or Manage Decks, and
  // already narrowed by the Live/Archived filter there). Returns null when nothing is tagged yet, so
  // the tab row stays hidden until a parent actually starts using subjects -- no empty-looking UI.
  function buildSubjectTabs(decks){
    var present = {};
    decks.forEach(function(d){
      if(!d.subject) return;
      var meta = subjectMeta(d.subject);
      if(!present[meta.id]) present[meta.id] = { id: meta.id, icon: meta.icon, label: meta.label, count: 0 };
      present[meta.id].count += 1;
    });
    var ids = Object.keys(present);
    if(!ids.length) return null;
    var presetOrder = SUBJECTS.map(function(s){ return s.id; });
    ids.sort(function(a,b){
      var ai = presetOrder.indexOf(a), bi = presetOrder.indexOf(b);
      if(ai !== -1 && bi !== -1) return ai - bi;
      if(ai !== -1) return -1;
      if(bi !== -1) return 1;
      return present[a].label.localeCompare(present[b].label);
    });
    return ids.map(function(id){ return present[id]; });
  }

  // Reading-support accommodation (Settings toggle): wider letter/word spacing and a larger base
  // font, driven entirely by CSS via this one class -- deliberately NOT a dyslexia-specific font
  // swap (OpenDyslexic/Dyslexie aren't backed by controlled research; plain legible fonts plus
  // generous spacing and text-to-speech are). Called once on boot/profile-enter and again any time
  // S.settings.readingSupport changes.
  function applyReadingSupport(){
    document.body.classList.toggle('reading-support', !!(S.settings && S.settings.readingSupport));
  }

  function todayISO(d){ d = d || new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function shuffle(arr){ var a = arr.slice(); for(var i=a.length-1;i>0;i--){ var j = Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }

  /* ============ rendering ============ */
  var app = document.getElementById('app');
  app.innerHTML = '<div class="lock-screen"><h2>🌊 Loading Coral Cove…</h2></div>';

  // Small dismissible banner for S.storeError, dropped into any Adult Mode screen where a save/sync
  // failure would otherwise look like a button silently doing nothing (deck editor, deck grid, ...).
  function errorBannerHTML(){
    if(!S.storeError) return '';
    return '<div class="banner-error"><span>⚠️ '+esc(S.storeError)+'</span><button type="button" data-act="dismiss-store-error" aria-label="Dismiss">✕</button></div>';
  }
  function wireErrorBanner(){
    var b = app.querySelector('[data-act="dismiss-store-error"]');
    if(b) b.addEventListener('click', function(){ S.storeError = null; render(); });
  }

  function render(){
    if(!S.booted) return; // wait for settings to load before showing anything (avoids a lock-screen flash)
    if(S.pinPromptFor) return renderPinPad(S.pinPromptFor);
    // Profile gate: nothing profile-scoped renders until a profile is chosen. Manage/new-profile
    // screens sit outside any profile (they touch S.profiles, the top-level list) so they're checked
    // first, ahead of even the "which profile is active" check.
    if(S.creatingProfile) return renderNewProfileForm();
    if(S.managingProfiles) return renderManageProfiles();
    if(!S.activeProfileId) return renderProfilePicker();
    if(S.profileLoading) return renderProfileLoading();
    if(S.view === 'sessionResults') return renderSessionResults();
    // 'study'/'summary' are checked before the managingDecks branch below so that "Dive In" from
    // within Adult Mode (Manage Decks) actually opens the deck instead of silently falling through
    // to renderHome() -- previously the managingDecks branch had no case for these two views at all.
    if(S.view === 'study') return renderStudy();
    if(S.view === 'summary') return renderSummary();
    if(S.view === 'feed') return renderFeed();   // Word Feed -- same "works from either Manage Decks or
                                                   // Child Mode home" reasoning as study/summary above
    if(S.view === 'story') return renderStory();  // Story Mode -- same reasoning, see the STORY MODE
                                                   // section below WORD FEED
    if(S.view === 'equationFeed') return renderEquationFeed(); // Equation Feed -- same reasoning again,
                                                                 // see the EQUATION FEED section below STORY MODE
    if(S.view === 'langFeed') return renderLangFeed();          // Language Feed -- same reasoning again,
                                                                  // see the LANGUAGE FEED section below EQUATION FEED
    if(S.managingDecks){
      if(S.view === 'editor') return renderEditor();
      if(S.view === 'stats') return renderStats();
      if(S.view === 'deckStats') return renderDeckStats();
      if(S.view === 'settings') return renderSettingsPage();
      return renderHome();
    }
    if(!S.sessionActive) return renderLocked();
    if(S.view === 'editor') return renderEditor();
    if(S.view === 'stats') return renderStats();
    if(S.view === 'deckStats') return renderDeckStats();
    if(S.view === 'settings') return renderSettingsPage();
    return renderHome();
  }

  function renderProfileLoading(){
    app.innerHTML = '<div class="lock-screen"><h2>🌊 Loading…</h2></div>';
  }

  function ctrlRowHTML(){
    var soundIcon = Sound.isEnabled() ? '🔊' : '🔇';
    return '' +
      '<div class="ctrl-row">' +
        '<button type="button" class="icon-btn" data-act="toggle-sound" aria-label="Turn sound '+(Sound.isEnabled()?'off':'on')+'" title="Sound">'+soundIcon+'</button>' +
        '<button type="button" class="icon-btn" data-act="switch-profile" aria-label="Switch profile" title="Switch profile">🔀</button>' +
        '<button type="button" class="icon-btn" data-act="end-session" aria-label="End session" title="End session">🔒</button>' +
      '</div>';
  }
  function wireCtrlRow(){
    var s = app.querySelector('[data-act="toggle-sound"]');
    if(s) s.addEventListener('click', function(){ Sound.setEnabled(!Sound.isEnabled()); render(); });
    var p = app.querySelector('[data-act="switch-profile"]');
    if(p) p.addEventListener('click', exitToPicker);
    var e = app.querySelector('[data-act="end-session"]');
    if(e) e.addEventListener('click', function(){
      // In Adult Mode there's no child "session" to lock/end -- a grown-up playing a deck to try it
      // out just heads back to Manage Decks, no PIN needed (they were never asked for one to get here).
      if(S.managingDecks){ goHome(); return; }
      S.pinInput=''; S.pinError=''; S.pinShake=false; S.pinPromptFor='end'; render();
    });
  }

  /* ---------- LOCK SCREEN (Adult Mode / Child Mode choice) + PIN PAD ---------- */
  // The very first choice, every time the app is at rest: Adult Mode (manage decks, settings,
  // progress -- never asks for the PIN) or Child Mode (today's study session -- always asks for
  // the PIN to start, since that's the one thing the PIN still gates).
  // The per-profile "resting" screen for a Child Mode profile -- Adult Mode profiles skip this
  // entirely (enterProfile drops them straight into Manage Decks, since Adult Mode has never asked
  // for the PIN). Mode itself isn't chosen here anymore; it's a property of the profile, changed
  // only from Settings -> requestModeSwitch.
  function renderLocked(){
    var name = S.profile ? S.profile.name : '';
    app.innerHTML = '' +
      '<div class="mascot-wrap">'+mascotSVG('big')+'</div>' +
      '<div class="lock-screen">' +
        '<h2>🌊 '+esc(name)+' is resting</h2>' +
        '<p>Ask a grown-up to enter the PIN to start today\'s study session.</p>' +
        '<button type="button" class="btn btn-primary" data-act="choose-child">🧒 Start Session</button>' +
        '<button type="button" class="btn btn-ghost" data-act="switch-profile" style="margin-top:10px;">🔀 Switch Profile</button>' +
      '</div>';
    app.querySelector('[data-act="choose-child"]').addEventListener('click', function(){
      Sound.unlock();
      S.pinInput=''; S.pinError=''; S.pinShake=false;
      S.pinPromptFor = 'start';
      render();
    });
    app.querySelector('[data-act="switch-profile"]').addEventListener('click', function(){
      Sound.unlock();
      goToPicker();
    });
  }

  /* ---------- PROFILES ---------- */
  function profileAvatarHTML(p, size){
    size = size || 'lg';
    if(p && p.photoUrl) return '<img class="profile-avatar avatar-'+size+'" src="'+esc(p.photoUrl)+'" alt="">';
    var initial = (p && p.name) ? esc(p.name.trim().charAt(0).toUpperCase()) : '🐬';
    return '<div class="profile-avatar avatar-'+size+' avatar-fallback">'+initial+'</div>';
  }

  function subscribeProfiles(){
    if(S.unsubProfiles) S.unsubProfiles();
    S.unsubProfiles = S.store.listenProfiles(function(profiles){
      S.profiles = profiles;
      if(S.activeProfileId){
        var updated = profiles.find(function(p){ return p.id === S.activeProfileId; });
        if(updated) S.profile = updated;
      }
      if(!S.booted) return;
      render();
    });
  }

  // Enters a chosen profile: points the store at it, resets every piece of transient per-profile
  // state left over from whoever was active before, then loads that profile's own stats/settings/
  // session/badges and subscribes to its decks before letting render() show anything real (the brief
  // gap is covered by renderProfileLoading so the old profile's screen never flashes stale data).
  function enterProfile(profile){
    S.activeProfileId = profile.id;
    S.profile = profile;
    S.store.setActiveProfile(profile.id);
    S.profileLoading = true;
    S.decks = []; S.dueCounts = {}; S.currentDeckId = null;
    S.statsData = null; S.statsDeckId = null; S.deckFilter = 'all'; S.subjectFilter = 'all';
    S.view = 'home';
    S.managingDecks = profile.mode === 'adult';
    S.editMode = false;
    S.sessionActive = false;
    S.finishedTally = null;
    S.pendingEdit = null;
    S.justEarnedBadges = [];
    render();
    Promise.all([S.store.getStats(), S.store.getSettings(), S.store.getSessionTally(), S.store.getBadges()]).then(function(results){
      // unlockedSounds defaults to [] for any stats doc saved before the Word Feed sound shop existed.
      S.stats = Object.assign({ unlockedSounds: [] }, results[0]);
      S.settings = Object.assign({ algorithm:'sm2_speed', difficulty:'medium', readingSupport:false }, results[1] || {});
      S.sessionTally = results[2] || null;
      S.badges = results[3] || {};
      applyReadingSupport();
      // A session never resumes automatically across a profile switch or page reload -- Child Mode
      // always comes back to the resting screen and has to be started again on purpose.
      S.sessionActive = false;
      S.profileLoading = false;
      subscribeDecks();
      refreshDueCounts().then(render);
    });
  }

  // Actually flips the active profile's mode (called either straight from Settings, for a profile
  // that didn't start as Child, or after the 'modeSwitch' PIN clears for one that did). Drops the
  // profile right into whichever home screen the new mode implies.
  function applyModeSwitch(newMode){
    var p = S.profile;
    if(!p || p.mode === newMode) return;
    S.store.updateProfile(p.id, { mode: newMode }).catch(function(){});
    S.profile = Object.assign({}, p, { mode: newMode });
    S.profiles = S.profiles.map(function(x){ return x.id === p.id ? S.profile : x; });
    S.managingDecks = newMode === 'adult';
    S.editMode = false;
    S.view = 'home';
    render();
  }

  // Tears down the active profile's subscriptions/state and drops back to the profile picker.
  function goToPicker(){
    if(S.unsubDecks){ S.unsubDecks(); S.unsubDecks = null; }
    if(S.unsubCards){ S.unsubCards(); S.unsubCards = null; }
    S.activeProfileId = null;
    S.profile = null;
    S.managingDecks = false;
    S.editMode = false;
    S.sessionActive = false;
    S.view = 'home';
    S.decks = []; S.dueCounts = {};
    render();
  }

  // The "Switch Profile" control shown during an active Child Mode session -- ending a session is
  // already PIN-gated (kind 'end'), so leaving one early to switch profiles is gated the same way.
  // Adult Mode and a not-yet-started Child Mode profile have nothing to protect, so those go straight
  // through goToPicker().
  function exitToPicker(){
    if(S.sessionActive){
      S.pinInput=''; S.pinError=''; S.pinShake=false;
      S.pinPromptFor = 'switch';
      render();
      return;
    }
    goToPicker();
  }

  function renderProfilePicker(){
    var tiles = S.profiles.map(function(p){
      return '<button type="button" class="profile-tile" data-profile="'+p.id+'">' +
          profileAvatarHTML(p) +
          '<span class="profile-name">'+esc(p.name)+'</span>' +
        '</button>';
    }).join('');
    app.innerHTML = '' +
      '<div class="mascot-wrap">'+mascotSVG('big')+'</div>' +
      '<div class="lock-screen">' +
        '<h2>🌊 Who\'s diving in?</h2>' +
        '<p>Pick a profile to get started.</p>' +
        '<div class="profile-grid">'+tiles+'</div>' +
        '<button type="button" class="btn btn-ghost" data-act="manage-profiles" style="margin-top:14px;">⚙️ Manage Profiles</button>' +
      '</div>';
    app.querySelectorAll('[data-profile]').forEach(function(b){
      b.addEventListener('click', function(){
        var p = S.profiles.find(function(x){ return x.id === b.dataset.profile; });
        if(!p) return;
        Sound.unlock();
        enterProfile(p);
      });
    });
    app.querySelector('[data-act="manage-profiles"]').addEventListener('click', function(){
      Sound.unlock();
      S.pinInput=''; S.pinError=''; S.pinShake=false;
      S.pinPromptFor = 'manageProfiles';
      render();
    });
  }

  function renderManageProfiles(){
    var tiles = S.profiles.map(function(p){
      return '' +
        '<div class="profile-tile profile-tile-manage">' +
          profileAvatarHTML(p) +
          '<span class="profile-name">'+esc(p.name)+'</span>' +
          '<span class="profile-mode-badge">'+(p.mode==='adult'?'🔧 Adult':'🧒 Child')+'</span>' +
          '<button type="button" class="icon-btn" data-del="'+p.id+'" aria-label="Delete '+esc(p.name)+'\'s profile" title="Delete profile">🗑️</button>' +
        '</div>';
    }).join('');
    app.innerHTML = '' +
      '<div class="nav-row">' +
        '<button class="back-btn" data-act="exit-manage-profiles">⟵ Lagoon</button>' +
        '<span class="nav-title">⚙️ Manage Profiles</span>' +
      '</div>' +
      '<div class="stats-page">' +
        errorBannerHTML() +
        '<div class="profile-grid">' + tiles +
          '<button type="button" class="profile-tile profile-tile-add" data-act="new-profile"><span class="profile-add-icon">➕</span><span class="profile-name">Add Profile</span></button>' +
        '</div>' +
      '</div>';
    wireErrorBanner();
    app.querySelector('[data-act="exit-manage-profiles"]').addEventListener('click', function(){ S.managingProfiles = false; render(); });
    app.querySelector('[data-act="new-profile"]').addEventListener('click', function(){
      S.newProfileDraft = { name:'', mode:'child', photoId:'', photoUrl:'' };
      S.managingProfiles = false;
      S.creatingProfile = true;
      render();
    });
    app.querySelectorAll('[data-del]').forEach(function(b){
      b.addEventListener('click', function(){
        var id = b.dataset.del;
        var p = S.profiles.find(function(x){ return x.id === id; });
        if(!p) return;
        if(S.profiles.length <= 1){ S.storeError = 'You need at least one profile.'; render(); return; }
        if(!window.confirm('Delete '+p.name+'\'s profile? This removes all of their decks and progress for good.')) return;
        S.store.deleteProfile(id).then(function(){
          if(p.photoId) Assets.remove(p.photoId);
          render();
        });
      });
    });
  }

  function handleProfilePhotoFile(file){
    if(!file || !S.newProfileDraft) return;
    var draft = S.newProfileDraft;
    S.profilePhotoUploading = true;
    render();
    var uploaded = null;
    downscalePhoto(file, 480).then(function(blob){
      return Assets.upload(blob);
    }).then(function(res){
      uploaded = res;
      // Browsers generally can't decode HEIC/HEIF via <img>, so confirm the uploaded photo actually
      // renders before keeping it -- otherwise a "successful" upload would silently show as a broken
      // image everywhere the avatar appears.
      return new Promise(function(resolve, reject){
        var img = new Image();
        img.onload = function(){ resolve(); };
        img.onerror = function(){ reject(new Error('decode-failed')); };
        img.src = res.url;
      });
    }).then(function(){
      draft.photoId = uploaded.id;
      draft.photoUrl = uploaded.url;
      S.profilePhotoUploading = false;
      render();
    }).catch(function(){
      if(uploaded) Assets.remove(uploaded.id);
      S.profilePhotoUploading = false;
      S.storeError = 'That photo couldn\'t be used here — try a JPG or PNG instead.';
      render();
    });
  }

  function renderNewProfileForm(){
    var d = S.newProfileDraft || (S.newProfileDraft = { name:'', mode:'child', photoId:'', photoUrl:'' });
    var photoBlock = d.photoUrl
      ? '<img class="profile-avatar avatar-lg" src="'+esc(d.photoUrl)+'" alt="">'
      : '<div class="profile-avatar avatar-lg avatar-fallback">'+(d.name.trim() ? esc(d.name.trim().charAt(0).toUpperCase()) : '🐬')+'</div>';
    var modeBtn = function(m, label, blurb){
      return '<button type="button" class="algo-opt'+(d.mode===m?' active':'')+'" data-new-mode="'+m+'">' +
          '<span class="algo-name">'+label+(d.mode===m?' <span class="algo-current">— selected</span>':'')+'</span>' +
          '<span class="algo-blurb">'+blurb+'</span>' +
        '</button>';
    };
    app.innerHTML = '' +
      '<div class="nav-row">' +
        '<button class="back-btn" data-act="cancel-new-profile">⟵ Cancel</button>' +
        '<span class="nav-title">➕ New Profile</span>' +
      '</div>' +
      '<div class="stats-page">' +
        errorBannerHTML() +
        '<div class="new-profile-form">' +
          '<div class="profile-photo-picker">' +
            photoBlock +
            (S.assetsAvailable ?
              '<label class="btn btn-ghost profile-photo-label">'+(S.profilePhotoUploading?'Uploading…':'📷 Choose Photo')+
                '<input type="file" accept="image/png,image/jpeg,image/heic,image/heif,.heic,.heif" data-inp="profile-photo" style="display:none;" '+(S.profilePhotoUploading?'disabled':'')+'>' +
              '</label>'
              : '<p class="algo-note">Photo uploads are only available in the live app.</p>') +
          '</div>' +
          '<div class="field"><label for="profileNameInput">Name</label><input type="text" id="profileNameInput" placeholder="Profile name" value="'+esc(d.name)+'" maxlength="24"></div>' +
          '<label class="field-label" style="margin-top:14px;">Mode</label>' +
          '<div class="algo-toggle">' +
            modeBtn('child', '🧒 Child Mode', 'PIN-protected study sessions; deck editing needs the PIN too.') +
            modeBtn('adult', '🔧 Adult Mode', 'Study and manage decks anytime — no PIN needed.') +
          '</div>' +
          '<button type="button" class="btn btn-primary" data-act="save-new-profile" style="margin-top:18px;" '+(!d.name.trim()?'disabled':'')+'>Create Profile</button>' +
        '</div>' +
      '</div>';
    wireErrorBanner();
    app.querySelector('[data-act="cancel-new-profile"]').addEventListener('click', function(){
      if(d.photoId) Assets.remove(d.photoId);
      S.newProfileDraft = null;
      S.creatingProfile = false;
      S.managingProfiles = true;
      render();
    });
    var nameInp = app.querySelector('#profileNameInput');
    var saveBtn = app.querySelector('[data-act="save-new-profile"]');
    nameInp.addEventListener('input', function(){ d.name = nameInp.value; saveBtn.disabled = !d.name.trim(); });
    app.querySelectorAll('[data-new-mode]').forEach(function(b){
      b.addEventListener('click', function(){ d.mode = b.dataset.newMode; render(); });
    });
    var fileInp = app.querySelector('[data-inp="profile-photo"]');
    if(fileInp) fileInp.addEventListener('change', function(){
      var f = fileInp.files && fileInp.files[0];
      if(f) handleProfilePhotoFile(f);
    });
    saveBtn.addEventListener('click', function(){
      var name = d.name.trim();
      if(!name) return;
      S.store.addProfile({ name: name, mode: d.mode, initialMode: d.mode, photoId: d.photoId||'', photoUrl: d.photoUrl||'', order: S.profiles.length }).then(function(){
        S.newProfileDraft = null;
        S.creatingProfile = false;
        render();
      });
    });
  }

  function pinPadHTML(title, sub, cancelLabel){
    var dots = '';
    for(var i=0;i<4;i++){ dots += '<span class="pin-dot '+(i<S.pinInput.length?'filled':'')+'"></span>'; }
    var keyHTML = [1,2,3,4,5,6,7,8,9].map(function(k){
      return '<button type="button" class="pin-key" data-digit="'+k+'">'+k+'</button>';
    }).join('');
    keyHTML += '<button type="button" class="pin-key" data-act="pin-back" aria-label="Backspace">⌫</button>';
    keyHTML += '<button type="button" class="pin-key" data-digit="0">0</button>';
    keyHTML += '<span></span>';
    return '' +
      '<div class="lock-screen">' +
        '<h2>'+title+'</h2>' +
        '<p>'+sub+'</p>' +
        '<div class="pin-wrap">' +
          '<div class="pin-dots '+(S.pinShake?'shake':'')+'">'+dots+'</div>' +
          '<div class="pin-error">'+(S.pinError||'&nbsp;')+'</div>' +
          '<div class="pin-grid">'+keyHTML+'</div>' +
          (cancelLabel ? '<button type="button" class="pin-cancel" data-act="pin-cancel">'+cancelLabel+'</button>' : '') +
        '</div>' +
      '</div>';
  }

  function wirePinKeys(onFilled, onCancel){
    app.querySelectorAll('[data-digit]').forEach(function(b){
      b.addEventListener('click', function(){
        if(S.pinInput.length >= 4) return;
        Sound.tap();
        S.pinInput += b.dataset.digit;
        S.pinError = ''; S.pinShake = false;
        var filled = S.pinInput.length === 4;
        render();
        if(filled) setTimeout(onFilled, 220);
      });
    });
    var back = app.querySelector('[data-act="pin-back"]');
    if(back) back.addEventListener('click', function(){
      if(!S.pinInput.length) return;
      Sound.tap();
      S.pinInput = S.pinInput.slice(0, -1);
      S.pinError = '';
      render();
    });
    var cancel = app.querySelector('[data-act="pin-cancel"]');
    if(cancel && onCancel) cancel.addEventListener('click', onCancel);
  }

  function shakeAndClear(msg){
    S.pinError = msg;
    S.pinShake = true;
    S.pinInput = '';
    Sound.wrong();
    render();
    setTimeout(function(){ S.pinShake = false; render(); }, 420);
  }

  function pinPadTitles(kind){
    if(kind === 'start') return ['🔐 Start Child Mode', 'Ask a grown-up to enter the PIN to begin today\'s session.'];
    if(kind === 'end') return ['🔐 End Session', 'Enter the PIN to finish and lock Coral Cove.'];
    if(kind === 'exit') return ['🔐 Leave This Deck?', 'Ask a grown-up to enter the PIN to head back before finishing.'];
    if(kind === 'switch') return ['🔐 Switch Profile', 'Enter the PIN to end this session and switch profiles.'];
    if(kind === 'manageProfiles') return ['🔐 Manage Profiles', 'Enter the PIN to add or remove profiles.'];
    if(kind === 'modeSwitch') return ['🔐 Change Mode', 'Enter the PIN to switch this profile\'s mode.'];
    return ['🔐 Parent PIN', 'Enter the PIN to open Edit Mode.'];
  }

  function renderPinPad(kind){
    var t = pinPadTitles(kind);
    app.innerHTML = pinPadHTML(t[0], t[1], 'Cancel');
    wirePinKeys(function(){ submitPin(kind); }, function(){ cancelPinPrompt(kind); });
  }

  function beginSession(){
    S.sessionTally = defaultTally();
    S.sessionActive = true;
    S.editMode = false;
    var startSettings = Object.assign({}, S.settings, { sessionActive: true, sessionStartedAt: S.sessionTally.startedAt });
    S.settings = startSettings;
    Promise.all([S.store.setSettings(startSettings), S.store.setSessionTally(S.sessionTally)]).then(function(){
      Sound.sessionStart();
      S.pinPromptFor = null;
      S.view = 'home';
      render();
    });
  }
  function endSessionNow(){
    var tally = S.sessionTally || defaultTally();
    S.finishedTally = Object.assign({}, tally, { endedAt: Date.now() });
    S.sessionActive = false;
    var endSettings = Object.assign({}, S.settings, { sessionActive: false });
    S.settings = endSettings;
    Promise.all([S.store.setSettings(endSettings), S.store.setSessionTally(S.finishedTally)]).then(function(){
      Sound.sessionEnd();
      S.pinPromptFor = null;
      S.view = 'sessionResults';
      render();
    });
  }
  function enterManageMode(){
    S.pinPromptFor = null;
    S.managingDecks = true;
    S.editMode = false;
    S.view = 'home';
    refreshDueCounts().then(render);
  }

  // Turns Edit Mode on/off for the Live/Archived tabs + deck editing/archiving controls, which now
  // live behind this flag in BOTH Adult Mode and Child Mode. Adult Mode is already unlocked, so this
  // flips on with no PIN; Child Mode has to clear the PIN first (see requestEditMode below).
  function toggleEditMode(){
    if(S.editMode){ S.editMode = false; render(); return; }
    requestEditMode();
  }

  function requestEditMode(){
    if(S.managingDecks){ S.editMode = true; render(); return; }
    S.pendingEdit = null;
    S.pinInput = ''; S.pinError = ''; S.pinShake = false;
    S.pinPromptFor = 'edit';
    render();
  }

  function submitPin(kind){
    var ok = !!S.pinHash && pinHash(S.pinInput) === S.pinHash;
    if(!ok){
      shakeAndClear('That\'s not it — try again.');
      return;
    }
    S.pinInput = ''; S.pinError = ''; S.pinShake = false;
    // Every kind below prompts for the PIN every single time it comes up -- there's no "unlock
    // once per visit" anymore. Adult Mode is the thing that's always free now (see renderLocked).
    if(kind === 'start'){
      beginSession();
    } else if(kind === 'end'){
      endSessionNow();
    } else if(kind === 'edit'){
      S.pinPromptFor = null;
      var pe = S.pendingEdit || {};
      S.pendingEdit = null;
      S.editMode = true;
      if(pe.deckId){ openEditorUnlocked(pe.deckId, pe.focusName); } else { render(); }
    } else if(kind === 'exit'){
      S.pinPromptFor = null;
      goHome();
    } else if(kind === 'switch'){
      S.pinPromptFor = null;
      var endSettings = Object.assign({}, S.settings, { sessionActive:false });
      S.settings = endSettings;
      S.store.setSettings(endSettings).catch(function(){});
      goToPicker();
    } else if(kind === 'manageProfiles'){
      S.pinPromptFor = null;
      S.managingProfiles = true;
      render();
    } else if(kind === 'modeSwitch'){
      S.pinPromptFor = null;
      var nm = S.pendingModeSwitch;
      S.pendingModeSwitch = null;
      if(nm) applyModeSwitch(nm); else render();
    }
  }

  function cancelPinPrompt(kind){
    S.pinInput = ''; S.pinError = ''; S.pinShake = false;
    if(kind === 'edit') S.pendingEdit = null;
    if(kind === 'modeSwitch') S.pendingModeSwitch = null;
    S.pinPromptFor = null;
    render();
  }

  function goLocked(){
    S.view = 'home';
    S.currentDeckId = null;
    S.finishedTally = null;
    S.editMode = false;
    if(S.unsubCards){ S.unsubCards(); S.unsubCards = null; }
    render();
  }

  function renderSessionResults(){
    var t = S.finishedTally || defaultTally();
    var mins = t.endedAt ? Math.max(1, Math.round((t.endedAt - t.startedAt) / 60000)) : 0;
    var total = t.reviewedCount || 0;
    var right = Math.max(0, total - (t.again || 0));
    var accuracy = total > 0 ? Math.round((right / total) * 100) : 0;
    var deckNames = (t.decksStudied || []).map(function(id){
      var d = S.decks.find(function(x){ return x.id === id; });
      return d ? (d.emoji + ' ' + esc(d.name)) : null;
    }).filter(Boolean);
    app.innerHTML = '' +
      '<div class="mascot-wrap">'+mascotSVG('big celebrate')+'</div>' +
      '<div class="summary-card">' +
        '<h2>🎉 Session complete!</h2>' +
        '<div class="summary-stats">' +
          '<div class="summary-stat"><span class="num tabular">'+right+' / '+total+'</span><span class="label">Right</span></div>' +
          '<div class="summary-stat"><span class="num tabular">'+accuracy+'%</span><span class="label">Accuracy</span></div>' +
          '<div class="summary-stat"><span class="num tabular">'+mins+'</span><span class="label">Minutes</span></div>' +
        '</div>' +
        (deckNames.length ? '<div class="session-decklist">Decks studied: '+deckNames.join(', ')+'</div>' : '') +
        '<button type="button" class="btn btn-primary" data-act="done">Done</button>' +
      '</div>';
    app.querySelector('[data-act="done"]').addEventListener('click', goLocked);
  }

  function bubblesHTML(n){
    var out = '<div class="bubbles" aria-hidden="true">';
    for(var i=0;i<n;i++){
      var size = 8 + Math.round(Math.random()*22);
      var left = Math.round(Math.random()*96);
      var dur = (6 + Math.random()*8).toFixed(1);
      var delay = (Math.random()*8).toFixed(1);
      out += '<span class="bubble" style="width:'+size+'px;height:'+size+'px;left:'+left+'%;animation-duration:'+dur+'s;animation-delay:-'+delay+'s;"></span>';
    }
    out += '</div>';
    return out;
  }

  // mascotSVG above, just simplified to fit a 44px badge, with a frown for a wrong answer.

  function subscribeDecks(){
    if(S.unsubDecks) S.unsubDecks();
    S.unsubDecks = S.store.listenDecks(function(decks){
      S.decks = decks;
      if(!S.booted) return;
      if(S.view === 'home'){ refreshDueCounts().then(render); } else { render(); }
    });
  }

  function refreshDueCounts(){
    var now = Date.now();
    return Promise.all(S.decks.map(function(d){
      return S.store.getCardsOnce(d.id).then(function(cards){
        var due = cards.filter(function(c){ return (c.due||0) <= now; }).length;
        S.dueCounts[d.id] = { due: due, total: cards.length };
      });
    }));
  }

  function goHome(){
    // A single choke point for leaving ANY screen back to the deck grid -- covers Word Feed's sound
    // player too, so it always stops here no matter which path led out (the exit button, a PIN
    // clearing, Adult Mode's no-PIN early exit, ...) rather than needing its own cleanup on each one.
    Ambience.stop();
    S.feedSoundId = null;
    S.soundPickerOpen = false;
    S.view = 'home';
    S.currentDeckId = null;
    if(S.unsubCards){ S.unsubCards(); S.unsubCards = null; }
    refreshDueCounts().then(render);
  }

  // Adult Mode's "✅ Done" button -- there's no "choose child/adult" screen to fall back to anymore
  // (mode lives on the profile, not chosen per visit), so leaving Manage Decks now means leaving the
  // profile entirely, back to the picker. Adult Mode was always PIN-free, so this asks for nothing.
  function exitManager(){
    S.currentDeckId = null;
    if(S.unsubCards){ S.unsubCards(); S.unsubCards = null; }
    goToPicker();
  }

  /* ---------- HOME ---------- */
  var DECK_FILTERS = [
    { id: 'all', label: 'All decks' },
    { id: 'live', label: 'Live' },
    { id: 'archived', label: 'Archived' }
  ];

  function renderHome(){
    var managing = S.managingDecks;
    // Edit Mode -- not the same as Adult Mode -- is what now shows archived decks and the
    // Live/Archived tabs, per-deck editing/archiving, and deck creation/import. Adult Mode flips it
    // on for free; Child Mode has to clear the PIN first (see requestEditMode/toggleEditMode).
    var editMode = S.editMode;
    var banner = (S.store.live ? '' : '<div class="banner">🌟 Try-it-out mode — your decks won\'t be saved after you close this page.</div>') + errorBannerHTML();
    // Archived decks are only ever shown inside Edit Mode -- everywhere else (including the normal
    // Adult Mode deck grid now) they're filtered out before the deck grid is built.
    var visibleDecks = editMode ? S.decks : S.decks.filter(function(d){ return !d.archived; });
    var filterTabsHTML = '';
    if(editMode){
      var filter = S.deckFilter || 'all';
      visibleDecks = visibleDecks.filter(function(d){
        if(filter === 'live') return !d.archived;
        if(filter === 'archived') return !!d.archived;
        return true;
      });
      var tabsHTML = DECK_FILTERS.map(function(f){
        var count = S.decks.filter(function(d){
          if(f.id === 'live') return !d.archived;
          if(f.id === 'archived') return !!d.archived;
          return true;
        }).length;
        return '<button type="button" class="filter-tab'+(filter===f.id?' active':'')+'" data-filter="'+f.id+'">'+f.label+' <span class="filter-count">'+count+'</span></button>';
      }).join('');
      filterTabsHTML = '<div class="filter-tabs" role="tablist" aria-label="Filter decks">'+tabsHTML+'</div>';
    }
    // Subject tabs (Reading / Math / Korean / ...) sit below the archive filter and apply to both
    // the kid home screen and Manage Decks -- built from whatever's actually tagged in the current
    // scope (already narrowed by the Live/Archived filter above), so they only ever show subjects
    // that have at least one deck behind them right now.
    var subjectTabsHTML = '';
    var subjectTabs = buildSubjectTabs(visibleDecks);
    if(subjectTabs){
      if(S.subjectFilter !== 'all' && !subjectTabs.some(function(t){ return t.id === S.subjectFilter; })){
        S.subjectFilter = 'all'; // the tagged deck we were filtered to is gone (archived/edited/deleted)
      }
      var subjFilter = S.subjectFilter || 'all';
      var subjChips = '<button type="button" class="subject-tab'+(subjFilter==='all'?' active':'')+'" data-subject-filter="all">🌈 All <span class="filter-count">'+visibleDecks.length+'</span></button>' +
        subjectTabs.map(function(t){
          return '<button type="button" class="subject-tab'+(subjFilter===t.id?' active':'')+'" data-subject-filter="'+esc(t.id)+'">'+t.icon+' '+esc(t.label)+' <span class="filter-count">'+t.count+'</span></button>';
        }).join('');
      subjectTabsHTML = '<div class="subject-tabs" role="tablist" aria-label="Filter by subject">'+subjChips+'</div>';
      if(subjFilter !== 'all'){
        visibleDecks = visibleDecks.filter(function(d){ return d.subject && subjectMeta(d.subject).id === subjFilter; });
      }
    } else {
      S.subjectFilter = 'all';
    }
    if(managing){
      // Adult Mode's grid is a "most recent decks" format now that the Live/Archived tabs aren't
      // shown by default (they moved into Edit Mode): most recently studied or edited first, with
      // never-opened decks falling to the back in their original creation order. Child Mode keeps
      // its own stable, creation-order grid -- re-sorting a kid's decks after every study session
      // would just be confusing.
      visibleDecks = visibleDecks.slice().sort(function(a, b){
        var diff = (b.lastOpenedAt || 0) - (a.lastOpenedAt || 0);
        return diff !== 0 ? diff : ((a.order || 0) - (b.order || 0));
      });
    }
    var deckTiles = visibleDecks.map(function(d){
      var dc = S.dueCounts[d.id] || { due:0, total:0 };
      var archived = !!d.archived;
      var isFeed = !!d.feedMode;
      var isStory = !isFeed && !!d.storyMode;
      var isEquation = !isFeed && !isStory && !!d.equationMode;
      var isLang = !isFeed && !isStory && !isEquation && !!d.langFeedMode;
      // Word Feed, Story Mode, Equation Feed and Language Feed decks are pure browsing, not
      // spaced-repetition -- "due" is meaningless for them, so they get their own simple badge
      // instead of the due/all-caught-up language.
      var badge = isFeed
        ? '<span class="deck-badge feed">🎬 Word Feed</span>'
        : (isStory
          ? '<span class="deck-badge feed">📜 Story Mode</span>'
          : (isEquation
            ? '<span class="deck-badge feed">➕ Equation Feed</span>'
            : (isLang
              ? '<span class="deck-badge feed">🌐 Language Feed</span>'
              : (dc.total === 0
                ? '<span class="deck-badge">No cards yet</span>'
                : (dc.due > 0
                  ? '<span class="deck-badge due">'+dc.due+' to review</span>'
                  : '<span class="deck-badge">All caught up! 🎉</span>')))));
      var diveLabel = isFeed ? '▶️ Watch & Listen' : (isStory ? '📖 Read the Story' : (isEquation ? '🧮 Solve & Listen' : (isLang ? '🌐 Learn Words' : 'Dive In')));
      return '' +
      '<div class="deck-card'+(editMode && archived ? ' archived' : '')+'">' +
        (editMode && archived ? '<span class="archived-tag">📦 Archived</span>' : '') +
        '<div class="deck-emoji">'+d.emoji+'</div>' +
        '<h3 class="deck-name">'+esc(d.name)+'</h3>' +
        '<div class="deck-meta">'+dc.total+' card'+(dc.total===1?'':'s')+'</div>' +
        badge +
        '<div class="deck-actions">' +
          '<button class="btn btn-primary" data-act="study" data-deck="'+d.id+'" '+(dc.total===0?'disabled':'')+'>'+diveLabel+'</button>' +
          (editMode ? '<button class="icon-btn" data-act="edit-deck" data-deck="'+d.id+'" title="Edit deck" aria-label="Edit '+esc(d.name)+'">✏️</button>' : '') +
          (editMode ? '<button class="icon-btn" data-act="toggle-archive" data-deck="'+d.id+'" title="'+(archived?'Unarchive':'Archive')+' deck" aria-label="'+(archived?'Unarchive':'Archive')+' '+esc(d.name)+'">'+(archived?'📤':'📦')+'</button>' : '') +
        '</div>' +
      '</div>';
    }).join('');

    app.innerHTML = '' +
      '<div class="topbar">' +
        '<div class="brand">' +
          '<div class="brand-block">' +
            '<h1 class="brand-title">Coral Cove</h1>' +
            '<p class="brand-tag">'+(editMode ? '✏️ Edit Mode — arrange and archive decks' : (managing ? '🔧 Adult Mode — kids can\'t see this screen' : 'Dive in and practice!'))+'</p>' +
          '</div>' +
        '</div>' +
        '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">' +
          (managing ? '' :
          '<div class="stats-row">' +
            '<div class="pill streak"><span class="icon">🌊</span><span class="tabular">'+S.stats.streak+'</span></div>' +
            '<div class="pill stars"><span class="icon">⭐</span><span class="tabular">'+S.stats.stars+'</span></div>' +
          '</div>') +

    app.querySelectorAll('[data-act="study"]').forEach(function(b){
