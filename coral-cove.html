<title>Coral Cove</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800;900&display=swap">
<style>
  :root{
    --deep:#0a3d4a; --deep-2:#0d5262; --lagoon:#1c8c93; --lagoon-light:#4fb3ba;
    --foam:#f4fbf9; --foam-2:#e7f4f1; --coral:#ff7a5c; --coral-dark:#e8593c;
    --sun:#ffc94d; --sun-dark:#e8a716; --seaweed:#2f6d5c;
    --ink:#0b2b33; --ink-soft:#4a6a70;
    --surface:#ffffff; --border:#d3ece6;
    --shadow:0 10px 26px rgba(10,61,74,.14);
    --shadow-sm:0 4px 12px rgba(10,61,74,.10);
    --r-lg:28px; --r-md:18px; --r-sm:12px;
    --ok-bg:#eafaf3; --ok-ink:#1f7a5c; --bad-bg:#fdeceb; --bad-ink:#c65b46;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --foam:#07232a; --foam-2:#0c2e36; --surface:#0f3942; --border:#17515f;
      --ink:#eaf6f4; --ink-soft:#a9cbc7; --lagoon-light:#5fc2c9; --seaweed:#74d1b3;
      --shadow:0 10px 26px rgba(0,0,0,.45); --shadow-sm:0 4px 12px rgba(0,0,0,.35);
      --ok-bg:#123b2d; --ok-ink:#74d1b3; --bad-bg:#3a1f1a; --bad-ink:#ff8a72;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --foam:#07232a; --foam-2:#0c2e36; --surface:#0f3942; --border:#17515f;
    --ink:#eaf6f4; --ink-soft:#a9cbc7; --lagoon-light:#5fc2c9; --seaweed:#74d1b3;
    --shadow:0 10px 26px rgba(0,0,0,.45); --shadow-sm:0 4px 12px rgba(0,0,0,.35);
    --ok-bg:#123b2d; --ok-ink:#74d1b3; --bad-bg:#3a1f1a; --bad-ink:#ff8a72;
    color-scheme: dark;
  }

  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--foam); color:var(--ink);
    font-family:'Nunito',system-ui,-apple-system,sans-serif;
    min-height:100%;
    padding-inline: max(16px, env(safe-area-inset-left,0px)) max(16px, env(safe-area-inset-right,0px));
  }
  html,body{height:100%;}
  h1,h2,h3,.display{ font-family:'Baloo 2', system-ui, sans-serif; text-wrap:balance; }
  button{ font-family:inherit; }
  .tabular{ font-variant-numeric: tabular-nums; }
  [hidden]{ display:none !important; }
  a{ color:inherit; }

  #app{ max-width:760px; margin:0 auto; padding-block:20px 40px; position:relative; }

  /* ---------- top bar / stats ---------- */
  .topbar{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:18px; flex-wrap:wrap; }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand-title{ font-size:1.7rem; font-weight:800; color:var(--deep); margin:0; }
  :root:not([data-theme="light"]) .brand-title{ }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .brand-title{ color:var(--lagoon-light);} }
  :root[data-theme="dark"] .brand-title{ color:var(--lagoon-light); }
  .brand-tag{ margin:0; font-size:.85rem; color:var(--ink-soft); font-weight:600; }

  .stats-row{ display:flex; gap:8px; }
  .pill{
    display:flex; align-items:center; gap:6px; background:var(--surface); border:1px solid var(--border);
    padding:8px 12px; border-radius:999px; font-weight:800; font-size:.95rem; box-shadow:var(--shadow-sm);
  }
  .pill .icon{ font-size:1.05rem; }
  .pill.streak{ color:var(--coral-dark); }
  .pill.stars{ color:var(--sun-dark); }

  /* ---------- back nav ---------- */
  .nav-row{ display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  .back-btn{
    display:flex; align-items:center; gap:6px; background:var(--surface); border:1px solid var(--border);
    color:var(--ink); font-weight:800; padding:9px 14px 9px 10px; border-radius:999px; cursor:pointer; box-shadow:var(--shadow-sm);
  }
  .back-btn:hover{ background:var(--foam-2); }
  .nav-title{ font-weight:800; font-size:1.25rem; color:var(--deep); }
  :root[data-theme="dark"] .nav-title, @media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .nav-title{color:var(--lagoon-light);}}

  /* ---------- mascot ---------- */
  .mascot-wrap{ display:flex; justify-content:center; margin: 6px 0 10px; }
  .mascot{ width:104px; height:104px; animation: bob 3.2s ease-in-out infinite; filter: drop-shadow(0 6px 10px rgba(10,61,74,.18)); }
  .mascot.big{ width:150px; height:150px; }
  .mascot.celebrate{ animation: wiggle .6s ease-in-out 2; }
  @keyframes bob{ 0%,100%{ transform: translateY(0) rotate(-2deg);} 50%{ transform: translateY(-8px) rotate(2deg);} }
  @keyframes wiggle{ 0%,100%{ transform: rotate(0) scale(1);} 25%{ transform: rotate(-8deg) scale(1.05);} 75%{ transform: rotate(8deg) scale(1.05);} }
  @media (prefers-reduced-motion: reduce){ .mascot, .mascot.celebrate{ animation:none; } }

  /* ---------- decorative bubbles ---------- */
  .bubbles{ position:absolute; inset:0; overflow:hidden; pointer-events:none; z-index:0; border-radius:inherit; }
  .bubble{ position:absolute; bottom:-40px; border-radius:50%; background:radial-gradient(circle at 30% 30%, rgba(255,255,255,.85), rgba(255,255,255,.05) 70%); opacity:.5; animation: rise linear infinite; }
  @keyframes rise{ 0%{ transform:translateY(0); opacity:.55;} 90%{opacity:.35;} 100%{ transform:translateY(-380px); opacity:0; } }
  @media (prefers-reduced-motion: reduce){ .bubble{ animation:none; display:none; } }

  /* ---------- banner ---------- */
  .banner{
    background:var(--sun); color:#4a3300; font-weight:700; font-size:.88rem;
    padding:10px 14px; border-radius:var(--r-sm); margin-bottom:16px; box-shadow:var(--shadow-sm);
  }
  .banner-error{
    background:#ffe1e1; color:#7a1c1c; font-weight:700; font-size:.88rem;
    padding:10px 14px; border-radius:var(--r-sm); margin-bottom:16px; box-shadow:var(--shadow-sm);
    display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .banner-error button{
    background:none; border:none; color:#7a1c1c; font-weight:800; font-size:1.05rem; line-height:1;
    cursor:pointer; padding:2px 6px; flex-shrink:0;
  }

  /* ---------- deck grid ---------- */
  .deck-grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(210px,1fr)); gap:14px; }
  .deck-card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg);
    padding:18px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:10px;
    position:relative; overflow:hidden;
  }
  .deck-emoji{ font-size:2.4rem; line-height:1; }
  .deck-name{ font-family:'Baloo 2',sans-serif; font-weight:700; font-size:1.15rem; margin:0; color:var(--deep); }
  :root[data-theme="dark"] .deck-name{ color:var(--lagoon-light); }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .deck-name{ color:var(--lagoon-light);} }
  .deck-meta{ font-size:.85rem; color:var(--ink-soft); font-weight:700; }
  .deck-badge{
    align-self:flex-start; font-size:.78rem; font-weight:800; padding:4px 10px; border-radius:999px;
    background:var(--foam-2); color:var(--seaweed);
  }
  .deck-badge.due{ background:var(--coral); color:#fff; }
  .deck-actions{ display:flex; gap:8px; margin-top:auto; }

  /* Archived decks — visible only in Manage Decks mode, never to a student. */
  .deck-card.archived{
    border:2px solid var(--sun-dark);
    box-shadow:0 0 0 3px rgba(255,201,77,.35), 0 0 18px 2px rgba(255,201,77,.55);
    animation:archiveGlow 2.6s ease-in-out infinite;
  }
  @keyframes archiveGlow{
    0%,100%{ box-shadow:0 0 0 3px rgba(255,201,77,.30), 0 0 14px 1px rgba(255,201,77,.45); }
    50%{ box-shadow:0 0 0 3px rgba(255,201,77,.45), 0 0 22px 4px rgba(255,201,77,.75); }
  }
  .archived-tag{
    position:absolute; top:10px; right:-30px; background:var(--sun-dark); color:#4a3300; font-size:.68rem; font-weight:800;
    padding:3px 34px; transform:rotate(38deg); box-shadow:var(--shadow-sm);
  }

  /* Manage Decks filter tabs -- All / Live / Archived, replacing what used to be a separate archive page. */
  .filter-tabs{ display:flex; gap:8px; flex-wrap:wrap; margin:4px 0 14px; }
  .filter-tab{
    border:none; border-radius:999px; background:var(--foam-2); color:var(--ink); font-weight:800;
    font-size:.85rem; padding:8px 14px; cursor:pointer; transition:transform .12s ease, background .15s ease;
  }
  .filter-tab:active{ transform:scale(.96); }
  .filter-tab.active{ background:var(--lagoon); color:#fff; }
  .filter-tab .filter-count{ opacity:.75; font-weight:700; margin-left:2px; }
  .filter-tab.active .filter-count{ opacity:.9; }
  /* Subject tabs -- Reading / Math / Korean / etc. Coral accent so they read as a distinct row from
     the lagoon-colored Live/Archived filter above them when both are showing (Manage Decks). */
  .subject-tabs{ display:flex; gap:8px; flex-wrap:wrap; margin:-2px 0 14px; }
  .subject-tab{
    border:none; border-radius:999px; background:var(--foam-2); color:var(--ink); font-weight:800;
    font-size:.85rem; padding:8px 14px; cursor:pointer; transition:transform .12s ease, background .15s ease;
  }
  .subject-tab:active{ transform:scale(.96); }
  .subject-tab.active{ background:var(--coral); color:#fff; }
  .subject-tab .filter-count{ opacity:.75; font-weight:700; margin-left:2px; }
  .subject-tab.active .filter-count{ opacity:.9; }
  .empty-filter-note{
    color:var(--ink-soft); font-weight:700; text-align:center; padding:28px 12px; font-size:.95rem;
  }
  .btn{
    border:none; border-radius:999px; font-weight:800; cursor:pointer; padding:10px 16px; font-size:.92rem;
    transition: transform .12s ease;
  }
  .btn:active{ transform: scale(.96); }
  .btn:focus-visible, .back-btn:focus-visible, .icon-btn:focus-visible, input:focus-visible, textarea:focus-visible{
    outline: 3px solid var(--sun-dark); outline-offset: 2px;
  }
  .btn-primary{ background:var(--lagoon); color:#fff; box-shadow:0 4px 0 var(--deep); }
  .btn-primary:active{ box-shadow:0 2px 0 var(--deep); transform: translateY(2px) scale(.98); }
  .btn-ghost{ background:var(--foam-2); color:var(--ink); }
  .btn-coral{ background:var(--coral); color:#fff; box-shadow:0 4px 0 var(--coral-dark); }
  .btn-coral:active{ box-shadow:0 2px 0 var(--coral-dark); transform: translateY(2px) scale(.98); }
  .icon-btn{ background:var(--foam-2); border:none; width:38px; height:38px; border-radius:50%; cursor:pointer; font-size:1rem; }
  .icon-btn:hover{ background:var(--border); }

  .add-deck-card{
    background:transparent; border:2px dashed var(--border); border-radius:var(--r-lg); min-height:150px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; cursor:pointer; color:var(--ink-soft);
    font-weight:800; font-family:'Baloo 2',sans-serif;
  }
  .add-deck-card:hover{ border-color:var(--lagoon-light); color:var(--lagoon); }
  .add-deck-card .plus{ font-size:1.8rem; }

  /* ---------- study ---------- */
  .progress-track{ display:flex; gap:6px; justify-content:center; margin:6px 0 18px; flex-wrap:wrap; }
  .dot{ width:10px; height:10px; border-radius:50%; background:var(--border); }
  .dot.done{ background:var(--seaweed); }
  .dot.current{ background:var(--coral); transform:scale(1.3); }

  /* ---------- swim-progress critter bar ---------- */
  .critter-label{ text-align:center; font-size:.78rem; font-weight:800; color:var(--ink-soft); margin:4px 0 6px; }
  .critter-track{ position:relative; height:16px; background:var(--foam-2); border:1px solid var(--border); border-radius:999px; margin:0 26px 34px; }
  .critter-track-fill{ position:absolute; top:0; left:0; height:100%; border-radius:999px; background:linear-gradient(90deg, var(--lagoon-light), var(--lagoon)); transition:width .5s cubic-bezier(.34,1.4,.64,1); }
  .critter-swim{ position:absolute; top:50%; left:0; width:44px; height:44px; transform:translate(-50%,-50%); transition:left .5s cubic-bezier(.34,1.4,.64,1); filter:drop-shadow(0 2px 4px rgba(10,61,74,.28)); }
  .critter-swim svg{ width:100%; height:100%; display:block; }
  .critter-swim.oops{ animation:critterOops .5s ease; }
  @keyframes critterOops{
    0%{ transform:translate(-50%,-50%) rotate(0deg); }
    25%{ transform:translate(-50%,-50%) rotate(-10deg); }
    50%{ transform:translate(-50%,-50%) rotate(7deg); }
    75%{ transform:translate(-50%,-50%) rotate(-4deg); }
    100%{ transform:translate(-50%,-50%) rotate(0deg); }
  }

  .stage{
    position:relative; min-height:320px; border-radius:var(--r-lg); background:linear-gradient(180deg, var(--foam-2), var(--foam));
    border:1px solid var(--border); padding:26px 16px 30px; overflow:hidden;
    animation:stageEnter .32s cubic-bezier(.22,1,.36,1) both;
    /* Swiping/dragging over card text shouldn't start a native text selection or drag — that can
       steal the pointer gesture from our own swipe handling. */
    -webkit-user-select:none; user-select:none; -webkit-user-drag:none;
  }
  .stage img, .stage *{ -webkit-user-drag:none; }
  /* TikTok-style vertical feed: each new card whooshes up into place; answering the current one
     sends it whooshing up and out before the next one arrives — see .stage-exit, toggled in JS. */
  @keyframes stageEnter{
    0%{ transform:translateY(38px); opacity:0; }
    100%{ transform:translateY(0); opacity:1; }
  }
  .stage.stage-exit{
    animation:stageExit .2s cubic-bezier(.4,0,1,1) both;
    pointer-events:none; /* locked — no further taps land while the card is on its way out */
  }
  @keyframes stageExit{
    0%{ transform:translateY(0); opacity:1; }
    100%{ transform:translateY(-46px); opacity:0; }
  }
  /* Swipe back to review the one card just answered — a mirror-image transition: exits down,
     enters from above, so "backward" always reads as the opposite motion of "forward". */
  .stage.stage-exit-down{
    animation:stageExitDown .2s cubic-bezier(.4,0,1,1) both;
    pointer-events:none;
  }
  @keyframes stageExitDown{
    0%{ transform:translateY(0); opacity:1; }
    100%{ transform:translateY(46px); opacity:0; }
  }
  .stage.stage-peek{
    animation:stagePeekEnter .32s cubic-bezier(.22,1,.36,1) both;
    border:2px solid var(--sun-dark);
    box-shadow:0 0 0 3px rgba(255,201,77,.28);
    cursor:pointer;
  }
  @keyframes stagePeekEnter{
    0%{ transform:translateY(-38px); opacity:0; }
    100%{ transform:translateY(0); opacity:1; }
  }
  /* Live drag state: JS drives the transform directly, so no CSS transition should fight it;
     stage-snapback re-enables one, briefly, purely to animate the release-and-cancel bounce. */
  .stage.stage-dragging{ transition:none; touch-action:none; }
  .stage.stage-snapback{ transition:transform .25s cubic-bezier(.34,1.4,.64,1); transform:translateY(0); }
  .peek-badge{ text-align:center; font-weight:800; font-size:.95rem; margin-top:14px; position:relative; z-index:1; }
  .peek-badge.peek-right{ color:var(--ok-ink); }
  .peek-badge.peek-wrong{ color:var(--bad-ink); }
  @media (prefers-reduced-motion: reduce){
    .stage{ animation:none; }
    .stage.stage-exit{ animation:none; }
    .stage.stage-exit-down{ animation:none; }
    .stage.stage-peek{ animation:none; }
  }

  .flip-scene{ perspective: 1200px; width:min(100%,420px); margin:0 auto; }
  .flip-card{ position:relative; width:100%; min-height:220px; transform-style:preserve-3d; transition: transform .5s cubic-bezier(.4,.2,.2,1); cursor:pointer; }
  .flip-card.flipped{ transform: rotateY(180deg); }
  .face{
    position:absolute; inset:0; backface-visibility:hidden; border-radius:var(--r-md); background:var(--surface);
    box-shadow:var(--shadow); display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:26px 20px; text-align:center; gap:10px; border:1px solid var(--border);
  }
  .face-back{ transform: rotateY(180deg); background:var(--deep); color:#fff; border-color:var(--deep); }
  .face-front .card-text{ font-family:'Baloo 2',sans-serif; font-weight:700; font-size:1.7rem; color:var(--ink); }
  .face-back .card-text{ font-family:'Baloo 2',sans-serif; font-weight:700; font-size:1.5rem; }
  .card-note{ font-size:.95rem; opacity:.85; font-weight:600; }
  .card-note.dim{ color:var(--ink-soft); }
  .card-photo{ display:block; width:100%; max-width:260px; max-height:170px; object-fit:contain; border-radius:var(--r-sm); margin-bottom:4px; }
  .replay-audio-btn{
    margin-top:2px; background:rgba(255,255,255,.18); border:1px solid rgba(255,255,255,.4); color:#fff;
    font-weight:800; font-size:.8rem; padding:8px 14px; border-radius:999px; cursor:pointer;
  }
  .replay-audio-btn:hover{ background:rgba(255,255,255,.28); }
  .replay-audio-btn:active{ transform:scale(.96); }
  .read-face{ position:static; box-shadow:var(--shadow); }
  .read-label{ font-size:.78rem; font-weight:800; letter-spacing:.03em; text-transform:uppercase; color:var(--lagoon); }
  .flip-hint{ font-size:.82rem; color:var(--ink-soft); font-weight:700; text-align:center; margin-top:12px; }

  .choice-row{ display:flex; flex-direction:column; gap:10px; position:relative; z-index:1; margin-top:16px; max-width:420px; margin-inline:auto; }
  .choice-btn{
    background:var(--surface); border:2px solid var(--border); border-radius:var(--r-md); padding:14px 16px;
    font-family:'Baloo 2',sans-serif; font-weight:700; font-size:1.05rem; color:var(--ink); cursor:pointer;
    text-align:left; box-shadow:var(--shadow-sm); transition: transform .12s ease;
  }
  .choice-btn:hover{ border-color:var(--lagoon-light); }
  .choice-btn:active{ transform: scale(.98); }
  .choice-btn:disabled{ cursor:default; }
  .choice-btn.correct{ border-color:var(--ok-ink); background:var(--ok-bg); color:var(--ok-ink); }
  .choice-btn.wrong{ border-color:var(--bad-ink); background:var(--bad-bg); color:var(--bad-ink); }

  .grade-row{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:20px; }
  .grade-btn{
    display:flex; flex-direction:column; align-items:center; gap:4px; padding:12px 6px; border-radius:var(--r-md);
    border:none; cursor:pointer; font-weight:800; font-size:.82rem; color:#fff; box-shadow: 0 4px 0 rgba(0,0,0,.18);
  }
  .grade-btn:active{ transform:translateY(2px); box-shadow:0 2px 0 rgba(0,0,0,.18); }
  .grade-btn .emoji{ font-size:1.5rem; }
  .grade-again{ background:#c65b46; }
  .grade-hard{ background:var(--sun-dark); }
  .grade-good{ background:var(--lagoon); }
  .grade-easy{ background:var(--seaweed); }

  /* ---------- automatic outcome buttons (right/wrong self-report, replaces manual 4-way grading) ---------- */
  .grade-row.outcome-row{ grid-template-columns:repeat(2,1fr); max-width:360px; margin-inline:auto; }
  .grade-row.outcome-row .grade-btn{ padding:16px 6px; font-size:.92rem; }
  .grade-wrong{ background:#c65b46; }
  .grade-right{ background:var(--seaweed); }
  .choice-feedback{ font-size:.9rem; font-weight:800; text-align:center; margin-top:12px; position:relative; z-index:1; }
  .choice-feedback.ok{ color:var(--ok-ink); }
  .choice-feedback.no{ color:var(--bad-ink); }

  /* ---------- summary ---------- */
  .summary-card{
    text-align:center; background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg); box-shadow:var(--shadow); padding:32px 20px;
    animation:stageEnter .38s cubic-bezier(.22,1,.36,1) both;
  }
  @media (prefers-reduced-motion: reduce){ .summary-card{ animation:none; } }
  .summary-card h2{ margin:6px 0 2px; color:var(--deep); font-size:1.6rem; }
  :root[data-theme="dark"] .summary-card h2{ color:var(--lagoon-light); }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .summary-card h2{ color:var(--lagoon-light);} }
  .summary-stats{ display:flex; justify-content:center; gap:22px; margin:18px 0; flex-wrap:wrap; }
  .summary-stat{ display:flex; flex-direction:column; align-items:center; }
  .summary-stat .num{ font-family:'Baloo 2',sans-serif; font-weight:800; font-size:1.7rem; color:var(--coral-dark); }
  .summary-stat .label{ font-size:.78rem; font-weight:800; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em; }

  /* ---------- stats page ---------- */
  .stats-page{ display:flex; flex-direction:column; gap:22px; padding-bottom:24px; }
  .stats-section h3{ margin:0 0 12px; font-size:1.05rem; color:var(--deep); }
  :root[data-theme="dark"] .stats-section h3{ color:var(--lagoon-light); }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .stats-section h3{ color:var(--lagoon-light);} }

  .stat-tiles{ display:grid; grid-template-columns:repeat(auto-fit, minmax(120px,1fr)); gap:10px; }
  .stat-tile{ background:var(--surface); border:1px solid var(--border); border-radius:var(--r-md); box-shadow:var(--shadow-sm); padding:14px 10px; text-align:center; }
  .stat-tile .num{ font-family:'Baloo 2',sans-serif; font-weight:800; font-size:1.5rem; color:var(--lagoon); }
  :root[data-theme="dark"] .stat-tile .num{ color:var(--lagoon-light); }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .stat-tile .num{ color:var(--lagoon-light);} }
  .stat-tile .label{ font-size:.72rem; font-weight:800; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.03em; margin-top:2px; }

  .mastery-list{ display:flex; flex-direction:column; gap:12px; }
  .mastery-row{
    display:flex; align-items:center; gap:10px; width:100%; background:none; border:none; padding:6px;

<script>
(function(){
  "use strict";

  /* ============ scheduler (Anki-style SM-2) ============ */
  var LEARN_STEPS_MIN = [1, 10];      // new cards step through these (minutes) before graduating
  var RELEARN_STEPS_MIN = [10];       // a lapsed review card steps through these before returning to review
  var GRADUATING_DAYS = 1;            // interval a card gets when it finishes the learn steps on "Good"
  var EASY_GRADUATE_DAYS = 4;         // interval a card gets when "Easy" skips the remaining learn steps
  var EASE_START = 2.5;
  var EASE_MIN = 1.3;
  var HARD_INTERVAL_MULT = 1.2;
  var EASY_BONUS = 1.3;
  var LAPSE_MIN_DAYS = 1;             // interval a card gets after relearning from a lapse — deliberately NOT scaled
                                       // by difficulty's intervalMult (see DIFFICULTIES below), so a just-recovered
                                       // card always gets rechecked promptly no matter how hard the deck is set to.
  var LEECH_THRESHOLD = 8;            // lapses at which a card is flagged as a "leech" (needs extra practice)

  // Parents can pick one of these in Manage Decks → ⚙️ Settings. App-wide, not per-deck. Three
  // dimensions per level, all pulling in the same direction as the level gets harder:
  //  - roundSize: more questions per sitting.
  //  - intervalMult: how far out a card gets pushed once it's answered well — a bigger multiplier
  //    means a longer gap before it's tested again, which is a truer test of real retention rather
  //    than short-term memorization. (Deliberately NOT applied to the post-lapse recovery interval
  //    above, or to the struggle-shrink below, so this only stretches cards that are going well.)
  //  - struggleShrink: when a card is missed several times in a row, each consecutive miss shrinks
  //    its relearn delay by this factor (struggleShrink^consecutiveMisses) and cuts deeper into its
  //    ease, so it comes back sooner and more often relative to cards that aren't a struggle — the
  //    "if it seems like they're struggling, reinforce it more" behavior, strongest on Hard.
  var DIFFICULTIES = [
    {
      id: 'easy',
      icon: '🌱',
      name: 'Easy',
      roundSize: 4,
      intervalMult: 0.7,
      strugglePenalty: 0.08,
      struggleShrink: 0.8,
      blurb: '4 questions a round, and reviews come back a bit sooner across the board — gentle repetition rather than a real stretch on memory.'
    },
    {
      id: 'medium',
      icon: '🌊',
      name: 'Medium',
      roundSize: 6,
      intervalMult: 1.0,
      strugglePenalty: 0.20,
      struggleShrink: 0.55,
      blurb: 'The default — 6 questions a round with standard spacing.'
    },
    {
      id: 'hard',
      icon: '🔥',
      name: 'Hard',
      roundSize: 10,
      intervalMult: 1.4,
      strugglePenalty: 0.35,
      struggleShrink: 0.3,
      blurb: '10 questions a round, and cards you know well get spaced out further — a real test of long-term memory. Cards you keep missing get drilled far more often than the rest.'
    }
  ];

  function currentDifficulty(){
    var id = S.settings.difficulty || 'medium';
    for(var i=0;i<DIFFICULTIES.length;i++){ if(DIFFICULTIES[i].id === id) return DIFFICULTIES[i]; }
    return DIFFICULTIES[1];
  }

  // ---------- gradual new-card introduction ----------
  // A deck with only a handful of cards (the built-in decks) should behave exactly like before:
  // every card available right away. A big deck (like a 300-word vocabulary set) should NOT dump
  // every unseen card into the pool at once — that's overwhelming and defeats spaced repetition,
  // which relies on a card being reviewed a few times while it's still fresh. Instead, only a
  // limited number of cards are ever "in flight" (introduced but not yet solidly known) for a
  // given deck at once; a brand-new card is unlocked only once an earlier one graduates out of
  // that window by becoming well-established.
  var NEW_CARD_WINDOW = 15;      // max cards "in flight" (being learned/reviewed, not yet mastered)
                                  // per deck at any one time. Every built-in deck has well under
                                  // this many cards total, so this never engages for them — it only
                                  // kicks in once a deck is bigger than its own natural window.
  var MASTERY_INTERVAL_DAYS = 7; // a review-state card frees its window slot once its interval
                                  // reaches this many days — "known well enough" to stop blocking
                                  // the next unseen card, even though it's still scheduled to come
                                  // back for review later.

  function cardState(c){ return c.state || ((c.interval||0) > 0 ? 'review' : 'new'); }

  // Builds the pool startStudy() draws a round from: cards already due for review, plus as many
  // not-yet-seen cards as the deck's new-card window currently allows. Replaces the older "every
  // card with a due timestamp in the past" pool, which — for a huge deck — meant literally every
  // unseen card (due defaults to "now") was fair game from the very first round.
  function buildStudyPool(cards){
    var now = Date.now();
    var reviewDue = cards.filter(function(c){
      var st = cardState(c);
      return st !== 'new' && (c.due||0) <= now;
    });
    var newCards = cards.filter(function(c){ return cardState(c) === 'new'; })
      .sort(function(a,b){ return (a.createdAt||0) - (b.createdAt||0); }); // deck's own curriculum order
    var activeUnmastered = cards.filter(function(c){
      var st = cardState(c);
      if(st === 'new') return false;
      if(st === 'review' && (c.interval||0) >= MASTERY_INTERVAL_DAYS) return false;
      return true;
    }).length;
    var slots = Math.max(0, NEW_CARD_WINDOW - activeUnmastered);
    var pool = reviewDue.concat(newCards.slice(0, slots));
    if(!pool.length){
      // Nothing due and no window slot open (rare — everything currently "in flight" is mid-step
      // between due timestamps). Rather than leave the round empty, let one new card through so
      // studying never dead-ends; still just one at a time, so the gradual-introduction spirit holds.
      pool = newCards.length ? newCards.slice(0, 1) : cards;
    }
    return pool;
  }

  // Parents can pick which of these runs in Manage Decks → ⚙️ Scheduling. The choice is stored as
  // S.settings.algorithm and is app-wide (not per-deck). Two axes differ on purpose: how the
  // scheduling math works (adaptive SM-2 vs. fixed Leitner boxes), and whether answer speed factors
  // into grading at all (only 'sm2_speed' looks at elapsed time).
  var ALGORITHMS = [
    {
      id: 'sm2_speed',
      icon: '⚡',
      name: 'Standard + Speed',
      blurb: 'Adaptive scheduling (like Anki) that also factors in how fast an answer came — quick, confident answers get spaced out further than slow, hesitant ones. This is the default.'
    },
    {
      id: 'sm2_plain',
      icon: '🎯',
      name: 'Standard (Accuracy Only)',
      blurb: 'The same adaptive scheduling engine, but only right vs. wrong matters — how long it took to answer has no effect on when a card comes back.'
    },
    {
      id: 'leitner',
      icon: '🗃️',
      name: 'Simple Boxes',
      blurb: 'A simpler, more predictable system — a card moves up one box after a correct answer and back to box 1 after a miss. Easier to see why a card is showing up again.'
    }
  ];

  function fuzzedDays(days){
    if(days < 2) return days;
    var pct = days < 7 ? 0.25 : (days < 30 ? 0.15 : 0.05);
    var delta = days * pct;
    return Math.max(1, Math.round(days + (Math.random()*2 - 1) * delta));
  }

  function gradeCard(card, rating, now, diff){
    now = now || Date.now();
    diff = diff || currentDifficulty();
    var ease = card.ease || EASE_START;
    var interval = card.interval || 0;
    var reps = card.reps || 0;
    var lapses = card.lapses || 0;
    var state = card.state || (interval > 0 ? 'review' : 'new');
    var step = card.learningStep || 0;
    var isLeech = !!card.isLeech;
    var priorStreak = card.strugglingStreak || 0; // consecutive misses BEFORE this answer
    var streak = (rating === 'again') ? priorStreak + 1 : 0; // returned/persisted streak, after this answer
    var due;

    function minutesFromNow(m){ return now + m*60000; }
    function daysFromNow(d){ return now + d*86400000; }
    // Each consecutive miss on this card shrinks its relearn delay further — struggleShrink^priorStreak,
    // capped so it never collapses to near-zero. A single miss (priorStreak 0 going in) is unaffected —
    // this only kicks in once a card is already being missed repeatedly, which is the "seems like
    // they're struggling" signal, not a one-off wrong answer.
    function struggleMinutes(baseMin){
      return baseMin * Math.pow(diff.struggleShrink, Math.min(priorStreak, 3));
    }

    if(state === 'new' || state === 'learning'){
      if(rating === 'again'){
        step = 0; state = 'learning';
        due = minutesFromNow(struggleMinutes(LEARN_STEPS_MIN[0]));
      } else if(rating === 'hard'){
        state = 'learning';
        due = minutesFromNow(LEARN_STEPS_MIN[step] || LEARN_STEPS_MIN[LEARN_STEPS_MIN.length-1]);
      } else if(rating === 'good'){
        step += 1;
        if(step >= LEARN_STEPS_MIN.length){
          state = 'review'; interval = Math.max(1, Math.round(GRADUATING_DAYS * diff.intervalMult)); reps += 1; step = 0;
          due = daysFromNow(interval);
        } else {
          state = 'learning';
          due = minutesFromNow(LEARN_STEPS_MIN[step]);
        }
      } else { // easy — skip remaining steps, graduate now
        state = 'review'; interval = Math.max(1, Math.round(EASY_GRADUATE_DAYS * diff.intervalMult)); reps += 1; step = 0;
        due = daysFromNow(interval);
      }
    } else if(state === 'relearning'){
      if(rating === 'again'){
        step = 0; state = 'relearning';
        due = minutesFromNow(struggleMinutes(RELEARN_STEPS_MIN[0]));
      } else if(rating === 'hard'){
        state = 'relearning';
        due = minutesFromNow(RELEARN_STEPS_MIN[step] || RELEARN_STEPS_MIN[RELEARN_STEPS_MIN.length-1]);
      } else {
        step += 1;
        if(step >= RELEARN_STEPS_MIN.length || rating === 'easy'){
          // Deliberately NOT scaled by intervalMult (see the note by LAPSE_MIN_DAYS above) — a card
          // that just recovered from a lapse gets rechecked promptly regardless of difficulty.
          state = 'review'; interval = LAPSE_MIN_DAYS; step = 0;
          due = daysFromNow(interval);
        } else {
          state = 'relearning';
          due = minutesFromNow(RELEARN_STEPS_MIN[step]);
        }
      }
    } else { // review
      if(rating === 'again'){
        lapses += 1;
        ease = Math.max(EASE_MIN, ease - diff.strugglePenalty);
        state = 'relearning'; step = 0;
        due = minutesFromNow(struggleMinutes(RELEARN_STEPS_MIN[0]));
        if(lapses >= LEECH_THRESHOLD) isLeech = true;
      } else if(rating === 'hard'){
        ease = Math.max(EASE_MIN, ease - 0.15);
        interval = fuzzedDays(Math.max(interval + 1, Math.round(interval * HARD_INTERVAL_MULT * diff.intervalMult)));
        reps += 1;
        due = daysFromNow(interval);
      } else if(rating === 'good'){
        interval = fuzzedDays(Math.max(interval + 1, Math.round(interval * ease * diff.intervalMult)));
        reps += 1;
        due = daysFromNow(interval);
      } else { // easy
        ease = ease + 0.15;
        interval = fuzzedDays(Math.max(interval + 1, Math.round(interval * ease * EASY_BONUS * diff.intervalMult)));
        reps += 1;
        due = daysFromNow(interval);
      }
    }

    return { ease: ease, interval: interval, reps: reps, lapses: lapses, due: due, state: state, learningStep: step, isLeech: isLeech, strugglingStreak: streak };
  }

  /* ============ scheduler (Simple Boxes / Leitner) ============ */
  // A card starts in box 1. A correct answer moves it up one box (capped at the last box); a miss
  // sends it straight back to box 1 and becomes due again right away (so it can resurface the same
  // sitting via "Play Again", the same spirit as SM-2's short relearning steps). No ease factor, no
  // per-mode timing — just right/wrong and a fixed interval per box, which is the whole appeal of
  // this option: it's easy for a parent (or a kid) to predict when a card comes back.
  var LEITNER_BOX_DAYS = [1, 2, 4, 7, 14, 30]; // index 0 = box 1

  function gradeCardLeitner(card, correct, now, diff){
    now = now || Date.now();
    diff = diff || currentDifficulty();
    var box = card.box || 1;
    var reps = card.reps || 0;
    var lapses = card.lapses || 0;
    var streak = card.strugglingStreak || 0;
    var due;
    if(correct){
      streak = 0;
      box = Math.min(box + 1, LEITNER_BOX_DAYS.length);
      reps += 1;
      due = now + Math.max(1, Math.round(LEITNER_BOX_DAYS[box - 1] * diff.intervalMult)) * 86400000;
    } else {
      // Already as immediate as reinforcement gets (due right away) — no more room for struggleShrink
      // to tighten further, so a repeated miss here just keeps the streak counter climbing.
      streak += 1;
      box = 1;
      lapses += 1;
      due = now; // back in the pool right away, not banished for a full day
    }
    return {
      box: box, interval: LEITNER_BOX_DAYS[box - 1], reps: reps, lapses: lapses, due: due,
      state: 'review', ease: card.ease || EASE_START, learningStep: 0,
      isLeech: lapses >= LEECH_THRESHOLD, strugglingStreak: streak
    };
  }

  var STARS = { again: 0, hard: 1, good: 2, easy: 3 };

  /* ============ automatic grading: derive the SM-2 rating from correct/incorrect + time taken ============ */
  /* No more asking the kid to self-judge "was that easy or hard" — we just need right vs. wrong (still
     self-reported for flip/read cards, since there's no way to grade an open-ended answer automatically;
     fully automatic for multiple-choice, since the app already knows). Response time then decides how
     confidently "right" counts: quick + correct graduates further out than slow + correct, and any wrong
     answer is always "again" regardless of how long it took. */
  var TIME_THRESHOLDS = {
    choice: { fastMs: 3000,  slowMs: 9000  },  // time from seeing the question to tapping an option
    flip:   { fastMs: 4000,  slowMs: 12000 },  // time from seeing the front to flipping (recall latency)
    read:   { fastMs: 5000,  slowMs: 15000 }   // time from seeing the word/phrase to marking it read
  };
  function autoRating(mode, correct, elapsedMs){
    if(!correct) return 'again';
    // Only the 'sm2_speed' algorithm (the default) weighs response time; the other two options
    // treat every correct answer the same regardless of how long it took.
    var algo = S.settings.algorithm || 'sm2_speed';
    if(algo !== 'sm2_speed') return 'good';
    var t = TIME_THRESHOLDS[mode] || TIME_THRESHOLDS.flip;
    if(elapsedMs <= t.fastMs) return 'easy';
    if(elapsedMs <= t.slowMs) return 'good';
    return 'hard';
  }

  /* ============ sound + haptics (synthesized, no external files) ============ */
  var Sound = (function(){
    var ctx = null;
    var enabled = true;
    try {
      var saved = localStorage.getItem('coralCoveSound');
      if(saved !== null) enabled = saved === '1';
    } catch(e){}

    function ensureCtx(){
      if(!ctx){
        var AC = window.AudioContext || window.webkitAudioContext;
        if(AC){ try { ctx = new AC(); } catch(e){ ctx = null; } }
      }
      if(ctx && ctx.state === 'suspended'){ ctx.resume().catch(function(){}); }
      return ctx;
    }

    function tone(freq, start, dur, type, peak){
      var c = ensureCtx();
      if(!c || !enabled) return;
      try {
        var osc = c.createOscillator();
        var gain = c.createGain();
        osc.type = type || 'sine';
        osc.frequency.value = freq;
        var t0 = c.currentTime + start;
        gain.gain.setValueAtTime(0.0001, t0);
        gain.gain.linearRampToValueAtTime(peak || 0.16, t0 + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
        osc.connect(gain); gain.connect(c.destination);
        osc.start(t0); osc.stop(t0 + dur + 0.03);
      } catch(e){}
    }

    function slideTone(freqStart, freqEnd, start, dur, type, peak){
      var c = ensureCtx();
      if(!c || !enabled) return;
      try {
        var osc = c.createOscillator();
        var gain = c.createGain();
        osc.type = type || 'sine';
        var t0 = c.currentTime + start;
        osc.frequency.setValueAtTime(freqStart, t0);
        osc.frequency.exponentialRampToValueAtTime(Math.max(1, freqEnd), t0 + dur);
        gain.gain.setValueAtTime(0.0001, t0);
        gain.gain.linearRampToValueAtTime(peak || 0.14, t0 + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
        osc.connect(gain); gain.connect(c.destination);
        osc.start(t0); osc.stop(t0 + dur + 0.03);
      } catch(e){}
    }

    function vibrate(pattern){
      if(!enabled) return;
      try { if(navigator.vibrate) navigator.vibrate(pattern); } catch(e){}
    }

    // iOS Safari silences Web Audio API tones whenever the physical mute/ring switch is
    // flipped to silent — this is a long-standing platform quirk, not a bug in this app.
    // The known workaround: get a real HTML5 <audio> element playing (even near-silent,
    // looped audio) from the very first tap. That switches the page's audio session into
    // the "playback" category, which iOS does NOT silence for the mute switch, and Web
    // Audio tones started afterward inherit that same session. Best-effort — not guaranteed
    // on every iOS version, but harmless if it doesn't help.
    var silentUnlockAudio = null;
    var SILENT_WAV = 'data:audio/wav;base64,UklGRkQDAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YSADAACAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgA==';
    function startSilentUnlock(){
      if(silentUnlockAudio) return;
      try {
        silentUnlockAudio = new Audio(SILENT_WAV);
        silentUnlockAudio.loop = true;
        silentUnlockAudio.volume = 0.01;
        var p = silentUnlockAudio.play();
        if(p && p.catch) p.catch(function(){});
      } catch(e){}
    }

    return {
      isEnabled: function(){ return enabled; },
      setEnabled: function(v){
        enabled = v;
        try { localStorage.setItem('coralCoveSound', v ? '1' : '0'); } catch(e){}
      },
      unlock: function(){ ensureCtx(); startSilentUnlock(); }, // call on first user gesture so mobile browsers allow audio later
      tap: function(){ tone(520, 0, 0.06, 'sine', 0.10); vibrate(8); },
      flip: function(){ tone(420, 0, 0.08, 'sine', 0.10); tone(640, 0.05, 0.09, 'sine', 0.09); vibrate(10); },
      // Playful "ta-da!" — a quick bouncing major arpeggio with a sparkly high glimmer on top.
      correct: function(){
        tone(523, 0,    0.08, 'triangle', 0.15);   // C5
        tone(659, 0.06, 0.08, 'triangle', 0.15);   // E5
        tone(784, 0.12, 0.10, 'triangle', 0.16);   // G5
        tone(1047, 0.19, 0.16, 'triangle', 0.15);  // C6 — the "ta-da"
        tone(1568, 0.20, 0.12, 'sine', 0.05);      // tiny sparkle overlay
        vibrate([10, 15, 10]);
      },
      // Playful cartoon "womp womp" — a comic downward slide instead of a harsh buzzer, so it stays fun, not discouraging.
      wrong: function(){
        slideTone(420, 180, 0,    0.24, 'sawtooth', 0.09);
        slideTone(320, 140, 0.20, 0.22, 'sawtooth', 0.07);
        vibrate([20, 30, 20]);
      },
      sessionStart: function(){ tone(523, 0, 0.10, 'triangle', 0.15); tone(659, 0.09, 0.10, 'triangle', 0.15); tone(784, 0.18, 0.18, 'triangle', 0.16); vibrate([20, 50, 20]); },
      sessionEnd: function(){ tone(784, 0, 0.12, 'triangle', 0.16); tone(659, 0.11, 0.10, 'triangle', 0.14); tone(523, 0.20, 0.18, 'triangle', 0.15); vibrate([30, 60, 30, 60, 30]); }
    };
  })();

  /* ============ spoken answers (Web Speech API — no audio files to host, works offline) ============ */
  var Speech = (function(){
    var supported = !!(window.speechSynthesis && window.SpeechSynthesisUtterance);
    var voices = [];
    var lastUtter = null; // keep a live reference while speaking -- Chrome has a long-documented bug
                           // where an utterance with no other reference gets garbage-collected mid-speech,
                           // silently cutting off audio with no error at all

    function refreshVoices(){
      if(!supported) return;
      try { voices = window.speechSynthesis.getVoices() || []; } catch(e){ voices = []; }
    }
    if(supported){
      refreshVoices();
      // Voices load asynchronously in most browsers -- on first page load getVoices() often comes
      // back empty even though voices arrive a moment later.
      try { window.speechSynthesis.onvoiceschanged = refreshVoices; } catch(e){}
    }

    // Card text with no lang hint stored, so detect it from the actual characters: Hangul -> Korean,
    // otherwise assume English. Without this, the browser's default voice (almost always English)
    // tries to read Hangul and many engines produce nothing at all rather than a mispronunciation.
    function detectLang(text){
      return /[가-힣ᄀ-ᇿ㄰-㆏]/.test(text) ? 'ko-KR' : 'en-US';
    }

    function pickVoice(lang){
      if(!voices.length) refreshVoices();
      if(!voices.length) return null;
      var exact = voices.filter(function(v){ return v.lang === lang; });
      if(exact.length) return exact[0];
      var prefix = lang.split('-')[0];
      var loose = voices.filter(function(v){ return v.lang && v.lang.indexOf(prefix) === 0; });
      return loose.length ? loose[0] : null;
    }

    function doSpeak(text, lang){
      try {
        window.speechSynthesis.cancel(); // stop anything already talking before starting the new line
        var utter = new SpeechSynthesisUtterance(String(text));
        utter.lang = lang;
        var v = pickVoice(lang);
        if(v) utter.voice = v;
        utter.rate = 0.88;   // a touch slower, easier for an early reader to follow
        utter.pitch = 1.05;
        lastUtter = utter;
        utter.onend = utter.onerror = function(){ if(lastUtter === utter) lastUtter = null; };
        window.speechSynthesis.speak(utter);
      } catch(e){}
    }

    function speak(text){
      if(!supported || !Sound.isEnabled() || !text) return;
      var str = String(text);
      var lang = detectLang(str);
      if(!voices.length){
        refreshVoices();
        if(!voices.length){
          // Give voices a brief moment to finish loading rather than speaking with whatever the
          // browser's un-loaded default happens to be (or silently failing if it has none yet).
          var tries = 0;
          var wait = setInterval(function(){
            refreshVoices();
            tries++;
            if(voices.length || tries > 10){
              clearInterval(wait);
              doSpeak(str, lang);
            }
          }, 150);
          return;
        }
      }
      doSpeak(str, lang);
    }
    return { speak: speak, isSupported: function(){ return supported; } };
  })();

  /* ============ tiny non-cryptographic PIN hash ============ */
  /* Not real security — just stops a curious kid from reading the PIN straight out of the saved data. */
  function pinHash(str){
    var h = 5381;
    str = String(str || '');
    for(var i = 0; i < str.length; i++){ h = ((h * 33) ^ str.charCodeAt(i)) >>> 0; }
    return h.toString(36);
  }

  /* ============ store adapter (db capability, with in-memory fallback) ============ */
  // A save/delete that fails against the live db capability used to fail SILENTLY -- the edit/trash
  // buttons in the deck editor looked like they "just didn't work" because nothing told the grown-up
  // anything went wrong. Every live write below is now wrapped with reportStoreError() so a failure
  // surfaces as a small dismissible banner instead of doing nothing.
  function reportStoreError(action){
    return function(err){
      console.error('[Coral Cove] '+action+' failed', err);
      S.storeError = (action.charAt(0).toUpperCase()+action.slice(1)) + ' didn\'t save. Check your connection and try again.';
      render();
      throw err;
    };
  }

  var store = (function(){
    var mem = { decks: [], cards: {}, stats: { streak:0, stars:0, lastReviewDateISO:null, totalReviews:0 }, settings: { pinHash:null, sessionActive:false, sessionStartedAt:null, algorithm:'sm2_speed', difficulty:'medium' }, sessionTally: null, history: [], nextId: 1, deckListeners: [], cardListeners: {} };
    var db = null;
    var live = false;

    function memId(){ return 'local-' + (mem.nextId++); }
    function notifyDecks(){ mem.deckListeners.forEach(function(cb){ cb(mem.decks.slice()); }); }
    function notifyCards(deckId){ (mem.cardListeners[deckId]||[]).forEach(function(cb){ cb((mem.cards[deckId]||[]).slice()); }); }

    function api(){
      return {
        live: live,
        listenDecks: function(cb){
          if(live){
            return db.collection('decks').orderBy('order','asc').onSnapshot(function(snap){
              cb(snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); }));
            }, function(err){
              // onSnapshot errors are terminal -- this listener is now dead and will never fire again.
              // Falling back to the (always-empty, in live mode) in-memory store used to silently wipe
              // every deck from the screen. Keep whatever was last shown instead, and tell the grown-up.
              console.error('[Coral Cove] deck sync lost', err);
              S.storeError = 'Lost connection while syncing your decks — please reload the page.';
              render();
            });
          }
          mem.deckListeners.push(cb);
          cb(mem.decks.slice());
          return function(){ mem.deckListeners = mem.deckListeners.filter(function(x){ return x!==cb; }); };
        },
        addDeck: function(data){
          data = Object.assign({ createdAt: Date.now() }, data);
          if(live) return db.collection('decks').add(data).then(function(ref){ return ref.id; }).catch(reportStoreError('create deck'));
          var id = memId();
          mem.decks.push(Object.assign({id:id}, data));
          mem.cards[id] = [];
          notifyDecks();
          return Promise.resolve(id);
        },
        updateDeck: function(id, data){
          if(live) return db.collection('decks').doc(id).update(data).catch(reportStoreError('save deck'));
          var d = mem.decks.find(function(x){ return x.id===id; });
          if(d) Object.assign(d, data);
          notifyDecks();
          return Promise.resolve();
        },
        deleteDeck: function(id){
          if(live){
            return db.collection('decks/'+id+'/cards').get().then(function(snap){
              return Promise.all(snap.docs.map(function(d){ return d.ref ? d.ref.delete() : db.collection('decks/'+id+'/cards').doc(d.id).delete(); }));
            }).then(function(){ return db.collection('decks').doc(id).delete(); }).catch(reportStoreError('delete deck'));
          }
          mem.decks = mem.decks.filter(function(x){ return x.id!==id; });
          delete mem.cards[id];
          notifyDecks();
          return Promise.resolve();
        },
        getCardsOnce: function(deckId){
          if(live){
            return db.collection('decks/'+deckId+'/cards').get().then(function(snap){
              return snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
            });
          }
          return Promise.resolve((mem.cards[deckId]||[]).slice());
        },
        listenCards: function(deckId, cb){
          if(live){
            return db.collection('decks/'+deckId+'/cards').onSnapshot(function(snap){
              cb(snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); }));
            }, function(err){
              // Same terminal-error issue as listenDecks above: don't blank the real card list with
              // an always-empty in-memory fallback -- keep showing the last-known cards and surface it.
              console.error('[Coral Cove] card sync lost', err);
              S.storeError = 'Lost connection while syncing this deck\'s cards — please reload the page.';
              render();
            });
          }
          if(!mem.cardListeners[deckId]) mem.cardListeners[deckId] = [];
          mem.cardListeners[deckId].push(cb);
          cb((mem.cards[deckId]||[]).slice());
          return function(){ mem.cardListeners[deckId] = (mem.cardListeners[deckId]||[]).filter(function(x){ return x!==cb; }); };
        },
        addCard: function(deckId, data){
          data = Object.assign({ due: Date.now(), interval:0, ease:2.5, reps:0, lapses:0, state:'new', learningStep:0, createdAt: Date.now() }, data);
          if(live) return db.collection('decks/'+deckId+'/cards').add(data).catch(reportStoreError('save card'));
          var id = memId();
          if(!mem.cards[deckId]) mem.cards[deckId] = [];
          mem.cards[deckId].push(Object.assign({id:id}, data));
          notifyCards(deckId);
          return Promise.resolve();
        },
        updateCard: function(deckId, cardId, data){
          if(live) return db.collection('decks/'+deckId+'/cards').doc(cardId).update(data).catch(reportStoreError('save card'));
          var arr = mem.cards[deckId]||[];
          var c = arr.find(function(x){ return x.id===cardId; });
          if(c) Object.assign(c, data);
          notifyCards(deckId);
          return Promise.resolve();
        },
        deleteCard: function(deckId, cardId){
          if(live) return db.collection('decks/'+deckId+'/cards').doc(cardId).delete().catch(reportStoreError('delete card'));
          mem.cards[deckId] = (mem.cards[deckId]||[]).filter(function(x){ return x.id!==cardId; });
          notifyCards(deckId);
          return Promise.resolve();
        },
        getStats: function(){
          if(live) return db.doc('stats/summary').get().then(function(snap){
            return snap.exists ? snap.data() : { streak:0, stars:0, lastReviewDateISO:null, totalReviews:0 };
          });
          return Promise.resolve(Object.assign({}, mem.stats));
        },
        setStats: function(data){
          if(live) return db.doc('stats/summary').set(data);
          mem.stats = Object.assign({}, data);
          return Promise.resolve();
        },
        getSettings: function(){
          if(live) return db.doc('settings/parent').get().then(function(snap){
            return snap.exists ? snap.data() : { pinHash:null, sessionActive:false, sessionStartedAt:null, algorithm:'sm2_speed', difficulty:'medium' };
          });
          return Promise.resolve(Object.assign({}, mem.settings));
        },
        setSettings: function(data){
          if(live) return db.doc('settings/parent').set(data);
          mem.settings = Object.assign({}, data);
          return Promise.resolve();
        },
        getSessionTally: function(){
          if(live) return db.doc('session/current').get().then(function(snap){
            return snap.exists ? snap.data() : null;
          });
          return Promise.resolve(mem.sessionTally ? Object.assign({}, mem.sessionTally) : null);
        },
        setSessionTally: function(data){
          if(live) return db.doc('session/current').set(data);
          mem.sessionTally = Object.assign({}, data);
          return Promise.resolve();
        },
        // A permanent, append-only log of finished study rounds — this is what powers the
        // overall Stats page's trend chart. Never overwritten, unlike sessionTally above.
        addHistoryEntry: function(data){
          data = Object.assign({ endedAt: Date.now() }, data);
          if(live) return db.collection('history').add(data);
          var id = memId();
          mem.history.push(Object.assign({id:id}, data));
          return Promise.resolve();
        },
        getHistoryOnce: function(){
          if(live) return db.collection('history').get().then(function(snap){
            return snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
          });
          return Promise.resolve(mem.history.slice());
        }
      };
    }

    return {
      init: function(){
        if(!(window.claude && window.claude.use)) return Promise.resolve(api());
        return window.claude.use('db').then(function(handle){
          if(handle){ db = handle; live = true; }
          return api();
        }).catch(function(){ return api(); });
      }

  /* ============ photo uploads (assets capability) ============ */
  // Only available inside the live published app (claude.ai) -- the offline export and any old
  // in-memory "try it out" preview never get a handle here, so photo upload is hidden there and
  // existing photos still just display fine (they're plain https image URLs once uploaded).
  var Assets = (function(){
    var handle = null;
    return {
      init: function(){
        if(!(window.claude && window.claude.use)) return Promise.resolve(null);
        return window.claude.use('assets').then(function(h){ handle = h; return h; }).catch(function(){ handle = null; return null; });
      },
      available: function(){ return !!handle; },
      upload: function(blob){ return handle ? handle.upload(blob) : Promise.reject(new Error('Photo uploads are only available in the live app.')); },
      remove: function(id){
        if(!handle || !id) return Promise.resolve();
        // Best-effort: an old/abandoned photo failing to delete just leaves a harmless orphan in
        // the artifact's asset storage -- never worth surfacing an error banner for.
        return handle.delete(id).catch(function(err){ console.warn('[Coral Cove] could not delete photo asset', err); });
      }
    };
  })();

  // Shrinks a photo to a reasonable size before upload (most phone photos are far larger than a
  // flashcard ever needs to display). Images already smaller than the cap are uploaded untouched.
  // PNG stays PNG (keeps transparency); anything else becomes a JPEG to keep storage/light.
  function downscalePhoto(file, maxDim){
    return new Promise(function(resolve){
      var img = new Image();
      var url = URL.createObjectURL(file);
      img.onload = function(){
        URL.revokeObjectURL(url);
        var w = img.naturalWidth, h = img.naturalHeight;
        if(!w || !h || Math.max(w, h) <= maxDim){ resolve(file); return; }
        var scale = maxDim / Math.max(w, h);
        var outW = Math.max(1, Math.round(w*scale)), outH = Math.max(1, Math.round(h*scale));
        var canvas = document.createElement('canvas');
        canvas.width = outW; canvas.height = outH;
        var ctx = canvas.getContext('2d');
        if(!ctx){ resolve(file); return; }
        ctx.drawImage(img, 0, 0, outW, outH);
        var outType = file.type === 'image/png' ? 'image/png' : 'image/jpeg';
        canvas.toBlob(function(blob){ resolve(blob || file); }, outType, 0.85);
      };
      img.onerror = function(){ URL.revokeObjectURL(url); resolve(file); };
      img.src = url;
    });
  }

  function defaultTally(){
    return { startedAt: Date.now(), endedAt: null, reviewedCount: 0, starsEarned: 0, again: 0, hard: 0, good: 0, easy: 0, decksStudied: [] };
  }

  var DECK_EMOJI = ['🐢','🐬','🐳','🦀','🐠','🦈','🦞','🐙','🌊','🐚','🦑','⭐'];

  // Preset subjects a deck can be tagged with, shown as chips in the deck editor and as tabs on the
  // deck grid. A deck can also carry a custom subject (any typed text) instead of one of these ids --
  // subjectMeta() below resolves either kind to a display icon+label.
  var SUBJECTS = [
    { id:'reading', icon:'📖', label:'Reading' },
    { id:'math', icon:'🔢', label:'Math' },
    { id:'korean', icon:'🇰🇷', label:'Korean' },
    { id:'science', icon:'🔬', label:'Science' },
    { id:'life', icon:'🌱', label:'Life Skills' },
    { id:'other', icon:'✨', label:'Other' }
  ];
  function subjectMeta(subject){
    if(!subject) return null;
    var preset = SUBJECTS.find(function(s){ return s.id === subject; });
    if(preset) return preset;
    return { id: subject, icon:'🏷️', label: subject }; // a parent-typed custom subject: the text IS the id
  }
  // Builds the tab list for whichever deck set is currently in view (kid home or Manage Decks, and
  // already narrowed by the Live/Archived filter there). Returns null when nothing is tagged yet, so
  // the tab row stays hidden until a parent actually starts using subjects -- no empty-looking UI.
  function buildSubjectTabs(decks){
    var present = {};
    decks.forEach(function(d){
      if(!d.subject) return;
      var meta = subjectMeta(d.subject);
      if(!present[meta.id]) present[meta.id] = { id: meta.id, icon: meta.icon, label: meta.label, count: 0 };
      present[meta.id].count += 1;
    });
    var ids = Object.keys(present);
    if(!ids.length) return null;
    var presetOrder = SUBJECTS.map(function(s){ return s.id; });
    ids.sort(function(a,b){
      var ai = presetOrder.indexOf(a), bi = presetOrder.indexOf(b);
      if(ai !== -1 && bi !== -1) return ai - bi;
      if(ai !== -1) return -1;
      if(bi !== -1) return 1;
      return present[a].label.localeCompare(present[b].label);
    });
    return ids.map(function(id){ return present[id]; });
  }

  function todayISO(d){ d = d || new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function shuffle(arr){ var a = arr.slice(); for(var i=a.length-1;i>0;i--){ var j = Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }

  /* ---------- LOCK SCREEN (Adult Mode / Child Mode choice) + PIN PAD ---------- */

  function renderLocked(){

  function pinPadHTML(title, sub, cancelLabel){
    var dots = '';

    var keyHTML = [1,2,3,4,5,6,7,8,9].map(function(k){

    }).join('');

  function wirePinKeys(onFilled, onCancel){
    app.querySelectorAll('[data-digit]').forEach(function(b){
      b.addEventListener('click', function(){
        if(S.pinInput.length >= 4) return;
        Sound.tap();
        S.pinInput += b.dataset.digit;
        S.pinError = ''; S.pinShake = false;
        var filled = S.pinInput.length === 4;
        render();
        if(filled) setTimeout(onFilled, 220);
      });
    });
    var back = app.querySelector('[data-act="pin-back"]');
    if(back) back.addEventListener('click', function(){
      if(!S.pinInput.length) return;
      Sound.tap();
      S.pinInput = S.pinInput.slice(0, -1);
      S.pinError = '';
      render();
    });
    var cancel = app.querySelector('[data-act="pin-cancel"]');
    if(cancel && onCancel) cancel.addEventListener('click', onCancel);

  function beginSession(){

    // once per visit" anymore. Adult Mode is the thing that's always free now (see renderLocked).
    if(kind === 'start'){
