  function createDeck(){
    var emoji = DECK_EMOJI[Math.floor(Math.random()*DECK_EMOJI.length)];
    S.store.addDeck({ name: 'New Deck', emoji: emoji, order: S.decks.length }).then(function(id){
      openEditor(id, true);
    });
  }

  /* ---------- ANKI IMPORT ----------
     Scoped deliberately to Anki's plain-text export (File -> Export -> "Notes in Plain Text"),
     which is tab- or comma-separated with optional "#"-prefixed header lines -- NOT the zipped
     .apkg format, which would need a SQLite reader Coral Cove has no way to load. */
  function stripAnkiHtml(s){
    s = String(s == null ? '' : s);
    s = s.replace(/\[sound:[^\]]*\]/gi, '');
    s = s.replace(/<[^>]+>/g, ' ');
    var ta = document.createElement('textarea');
    ta.innerHTML = s;
    s = ta.value;
    return s.replace(/\s+/g, ' ').trim();
  }

  function parseAnkiPlainText(text){
    var lines = String(text||'').replace(/\r\n/g,'\n').replace(/\r/g,'\n').split('\n');
    // "#"-prefixed lines are Anki's own export metadata (#separator:tab, #html:true, ...) -- not data.
    var dataLines = lines.filter(function(l){ return l.trim() && l.trim().charAt(0) !== '#'; });
    if(!dataLines.length) return [];
    var delim = dataLines.some(function(l){ return l.indexOf('\t') !== -1; }) ? '\t' : ',';
    var cards = [];
    dataLines.forEach(function(l){
      var fields = l.split(delim);
      var front = stripAnkiHtml(fields[0]);
      var back = stripAnkiHtml(fields[1]);
      if(front && back) cards.push({ front: front, back: back });
    });
    return cards;
  }

  function handleAnkiImportFile(file){
    var reader = new FileReader();
    reader.onload = function(){
      var parsed = parseAnkiPlainText(String(reader.result || ''));
      if(!parsed.length){
        S.storeError = 'Couldn’t find any cards in that file. Coral Cove reads Anki’s plain-text export (File → Export → "Notes in Plain Text") with a Front and Back column — not the .apkg format.';
        render();
        return;
      }
      var suggested = file.name.replace(/\.(txt|csv|tsv)$/i, '') || 'Imported Deck';
      var name = window.prompt('Name this new deck:', suggested);
      if(!name) return;
      var emoji = DECK_EMOJI[Math.floor(Math.random()*DECK_EMOJI.length)];
      S.store.addDeck({ name: name.trim() || 'Imported Deck', emoji: emoji, order: S.decks.length }).then(function(deckId){
        return Promise.all(parsed.map(function(c){
          return S.store.addCard(deckId, { front: c.front, back: c.back, note: '', mode: 'flip', choices: [], category: '', photoId: '', photoUrl: '' });
        }));
      }).then(function(){
        render();
      }).catch(function(err){
        console.error('[Coral Cove] Anki import failed', err);
        S.storeError = 'That import didn’t finish saving. Check your connection and try again.';
        render();
      });
    };
    reader.onerror = function(){
      S.storeError = 'Couldn’t read that file — please try again.';
      render();
    };
    reader.readAsText(file);
  }

  /* ---------- STUDY ---------- */
  // Round length now comes from the parent-set difficulty (Easy 4 / Medium 6 / Hard 10) rather than
  // a fixed constant — see DIFFICULTIES up top.

  function startStudy(deckId){
    S.currentDeckId = deckId;
    S.editMode = false; // Edit Mode is a deck-management concept -- Dive In always leaves it behind
    S.store.updateDeck(deckId, { lastOpenedAt: Date.now() }); // drives the Manage Decks "most recently opened" order
    S.store.getCardsOnce(deckId).then(function(cards){
      var pool = buildStudyPool(cards);
      S.studyQueue = shuffle(pool).slice(0, currentDifficulty().roundSize);
      S.studyTotal = S.studyQueue.length;
      S.sessionReviewed = 0;
      S.sessionStars = 0;
      S.roundTally = { again: 0, hard: 0, good: 0, easy: 0 };
      S.view = 'study';
      S.cardFlipped = false;
      S.choiceState = null;
      S.dragState = null;
      S.timedChoiceState = null;
      S.timedChoiceAllCards = cards; // full deck pool (not just this round's queue) -- gives 'timedchoice' mode enough sibling cards to draw distractors from even on a short round
      S.timedChoiceDirection = null;
      S.timedChoiceGroupLeft = 0;
      clearTimedChoiceTimer();
      S.currentCardId = null;
      S.cardShownAt = null;
      S.cardFlippedAt = null;
      S.transitioning = false;
      S.peeking = false;
      S.lastAnsweredCard = null;
      S.critterPrevPct = 0;
      render();
    });
  }

  /* ---------- WORD FEED ---------- */
  // A deck-level mode (deck.feedMode === true, toggled in the deck editor), not a per-card mode like
  // flip/read/choice/match/blank. A "Dive In" on a Word Feed deck skips renderStudy() entirely for a
  // full-screen, TikTok-style vertical swipe browser: one word centered per screen, spoken aloud as it
  // settles, swipe up/down to move through the deck with no fixed direction and no end -- it loops.
  // Deliberately fun-only: no grading, no SRS fields touched, no stats/history/streak writes, no
  // summary screen. See startStudy() just above for the equivalent entry point into a graded round.
  function startFeed(deckId){
    S.currentDeckId = deckId;
    S.editMode = false;
    S.store.updateDeck(deckId, { lastOpenedAt: Date.now() }); // same "recently opened" bookkeeping as every other deck entry point
    S.store.getCardsOnce(deckId).then(function(cards){
      if(!cards.length) return; // the Dive In button is disabled at 0 cards already; this is just a guard
      S.feedQueue = shuffle(cards);
      S.feedIndex = 0;
      S.feedLastSpokenId = null;
      Ambience.stop();          // always opens quiet -- see feedSoundId's comment up in the S state object
      S.feedSoundId = null;
      S.soundPickerOpen = false;
      S.view = 'feed';
      render();
    });
  }

  function renderFeed(){
    var deck = S.decks.find(function(d){ return d.id === S.currentDeckId; }) || { name:'Word Feed', emoji:'🎬' };
    var queue = S.feedQueue;
    if(!queue.length){ goHome(); return; }
    var n = queue.length;
    var idx = ((S.feedIndex % n) + n) % n;
    var curCard = queue[idx];
    var nextCard = queue[(idx + 1) % n];
    var prevCard = queue[(idx - 1 + n) % n];

    // Speak exactly once per settled card, including the very first one -- guarded so a re-render for
    // an unrelated reason (there shouldn't be many, but it's cheap insurance) never repeats a word.
    // Deliberately NOT gated behind "Child Mode only" the way choice/match/blank's tap-to-speak is --
    // this mirrors flip mode's auto-speak-on-reveal instead, which plays for a grown-up too, since the
    // entire point of Word Feed is the word-plus-sound pairing regardless of who's browsing it.
    if(S.feedLastSpokenId !== curCard.id){
      S.feedLastSpokenId = curCard.id;
      Speech.speak(curCard.front);
    }

    function feedCardHTML(c, pos){
      return '<div class="feed-card feed-card-'+pos+'" data-feed-pos="'+pos+'"><div class="feed-word">'+esc(c.front)+'</div></div>';
    }

    app.innerHTML = '' +
      '<div class="feed-topbar">' +
        '<button type="button" class="icon-btn" data-act="exit-feed" aria-label="Close Word Feed" title="Close">✕</button>' +
        '<div class="feed-deck-label">'+deck.emoji+' '+esc(deck.name)+'</div>' +
        '<button type="button" class="icon-btn" data-act="feed-sounds" aria-label="Feed sounds" title="Sounds">'+(S.feedSoundId?'🎧':'🔈')+'</button>' +
      '</div>' +
      '<div class="feed-stage" id="feedStage">' +
        feedCardHTML(prevCard, 'prev') +
        feedCardHTML(curCard, 'current') +
        feedCardHTML(nextCard, 'next') +
      '</div>' +
      '<div class="feed-hint">↕ Swipe for another word</div>' +
      (S.soundPickerOpen ? soundPanelHTML() : '');

    app.querySelector('[data-act="exit-feed"]').addEventListener('click', function(){
      try { window.speechSynthesis && window.speechSynthesis.cancel(); } catch(e){}
      Ambience.stop();
      // In Adult Mode a grown-up is already in (no PIN was needed to get here), so backing out of
      // Word Feed just returns to Manage Decks -- same rule as exit-study just above. In Child Mode,
      // a kid backing out of Word Feed on their own needs a grown-up's PIN, same as leaving a study
      // round early (this used to skip the PIN entirely, which meant a kid could freely wander out
      // of a session mid-swipe with no grown-up involved).
      if(S.managingDecks){ goHome(); return; }
      S.pinInput=''; S.pinError=''; S.pinShake=false;
      S.pinPromptFor = 'exit';
      render();
    });

    app.querySelector('[data-act="feed-sounds"]').addEventListener('click', function(){
      S.soundPickerOpen = !S.soundPickerOpen;
      render();
    });

    if(S.soundPickerOpen) wireSoundPanel(); else wireFeedSwipe(curCard.front);
  }

  // The Word Feed sound shop -- six looping ambient tracks (see the Ambience module up top), three
  // free and three bought once with stars. Rendered as a bottom-sheet over the feed stage rather than
  // navigating away, so picking a sound (or closing the panel) never interrupts the swipe session.
  function soundPanelHTML(){
    var stats = S.stats || {};
    var unlocked = stats.unlockedSounds || [];
    var tiles = SOUND_TRACKS.map(function(t){
      var isUnlocked = t.free || unlocked.indexOf(t.id) !== -1;
      var active = S.feedSoundId === t.id;
      var shaking = S.soundBuyError === t.id;
      var sub = !isUnlocked ? ('🔒 '+SOUND_PRICE+'⭐') : (active ? '▶ Playing' : 'Tap to play');
      return '' +
        '<button type="button" class="sound-tile'+(active?' active':'')+(isUnlocked?'':' locked')+(shaking?' shake':'')+'" data-sound-id="'+t.id+'">' +
          '<span class="sound-tile-icon">'+t.icon+'</span>' +
          '<span class="sound-tile-name">'+esc(t.name)+'</span>' +
          '<span class="sound-tile-sub">'+sub+'</span>' +
        '</button>';
    }).join('');
    return '' +
      '<div class="sound-panel-backdrop">' +
        '<div class="sound-panel">' +
          '<div class="sound-panel-head">' +
            '<span class="sound-panel-title">🎧 Feed Sounds</span>' +
            '<span class="pill stars"><span class="icon">⭐</span><span class="tabular">'+(stats.stars||0)+'</span></span>' +
          '</div>' +
          '<div class="sound-list">' +
            '<button type="button" class="sound-tile off-tile'+(!S.feedSoundId?' active':'')+'" data-sound-off>' +
              '<span class="sound-tile-icon">🔇</span><span class="sound-tile-name">No Sound</span>' +
              '<span class="sound-tile-sub">'+(!S.feedSoundId?'▶ Selected':'Tap to mute')+'</span>' +
            '</button>' +
            tiles +
          '</div>' +
          '<div class="sound-panel-hint">Unlock more sounds for '+SOUND_PRICE+'⭐ each — earn stars by studying decks!</div>' +
          '<button type="button" class="btn btn-ghost sound-panel-close" data-act="close-sound-panel">Done</button>' +
        '</div>' +
      '</div>';
  }

  function wireSoundPanel(){
    var backdrop = app.querySelector('.sound-panel-backdrop');
    if(backdrop) backdrop.addEventListener('click', function(e){
      if(e.target === backdrop){ S.soundPickerOpen = false; render(); }
    });
    app.querySelectorAll('[data-act="close-sound-panel"]').forEach(function(b){
      b.addEventListener('click', function(){ S.soundPickerOpen = false; render(); });
    });
    var offBtn = app.querySelector('[data-sound-off]');
    if(offBtn) offBtn.addEventListener('click', function(){
      Ambience.stop();
      S.feedSoundId = null;
      render();
    });
    app.querySelectorAll('[data-sound-id]').forEach(function(btn){
      btn.addEventListener('click', function(){ handleSoundTileTap(btn.dataset.soundId); });
    });
  }

  // Tapping an unlocked (or free) tile toggles it on/off; tapping a locked one spends
  // SOUND_PRICE stars to unlock it forever for this profile (once bought, always available from
  // then on) and immediately starts playing it -- or, without enough stars, gives that one tile a
  // brief shake instead of silently doing nothing.
  function handleSoundTileTap(id){
    var track = SOUND_TRACKS.filter(function(t){ return t.id === id; })[0];
    if(!track) return;
    var unlocked = track.free || (S.stats.unlockedSounds || []).indexOf(id) !== -1;
    if(unlocked){
      if(S.feedSoundId === id){
        Ambience.stop();
        S.feedSoundId = null;
      } else {
        Ambience.play(id);
        S.feedSoundId = id;
      }
      render();
      return;
    }
    if((S.stats.stars || 0) < SOUND_PRICE){
      S.soundBuyError = id;
      render();
      setTimeout(function(){ if(S.soundBuyError === id){ S.soundBuyError = null; render(); } }, 650);
      return;
    }
    var newStats = Object.assign({}, S.stats, {
      stars: (S.stats.stars || 0) - SOUND_PRICE,
      unlockedSounds: (S.stats.unlockedSounds || []).concat([id])
    });
    S.store.setStats(newStats).then(function(){
      S.stats = newStats;
      Ambience.play(id);
      S.feedSoundId = id;
      render();
    }).catch(function(){});
  }

  // Pointer-Events-based vertical swipe, same touch-and-mouse-compatible approach as wireDragTiles()
  // above: the active card follows the pointer while dragging (no CSS transition), then either
  // animates the rest of the way past the stage edge (transition re-enabled) once a distance threshold
  // is cleared, swapping in the neighboring card underneath, or springs back to center if it wasn't.
  // Generic so both Word Feed and Story Mode below share the exact same swipe feel -- only the stage's
  // element id and what "advance"/"go back" mean (shuffled deck vs. a story's word order) differ.
  function wireVerticalSwipeFeed(stageId, onCommitNext, onCommitPrev, onTap){
    var stage = document.getElementById(stageId);
    if(!stage) return;
    var cur = stage.querySelector('.feed-card-current');
    var nxt = stage.querySelector('.feed-card-next');
    var prv = stage.querySelector('.feed-card-prev');
    if(!cur || !nxt || !prv) return;
    var THRESHOLD = 60; // px of vertical drag before a swipe counts as committed
    var TAP_SLOP = 8;   // px of accidental finger drift that still counts as a tap, not an aborted swipe
    var TAP_MS = 500;   // a press held longer than this isn't a tap even if the finger didn't move
    var SETTLE_MS = 300;
    var startY = 0, dy = 0, dragging = false, settling = false, activePid = null, downTime = 0;

    function setDragTransforms(delta){
      cur.style.transform = 'translateY('+delta+'px)';
      nxt.style.transform = 'translateY(calc(100% + '+delta+'px))';
      prv.style.transform = 'translateY(calc(-100% + '+delta+'px))';
    }
    function setTransitions(on){
      var t = on ? 'transform .3s cubic-bezier(.22,.8,.32,1)' : 'none';
      cur.style.transition = t; nxt.style.transition = t; prv.style.transition = t;
    }

    stage.addEventListener('pointerdown', function(e){
      if(settling) return;
      activePid = e.pointerId;
      startY = e.clientY; dy = 0; dragging = true; downTime = Date.now();
      setTransitions(false);
      try { stage.setPointerCapture(activePid); } catch(err){}
    });
    stage.addEventListener('pointermove', function(e){
      if(!dragging || e.pointerId !== activePid) return;
      dy = e.clientY - startY;
      setDragTransforms(dy);
    });
    function endDrag(e){
      if(!dragging || (e && e.pointerId !== activePid)) return;
      dragging = false; activePid = null; settling = true;
      setTransitions(true);
      if(dy <= -THRESHOLD){
        cur.style.transform = 'translateY(-100%)';
        nxt.style.transform = 'translateY(0)';
        setTimeout(function(){ settling = false; onCommitNext(); }, SETTLE_MS);
      } else if(dy >= THRESHOLD){
        cur.style.transform = 'translateY(100%)';
        prv.style.transform = 'translateY(0)';
        setTimeout(function(){ settling = false; onCommitPrev(); }, SETTLE_MS);
      } else {
        setDragTransforms(0);
        // Barely moved and released quickly -- that's a tap on the card, not an aborted swipe.
        if(onTap && Math.abs(dy) < TAP_SLOP && (Date.now() - downTime) < TAP_MS) onTap();
        setTimeout(function(){ settling = false; }, SETTLE_MS);
      }
    }
    stage.addEventListener('pointerup', endDrag);
    stage.addEventListener('pointercancel', endDrag);
  }

  function wireFeedSwipe(word){
    wireVerticalSwipeFeed('feedStage',
      function(){ S.feedIndex = S.feedIndex + 1; if(S.view === 'feed') render(); },
      function(){ S.feedIndex = S.feedIndex - 1; if(S.view === 'feed') render(); },
      // Tapping the card replays its word on demand -- deliberately calling Speech.speak directly
      // (bypassing the settle-once-per-card guard up in renderFeed) so it repeats every tap, same as
      // the "Hear it again" replay button on a flipped study card.
      function(){ Speech.speak(word); });
  }

  /* ---------- STORY MODE ---------- */
  // A deck-level mode (deck.storyMode === true, toggled in the deck editor -- mutually exclusive with
  // Word Feed's deck.feedMode above), sharing Word Feed's exact swipe UI and .feed-* markup/CSS, just
  // with different content and ordering: instead of the deck's cards shuffled into a word soup, Story
  // Mode reconstructs a single passage from the deck's own cards (their "note"/hint field, which for
  // the built-in reading decks already carries one story sentence per card) and reads it one word at a
  // time, IN ORDER, swiping forward through the story and looping back to the first word at the end --
  // same wraparound as Word Feed. Rebuilt fresh from the deck's current cards every time it's opened
  // (nothing extra is stored), so editing a card's note updates the story the next time it's read.
  // Deliberately fun-only, same as Word Feed: no grading, no SRS fields touched, no stats/history
  // writes.
  function buildStoryWords(cards){
    var ordered = cards.slice().sort(function(a,b){ return (a.createdAt||0) - (b.createdAt||0); });
    var sentences = [];
    ordered.forEach(function(c){
      var note = String(c.note||'').trim();
      // Skip blanks and immediate repeats -- several of the built-in decks have two cards drawn from
      // the same sentence (one for each of two vocab words in it), which would otherwise double up
      // that whole sentence back-to-back in the reconstructed passage.
      if(note && sentences[sentences.length-1] !== note) sentences.push(note);
    });
    return sentences.join(' ').split(/\s+/).filter(Boolean);
  }

  function startStory(deckId){
    S.currentDeckId = deckId;
    S.editMode = false;
    S.store.updateDeck(deckId, { lastOpenedAt: Date.now() }); // same "recently opened" bookkeeping as every other deck entry point
    S.store.getCardsOnce(deckId).then(function(cards){
      var words = buildStoryWords(cards);
      if(!words.length){
        // No note/hint text to build a story from yet -- rather than open onto a blank swipe screen,
        // stay put and explain why, the same way a failed save surfaces (see errorBannerHTML).
        S.storeError = 'This deck doesn\'t have a story to read yet — add a sentence to each card\'s hint/note field in the editor to build one.';
        render();
        return;
      }
      S.storyQueue = words.map(function(w, i){ return { id: 'story-'+i, front: w }; });
      S.storyIndex = 0;
      S.storyLastSpokenId = null;
      S.view = 'story';
      render();
    });
  }

  function renderStory(){
    var deck = S.decks.find(function(d){ return d.id === S.currentDeckId; }) || { name:'Story', emoji:'📜' };
    var queue = S.storyQueue;
    if(!queue.length){ goHome(); return; }
    var n = queue.length;
    var idx = ((S.storyIndex % n) + n) % n;
    var curWord = queue[idx];
    var nextWord = queue[(idx + 1) % n];
    var prevWord = queue[(idx - 1 + n) % n];

    // Same speak-exactly-once-per-settled-word guard as Word Feed's renderFeed().
    if(S.storyLastSpokenId !== curWord.id){
      S.storyLastSpokenId = curWord.id;
      Speech.speak(curWord.front);
    }

    function storyCardHTML(w, pos){
      return '<div class="feed-card feed-card-'+pos+'" data-feed-pos="'+pos+'"><div class="feed-word">'+esc(w.front)+'</div></div>';
    }

    app.innerHTML = '' +
      '<div class="feed-topbar">' +
        '<button type="button" class="icon-btn" data-act="exit-story" aria-label="Close Story Mode" title="Close">✕</button>' +
        '<div class="feed-deck-label">'+deck.emoji+' '+esc(deck.name)+'</div>' +
        '<span class="feed-topbar-spacer" aria-hidden="true"></span>' +
      '</div>' +
      '<div class="feed-stage" id="storyStage">' +
        storyCardHTML(prevWord, 'prev') +
        storyCardHTML(curWord, 'current') +
        storyCardHTML(nextWord, 'next') +
      '</div>' +
      '<div class="feed-hint">↕ Word '+(idx+1)+' of '+n+'</div>';

    app.querySelector('[data-act="exit-story"]').addEventListener('click', function(){
      try { window.speechSynthesis && window.speechSynthesis.cancel(); } catch(e){}
      // Same Child Mode PIN guard as exit-feed above -- see that comment for why.
      if(S.managingDecks){ goHome(); return; }
      S.pinInput=''; S.pinError=''; S.pinShake=false;
      S.pinPromptFor = 'exit';
      render();
    });

    wireVerticalSwipeFeed('storyStage',
      function(){ S.storyIndex = S.storyIndex + 1; if(S.view === 'story') render(); },
      function(){ S.storyIndex = S.storyIndex - 1; if(S.view === 'story') render(); });
  }

  /* ---------- EQUATION FEED ---------- */
  // A deck-level mode (deck.equationMode === true, toggled in the deck editor -- mutually exclusive
  // with Word Feed's feedMode and Story Mode's storyMode above), sharing their exact swipe UI and
  // .feed-* markup/CSS. The content and timing are different though: each card is an addition
  // equation ("3 + 4") with NO answer shown at first. The card settles, the full equation is spoken
  // aloud right away WITH the answer ("3 plus 4 equals 7", read slower than the app's normal speaking
  // rate) and the answer itself bounces onto the screen in place of the "?" a flat delay later.
  // Deliberately fun-only, same as Word Feed/Story Mode: no grading, no SRS fields touched, no
  // stats/history writes.
  var EQUATION_SPEECH_RATE = 0.7;     // slower than the app-wide default (0.88) -- easier to follow
  var EQUATION_REVEAL_DELAY_MS = 3200; // flat delay from settle to the answer bouncing in
  function equationSpeech(front, back){
    var m = String(front||'').match(/^\s*(-?\d+)\s*\+\s*(-?\d+)\s*$/);
    if(m) return m[1]+' plus '+m[2]+' equals '+back;
    return front+' equals '+back; // fallback for any oddly-formatted card
  }

  function startEquationFeed(deckId){
    S.currentDeckId = deckId;
    S.editMode = false;
    S.store.updateDeck(deckId, { lastOpenedAt: Date.now() }); // same "recently opened" bookkeeping as every other deck entry point
    S.store.getCardsOnce(deckId).then(function(cards){
      if(!cards.length) return; // the Dive In button is disabled at 0 cards already; this is just a guard
      S.equationQueue = shuffle(cards);
      S.equationIndex = 0;
      S.equationSettledId = null;
      S.equationRevealed = false;
      S.view = 'equationFeed';
      render();
    });
  }

  function renderEquationFeed(){
    var deck = S.decks.find(function(d){ return d.id === S.currentDeckId; }) || { name:'Equation Feed', emoji:'➕' };
    var queue = S.equationQueue;
    if(!queue.length){ goHome(); return; }
    var n = queue.length;
    var idx = ((S.equationIndex % n) + n) % n;
    var curCard = queue[idx];
    var nextCard = queue[(idx + 1) % n];
    var prevCard = queue[(idx - 1 + n) % n];

    // Settle-once-per-card guard, same spirit as Word Feed/Story Mode's: the equation shows with no
    // answer the instant it settles, the full equation-plus-answer is spoken right away (slower than
    // the app's normal speaking rate -- easier to follow along with while doing the math), and the
    // answer bounces onto the screen on a flat timer -- deliberately NOT synced to when the speech
    // finishes (that used to be the case; a flat delay is more predictable regardless of how long a
    // given equation takes to say out loud), same flat-timer approach as Language Feed's translation
    // reveal below.
    if(S.equationSettledId !== curCard.id){
      S.equationSettledId = curCard.id;
      S.equationRevealed = false;
      var settledId = curCard.id;
      Speech.speak(equationSpeech(curCard.front, curCard.back), { rate: EQUATION_SPEECH_RATE });
      setTimeout(function(){
        // The child may have already swiped away before this timer fired -- only reveal if this is
        // still the card actually on screen.
        if(S.view !== 'equationFeed' || S.equationSettledId !== settledId) return;
        S.equationRevealed = true;
        render();
      }, EQUATION_REVEAL_DELAY_MS);
    }

    function eqCardHTML(c, pos){
      var showAnswer = pos === 'current' && S.equationRevealed;
      return '<div class="feed-card feed-card-'+pos+'" data-feed-pos="'+pos+'">' +
        '<div class="feed-word eq-prompt">' +
          '<span>'+esc(c.front)+' =</span>' +
          (showAnswer
            ? '<span class="eq-answer eq-bounce">'+esc(c.back)+'</span>'
            : '<span class="eq-answer eq-blank">?</span>') +
        '</div></div>';
    }

    app.innerHTML = '' +
      '<div class="feed-topbar">' +
        '<button type="button" class="icon-btn" data-act="exit-equation" aria-label="Close Equation Feed" title="Close">✕</button>' +
        '<div class="feed-deck-label">'+deck.emoji+' '+esc(deck.name)+'</div>' +
        '<span class="feed-topbar-spacer" aria-hidden="true"></span>' +
      '</div>' +
      '<div class="feed-stage" id="equationStage">' +
        eqCardHTML(prevCard, 'prev') +
        eqCardHTML(curCard, 'current') +
        eqCardHTML(nextCard, 'next') +
      '</div>' +
      '<div class="feed-hint">↕ Swipe for another equation</div>';

    app.querySelector('[data-act="exit-equation"]').addEventListener('click', function(){
      try { window.speechSynthesis && window.speechSynthesis.cancel(); } catch(e){}
      // Same Child Mode PIN guard as exit-feed/exit-story above -- see that comment for why.
      if(S.managingDecks){ goHome(); return; }
      S.pinInput=''; S.pinError=''; S.pinShake=false;
      S.pinPromptFor = 'exit';
      render();
    });

    wireVerticalSwipeFeed('equationStage',
      function(){ S.equationIndex = S.equationIndex + 1; if(S.view === 'equationFeed') render(); },
      function(){ S.equationIndex = S.equationIndex - 1; if(S.view === 'equationFeed') render(); },
      // Tapping the settled card replays the equation-plus-answer on demand, same "Hear it again"
      // spirit as Word Feed's tap-to-replay -- only once the answer has actually been revealed once,
      // so an early tap can't spoil the surprise ahead of the timer.
      function(){ if(S.equationRevealed) Speech.speak(equationSpeech(curCard.front, curCard.back), { rate: EQUATION_SPEECH_RATE }); });
  }

  /* ---------- LANGUAGE FEED ---------- */
  // A deck-level mode (deck.langFeedMode === true, toggled in the deck editor -- mutually exclusive
  // with Word Feed/Story Mode/Equation Feed above), sharing their exact swipe UI and .feed-* markup/
  // CSS. Built for vocabulary decks (e.g. Korean Word Feed): instead of dumping the whole deck into
  // the swipe queue at once like Word Feed does, only a few words are "unlocked" at a time
  // (deck.langBatchSize, default 5) -- deck.langUnlockedCount tracks how many of the deck's cards
  // (sorted by their `order` field, oldest-first) are in play. Once every currently-unlocked card has
  // been swiped to at least once THIS SESSION, the next batch unlocks automatically and its cards join
  // the swipe rotation, persisted back to the deck doc so the next visit picks up where this one left
  // off. Each card shows its target-language word (spoken aloud as it settles, same as Word Feed) with
  // the English translation hidden; about a second later the translation fades in under it. Same
  // fun-only rules as Word Feed/Story Mode/Equation Feed: no grading, no SRS fields touched, no
  // stats/history writes.
  function startLangFeed(deckId){
    S.currentDeckId = deckId;
    S.editMode = false;
    S.store.updateDeck(deckId, { lastOpenedAt: Date.now() }); // same "recently opened" bookkeeping as every other deck entry point
    S.store.getCardsOnce(deckId).then(function(cards){
      if(!cards.length) return; // the Dive In button is disabled at 0 cards already; this is just a guard
      var deck = S.decks.find(function(d){ return d.id === deckId; }) || {};
      var sorted = cards.slice().sort(function(a, b){ return (a.order||0) - (b.order||0); });
      var batchSize = deck.langBatchSize || 5;
      var unlockedCount = Math.min(deck.langUnlockedCount || batchSize, sorted.length);
      S.langSorted = sorted;
      S.langBatchSize = batchSize;
      S.langUnlockedCount = unlockedCount;
      S.langTotalCards = sorted.length;
      S.langQueue = shuffle(sorted.slice(0, unlockedCount));
      S.langIndex = 0;
      S.langSettledId = null;
      S.langRevealed = false;
      S.langSeenIds = new Set();
      S.langJustUnlocked = false;
      S.view = 'langFeed';
      render();
    });
  }

  // Called once a card has settled on screen -- marks it seen this session, and unlocks the next
  // batch (if any remain, and every card in the current rotation has now been seen at least once)
  // by appending the newly-unlocked cards to the live queue rather than rebuilding it, so a batch
  // unlocking mid-swipe never disturbs the card already on screen.
  function unlockNextLangBatchIfNeeded(deckId){
    if(S.langUnlockedCount >= S.langTotalCards) return;
    if(S.langSeenIds.size < S.langQueue.length) return;
    var newCount = Math.min(S.langUnlockedCount + S.langBatchSize, S.langTotalCards);
    if(newCount === S.langUnlockedCount) return;
    var newlyAdded = S.langSorted.slice(S.langUnlockedCount, newCount);
    S.langUnlockedCount = newCount;
    S.langQueue = S.langQueue.concat(shuffle(newlyAdded));
    S.langJustUnlocked = true;
    S.store.updateDeck(deckId, { langUnlockedCount: newCount });
  }

  function renderLangFeed(){
    var deck = S.decks.find(function(d){ return d.id === S.currentDeckId; }) || { name:'Language Feed', emoji:'🌐' };
    var queue = S.langQueue;
    if(!queue.length){ goHome(); return; }
    var n = queue.length;
    var idx = ((S.langIndex % n) + n) % n;
    var curCard = queue[idx];
    var nextCard = queue[(idx + 1) % n];
    var prevCard = queue[(idx - 1 + n) % n];

    // Settle-once-per-card guard, same spirit as Equation Feed's: the target word shows (and is
    // spoken) the instant it settles, with the translation hidden; about a second later the
    // translation fades in. Speech.speak auto-detects Hangul vs. Latin script (detectLang), so no
    // extra plumbing is needed for Korean vs. English target words here.
    if(S.langSettledId !== curCard.id){
      S.langSettledId = curCard.id;
      S.langRevealed = false;
      S.langSeenIds.add(curCard.id);
      S.langJustUnlocked = false;
      unlockNextLangBatchIfNeeded(S.currentDeckId);
      var settledId = curCard.id;
      Speech.speak(curCard.front);
      setTimeout(function(){
        // The child may have already swiped away before this timer fired -- only reveal if this is
        // still the card actually on screen.
        if(S.view !== 'langFeed' || S.langSettledId !== settledId) return;
        S.langRevealed = true;
        render();
      }, 1000);
    }

    function langCardHTML(c, pos){
      if(pos !== 'current'){
        return '<div class="feed-card feed-card-'+pos+'" data-feed-pos="'+pos+'">' +
          '<div class="lang-word-wrap"><div class="feed-word">'+esc(c.front)+'</div></div>' +
        '</div>';
      }
      var showTranslation = S.langRevealed;
      return '<div class="feed-card feed-card-'+pos+'" data-feed-pos="'+pos+'">' +
        '<div class="lang-word-wrap">' +
          '<div class="feed-word">'+esc(c.front)+'</div>' +
          '<div class="lang-translation'+(showTranslation?' lang-fade-in':'')+'"'+(showTranslation?'':' style="visibility:hidden"')+'>'+esc(c.back)+'</div>' +
        '</div>' +
      '</div>';
    }

    app.innerHTML = '' +
      '<div class="feed-topbar">' +
        '<button type="button" class="icon-btn" data-act="exit-lang" aria-label="Close Language Feed" title="Close">✕</button>' +
        '<div class="feed-deck-label">'+deck.emoji+' '+esc(deck.name)+'</div>' +
        '<span class="feed-topbar-spacer" aria-hidden="true"></span>' +
      '</div>' +
      '<div class="feed-stage" id="langStage">' +
        langCardHTML(prevCard, 'prev') +
        langCardHTML(curCard, 'current') +
        langCardHTML(nextCard, 'next') +
        (S.langJustUnlocked ? '<div class="lang-unlock-toast">🎉 New words unlocked!</div>' : '') +
      '</div>' +
      '<div class="feed-hint">↕ Swipe for another word'+(S.langUnlockedCount < S.langTotalCards ? ' · '+S.langUnlockedCount+' of '+S.langTotalCards+' words so far' : '')+'</div>';

    app.querySelector('[data-act="exit-lang"]').addEventListener('click', function(){
      try { window.speechSynthesis && window.speechSynthesis.cancel(); } catch(e){}
      // Same Child Mode PIN guard as exit-feed/exit-story/exit-equation above -- see that comment for why.
      if(S.managingDecks){ goHome(); return; }
      S.pinInput=''; S.pinError=''; S.pinShake=false;
      S.pinPromptFor = 'exit';
      render();
    });

    wireVerticalSwipeFeed('langStage',
      function(){ S.langIndex = S.langIndex + 1; if(S.view === 'langFeed') render(); },
      function(){ S.langIndex = S.langIndex - 1; if(S.view === 'langFeed') render(); },
      // Tapping the settled card replays the target word on demand, same "Hear it again" spirit as
      // Word Feed/Equation Feed's tap-to-replay.
      function(){ Speech.speak(curCard.front); });
  }

  var OUTCOME_ROW_HTML = '' +
    '<div class="grade-row outcome-row" style="position:relative;z-index:1;">' +
      '<button class="grade-btn grade-wrong" data-outcome="wrong"><span class="emoji">🦀</span>Not quite</button>' +
      '<button class="grade-btn grade-right" data-outcome="right"><span class="emoji">🐬</span>Got it right!</button>' +
    '</div>';

  // On Hard difficulty, the simple right/wrong self-report is replaced with real Anki-style
  // self-grading — four options describing how hard the card actually was, same spirit as Anki's
  // own Again/Hard/Good/Easy buttons. The child's own tap IS the rating here, so it also bypasses
  // autoRating()'s response-time guesswork for these two modes (flip and read) while Hard is on.
  var ANKI_ROW_HTML = '' +
    '<div class="grade-row" style="position:relative;z-index:1;">' +
      '<button class="grade-btn grade-again" data-rating="again"><span class="emoji">🦀</span>Again</button>' +
      '<button class="grade-btn grade-hard" data-rating="hard"><span class="emoji">🐢</span>Hard</button>' +
      '<button class="grade-btn grade-good" data-rating="good"><span class="emoji">🐬</span>Good</button>' +
      '<button class="grade-btn grade-easy" data-rating="easy"><span class="emoji">🐳</span>Easy</button>' +
    '</div>';

  function outcomeRowHTML(){
    return currentDifficulty().id === 'hard' ? ANKI_ROW_HTML : OUTCOME_ROW_HTML;
  }

  // The read-only "swipe back" view of the one card the kid most recently answered. No inputs are
  // interactive here — it's a look, not a redo — so there's no route to change a grade already
  // recorded. Mirrors the live layout for each mode, just frozen in its answered state.
  function buildPeekInner(rec){
    var badge = rec.correct
      ? '<div class="peek-badge peek-right">✅ That one was right!</div>'
      : '<div class="peek-badge peek-wrong">🦀 That one was marked not quite</div>';
    var body;
    var photoHTML = rec.photoUrl ? '<img class="card-photo" src="'+esc(rec.photoUrl)+'" alt="">' : '';
    if(rec.mode === 'choice' || rec.mode === 'match' || rec.mode === 'blank' || rec.mode === 'timedchoice'){
      var optsHTML = (rec.choiceOptions||[]).map(function(opt){
        var cls = 'choice-btn';
        if(opt === rec.back) cls += ' correct';
        else if(opt === rec.chosenText) cls += ' wrong';
        return '<button type="button" class="'+cls+'" disabled>'+esc(opt)+'</button>';
      }).join('');
      var peekLabel = rec.mode === 'blank' ? '✏️ Last question' : (rec.mode === 'match' ? '🧲 Last question' : (rec.mode === 'timedchoice' ? '⏱️ Last question' : '🔢 Last question'));
      body = '' +
        '<div class="flip-scene" style="position:relative;z-index:1;">' +
          '<div class="face face-front read-face"><div class="read-label">'+peekLabel+'</div>'+photoHTML+'<div class="card-text">'+esc(rec.front)+'</div></div>' +
        '</div>' +
        '<div class="choice-row">'+optsHTML+'</div>';
    } else if(rec.mode === 'read'){
      body = '' +
        '<div class="flip-scene" style="position:relative;z-index:1;">' +
          '<div class="face face-front read-face">' +
            '<div class="read-label">📖 Last question</div>' +
            photoHTML +
            '<div class="card-text">'+esc(rec.front)+'</div>' +
            (rec.note?'<div class="card-note dim">'+esc(rec.note)+'</div>':'') +
          '</div>' +
        '</div>';
    } else {
      body = '' +
        '<div class="flip-scene" style="position:relative;z-index:1;">' +
          '<div class="flip-card flipped">' +
            '<div class="face face-front">'+photoHTML+'<div class="card-text">'+esc(rec.front)+'</div></div>' +
            '<div class="face face-back"><div class="card-text">'+esc(rec.back)+'</div>'+(rec.note?'<div class="card-note">'+esc(rec.note)+'</div>':'')+'</div>' +
          '</div>' +
        '</div>';
    }
    return '' +
      '<div class="peek-wrap">' +
        body +
        badge +
        '<div class="flip-hint" style="position:relative;z-index:1;">⬆️ Swipe up (or tap) to continue</div>' +
      '</div>';
  }

  // Drag-to-swipe, TikTok style: live-follows the finger, snaps back if it doesn't clear the
  // threshold. Direction is asymmetric on purpose — forward is never draggable (answering is the
  // only way past the current card), backward only reaches the one card just answered.
  function wireSwipe(stageEl){
    if(!stageEl) return;
    var dragging = false, startY = 0, dy = 0, activePointerId = null;
    var DRAG_MAX = 120, COMMIT = 62;
    function canPeekBack(){ return !S.peeking && !!S.lastAnsweredCard && !S.transitioning; }
    function canReturnForward(){ return S.peeking && !S.transitioning; }
    function pointY(e){ return e.touches && e.touches.length ? e.touches[0].clientY : e.clientY; }
    // Track the drag on `document` rather than relying on setPointerCapture: this keeps
    // following the finger/mouse even if it drifts outside the card bounds mid-swipe, and
    // guarantees onUp always fires (no stuck drag state) regardless of where the release lands.
    function onDown(e){
      if(S.transitioning || (!canPeekBack() && !canReturnForward())) return;
      dragging = true; dy = 0; startY = pointY(e);
      activePointerId = e.pointerId != null ? e.pointerId : null;
      stageEl.style.animation = 'none'; // don't fight the entrance animation with a live drag transform
      stageEl.classList.add('stage-dragging');
      document.addEventListener('pointermove', onMove);
      document.addEventListener('pointerup', onUp);
      document.addEventListener('pointercancel', onUp);
    }
    function onMoveRaw(y){
      dy = y - startY;
      var t;
      if(dy >= 0){ t = canPeekBack() ? Math.min(dy, DRAG_MAX) : Math.min(dy, DRAG_MAX) * 0.22; }
      else { t = canReturnForward() ? Math.max(dy, -DRAG_MAX) : Math.max(dy, -DRAG_MAX) * 0.22; }
      stageEl.style.transform = 'translateY('+t+'px)';
    }
    function onMove(e){
      if(!dragging) return;
      if(activePointerId != null && e.pointerId != null && e.pointerId !== activePointerId) return;
      onMoveRaw(pointY(e));
      if(e.cancelable) e.preventDefault();
    }
    function onUp(e){
      if(!dragging) return;
      if(activePointerId != null && e && e.pointerId != null && e.pointerId !== activePointerId) return;
      dragging = false;
      activePointerId = null;
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', onUp);
      document.removeEventListener('pointercancel', onUp);
      stageEl.classList.remove('stage-dragging');
      var goBack = dy > COMMIT && canPeekBack();
      var goForward = dy < -COMMIT && canReturnForward();
      // A real drag (even one that snaps back short of the threshold) shouldn't also be read as
      // a tap by the peek view's tap-to-return handler, which fires right after via 'click'.
      stageEl.__justDragged = Math.abs(dy) > 6;
      stageEl.style.transform = '';
      if(goBack) peekBack();
      else if(goForward) returnFromPeek();
      else {
        stageEl.classList.add('stage-snapback');
        setTimeout(function(){ stageEl.classList.remove('stage-snapback'); }, 220);
      }
      dy = 0;
    }
    stageEl.addEventListener('pointerdown', onDown);
    // Guard against the browser starting a native text/element drag mid-swipe, which can steal
    // the gesture and stop delivering further pointer events to us.
    stageEl.addEventListener('dragstart', function(e){ e.preventDefault(); });
    // Trackpad/mouse-wheel as a desktop-friendly equivalent to a swipe.
    stageEl.addEventListener('wheel', function(e){
      if(S.transitioning) return;
      if(e.deltaY < -14 && canReturnForward()){ e.preventDefault(); returnFromPeek(); }
      else if(e.deltaY > 14 && canPeekBack()){ e.preventDefault(); peekBack(); }
    }, { passive:false });
  }

  function peekBack(){
    if(S.transitioning || S.peeking || !S.lastAnsweredCard) return;
    S.transitioning = true;
    var stageEl = app.querySelector('.stage');
    if(stageEl) stageEl.classList.add('stage-exit-down');
    setTimeout(function(){
      S.transitioning = false;
      S.peeking = true;
      render();
    }, 200);
  }

  function returnFromPeek(){
    if(S.transitioning || !S.peeking) return;
    S.transitioning = true;
    var stageEl = app.querySelector('.stage');
    if(stageEl) stageEl.classList.add('stage-exit');
    setTimeout(function(){
      S.transitioning = false;
      S.peeking = false;
      render();
    }, 200);
  }

  function pointInRect(rect, x, y){
    return x >= rect.left && x <= rect.right && y >= rect.top && y <= rect.bottom;
  }

  // Drag-to-answer interaction shared by 'match' and 'blank' card modes. Built on Pointer Events
  // (not native HTML5 drag/drop, which touch browsers support inconsistently) so the same code
  // handles mouse and touch alike: a tile follows the pointer via a CSS transform while held, and
  // on release either snaps into the drop zone (grading the card) or springs back to the tile row.
  // A plain tap (no real movement) drops the tile directly too, both for accessibility and so the
  // whole interaction stays usable with a simple click in automated tests.
  function wireDragTiles(card, cardMode){
    var ds = S.dragState;
    if(!ds) return;
    var dropZone = app.querySelector('[data-drop-zone]');
    if(!dropZone) return;

    function commitDrop(idx){
      if(ds.dropped != null || S.transitioning) return;
      ds.dropped = idx;
      var chosen = ds.options[idx];
      var correct = chosen === card.back;
      ds.correct = correct;
      var elapsed = Date.now() - (S.cardShownAt || Date.now());
      if(correct) Sound.correct(); else Sound.wrong();
      // Child Mode: read the tile that was just dropped aloud, right or wrong -- same rule as choice mode.
      if(!S.managingDecks) Speech.speak(chosen);
      render();
      setTimeout(function(){ grade(autoRating(cardMode, correct, elapsed), true); }, 1100);
    }

    app.querySelectorAll('[data-drag-idx]').forEach(function(tile){
      var idx = parseInt(tile.dataset.dragIdx, 10);
      var startX = 0, startY = 0, dragging = false, activePid = null;

      tile.addEventListener('click', function(){
        if(tile.__justDragged){ tile.__justDragged = false; return; }
        commitDrop(idx);
      });

      tile.addEventListener('pointerdown', function(e){
        if(ds.dropped != null) return;
        activePid = e.pointerId;
        startX = e.clientX; startY = e.clientY;
        dragging = false;
      });
      tile.addEventListener('pointermove', function(e){
        if(activePid == null || e.pointerId !== activePid || ds.dropped != null) return;
        var dx = e.clientX - startX, dy = e.clientY - startY;
        if(!dragging && Math.sqrt(dx*dx + dy*dy) > 6){
          dragging = true;
          tile.__justDragged = true;
          tile.classList.add('dragging');
          try { tile.setPointerCapture(activePid); } catch(err){}
        }
        if(dragging){
          tile.style.transform = 'translate('+dx+'px,'+dy+'px)';
          dropZone.classList.toggle('drag-over', pointInRect(dropZone.getBoundingClientRect(), e.clientX, e.clientY));
        }
      });
      function endDrag(e){
        if(activePid == null || (e && e.pointerId !== activePid)) return;
        var wasDragging = dragging;
        activePid = null; dragging = false;
        tile.classList.remove('dragging');
        dropZone.classList.remove('drag-over');
        if(wasDragging){
          var overZone = e && pointInRect(dropZone.getBoundingClientRect(), e.clientX, e.clientY);
          tile.style.transform = '';
          if(overZone) commitDrop(idx);
          // Missed the zone -- the transform reset above springs the tile back to its place in the
          // (still-flowing) tile row; nothing else to do until the next attempt.
        }
      }
      tile.addEventListener('pointerup', endDrag);
      tile.addEventListener('pointercancel', endDrag);
    });
  }

  /* ---------- timed multiple choice ("Timed choice" mode) ----------
     A sixth per-card mode, alongside flip/read/choice/match/blank: same multiple-choice interaction
     as 'choice' mode, but a visible countdown bar forces an answer before time runs out (at which
     point the correct option highlights itself and the card is graded as a miss), plus a "+time"
     button that adds a few more seconds without penalty. Built with Korean vocab practice in mind
     (see the "Korean Speed Quiz" decks), but it's a generic mode any deck can use.

     Direction alternates in groups rather than being fixed or fully random per card: every
     TIMED_CHOICE_GROUP_SIZE cards, a coin flip decides whether the next stretch of cards asks
     "front as the question, back-side text as the answer" (fwd -- e.g. "How do you say ___ in
     Korean?" with Korean options) or the reverse (rev -- e.g. shows the Korean word, English
     options). A card's own `choices` field (if the deck author filled one in) is only used for the
     forward direction, since it was written as alternatives to `back`; the reverse direction, and
     any card with no manual choices at all, draws its wrong answers from OTHER cards in the same
     deck instead -- which is also what lets a plain flip-mode deck (like Wendy's Korean Vocabulary,
     with no choices authored at all) be quizzed as multiple choice with zero extra data entry. */
  var TIMED_CHOICE_GROUP_SIZE = 3;   // how many cards in a row share the same question direction before re-rolling
  var TIMED_CHOICE_BASE_SECONDS = 6; // starting point before the length/difficulty adjustments below
  var TIMED_CHOICE_MIN_SECONDS = 5;
  var TIMED_CHOICE_MAX_SECONDS = 15;
  var TIMED_CHOICE_ADD_SECONDS = 5;  // how much the "+time" button adds, per tap
  var TIMED_CHOICE_MAX_ADDS = 2;      // the "+time" button can only be used twice per card

  // Longer text to read (either side) earns more time to scan the options, and a card the learner
  // has actually struggled with (per the SM-2 stats every card already tracks -- lapses, leech
  // status, learning state, and the plain timesCorrect/timesSeen accuracy ratio) earns more too.
  // A short, well-known word gets the tightest timer; a long phrase the learner keeps missing gets
  // the most breathing room. Always clamped to a sane range so it never feels impossibly short or
  // pointlessly long.
  function timedChoiceSeconds(card, promptText, answerText){
    var textLen = Math.max(String(promptText||'').length, String(answerText||'').length);
    var readingBonus = Math.max(0, (textLen - 6) * 0.22);
    var struggleBonus = 0;
    if(card.isLeech) struggleBonus = 4;
    else if((card.lapses||0) >= 2 || card.state === 'learning') struggleBonus = 2;
    else if(card.timesSeen){
      var acc = (card.timesCorrect||0) / card.timesSeen;
      if(acc < 0.5) struggleBonus = 3;
      else if(acc < 0.8) struggleBonus = 1;
    }
    var seconds = TIMED_CHOICE_BASE_SECONDS + readingBonus + struggleBonus;
    return Math.max(TIMED_CHOICE_MIN_SECONDS, Math.min(TIMED_CHOICE_MAX_SECONDS, Math.round(seconds)));
  }

  // Builds a fresh { direction, prompt, answer, options } for a card just entering 'timedchoice'
  // mode -- re-rolling the shared direction every TIMED_CHOICE_GROUP_SIZE cards, then sourcing wrong
  // answers from the card's own `choices` (forward direction only) or, failing that, from sibling
  // cards' opposite field in S.timedChoiceAllCards.
  function buildTimedChoiceRound(card){
    if(S.timedChoiceGroupLeft <= 0){
      S.timedChoiceDirection = Math.random() < 0.5 ? 'fwd' : 'rev';
      S.timedChoiceGroupLeft = TIMED_CHOICE_GROUP_SIZE;
    }
    S.timedChoiceGroupLeft -= 1;
    var direction = S.timedChoiceDirection;
    var promptText = direction === 'fwd' ? card.front : card.back;
    var answerText = direction === 'fwd' ? card.back : card.front;
    var siblingField = direction === 'fwd' ? 'back' : 'front';
    var wrongOpts = (direction === 'fwd' && card.choices && card.choices.length) ? card.choices.slice() : null;
    if(!wrongOpts || !wrongOpts.length){
      var siblings = (S.timedChoiceAllCards || []).filter(function(c){ return c.id !== card.id; });
      wrongOpts = shuffle(siblings).map(function(c){ return c[siblingField]; })
        .filter(function(v, idx, arr){ return v && v !== answerText && arr.indexOf(v) === idx; })
        .slice(0, 3);
    }
    var seconds = timedChoiceSeconds(card, promptText, answerText);
    return {
      cardId: card.id,
      direction: direction,
      prompt: promptText,
      answer: answerText,
      options: shuffle([answerText].concat(wrongOpts)),
      selected: null,
      totalSeconds: seconds,
      deadline: Date.now() + seconds*1000,
      secondsAdded: 0,
      timesAdded: 0,
      expired: false
    };
  }

  function timedChoiceTimerHTML(tc){
    var remaining = Math.max(0, tc.deadline - Date.now());
    var totalMs = (tc.totalSeconds + tc.secondsAdded) * 1000;
    var pct = totalMs > 0 ? Math.max(0, Math.min(100, (remaining/totalMs)*100)) : 0;
    var addsLeft = TIMED_CHOICE_MAX_ADDS - (tc.timesAdded||0);
    var addBtnHTML = addsLeft > 0 ?
      '<button type="button" class="btn btn-ghost tc-addtime-btn" data-act="tc-add-time">⏱️ +'+TIMED_CHOICE_ADD_SECONDS+'s</button>' :
      '<button type="button" class="btn btn-ghost tc-addtime-btn" disabled>⏱️ No more time</button>';
    return '' +
      '<div class="tc-timer-row" style="position:relative;z-index:1;">' +
        '<div class="tc-timer-track"><div class="tc-timer-fill'+(pct < 30 ? ' tc-low' : '')+'" id="tcTimerFill" style="width:'+pct+'%"></div></div>' +
        addBtnHTML +
      '</div>';
  }

  function clearTimedChoiceTimer(){
    if(S.timedChoiceTimerHandle){ clearInterval(S.timedChoiceTimerHandle); S.timedChoiceTimerHandle = null; }
  }

  // Drives the countdown bar via direct DOM updates (not render()) every 100ms so it animates
  // smoothly without re-rendering the whole screen every tick. Self-cancels the moment anything
  // about the situation has changed underneath it (a different card, an answer already picked, the
  // view navigated away) rather than relying on every possible exit path to clear it explicitly.
  function wireTimedChoiceTimer(card){
    clearTimedChoiceTimer();
    S.timedChoiceTimerHandle = setInterval(function(){
      var tc = S.timedChoiceState;
      if(S.view !== 'study' || !tc || tc.cardId !== card.id || tc.selected != null || tc.expired){
        clearTimedChoiceTimer();
        return;
      }
      var remaining = tc.deadline - Date.now();
      var totalMs = (tc.totalSeconds + tc.secondsAdded) * 1000;
      var fillEl = document.getElementById('tcTimerFill');
      if(fillEl){
        var pct = totalMs > 0 ? Math.max(0, Math.min(100, (remaining/totalMs)*100)) : 0;
        fillEl.style.width = pct + '%';
        fillEl.classList.toggle('tc-low', pct < 30);
      }
      if(remaining <= 0){
        clearTimedChoiceTimer();
        tc.expired = true;
        Sound.wrong();
        render();
        var elapsed = (tc.totalSeconds + tc.secondsAdded) * 1000;
        setTimeout(function(){ grade(autoRating('timedchoice', false, elapsed), true); }, 1400);
      }
    }, 100);
  }

  function renderStudy(){
    var deck = S.decks.find(function(d){ return d.id === S.currentDeckId; }) || {name:'Deck', emoji:'🌊'};
    if(!S.studyQueue.length){
      finishStudy();
      return;
    }
    var card = S.studyQueue[0];
    if(S.currentCardId !== card.id){
      // A new card is on stage — reset per-card UI state and start the response-time clock.
      S.currentCardId = card.id;
      S.cardShownAt = Date.now();
      S.cardFlippedAt = null;
      S.cardFlipped = false;
      S.choiceState = null;
      S.dragState = null;
      S.timedChoiceState = null;
      clearTimedChoiceTimer();
    }
    var mode = (card.mode === 'read' || card.mode === 'choice' || card.mode === 'match' || card.mode === 'blank' || card.mode === 'timedchoice') ? card.mode : 'flip';
    var peeking = S.peeking && !!S.lastAnsweredCard;
    var doneCount = S.sessionReviewed;
    var labelCount = peeking ? doneCount : (doneCount + 1);
    var progressBase = peeking ? Math.max(0, doneCount - 1) : doneCount;
    var progressPct = S.studyTotal > 0 ? Math.min(100, Math.max(0, Math.round((progressBase / S.studyTotal) * 100))) : 0;
    // The critter bar/fill are recreated from scratch on every render() (this whole screen is one
    // big innerHTML replace), so a plain CSS width/left transition never has a "before" state to
    // animate from — it just snaps. To make it travel smoothly instead, paint the bar at wherever
    // it last visually landed, then nudge it to the real value a frame later so the CSS transition
    // (already defined on .critter-track-fill / .critter-swim) has something to interpolate between.
    var startPct = S.critterPrevPct || 0;
    var critterHTML = '' +
      '<div class="critter-label">'+(peeking ? 'Reviewing question ' : 'Question ')+labelCount+' of '+S.studyTotal+'</div>' +
      '<div class="critter-track">' +
        '<div class="critter-track-fill" style="width:'+startPct+'%"></div>' +
        '<div class="critter-swim'+(S.lastOutcomeWrong?' oops':'')+'" style="left:'+startPct+'%">'+critterSVG(S.lastOutcomeWrong)+'</div>' +
      '</div>';

    var stageInner;
    if(peeking){
      stageInner = buildPeekInner(S.lastAnsweredCard);
    } else if(mode === 'read'){
      stageInner = '' +
        '<div class="flip-scene" style="position:relative;z-index:1;">' +
          '<div class="face face-front read-face">' +
            '<div class="read-label">📖 Read it out loud</div>' +
            (card.photoUrl?'<img class="card-photo" src="'+esc(card.photoUrl)+'" alt="">':'') +
            '<div class="card-text">'+esc(card.front)+'</div>' +
            (card.note?'<div class="card-note dim">'+esc(card.note)+'</div>':'') +
          '</div>' +
        '</div>' +
        '<div class="flip-hint" style="position:relative;z-index:1;">'+(currentDifficulty().id === 'hard' ? 'How well did they know it?' : 'Did they read it right?')+'</div>' +
        outcomeRowHTML();
    } else if(mode === 'choice'){
      if(!S.choiceState || S.choiceState.cardId !== card.id){
        S.choiceState = { cardId: card.id, options: shuffle([card.back].concat(card.choices||[])), selected: null };
      }
      var cs = S.choiceState;
      var pickedCorrect = cs.selected != null && cs.options[cs.selected] === card.back;
      var optsHTML = cs.options.map(function(opt, idx){
        var cls = 'choice-btn';
        if(cs.selected != null){
          if(opt === card.back) cls += ' correct';
          else if(idx === cs.selected) cls += ' wrong';
        }
        return '<button type="button" class="'+cls+'" data-choice-idx="'+idx+'" '+(cs.selected!=null?'disabled':'')+'>'+esc(opt)+'</button>';
      }).join('');
      var choiceFeedback = cs.selected == null
        ? '<div class="flip-hint" style="position:relative;z-index:1;">Tap an answer</div>'
        : '<div class="choice-feedback '+(pickedCorrect?'ok':'no')+'">'+(pickedCorrect ? 'Nice job! 🎉' : 'Good try — that one\'s tricky!')+'</div>';
      stageInner = '' +
        '<div class="flip-scene" style="position:relative;z-index:1;">' +
          '<div class="face face-front read-face">' +
            '<div class="read-label">🔢 Pick the answer</div>' +
            (card.photoUrl?'<img class="card-photo" src="'+esc(card.photoUrl)+'" alt="">':'') +
            '<div class="card-text">'+esc(card.front)+'</div>' +
          '</div>' +
        '</div>' +
        '<div class="choice-row">'+optsHTML+'</div>' +
        choiceFeedback;
    } else if(mode === 'timedchoice'){
      if(!S.timedChoiceState || S.timedChoiceState.cardId !== card.id){
        S.timedChoiceState = buildTimedChoiceRound(card);
      }
      var tc = S.timedChoiceState;
      var tcDone = tc.selected != null || tc.expired;
      var tcPickedCorrect = tc.selected != null && tc.options[tc.selected] === tc.answer;
      var tcOptsHTML = tc.options.map(function(opt, idx){
        var cls = 'choice-btn';
        if(tcDone){
          if(opt === tc.answer) cls += ' correct';
          else if(idx === tc.selected) cls += ' wrong';
        }
        return '<button type="button" class="'+cls+'" data-tc-idx="'+idx+'" '+(tcDone?'disabled':'')+'>'+esc(opt)+'</button>';
      }).join('');
      var tcFeedback = !tcDone
        ? '<div class="flip-hint" style="position:relative;z-index:1;">Tap an answer before time runs out!</div>'
        : '<div class="choice-feedback '+(tc.expired ? 'no' : (tcPickedCorrect?'ok':'no'))+'">'+(tc.expired ? 'Time\'s up! ⏰' : (tcPickedCorrect ? 'Nice job! 🎉' : 'Good try — that one\'s tricky!'))+'</div>';
      stageInner = '' +
        '<div class="flip-scene" style="position:relative;z-index:1;">' +
          '<div class="face face-front read-face">' +
            '<div class="read-label">⏱️ Beat the clock</div>' +
            (card.photoUrl?'<img class="card-photo" src="'+esc(card.photoUrl)+'" alt="">':'') +
            '<div class="card-text">'+esc(tc.prompt)+'</div>' +
          '</div>' +
        '</div>' +
        (!tcDone ? timedChoiceTimerHTML(tc) : '') +
        '<div class="choice-row">'+tcOptsHTML+'</div>' +
        tcFeedback;
    } else if(mode === 'match' || mode === 'blank'){
      // 'match' and 'blank' share one drag-a-tile-onto-a-target interaction -- the only real
      // difference is how the target is dressed (a standalone drop zone vs. an inline blank in a
      // sentence). Reuses card.back as the correct answer and card.choices as the distractor tiles,
      // exactly like 'choice' mode, just answered by dragging (or tapping) instead of tapping a row.
      if(!S.dragState || S.dragState.cardId !== card.id){
        S.dragState = { cardId: card.id, options: shuffle([card.back].concat(card.choices||[])), dropped: null, correct: null };
      }
      var ds = S.dragState;
      var tilesHTML = ds.options.map(function(opt, idx){
        if(ds.dropped === idx) return ''; // this tile is now sitting in the drop zone -- shown there instead
        return '<button type="button" class="drag-tile" data-drag-idx="'+idx+'">'+esc(opt)+'</button>';
      }).join('');
      var droppedText = ds.dropped != null ? esc(ds.options[ds.dropped]) : '';
      var dropStateCls = ds.dropped != null ? (ds.correct ? ' correct dropped' : ' wrong dropped') : '';
      var dragFeedback = ds.dropped == null
        ? '<div class="flip-hint" style="position:relative;z-index:1;">Drag or tap a tile onto the blank</div>'
        : '<div class="choice-feedback '+(ds.correct?'ok':'no')+'">'+(ds.correct ? 'Nice job! 🎉' : 'Good try — that one\'s tricky!')+'</div>';
      var promptHTML;
      if(mode === 'blank'){
        var parts = String(card.front||'').split('___');
        var dropInner = '<span class="drop-zone blank-slot'+dropStateCls+'" data-drop-zone>'+(droppedText || '＿＿＿')+'</span>';
        promptHTML = parts.length > 1
          ? '<div class="card-text blank-sentence">'+esc(parts[0])+dropInner+esc(parts.slice(1).join('___'))+'</div>'
          : '<div class="card-text blank-sentence">'+esc(card.front)+' '+dropInner+'</div>';
      } else {
        promptHTML = '<div class="card-text">'+esc(card.front)+'</div>' +
          '<div class="drop-zone'+dropStateCls+'" data-drop-zone>'+(droppedText || 'Drag the match here')+'</div>';
      }
      stageInner = '' +
        '<div class="flip-scene" style="position:relative;z-index:1;">' +
          '<div class="face face-front read-face">' +
            '<div class="read-label">'+(mode==='blank'?'✏️ Fill in the blank':'🧲 Drag the match')+'</div>' +
            (card.photoUrl?'<img class="card-photo" src="'+esc(card.photoUrl)+'" alt="">':'') +
            promptHTML +
          '</div>' +
        '</div>' +
        '<div class="drag-tile-row" data-tile-row>'+tilesHTML+'</div>' +
        dragFeedback;
    } else {
      stageInner = '' +
        '<div class="flip-scene" style="position:relative;z-index:1;">' +
          '<div class="flip-card '+(S.cardFlipped?'flipped':'')+'" id="flipCard">' +
            '<div class="face face-front">'+(card.photoUrl?'<img class="card-photo" src="'+esc(card.photoUrl)+'" alt="">':'')+'<div class="card-text">'+esc(card.front)+'</div></div>' +
            '<div class="face face-back"><div class="card-text">'+esc(card.back)+'</div>'+(card.note?'<div class="card-note">'+esc(card.note)+'</div>':'')+(Speech.isSupported()?'<button type="button" class="replay-audio-btn" data-act="replay-audio">🔁 Hear it again</button>':'')+'</div>' +
          '</div>' +
        '</div>' +
        '<div class="flip-hint" style="position:relative;z-index:1;">'+(S.cardFlipped ? (currentDifficulty().id === 'hard' ? 'How well did you know it?' : 'Be honest — did you get it right?') : 'Tap the card to flip it')+'</div>' +
        (S.cardFlipped ? outcomeRowHTML() : '');
    }

    app.innerHTML = '' +
      '<div class="nav-row">' +
        '<button class="back-btn" data-act="exit-study">⟵ Lagoon</button>' +
        '<span class="nav-title">'+deck.emoji+' '+esc(deck.name)+'</span>' +
        ctrlRowHTML() +
      '</div>' +
      critterHTML +
      '<div class="stage'+(peeking?' stage-peek':'')+'">' +
        bubblesHTML(8) +
        stageInner +
      '</div>';

    // Now that the bar exists in the DOM at startPct, bump it to the real value on the next frame
    // so the CSS transition actually plays instead of the value just appearing already-set. Double
    // rAF (rather than one) makes sure the browser has painted the starting position first — a
    // single rAF can land in the same paint as the innerHTML write and skip straight to the target.
    (function(){
      var fillEl = app.querySelector('.critter-track-fill');
      var swimEl = app.querySelector('.critter-swim');
      requestAnimationFrame(function(){
        requestAnimationFrame(function(){
          if(fillEl) fillEl.style.width = progressPct + '%';
          if(swimEl) swimEl.style.left = progressPct + '%';
        });
      });
    })();
    S.critterPrevPct = progressPct;

    app.querySelector('[data-act="exit-study"]').addEventListener('click', function(){
      // In Adult Mode a grown-up is already in (no PIN was needed to get here), so backing out of a
      // deck early just returns to Manage Decks. The PIN guard below is a Child Mode-only protection
      // against a kid quitting a round early without a grown-up's say-so.
      if(S.managingDecks){ goHome(); return; }
      // Leaving a deck before finishing the round needs a grown-up's PIN — finishing normally
      // (via the summary screen's own buttons) does not, so this only guards the early exit.
      S.pinInput=''; S.pinError=''; S.pinShake=false;
      S.pinPromptFor = 'exit';
      render();
    });
    wireCtrlRow();
    var stageEl = app.querySelector('.stage');
    wireSwipe(stageEl);
    // A short drag that snaps back (didn't clear the swipe threshold) can still end with
    // mousedown/up landing on the same tappable element — consumed once so it isn't also read
    // as a tap that flips the card or picks an answer.
    function dragJustHappened(){
      if(stageEl.__justDragged){ stageEl.__justDragged = false; return true; }
      return false;
    }
    if(peeking){
      // Reviewing the last card is not interactive — tapping it (same as swiping up) just returns
      // to the live, unanswered card. Ignore the synthetic click that follows a real drag release
      // (mousedown/up on the same element still fires 'click' even after a big pointer move).
      stageEl.addEventListener('click', function(){
        if(dragJustHappened()) return;
        returnFromPeek();
      });
      return;
    }
    var flip = document.getElementById('flipCard');
    if(flip){
      flip.addEventListener('click', function(){
        if(dragJustHappened()) return;
        if(S.transitioning) return;
        // Toggles both ways now — flipping back to the front (to re-read the question, or just to
        // flip it again for fun) is allowed any number of times before grading. Only the very FIRST
        // reveal starts the response-time clock that feeds auto-grading below; flipping back and
        // forth after that doesn't reset it, so mulling it over doesn't get scored as "took forever."
        S.cardFlipped = !S.cardFlipped;
        Sound.flip();
        render();
        if(S.cardFlipped){
          if(!S.cardFlippedAt) S.cardFlippedAt = Date.now();
          Speech.speak(card.back); // read the revealed answer aloud automatically
        }
      });
    }
    var replayBtn = app.querySelector('[data-act="replay-audio"]');
    if(replayBtn) replayBtn.addEventListener('click', function(e){ e.stopPropagation(); Speech.speak(card.back); });
    app.querySelectorAll('[data-choice-idx]').forEach(function(b){
      b.addEventListener('click', function(){
        if(dragJustHappened()) return;
        if(S.choiceState.selected != null || S.transitioning) return;
        S.choiceState.selected = parseInt(b.dataset.choiceIdx, 10);
        var chosen = S.choiceState.options[S.choiceState.selected];
        var correct = chosen === card.back;
        var elapsed = Date.now() - (S.cardShownAt || Date.now());
        if(correct) Sound.correct(); else Sound.wrong();
        // Child Mode: read whichever option was just tapped aloud, right or wrong -- reinforces the
        // text/sound link either way. Adult Mode (S.managingDecks) stays quiet, same as everywhere else.
        if(!S.managingDecks) Speech.speak(chosen);
        render();
        // Fully automatic: the app already knows right vs. wrong from the tap, so it grades itself —
        // pause just long enough for the correct/wrong highlight to register, then move on.
        setTimeout(function(){ grade(autoRating('choice', correct, elapsed), true); }, 1100);
      });
    });
    if(mode === 'match' || mode === 'blank') wireDragTiles(card, mode);
    if(mode === 'timedchoice'){
      app.querySelectorAll('[data-tc-idx]').forEach(function(b){
        b.addEventListener('click', function(){
          if(dragJustHappened()) return;
          var tcNow = S.timedChoiceState;
          if(!tcNow || tcNow.cardId !== card.id || tcNow.selected != null || tcNow.expired || S.transitioning) return;
          clearTimedChoiceTimer();
          tcNow.selected = parseInt(b.dataset.tcIdx, 10);
          var chosen = tcNow.options[tcNow.selected];
          var correct = chosen === tcNow.answer;
          var elapsed = (tcNow.totalSeconds + tcNow.secondsAdded) * 1000 - Math.max(0, tcNow.deadline - Date.now());
          if(correct) Sound.correct(); else Sound.wrong();
          if(!S.managingDecks) Speech.speak(chosen);
          render();
          setTimeout(function(){ grade(autoRating('timedchoice', correct, elapsed), true); }, 1100);
        });
      });
      var addTimeBtn = app.querySelector('[data-act="tc-add-time"]');
      if(addTimeBtn) addTimeBtn.addEventListener('click', function(e){
        e.stopPropagation();
        var tcNow = S.timedChoiceState;
        if(!tcNow || tcNow.cardId !== card.id || tcNow.selected != null || tcNow.expired) return;
        if((tcNow.timesAdded||0) >= TIMED_CHOICE_MAX_ADDS) return;
        tcNow.deadline += TIMED_CHOICE_ADD_SECONDS * 1000;
        tcNow.secondsAdded += TIMED_CHOICE_ADD_SECONDS;
        tcNow.timesAdded = (tcNow.timesAdded||0) + 1;
        Sound.tap();
        render();
      });
      var tcLive = S.timedChoiceState;
      if(tcLive && tcLive.cardId === card.id && tcLive.selected == null && !tcLive.expired) wireTimedChoiceTimer(card);
    }
    app.querySelectorAll('[data-outcome]').forEach(function(b){
      b.addEventListener('click', function(e){
        e.stopPropagation();
        if(dragJustHappened()) return;
        if(S.transitioning) return;
        var correct = b.dataset.outcome === 'right';
        var clock = mode === 'flip' ? (S.cardFlippedAt || S.cardShownAt) : S.cardShownAt;
        var elapsed = Date.now() - (clock || Date.now());
        grade(autoRating(mode, correct, elapsed));
      });
    });
    // Hard-difficulty Anki-style grading buttons (Again/Hard/Good/Easy) — the child's own tap IS
    // the rating, so this skips autoRating()'s response-time guesswork entirely.
    app.querySelectorAll('[data-rating]').forEach(function(b){
      b.addEventListener('click', function(e){
        e.stopPropagation();
        if(dragJustHappened()) return;
        if(S.transitioning) return;
        grade(b.dataset.rating);
      });
    });
  }

  // The only entry point that advances a card. Answering (an outcome tap, or a choice pick) is the
  // sole trigger — there is no swipe-to-skip and no tap-anywhere-to-continue, so a card is locked in
  // place until it's actually answered. Once answered, this plays the TikTok-style exit slide on the
  // current card and locks out any further taps for that brief window before the next card lands.
  function grade(rating, skipSound){
    if(S.transitioning) return;
    S.transitioning = true;
    var stageEl = app.querySelector('.stage');
    if(stageEl) stageEl.classList.add('stage-exit');
    setTimeout(function(){
      S.transitioning = false;
      commitGrade(rating, skipSound);
    }, 200);
  }

  function commitGrade(rating, skipSound){
    var card = S.studyQueue.shift();
    // 'leitner' uses its own fixed-box engine; the other two options share the SM-2 engine and only
    // differ upstream, in whether autoRating() let response time influence the rating at all. Either
    // way, the parent-set difficulty (round size aside) shapes how far a good answer is spaced out
    // and how hard a struggling card gets reinforced — see DIFFICULTIES up top.
    var algo = S.settings.algorithm || 'sm2_speed';
    var diff = currentDifficulty();
    var updates = (algo === 'leitner') ? gradeCardLeitner(card, rating !== 'again', Date.now(), diff) : gradeCard(card, rating, Date.now(), diff);
    // Cumulative right/wrong counters, independent of the scheduling algorithm above -- these are
    // what the Progress page's per-deck "topics" breakdown groups by category and sums.
    updates.timesSeen = (card.timesSeen || 0) + 1;
    updates.timesCorrect = (card.timesCorrect || 0) + (rating !== 'again' ? 1 : 0);
    S.store.updateCard(S.currentDeckId, card.id, updates);
    S.sessionReviewed += 1;
    S.sessionStars += STARS[rating];
    // Snapshot this card as the one swipe-back target — captured before choiceState/cardFlipped
    // reset below, and overwritten on every answer, so there's always exactly one card of "undo peek."
    var gradedMode = (card.mode === 'read' || card.mode === 'choice' || card.mode === 'match' || card.mode === 'blank' || card.mode === 'timedchoice') ? card.mode : 'flip';
    var isDragGraded = gradedMode === 'match' || gradedMode === 'blank';
    var tcGraded = gradedMode === 'timedchoice' ? S.timedChoiceState : null;
    // 'timedchoice' can ask in either direction (see buildTimedChoiceRound), so the peek-back view
    // needs the actual prompt/answer text that was shown, not always card.front/card.back verbatim.
    S.lastAnsweredCard = {
      front: tcGraded ? tcGraded.prompt : card.front,
      back: tcGraded ? tcGraded.answer : card.back,
      note: card.note || '',
      photoUrl: card.photoUrl || '',
      mode: gradedMode,
      correct: rating !== 'again',
      rating: rating,
      choiceOptions: (gradedMode === 'choice' && S.choiceState) ? S.choiceState.options.slice() : (isDragGraded && S.dragState ? S.dragState.options.slice() : (tcGraded ? tcGraded.options.slice() : null)),
      chosenText: (gradedMode === 'choice' && S.choiceState && S.choiceState.selected != null) ? S.choiceState.options[S.choiceState.selected] : (isDragGraded && S.dragState && S.dragState.dropped != null ? S.dragState.options[S.dragState.dropped] : (tcGraded && tcGraded.selected != null ? tcGraded.options[tcGraded.selected] : null))
    };
    S.peeking = false;
    // The swim-progress critter frowns for a beat right after a miss, then goes back to smiling —
    // it still swims forward the same step either way, so a wrong answer never looks like no progress.
    S.lastOutcomeWrong = (rating === 'again');
    if(S.lastOutcomeWrong){
      setTimeout(function(){ S.lastOutcomeWrong = false; if(S.view === 'study') render(); }, 900);
    }
    if(S.roundTally) S.roundTally[rating] = (S.roundTally[rating] || 0) + 1;
    if(!skipSound){
      if(rating === 'again') Sound.wrong();
      else if(rating === 'hard') Sound.tap();
      else Sound.correct();
    }
    if(S.sessionTally){
      S.sessionTally.reviewedCount += 1;
      S.sessionTally.starsEarned += STARS[rating];
      S.sessionTally[rating] = (S.sessionTally[rating] || 0) + 1;
      if(S.currentDeckId && S.sessionTally.decksStudied.indexOf(S.currentDeckId) === -1){
        S.sessionTally.decksStudied.push(S.currentDeckId);
      }
      S.store.setSessionTally(S.sessionTally);
    }
    // Rounds are meant to be a strict, predictable length (the chosen difficulty's roundSize) — a
    // missed card is NOT requeued into the same round (that used to inflate a round past its size).
    // It's simply due again shortly per the schedule and will resurface on the next round/Play Again.
    var stillLearning = updates.state === 'learning' || updates.state === 'relearning';
    S.cardFlipped = false;
    S.choiceState = null;
    S.dragState = null;
    S.currentCardId = null; // forces the next renderStudy() to treat the next card (even a re-queued one) as freshly shown
    if(S.dueCounts[S.currentDeckId]){
      S.dueCounts[S.currentDeckId].due = Math.max(0, S.dueCounts[S.currentDeckId].due - (stillLearning?0:1));
    }
    render();
  }

  function finishStudy(){
    var t = S.roundTally || { again:0, hard:0, good:0, easy:0 };
    var total = S.sessionReviewed;
    var right = Math.max(0, total - t.again);
    var deck = S.decks.find(function(d){ return d.id === S.currentDeckId; });
    var historyEntry = {
      deckId: S.currentDeckId,
      deckName: deck ? deck.name : 'Deck',
      deckEmoji: deck ? deck.emoji : '🌊',
      total: total,
      right: right,
      accuracy: total > 0 ? Math.round((right / total) * 100) : 0
    };
    var newStatsRef = null;
    S.store.getStats().then(function(stats){
      var today = todayISO();
      var newStreak = stats.streak || 0;
      if(stats.lastReviewDateISO !== today){
        var y = new Date(); y.setDate(y.getDate()-1);
        newStreak = (stats.lastReviewDateISO === todayISO(y)) ? (stats.streak||0) + 1 : 1;
      }
      var newStats = {
        streak: newStreak,
        stars: (stats.stars||0) + S.sessionStars,
        lastReviewDateISO: today,
        totalReviews: (stats.totalReviews||0) + S.sessionReviewed
      };
      newStatsRef = newStats;
      return S.store.setStats(newStats).then(function(){ S.stats = newStats; });
    }).then(function(){
      return S.store.addHistoryEntry(historyEntry);
    }).then(function(){
      return evaluateAndAwardBadges(newStatsRef, historyEntry);
    }).then(function(){
      S.view = 'summary';
      render();
    });
  }

    var t = S.roundTally || { again:0, hard:0, good:0, easy:0 };
    var total = S.sessionReviewed;
    var right = Math.max(0, total - t.again);

    var earnedHTML = '';
    if(S.justEarnedBadges && S.justEarnedBadges.length){
