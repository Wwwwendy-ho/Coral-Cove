  /* ---------- HOME ---------- */
  var DECK_FILTERS = [
    { id: 'all', label: 'All decks' },
    { id: 'live', label: 'Live' },
    { id: 'archived', label: 'Archived' }
  ];

  function renderHome(){
    var managing = S.managingDecks;
    var banner = (S.store.live ? '' : '<div class="banner">🌟 Try-it-out mode — your decks won\'t be saved after you close this page.</div>') + errorBannerHTML();
    // Archived decks are a parent-only concept: a kid in a study session never sees them at all,
    // not even as a locked/greyed-out tile — they're filtered out before the deck grid is built.
    var visibleDecks = managing ? S.decks : S.decks.filter(function(d){ return !d.archived; });
    var filterTabsHTML = '';
    if(managing){
      var filter = S.deckFilter || 'all';
      visibleDecks = visibleDecks.filter(function(d){
        if(filter === 'live') return !d.archived;
        if(filter === 'archived') return !!d.archived;
        return true;
      });
      var tabsHTML = DECK_FILTERS.map(function(f){
        var count = S.decks.filter(function(d){
          if(f.id === 'live') return !d.archived;
          if(f.id === 'archived') return !!d.archived;
          return true;
        }).length;
        return '<button type="button" class="filter-tab'+(filter===f.id?' active':'')+'" data-filter="'+f.id+'">'+f.label+' <span class="filter-count">'+count+'</span></button>';
      }).join('');
      filterTabsHTML = '<div class="filter-tabs" role="tablist" aria-label="Filter decks">'+tabsHTML+'</div>';
    }
    // Subject tabs (Reading / Math / Korean / ...) sit below the archive filter and apply to both
    // the kid home screen and Manage Decks -- built from whatever's actually tagged in the current
    // scope (already narrowed by the Live/Archived filter above), so they only ever show subjects
    // that have at least one deck behind them right now.
    var subjectTabsHTML = '';
    var subjectTabs = buildSubjectTabs(visibleDecks);
    if(subjectTabs){
      if(S.subjectFilter !== 'all' && !subjectTabs.some(function(t){ return t.id === S.subjectFilter; })){
        S.subjectFilter = 'all'; // the tagged deck we were filtered to is gone (archived/edited/deleted)
      }
      var subjFilter = S.subjectFilter || 'all';
      var subjChips = '<button type="button" class="subject-tab'+(subjFilter==='all'?' active':'')+'" data-subject-filter="all">🌈 All <span class="filter-count">'+visibleDecks.length+'</span></button>' +
        subjectTabs.map(function(t){
          return '<button type="button" class="subject-tab'+(subjFilter===t.id?' active':'')+'" data-subject-filter="'+esc(t.id)+'">'+t.icon+' '+esc(t.label)+' <span class="filter-count">'+t.count+'</span></button>';
        }).join('');
      subjectTabsHTML = '<div class="subject-tabs" role="tablist" aria-label="Filter by subject">'+subjChips+'</div>';
      if(subjFilter !== 'all'){
        visibleDecks = visibleDecks.filter(function(d){ return d.subject && subjectMeta(d.subject).id === subjFilter; });
      }
    } else {
      S.subjectFilter = 'all';
    }
    if(managing){
      // Most recently studied or edited first; decks that have never been opened fall to the back,
      // ordered among themselves by the deck's original creation order.
      visibleDecks = visibleDecks.slice().sort(function(a, b){
        var diff = (b.lastOpenedAt || 0) - (a.lastOpenedAt || 0);
        return diff !== 0 ? diff : ((a.order || 0) - (b.order || 0));
      });
    }
    var deckTiles = visibleDecks.map(function(d){
      var dc = S.dueCounts[d.id] || { due:0, total:0 };
      var archived = !!d.archived;
      var badge = dc.total === 0
        ? '<span class="deck-badge">No cards yet</span>'
        : (dc.due > 0
          ? '<span class="deck-badge due">'+dc.due+' to review</span>'
          : '<span class="deck-badge">All caught up! 🎉</span>');
      return '' +
      '<div class="deck-card'+(managing && archived ? ' archived' : '')+'">' +
        (managing && archived ? '<span class="archived-tag">📦 Archived</span>' : '') +
        '<div class="deck-emoji">'+d.emoji+'</div>' +
        '<h3 class="deck-name">'+esc(d.name)+'</h3>' +
        '<div class="deck-meta">'+dc.total+' card'+(dc.total===1?'':'s')+'</div>' +
        badge +
        '<div class="deck-actions">' +
          '<button class="btn btn-primary" data-act="study" data-deck="'+d.id+'" '+(dc.total===0?'disabled':'')+'>Dive In</button>' +
          (managing ? '<button class="icon-btn" data-act="edit-deck" data-deck="'+d.id+'" title="Edit deck" aria-label="Edit '+esc(d.name)+'">✏️</button>' : '') +
          (managing ? '<button class="icon-btn" data-act="toggle-archive" data-deck="'+d.id+'" title="'+(archived?'Unarchive':'Archive')+' deck" aria-label="'+(archived?'Unarchive':'Archive')+' '+esc(d.name)+'">'+(archived?'📤':'📦')+'</button>' : '') +
        '</div>' +
      '</div>';
    }).join('');

    app.innerHTML = '' +
      '<div class="topbar">' +
        '<div class="brand">' +
          '<div class="brand-block">' +
            '<h1 class="brand-title">Coral Cove</h1>' +
            '<p class="brand-tag">'+(managing ? '🔧 Adult Mode — kids can\'t see this screen' : 'Dive in and practice!')+'</p>' +
          '</div>' +
        '</div>' +
        '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">' +
          (managing ? '' :
          '<div class="stats-row">' +
            '<div class="pill streak"><span class="icon">🌊</span><span class="tabular">'+S.stats.streak+'</span></div>' +
            '<div class="pill stars"><span class="icon">⭐</span><span class="tabular">'+S.stats.stars+'</span></div>' +
          '</div>') +
          (managing ? '<button type="button" class="icon-btn" data-act="open-settings" title="Settings" aria-label="Study settings">⚙️</button>' : '') +
          '<button type="button" class="icon-btn" data-act="open-stats" title="Progress" aria-label="View progress">📊</button>' +
          (managing ? '<button type="button" class="btn btn-ghost" data-act="exit-manager">✅ Done</button>' : ctrlRowHTML()) +
        '</div>' +
      '</div>' +
      '<div class="mascot-wrap">'+mascotSVG('')+'</div>' +
      banner +
      filterTabsHTML +
      subjectTabsHTML +
      (!visibleDecks.length ? '<div class="empty-filter-note">'+(managing && S.deckFilter==='archived' ? 'No archived decks.' : (subjectTabs && S.subjectFilter!=='all' ? 'No decks tagged with this subject yet.' : 'No decks here.'))+'</div>' : '') +
      '<div class="deck-grid">' +
        deckTiles +
        (managing ? '<button type="button" class="add-deck-card" data-act="new-deck"><span class="plus">＋</span><span>New Deck</span></button>' : '') +
      '</div>';

    app.querySelectorAll('[data-act="study"]').forEach(function(b){ b.addEventListener('click', function(){ startStudy(b.dataset.deck); }); });
    app.querySelector('[data-act="open-stats"]').addEventListener('click', openStats);
    app.querySelectorAll('[data-subject-filter]').forEach(function(b){
      b.addEventListener('click', function(){
        if(S.subjectFilter === b.dataset.subjectFilter) return;
        S.subjectFilter = b.dataset.subjectFilter;
        render();
      });
    });
    if(managing){
      app.querySelectorAll('[data-act="edit-deck"]').forEach(function(b){ b.addEventListener('click', function(){ openEditor(b.dataset.deck); }); });
      app.querySelectorAll('[data-act="toggle-archive"]').forEach(function(b){
        b.addEventListener('click', function(){
          var d = S.decks.find(function(x){ return x.id === b.dataset.deck; });
          S.store.updateDeck(b.dataset.deck, { archived: !(d && d.archived) });
        });
      });
      app.querySelectorAll('[data-filter]').forEach(function(b){
        b.addEventListener('click', function(){
          if(S.deckFilter === b.dataset.filter) return;
          S.deckFilter = b.dataset.filter;
          render();
        });
      });
      var newBtn = app.querySelector('[data-act="new-deck"]');
      if(newBtn) newBtn.addEventListener('click', createDeck);
      var settingsBtn = app.querySelector('[data-act="open-settings"]');
      if(settingsBtn) settingsBtn.addEventListener('click', function(){ S.view = 'settings'; render(); });
      var doneBtn = app.querySelector('[data-act="exit-manager"]');
      if(doneBtn) doneBtn.addEventListener('click', exitManager);
    } else {
      wireCtrlRow();
    }
    wireErrorBanner();
  }

  function createDeck(){
    var emoji = DECK_EMOJI[Math.floor(Math.random()*DECK_EMOJI.length)];
    S.store.addDeck({ name: 'New Deck', emoji: emoji, order: S.decks.length }).then(function(id){
      openEditor(id, true);
    });
  }

  /* ---------- STUDY ---------- */
  // Round length now comes from the parent-set difficulty (Easy 4 / Medium 6 / Hard 10) rather than
  // a fixed constant — see DIFFICULTIES up top.

  function startStudy(deckId){
    S.currentDeckId = deckId;
    S.store.updateDeck(deckId, { lastOpenedAt: Date.now() }); // drives the Manage Decks "most recently opened" order
    S.store.getCardsOnce(deckId).then(function(cards){
      var pool = buildStudyPool(cards);
      S.studyQueue = shuffle(pool).slice(0, currentDifficulty().roundSize);
      S.studyTotal = S.studyQueue.length;
      S.sessionReviewed = 0;
      S.sessionStars = 0;
      S.roundTally = { again: 0, hard: 0, good: 0, easy: 0 };
      S.view = 'study';
      S.cardFlipped = false;
      S.choiceState = null;
      S.currentCardId = null;
      S.cardShownAt = null;
      S.cardFlippedAt = null;
      S.transitioning = false;
      S.peeking = false;
      S.lastAnsweredCard = null;
      S.critterPrevPct = 0;
      render();
    });
  }

  var OUTCOME_ROW_HTML = '' +
    '<div class="grade-row outcome-row" style="position:relative;z-index:1;">' +
      '<button class="grade-btn grade-wrong" data-outcome="wrong"><span class="emoji">🦀</span>Not quite</button>' +
      '<button class="grade-btn grade-right" data-outcome="right"><span class="emoji">🐬</span>Got it right!</button>' +
    '</div>';

  // On Hard difficulty, the simple right/wrong self-report is replaced with real Anki-style
  // self-grading — four options describing how hard the card actually was, same spirit as Anki's
  // own Again/Hard/Good/Easy buttons. The child's own tap IS the rating here, so it also bypasses
  // autoRating()'s response-time guesswork for these two modes (flip and read) while Hard is on.
  var ANKI_ROW_HTML = '' +
    '<div class="grade-row" style="position:relative;z-index:1;">' +
      '<button class="grade-btn grade-again" data-rating="again"><span class="emoji">🦀</span>Again</button>' +
      '<button class="grade-btn grade-hard" data-rating="hard"><span class="emoji">🐢</span>Hard</button>' +
      '<button class="grade-btn grade-good" data-rating="good"><span class="emoji">🐬</span>Good</button>' +
      '<button class="grade-btn grade-easy" data-rating="easy"><span class="emoji">🐳</span>Easy</button>' +
    '</div>';

  function outcomeRowHTML(){
    return currentDifficulty().id === 'hard' ? ANKI_ROW_HTML : OUTCOME_ROW_HTML;
  }

  // The read-only "swipe back" view of the one card the kid most recently answered. No inputs are
  // interactive here — it's a look, not a redo — so there's no route to change a grade already
  // recorded. Mirrors the live layout for each mode, just frozen in its answered state.
  function buildPeekInner(rec){
    var badge = rec.correct
      ? '<div class="peek-badge peek-right">✅ That one was right!</div>'
      : '<div class="peek-badge peek-wrong">🦀 That one was marked not quite</div>';
    var body;
    var photoHTML = rec.photoUrl ? '<img class="card-photo" src="'+esc(rec.photoUrl)+'" alt="">' : '';
    if(rec.mode === 'choice'){
      var optsHTML = (rec.choiceOptions||[]).map(function(opt){
        var cls = 'choice-btn';
        if(opt === rec.back) cls += ' correct';
        else if(opt === rec.chosenText) cls += ' wrong';
        return '<button type="button" class="'+cls+'" disabled>'+esc(opt)+'</button>';
      }).join('');
      body = '' +
        '<div class="flip-scene" style="position:relative;z-index:1;">' +
          '<div class="face face-front read-face"><div class="read-label">🔢 Last question</div>'+photoHTML+'<div class="card-text">'+esc(rec.front)+'</div></div>' +
        '</div>' +
        '<div class="choice-row">'+optsHTML+'</div>';
    } else if(rec.mode === 'read'){
      body = '' +
        '<div class="flip-scene" style="position:relative;z-index:1;">' +
          '<div class="face face-front read-face">' +
            '<div class="read-label">📖 Last question</div>' +
            photoHTML +
            '<div class="card-text">'+esc(rec.front)+'</div>' +
            (rec.note?'<div class="card-note dim">'+esc(rec.note)+'</div>':'') +
          '</div>' +
        '</div>';
    } else {
      body = '' +
        '<div class="flip-scene" style="position:relative;z-index:1;">' +
          '<div class="flip-card flipped">' +
            '<div class="face face-front">'+photoHTML+'<div class="card-text">'+esc(rec.front)+'</div></div>' +
            '<div class="face face-back"><div class="card-text">'+esc(rec.back)+'</div>'+(rec.note?'<div class="card-note">'+esc(rec.note)+'</div>':'')+'</div>' +
          '</div>' +
        '</div>';
    }
    return '' +
      '<div class="peek-wrap">' +
        body +
        badge +
        '<div class="flip-hint" style="position:relative;z-index:1;">⬆️ Swipe up (or tap) to continue</div>' +
      '</div>';
  }

  // Drag-to-swipe, TikTok style: live-follows the finger, snaps back if it doesn't clear the
  // threshold. Direction is asymmetric on purpose — forward is never draggable (answering is the
  // only way past the current card), backward only reaches the one card just answered.
  function wireSwipe(stageEl){
    if(!stageEl) return;
    var dragging = false, startY = 0, dy = 0, activePointerId = null;
    var DRAG_MAX = 120, COMMIT = 62;
    function canPeekBack(){ return !S.peeking && !!S.lastAnsweredCard && !S.transitioning; }
    function canReturnForward(){ return S.peeking && !S.transitioning; }
    function pointY(e){ return e.touches && e.touches.length ? e.touches[0].clientY : e.clientY; }
    // Track the drag on `document` rather than relying on setPointerCapture: this keeps
    // following the finger/mouse even if it drifts outside the card bounds mid-swipe, and
    // guarantees onUp always fires (no stuck drag state) regardless of where the release lands.
    function onDown(e){
      if(S.transitioning || (!canPeekBack() && !canReturnForward())) return;
      dragging = true; dy = 0; startY = pointY(e);
      activePointerId = e.pointerId != null ? e.pointerId : null;
      stageEl.style.animation = 'none'; // don't fight the entrance animation with a live drag transform
      stageEl.classList.add('stage-dragging');
      document.addEventListener('pointermove', onMove);
      document.addEventListener('pointerup', onUp);
      document.addEventListener('pointercancel', onUp);
    }
    function onMoveRaw(y){
      dy = y - startY;
      var t;
      if(dy >= 0){ t = canPeekBack() ? Math.min(dy, DRAG_MAX) : Math.min(dy, DRAG_MAX) * 0.22; }
      else { t = canReturnForward() ? Math.max(dy, -DRAG_MAX) : Math.max(dy, -DRAG_MAX) * 0.22; }
      stageEl.style.transform = 'translateY('+t+'px)';
    }
    function onMove(e){
      if(!dragging) return;
      if(activePointerId != null && e.pointerId != null && e.pointerId !== activePointerId) return;
      onMoveRaw(pointY(e));
      if(e.cancelable) e.preventDefault();
    }
    function onUp(e){
      if(!dragging) return;
      if(activePointerId != null && e && e.pointerId != null && e.pointerId !== activePointerId) return;
      dragging = false;
      activePointerId = null;
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', onUp);
      document.removeEventListener('pointercancel', onUp);
      stageEl.classList.remove('stage-dragging');
      var goBack = dy > COMMIT && canPeekBack();
      var goForward = dy < -COMMIT && canReturnForward();
      // A real drag (even one that snaps back short of the threshold) shouldn't also be read as
      // a tap by the peek view's tap-to-return handler, which fires right after via 'click'.
      stageEl.__justDragged = Math.abs(dy) > 6;
      stageEl.style.transform = '';
      if(goBack) peekBack();
      else if(goForward) returnFromPeek();
      else {
        stageEl.classList.add('stage-snapback');
        setTimeout(function(){ stageEl.classList.remove('stage-snapback'); }, 220);
      }
      dy = 0;
    }
    stageEl.addEventListener('pointerdown', onDown);
    // Guard against the browser starting a native text/element drag mid-swipe, which can steal
    // the gesture and stop delivering further pointer events to us.
    stageEl.addEventListener('dragstart', function(e){ e.preventDefault(); });
    // Trackpad/mouse-wheel as a desktop-friendly equivalent to a swipe.
    stageEl.addEventListener('wheel', function(e){
      if(S.transitioning) return;
      if(e.deltaY < -14 && canReturnForward()){ e.preventDefault(); returnFromPeek(); }
      else if(e.deltaY > 14 && canPeekBack()){ e.preventDefault(); peekBack(); }
    }, { passive:false });
  }

  function peekBack(){
    if(S.transitioning || S.peeking || !S.lastAnsweredCard) return;
    S.transitioning = true;
    var stageEl = app.querySelector('.stage');
    if(stageEl) stageEl.classList.add('stage-exit-down');
    setTimeout(function(){
      S.transitioning = false;
      S.peeking = true;
      render();
    }, 200);
  }

  function returnFromPeek(){
    if(S.transitioning || !S.peeking) return;
    S.transitioning = true;
    var stageEl = app.querySelector('.stage');
    if(stageEl) stageEl.classList.add('stage-exit');
    setTimeout(function(){
      S.transitioning = false;
      S.peeking = false;
      render();
    }, 200);
  }

  function renderStudy(){
    var deck = S.decks.find(function(d){ return d.id === S.currentDeckId; }) || {name:'Deck', emoji:'🌊'};
    if(!S.studyQueue.length){
      finishStudy();
      return;
    }
    var card = S.studyQueue[0];
    if(S.currentCardId !== card.id){
      // A new card is on stage — reset per-card UI state and start the response-time clock.
      S.currentCardId = card.id;
      S.cardShownAt = Date.now();
      S.cardFlippedAt = null;
      S.cardFlipped = false;
      S.choiceState = null;
    }
    var mode = card.mode === 'read' ? 'read' : (card.mode === 'choice' ? 'choice' : 'flip');
    var peeking = S.peeking && !!S.lastAnsweredCard;
    var doneCount = S.sessionReviewed;
    var labelCount = peeking ? doneCount : (doneCount + 1);
    var progressBase = peeking ? Math.max(0, doneCount - 1) : doneCount;
    var progressPct = S.studyTotal > 0 ? Math.min(100, Math.max(0, Math.round((progressBase / S.studyTotal) * 100))) : 0;
    // The critter bar/fill are recreated from scratch on every render() (this whole screen is one
    // big innerHTML replace), so a plain CSS width/left transition never has a "before" state to
    // animate from — it just snaps. To make it travel smoothly instead, paint the bar at wherever
    // it last visually landed, then nudge it to the real value a frame later so the CSS transition
    // (already defined on .critter-track-fill / .critter-swim) has something to interpolate between.
    var startPct = S.critterPrevPct || 0;
    var critterHTML = '' +
      '<div class="critter-label">'+(peeking ? 'Reviewing question ' : 'Question ')+labelCount+' of '+S.studyTotal+'</div>' +
      '<div class="critter-track">' +
        '<div class="critter-track-fill" style="width:'+startPct+'%"></div>' +
        '<div class="critter-swim'+(S.lastOutcomeWrong?' oops':'')+'" style="left:'+startPct+'%">'+critterSVG(S.lastOutcomeWrong)+'</div>' +
      '</div>';

    var stageInner;
    if(peeking){
      stageInner = buildPeekInner(S.lastAnsweredCard);
    } else if(mode === 'read'){
      stageInner = '' +
        '<div class="flip-scene" style="position:relative;z-index:1;">' +
          '<div class="face face-front read-face">' +
            '<div class="read-label">📖 Read it out loud</div>' +
            (card.photoUrl?'<img class="card-photo" src="'+esc(card.photoUrl)+'" alt="">':'') +
            '<div class="card-text">'+esc(card.front)+'</div>' +
            (card.note?'<div class="card-note dim">'+esc(card.note)+'</div>':'') +
          '</div>' +
        '</div>' +
        '<div class="flip-hint" style="position:relative;z-index:1;">'+(currentDifficulty().id === 'hard' ? 'How well did they know it?' : 'Did they read it right?')+'</div>' +
        outcomeRowHTML();
    } else if(mode === 'choice'){
      if(!S.choiceState || S.choiceState.cardId !== card.id){
        S.choiceState = { cardId: card.id, options: shuffle([card.back].concat(card.choices||[])), selected: null };
      }
      var cs = S.choiceState;
      var pickedCorrect = cs.selected != null && cs.options[cs.selected] === card.back;
      var optsHTML = cs.options.map(function(opt, idx){
        var cls = 'choice-btn';
        if(cs.selected != null){
          if(opt === card.back) cls += ' correct';
          else if(idx === cs.selected) cls += ' wrong';
        }
        return '<button type="button" class="'+cls+'" data-choice-idx="'+idx+'" '+(cs.selected!=null?'disabled':'')+'>'+esc(opt)+'</button>';
      }).join('');
      var choiceFeedback = cs.selected == null
        ? '<div class="flip-hint" style="position:relative;z-index:1;">Tap an answer</div>'
        : '<div class="choice-feedback '+(pickedCorrect?'ok':'no')+'">'+(pickedCorrect ? 'Nice job! 🎉' : 'Good try — that one\'s tricky!')+'</div>';
      stageInner = '' +
        '<div class="flip-scene" style="position:relative;z-index:1;">' +
          '<div class="face face-front read-face">' +
            '<div class="read-label">🔢 Pick the answer</div>' +
            (card.photoUrl?'<img class="card-photo" src="'+esc(card.photoUrl)+'" alt="">':'') +
            '<div class="card-text">'+esc(card.front)+'</div>' +
          '</div>' +
        '</div>' +
        '<div class="choice-row">'+optsHTML+'</div>' +
        choiceFeedback;
    } else {
      stageInner = '' +
        '<div class="flip-scene" style="position:relative;z-index:1;">' +
          '<div class="flip-card '+(S.cardFlipped?'flipped':'')+'" id="flipCard">' +
            '<div class="face face-front">'+(card.photoUrl?'<img class="card-photo" src="'+esc(card.photoUrl)+'" alt="">':'')+'<div class="card-text">'+esc(card.front)+'</div></div>' +
            '<div class="face face-back"><div class="card-text">'+esc(card.back)+'</div>'+(card.note?'<div class="card-note">'+esc(card.note)+'</div>':'')+(Speech.isSupported()?'<button type="button" class="replay-audio-btn" data-act="replay-audio">🔊 Hear it again</button>':'')+'</div>' +
          '</div>' +
        '</div>' +
        '<div class="flip-hint" style="position:relative;z-index:1;">'+(S.cardFlipped ? (currentDifficulty().id === 'hard' ? 'How well did you know it?' : 'Be honest — did you get it right?') : 'Tap the card to flip it')+'</div>' +
        (S.cardFlipped ? outcomeRowHTML() : '');
    }

    app.innerHTML = '' +
      '<div class="nav-row">' +
        '<button class="back-btn" data-act="exit-study">⟵ Lagoon</button>' +
        '<span class="nav-title">'+deck.emoji+' '+esc(deck.name)+'</span>' +
        ctrlRowHTML() +
      '</div>' +
      critterHTML +
      '<div class="stage'+(peeking?' stage-peek':'')+'">' +
        bubblesHTML(8) +
        stageInner +
      '</div>';

    // Now that the bar exists in the DOM at startPct, bump it to the real value on the next frame
    // so the CSS transition actually plays instead of the value just appearing already-set. Double
    // rAF (rather than one) makes sure the browser has painted the starting position first — a
    // single rAF can land in the same paint as the innerHTML write and skip straight to the target.
    (function(){
      var fillEl = app.querySelector('.critter-track-fill');
      var swimEl = app.querySelector('.critter-swim');
      requestAnimationFrame(function(){
        requestAnimationFrame(function(){
          if(fillEl) fillEl.style.width = progressPct + '%';
          if(swimEl) swimEl.style.left = progressPct + '%';
        });
      });
    })();
    S.critterPrevPct = progressPct;

    app.querySelector('[data-act="exit-study"]').addEventListener('click', function(){
      // In Adult Mode a grown-up is already in (no PIN was needed to get here), so backing out of a
      // deck early just returns to Manage Decks. The PIN guard below is a Child Mode-only protection
      // against a kid quitting a round early without a grown-up's say-so.
      if(S.managingDecks){ goHome(); return; }
      // Leaving a deck before finishing the round needs a grown-up's PIN — finishing normally
      // (via the summary screen's own buttons) does not, so this only guards the early exit.
      S.pinInput=''; S.pinError=''; S.pinShake=false;
      S.pinPromptFor = 'exit';
      render();
    });
    wireCtrlRow();
    var stageEl = app.querySelector('.stage');
    wireSwipe(stageEl);
    // A short drag that snaps back (didn't clear the swipe threshold) can still end with
    // mousedown/up landing on the same tappable element — consumed once so it isn't also read
    // as a tap that flips the card or picks an answer.
    function dragJustHappened(){
      if(stageEl.__justDragged){ stageEl.__justDragged = false; return true; }
      return false;
    }
    if(peeking){
      // Reviewing the last card is not interactive — tapping it (same as swiping up) just returns
      // to the live, unanswered card. Ignore the synthetic click that follows a real drag release
      // (mousedown/up on the same element still fires 'click' even after a big pointer move).
      stageEl.addEventListener('click', function(){
        if(dragJustHappened()) return;
        returnFromPeek();
      });
      return;
    }
    var flip = document.getElementById('flipCard');
    if(flip){
      flip.addEventListener('click', function(){
        if(dragJustHappened()) return;
        if(S.transitioning) return;
        // Toggles both ways now — flipping back to the front (to re-read the question, or just to
        // flip it again for fun) is allowed any number of times before grading. Only the very FIRST
        // reveal starts the response-time clock that feeds auto-grading below; flipping back and
        // forth after that doesn't reset it, so mulling it over doesn't get scored as "took forever."
        S.cardFlipped = !S.cardFlipped;
        Sound.flip();
        render();
        if(S.cardFlipped){
          if(!S.cardFlippedAt) S.cardFlippedAt = Date.now();
          Speech.speak(card.back); // read the revealed answer aloud automatically
        }
      });
    }
    var replayBtn = app.querySelector('[data-act="replay-audio"]');
    if(replayBtn) replayBtn.addEventListener('click', function(e){ e.stopPropagation(); Speech.speak(card.back); });
    app.querySelectorAll('[data-choice-idx]').forEach(function(b){
      b.addEventListener('click', function(){
        if(dragJustHappened()) return;
        if(S.choiceState.selected != null || S.transitioning) return;
        S.choiceState.selected = parseInt(b.dataset.choiceIdx, 10);
        var chosen = S.choiceState.options[S.choiceState.selected];
        var correct = chosen === card.back;
        var elapsed = Date.now() - (S.cardShownAt || Date.now());
        if(correct) Sound.correct(); else Sound.wrong();
        render();
        // Fully automatic: the app already knows right vs. wrong from the tap, so it grades itself —
        // pause just long enough for the correct/wrong highlight to register, then move on.
        setTimeout(function(){ grade(autoRating('choice', correct, elapsed), true); }, 1100);
      });
    });
    app.querySelectorAll('[data-outcome]').forEach(function(b){
      b.addEventListener('click', function(e){
        e.stopPropagation();
        if(dragJustHappened()) return;
        if(S.transitioning) return;
        var correct = b.dataset.outcome === 'right';
        var clock = mode === 'flip' ? (S.cardFlippedAt || S.cardShownAt) : S.cardShownAt;
        var elapsed = Date.now() - (clock || Date.now());
        grade(autoRating(mode, correct, elapsed));
      });
    });
    // Hard-difficulty Anki-style grading buttons (Again/Hard/Good/Easy) — the child's own tap IS
    // the rating, so this skips autoRating()'s response-time guesswork entirely.
    app.querySelectorAll('[data-rating]').forEach(function(b){
      b.addEventListener('click', function(e){
        e.stopPropagation();
        if(dragJustHappened()) return;
        if(S.transitioning) return;
        grade(b.dataset.rating);
      });
    });
  }

  // The only entry point that advances a card. Answering (an outcome tap, or a choice pick) is the
  // sole trigger — there is no swipe-to-skip and no tap-anywhere-to-continue, so a card is locked in
  // place until it's actually answered. Once answered, this plays the TikTok-style exit slide on the
  // current card and locks out any further taps for that brief window before the next card lands.
  function grade(rating, skipSound){
    if(S.transitioning) return;
    S.transitioning = true;
    var stageEl = app.querySelector('.stage');
    if(stageEl) stageEl.classList.add('stage-exit');
    setTimeout(function(){
      S.transitioning = false;
      commitGrade(rating, skipSound);
    }, 200);
  }

  function commitGrade(rating, skipSound){
    var card = S.studyQueue.shift();
    // 'leitner' uses its own fixed-box engine; the other two options share the SM-2 engine and only
    // differ upstream, in whether autoRating() let response time influence the rating at all. Either
    // way, the parent-set difficulty (round size aside) shapes how far a good answer is spaced out
    // and how hard a struggling card gets reinforced — see DIFFICULTIES up top.
    var algo = S.settings.algorithm || 'sm2_speed';
    var diff = currentDifficulty();
    var updates = (algo === 'leitner') ? gradeCardLeitner(card, rating !== 'again', Date.now(), diff) : gradeCard(card, rating, Date.now(), diff);
    // Cumulative right/wrong counters, independent of the scheduling algorithm above -- these are
    // what the Progress page's per-deck "topics" breakdown groups by category and sums.
    updates.timesSeen = (card.timesSeen || 0) + 1;
    updates.timesCorrect = (card.timesCorrect || 0) + (rating !== 'again' ? 1 : 0);
    S.store.updateCard(S.currentDeckId, card.id, updates);
    S.sessionReviewed += 1;
    S.sessionStars += STARS[rating];
    // Snapshot this card as the one swipe-back target — captured before choiceState/cardFlipped
    // reset below, and overwritten on every answer, so there's always exactly one card of "undo peek."
    var gradedMode = card.mode === 'read' ? 'read' : (card.mode === 'choice' ? 'choice' : 'flip');
    S.lastAnsweredCard = {
      front: card.front,
      back: card.back,
      note: card.note || '',
      photoUrl: card.photoUrl || '',
      mode: gradedMode,
      correct: rating !== 'again',
      rating: rating,
      choiceOptions: (gradedMode === 'choice' && S.choiceState) ? S.choiceState.options.slice() : null,
      chosenText: (gradedMode === 'choice' && S.choiceState && S.choiceState.selected != null) ? S.choiceState.options[S.choiceState.selected] : null
    };
    S.peeking = false;
    // The swim-progress critter frowns for a beat right after a miss, then goes back to smiling —
    // it still swims forward the same step either way, so a wrong answer never looks like no progress.
    S.lastOutcomeWrong = (rating === 'again');
    if(S.lastOutcomeWrong){
      setTimeout(function(){ S.lastOutcomeWrong = false; if(S.view === 'study') render(); }, 900);
    }
    if(S.roundTally) S.roundTally[rating] = (S.roundTally[rating] || 0) + 1;
    if(!skipSound){
      if(rating === 'again') Sound.wrong();
      else if(rating === 'hard') Sound.tap();
      else Sound.correct();
    }
    if(S.sessionTally){
      S.sessionTally.reviewedCount += 1;
      S.sessionTally.starsEarned += STARS[rating];
      S.sessionTally[rating] = (S.sessionTally[rating] || 0) + 1;
      if(S.currentDeckId && S.sessionTally.decksStudied.indexOf(S.currentDeckId) === -1){
        S.sessionTally.decksStudied.push(S.currentDeckId);
      }
      S.store.setSessionTally(S.sessionTally);
    }
    // Rounds are meant to be a strict, predictable length (the chosen difficulty's roundSize) — a
    // missed card is NOT requeued into the same round (that used to inflate a round past its size).
    // It's simply due again shortly per the schedule and will resurface on the next round/Play Again.
    var stillLearning = updates.state === 'learning' || updates.state === 'relearning';
    S.cardFlipped = false;
    S.choiceState = null;
    S.currentCardId = null; // forces the next renderStudy() to treat the next card (even a re-queued one) as freshly shown
    if(S.dueCounts[S.currentDeckId]){
      S.dueCounts[S.currentDeckId].due = Math.max(0, S.dueCounts[S.currentDeckId].due - (stillLearning?0:1));
    }
    render();
  }

  function finishStudy(){
    var t = S.roundTally || { again:0, hard:0, good:0, easy:0 };
    var total = S.sessionReviewed;
    var right = Math.max(0, total - t.again);
    var deck = S.decks.find(function(d){ return d.id === S.currentDeckId; });
    var historyEntry = {
      deckId: S.currentDeckId,
      deckName: deck ? deck.name : 'Deck',
      deckEmoji: deck ? deck.emoji : '🌊',
      total: total,
      right: right,
      accuracy: total > 0 ? Math.round((right / total) * 100) : 0
    };
    S.store.getStats().then(function(stats){
      var today = todayISO();
      var newStreak = stats.streak || 0;
      if(stats.lastReviewDateISO !== today){
        var y = new Date(); y.setDate(y.getDate()-1);
        newStreak = (stats.lastReviewDateISO === todayISO(y)) ? (stats.streak||0) + 1 : 1;
      }
      var newStats = {
        streak: newStreak,
        stars: (stats.stars||0) + S.sessionStars,
        lastReviewDateISO: today,
        totalReviews: (stats.totalReviews||0) + S.sessionReviewed
      };
      return S.store.setStats(newStats).then(function(){ S.stats = newStats; });
    }).then(function(){
      return S.store.addHistoryEntry(historyEntry);
    }).then(function(){
      S.view = 'summary';
      render();
    });
  }

  function renderSummary(){
    var deck = S.decks.find(function(d){ return d.id === S.currentDeckId; }) || {name:'Deck', emoji:'🌊'};
    var t = S.roundTally || { again:0, hard:0, good:0, easy:0 };
    var total = S.sessionReviewed;
    var right = Math.max(0, total - t.again);
    var accuracy = total > 0 ? Math.round((right / total) * 100) : 0;
    app.innerHTML = '' +
      '<div class="mascot-wrap">'+mascotSVG('big celebrate')+'</div>' +
      '<div class="summary-card">' +
        '<h2>Great swimming!</h2>' +
        '<div class="deck-meta">'+deck.emoji+' '+esc(deck.name)+'</div>' +
        '<div class="summary-stats">' +
          '<div class="summary-stat"><span class="num tabular">'+right+' / '+total+'</span><span class="label">Right</span></div>' +
          '<div class="summary-stat"><span class="num tabular">'+accuracy+'%</span><span class="label">Accuracy</span></div>' +
          '<div class="summary-stat"><span class="num tabular">'+S.stats.streak+'</span><span class="label">Day streak</span></div>' +
        '</div>' +
        '<div class="form-actions" style="justify-content:center;margin-top:6px;">' +
          '<button class="btn btn-primary" data-act="play-again">🔁 Play Again</button>' +
          '<button class="btn btn-ghost" data-act="back-home">Back to the Lagoon</button>' +
        '</div>' +
      '</div>';
    app.querySelector('[data-act="back-home"]').addEventListener('click', goHome);
    app.querySelector('[data-act="play-again"]').addEventListener('click', function(){ startStudy(deck.id); });
  }

  /* ---------- STATS PAGE ---------- */
  function openStats(){
    S.view = 'stats';
    S.statsData = null; // shows the loading state until the fetch below resolves
    render();
    var deckList = S.managingDecks ? S.decks : S.decks.filter(function(d){ return !d.archived; });
    Promise.all([
      S.store.getHistoryOnce(),
      Promise.all(deckList.map(function(d){
        return S.store.getCardsOnce(d.id).then(function(cards){
          var total = cards.length;
          var mastered = cards.filter(function(c){ return (c.reps||0) > 0 && (c.interval||0) >= 4; }).length;
          // Cards are kept on the entry (not just the total/mastered counts) so the per-deck drill-down
          // (renderDeckStats) can build its "topics" breakdown without a second round-trip.
          return { id: d.id, name: d.name, emoji: d.emoji, total: total, mastered: mastered, cards: cards };
        });
      }))
    ]).then(function(results){
      var history = results[0].slice().sort(function(a,b){ return (a.endedAt||0)-(b.endedAt||0); });
      S.statsData = { history: history, perDeck: results[1] };
      if(S.view === 'stats' || S.view === 'deckStats') render();
    });
  }

  // Groups a deck's cards by their optional "Topic" tag and sums each topic's cumulative right/seen
  // counts (tracked on every graded answer in commitGrade). Untagged cards are left out entirely --
  // an "Uncategorized: 100%" row would just be noise, not a useful topic breakdown. Sorted strongest
  // topic first, so a parent can see at a glance what's landed and what still needs practice.
  function categoryBreakdown(cards){
    var buckets = {};
    (cards||[]).forEach(function(c){
      var cat = (c.category||'').trim();
      var seen = c.timesSeen || 0;
      if(!cat || !seen) return;
      if(!buckets[cat]) buckets[cat] = { category: cat, seen: 0, correct: 0 };
      buckets[cat].seen += seen;
      buckets[cat].correct += (c.timesCorrect || 0);
    });
    var rows = Object.keys(buckets).map(function(k){
      var b = buckets[k];
      return { category: b.category, seen: b.seen, correct: b.correct, accuracy: b.seen > 0 ? Math.round((b.correct/b.seen)*100) : 0 };
    });
    rows.sort(function(a,b){ return b.accuracy - a.accuracy; });
    return rows;
  }

  // Aggregates raw per-round history entries into one point per calendar day (summed right/total
  // across every round finished that day), which is what the long-term trend chart plots -- a
  // per-round view gets noisy fast, but a daily view stays readable across weeks or months.
  function aggregateHistoryByDay(history){
    var byDay = {};
    (history||[]).forEach(function(h){
      var d = new Date(h.endedAt || 0);
      var iso = todayISO(d);
      if(!byDay[iso]){
        byDay[iso] = { iso: iso, ts: new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime(), right:0, total:0, rounds:0 };
      }
      byDay[iso].right += h.right || 0;
      byDay[iso].total += h.total || 0;
      byDay[iso].rounds += 1;
    });
    return Object.keys(byDay).map(function(k){ return byDay[k]; }).sort(function(a,b){ return a.ts - b.ts; });
  }

  // Hand-rolled inline SVG line+area chart (no chart library — this app stays a single dependency-
  // free file) showing accuracy by day across the ENTIRE history, not just the most recent rounds.
  // Capped to the most recent 60 days so the chart stays legible once a family has been using the
  // app for a long stretch; older days are still counted in "days of practice" below the chart.
  function renderLongTermTrend(history){
    if(!history || !history.length){
      return '<div class="trend-wrap"><div class="trend-empty">Finish a few rounds to start seeing a long-term trend! 🌊</div></div>';
    }
    var allDays = aggregateHistoryByDay(history);
    var days = allDays.slice(-60);
    var n = days.length;
    var W = 600, H = 160, padL = 30, padR = 10, padT = 10, padB = 4;
    var plotW = W - padL - padR, plotH = H - padT - padB;
    function xAt(i){ return n > 1 ? padL + (i/(n-1))*plotW : padL + plotW/2; }
    function yAt(pct){ return padT + (1 - pct/100) * plotH; }
    var pts = days.map(function(d, i){
      var pct = d.total > 0 ? Math.round((d.right/d.total)*100) : 0;
      return { x: xAt(i), y: yAt(pct), pct: pct, day: d };
    });
    var pathD = pts.map(function(p,i){ return (i===0?'M':'L')+p.x.toFixed(1)+','+p.y.toFixed(1); }).join(' ');
    var areaD = pathD + ' L'+pts[pts.length-1].x.toFixed(1)+','+(padT+plotH)+' L'+pts[0].x.toFixed(1)+','+(padT+plotH)+' Z';
    var gridHTML = [0,50,100].map(function(pct){
      var y = yAt(pct);
      return '<line x1="'+padL+'" y1="'+y.toFixed(1)+'" x2="'+(W-padR)+'" y2="'+y.toFixed(1)+'" stroke="var(--border)" stroke-width="1" stroke-dasharray="3,3"/>' +
        '<text x="2" y="'+(y+3).toFixed(1)+'" font-size="9" fill="var(--ink-soft)">'+pct+'</text>';
    }).join('');
    var ptsHTML = pts.map(function(p){
      var dd = new Date(p.day.ts);
      var label = (dd.getMonth()+1)+'/'+dd.getDate();
      var tip = esc('🗓️ '+label+' — '+p.pct+'% ('+p.day.right+'/'+p.day.total+' across '+p.day.rounds+' round'+(p.day.rounds===1?'':'s')+')');
      return '<circle class="trend-pt" cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="4" tabindex="0" data-tip="'+tip+'"/>';
    }).join('');
    var firstLabel = (function(){ var dd = new Date(days[0].ts); return (dd.getMonth()+1)+'/'+dd.getDate(); })();
    var lastLabel = (function(){ var dd = new Date(days[days.length-1].ts); return (dd.getMonth()+1)+'/'+dd.getDate(); })();
    var noteExtra = allDays.length > days.length ? ' (showing the most recent '+days.length+')' : '';
    return '' +
      '<div class="trend-wrap trend-long">' +
        '<svg class="trend-svg" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" role="img" aria-label="Accuracy by day, over time">' +
          gridHTML +
          '<path d="'+areaD+'" fill="var(--lagoon)" fill-opacity="0.14" stroke="none"/>' +
          '<path d="'+pathD+'" fill="none" stroke="var(--lagoon)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>' +
          ptsHTML +
        '</svg>' +
        (n > 1 ? '<div class="trend-axis"><span>'+firstLabel+'</span><span>'+lastLabel+'</span></div>' : '') +
        '<p class="trend-long-note">🌱 '+allDays.length+' day'+(allDays.length===1?'':'s')+' of practice so far'+noteExtra+'</p>' +
      '</div>';
  }

  // Shared tooltip wiring for both the short-term bar chart and the long-term SVG points -- both
  // kinds of chart mark tell you what they need with a `data-tip` attribute.
  function wireChartTips(){
    var tip = document.getElementById('chartTip');
    if(!tip) return;
    app.querySelectorAll('.trend-bar, .trend-pt').forEach(function(b){
      function show(){
        tip.textContent = b.dataset.tip;
        var r = b.getBoundingClientRect();
        tip.style.left = (r.left + r.width/2) + 'px';
        tip.style.top = r.top + 'px';
        tip.classList.add('show');
      }
      function hide(){ tip.classList.remove('show'); }
      b.addEventListener('mouseenter', show);
      b.addEventListener('mouseleave', hide);
      b.addEventListener('focus', show);
      b.addEventListener('blur', hide);
      b.addEventListener('touchstart', function(){ show(); setTimeout(hide, 1500); }, {passive:true});
    });
  }

  function renderStats(){
    var managing = S.managingDecks;
    var data = S.statsData;
    var allRight = 0, allTotal = 0;
    ((data && data.history) || []).forEach(function(h){ allRight += h.right||0; allTotal += h.total||0; });
    var overallAccuracy = allTotal > 0 ? Math.round((allRight/allTotal)*100) : 0;

    var tilesHTML = '' +
      '<div class="stat-tiles">' +
        '<div class="stat-tile"><div class="num tabular">'+(S.stats.totalReviews||0)+'</div><div class="label">Cards reviewed</div></div>' +
        '<div class="stat-tile"><div class="num tabular">'+overallAccuracy+'%</div><div class="label">Overall accuracy</div></div>' +
        '<div class="stat-tile"><div class="num tabular">'+S.stats.streak+'</div><div class="label">Day streak</div></div>' +
        '<div class="stat-tile"><div class="num tabular">'+S.stats.stars+'</div><div class="label">Stars earned</div></div>' +
      '</div>';

    var masteryHTML;
    if(!data){
      masteryHTML = '<div class="trend-empty">Loading…</div>';
    } else if(!data.perDeck.length){
      masteryHTML = '<div class="trend-empty">No decks yet.</div>';
    } else {
      masteryHTML = '<div class="mastery-list">' + data.perDeck.map(function(d){
        var pct = d.total > 0 ? Math.round((d.mastered / d.total) * 100) : 0;
        return '' +
          '<button type="button" class="mastery-row" data-deck="'+d.id+'">' +
            '<div class="mastery-emoji">'+d.emoji+'</div>' +
            '<div class="mastery-mid">' +
              '<div class="mastery-top"><span>'+esc(d.name)+'</span><span class="pct">'+pct+'% mastered</span></div>' +
              '<div class="mastery-track"><div class="mastery-fill" style="width:'+pct+'%"></div></div>' +
            '</div>' +
            '<span class="mastery-chevron">›</span>' +
          '</button>';
      }).join('') + '</div>';
    }

    var trendHTML, trendCount = 0;
    if(!data){
      trendHTML = '<div class="trend-wrap"><div class="trend-empty">Loading…</div></div>';
    } else if(!data.history.length){
      trendHTML = '<div class="trend-wrap"><div class="trend-empty">Finish a round to start tracking progress! 🌊</div></div>';
    } else {
      var recent = data.history.slice(-12);
      trendCount = recent.length;
      var bars = recent.map(function(h){
        var pct = h.accuracy || 0;
        var barCls = 'trend-bar' + (pct < 60 ? ' low' : '');
        var d = new Date(h.endedAt);
        var dateLabel = (d.getMonth()+1)+'/'+d.getDate();
        var tip = esc((h.deckEmoji||'🌊')+' '+(h.deckName||'Deck')+' — '+h.right+'/'+h.total+' ('+pct+'%) on '+dateLabel);
        return '<div class="trend-bar-col"><div class="'+barCls+'" style="height:'+Math.max(pct,3)+'%" tabindex="0" data-tip="'+tip+'"></div></div>';
      }).join('');
      var firstLabel = (function(){ var dd=new Date(recent[0].endedAt); return (dd.getMonth()+1)+'/'+dd.getDate(); })();
      var lastLabel = (function(){ var dd=new Date(recent[recent.length-1].endedAt); return (dd.getMonth()+1)+'/'+dd.getDate(); })();
      trendHTML = '' +
        '<div class="trend-wrap">' +
          '<div class="trend-bars">'+bars+'</div>' +
          (recent.length > 1 ? '<div class="trend-axis"><span>'+firstLabel+'</span><span>'+lastLabel+'</span></div>' : '') +
        '</div>';
    }

    var longTermHTML = data ? renderLongTermTrend(data.history) : '<div class="trend-wrap"><div class="trend-empty">Loading…</div></div>';

    app.innerHTML = '' +
      '<div class="nav-row">' +
        '<button class="back-btn" data-act="exit-stats">⟵ Lagoon</button>' +
        '<span class="nav-title">📊 '+(managing ? 'Progress Overview' : 'Your Progress')+'</span>' +
      '</div>' +
      '<div class="stats-page">' +
        '<div class="stats-section">'+tilesHTML+'</div>' +
        '<div class="stats-section"><h3>📈 Long-term trend</h3>'+longTermHTML+'</div>' +
        '<div class="stats-section"><h3>🎯 Recent rounds — last '+trendCount+'</h3>'+trendHTML+'</div>' +
        '<div class="stats-section"><h3>🐢 Deck mastery</h3>'+masteryHTML+'<p class="mastery-hint">Tap a deck to see which topics it knows best.</p></div>' +
      '</div>' +
      '<div class="chart-tip" id="chartTip"></div>';

    app.querySelector('[data-act="exit-stats"]').addEventListener('click', goHome);
    app.querySelectorAll('.mastery-row').forEach(function(b){
      b.addEventListener('click', function(){
        S.statsDeckId = b.dataset.deck;
        S.view = 'deckStats';
        render();
      });
    });
    wireChartTips();
  }

  /* ---------- DECK PROGRESS DRILL-DOWN (tap a deck in the mastery list) ---------- */
  function renderDeckStats(){
    var data = S.statsData;
    if(!data){ openStats(); return; } // shouldn't normally happen -- guards against a stale view after e.g. a reload
    var deckEntry = data.perDeck.find(function(d){ return d.id === S.statsDeckId; });
    if(!deckEntry){ S.view = 'stats'; render(); return; } // deck was deleted since the list loaded
    var deckHistory = data.history.filter(function(h){ return h.deckId === S.statsDeckId; });
    var right = 0, total = 0;
    deckHistory.forEach(function(h){ right += h.right||0; total += h.total||0; });
    var accuracy = total > 0 ? Math.round((right/total)*100) : 0;
    var pctMastered = deckEntry.total > 0 ? Math.round((deckEntry.mastered/deckEntry.total)*100) : 0;

    var tilesHTML = '' +
      '<div class="stat-tiles">' +
        '<div class="stat-tile"><div class="num tabular">'+deckEntry.total+'</div><div class="label">Cards</div></div>' +
        '<div class="stat-tile"><div class="num tabular">'+pctMastered+'%</div><div class="label">Mastered</div></div>' +
        '<div class="stat-tile"><div class="num tabular">'+accuracy+'%</div><div class="label">Accuracy</div></div>' +
        '<div class="stat-tile"><div class="num tabular">'+deckHistory.length+'</div><div class="label">Rounds played</div></div>' +
      '</div>';

    var longTermHTML = renderLongTermTrend(deckHistory);

    var catRows = categoryBreakdown(deckEntry.cards);
    var catHTML;
    if(!catRows.length){
      catHTML = '<div class="trend-empty">Tag this deck\'s cards with a Topic (in the deck editor) to see which topics are strongest here.</div>';
    } else {
      catHTML = '<div class="cat-list">' + catRows.map(function(r, i){
        var barCls = 'cat-fill' + (r.accuracy < 60 ? ' low' : (r.accuracy >= 85 ? ' high' : ''));
        var tag = '';
        if(catRows.length > 1){
          if(i === 0 && r.accuracy >= 70) tag = '<span class="cat-tag strong">💪 Strongest</span>';
          else if(i === catRows.length-1 && r.accuracy < 70) tag = '<span class="cat-tag weak">🎯 Needs practice</span>';
        }
        return '' +
          '<div class="cat-row">' +
            '<div class="cat-top"><span>'+esc(r.category)+'</span>'+tag+'<span class="pct">'+r.accuracy+'%</span></div>' +
            '<div class="cat-track"><div class="'+barCls+'" style="width:'+r.accuracy+'%"></div></div>' +
            '<div class="cat-meta">'+r.correct+' / '+r.seen+' correct answers</div>' +
          '</div>';
      }).join('') + '</div>';
    }

    app.innerHTML = '' +
      '<div class="nav-row">' +
        '<button class="back-btn" data-act="back-to-stats">⟵ Progress</button>' +
        '<span class="nav-title">'+deckEntry.emoji+' '+esc(deckEntry.name)+'</span>' +
      '</div>' +
      '<div class="stats-page">' +
        '<div class="stats-section">'+tilesHTML+'</div>' +
        '<div class="stats-section"><h3>📈 Long-term trend</h3>'+longTermHTML+'</div>' +
        '<div class="stats-section"><h3>🧩 Topics</h3>'+catHTML+'</div>' +
      '</div>' +
      '<div class="chart-tip" id="chartTip"></div>';

    app.querySelector('[data-act="back-to-stats"]').addEventListener('click', function(){ S.view = 'stats'; render(); });
    wireChartTips();
  }

  /* ---------- SETTINGS (parent-only, app-wide: difficulty + scheduling algorithm) ---------- */

    var currentDiff = S.settings.difficulty || 'medium';
    var diffOptsHTML = DIFFICULTIES.map(function(d){
      return '' +
        '<button type="button" class="algo-opt'+(d.id===currentDiff?' active':'')+'" data-diff="'+d.id+'">' +
          '<span class="algo-name">'+d.icon+' '+d.name+(d.id===currentDiff?' <span class="algo-current">— current</span>':'')+'</span>' +
          '<span class="algo-blurb">'+d.blurb+'</span>' +
        '</button>';
    }).join('');

    var currentAlgo = S.settings.algorithm || 'sm2_speed';
    var algoOptsHTML = ALGORITHMS.map(function(a){
      return '' +
        '<button type="button" class="algo-opt'+(a.id===currentAlgo?' active':'')+'" data-algo="'+a.id+'">' +
          '<span class="algo-name">'+a.icon+' '+a.name+(a.id===currentAlgo?' <span class="algo-current">— current</span>':'')+'</span>' +
          '<span class="algo-blurb">'+a.blurb+'</span>' +
        '</button>';
    }).join('');

    app.innerHTML = '' +
      '<div class="nav-row">' +
        '<button class="back-btn" data-act="exit-settings">⟵ Lagoon</button>' +
        '<span class="nav-title">⚙️ Settings</span>' +
      '</div>' +
      '<div class="stats-page">' +
        '<div class="stats-section">' +
          '<h3>🎯 Study difficulty</h3>' +
          '<div class="algo-toggle">'+diffOptsHTML+'</div>' +
          '<p class="algo-note">Changes round length and how far apart reviews get spaced right away. Applies to every deck.</p>' +
        '</div>' +
        '<div class="stats-section">' +
          '<h3>⚙️ Scheduling algorithm</h3>' +
          '<div class="algo-toggle">'+algoOptsHTML+'</div>' +
          '<p class="algo-note">This applies to every deck too. Switching only changes how future answers are scheduled — cards already due keep their current date.</p>' +
        '</div>' +
      '</div>';

    app.querySelector('[data-act="exit-settings"]').addEventListener('click', goHome);
    app.querySelectorAll('[data-diff]').forEach(function(b){
      b.addEventListener('click', function(){
        var id = b.dataset.diff;
        if(id === currentDiff) return;
        var newSettings = Object.assign({}, S.settings, { difficulty: id });
        S.settings = newSettings;
        S.store.setSettings(newSettings);

    });
    app.querySelectorAll('[data-algo]').forEach(function(b){
      b.addEventListener('click', function(){
        var id = b.dataset.algo;
        if(id === currentAlgo) return;

        S.store.setSettings(newSettings);

  /* ---------- EDITOR ---------- */
  function openEditor(deckId, focusName){
    // Adult Mode never asks for the PIN, so a deck can only be opened for editing from inside it.
    if(S.managingDecks){ openEditorUnlocked(deckId, focusName); return; }
    // Defensive fallback in case this is ever reached outside manager mode.
    S.pendingEdit = { deckId: deckId, focusName: focusName };
    S.pinInput = ''; S.pinError = ''; S.pinShake = false;
    S.pinPromptFor = 'edit';
    render();
  }

  function openEditorUnlocked(deckId, focusName){
    S.currentDeckId = deckId;
    S.store.updateDeck(deckId, { lastOpenedAt: Date.now() }); // drives the Manage Decks "most recently opened" order
    S.view = 'editor';
    S.emojiPickerOpen = false;
    S.addCardOpen = false;
    S.editingCardId = null;
    S.cardFormDraft = null;
    S.cardFormMode = 'flip';
    if(S.unsubCards) S.unsubCards();
    S.editorCards = [];
    S.unsubCards = S.store.listenCards(deckId, function(cards){
      S.editorCards = cards.sort(function(a,b){ return (a.createdAt||0)-(b.createdAt||0); });
      if(S.view === 'editor') render();
    });
    render();
    if(focusName){ setTimeout(function(){ var el = document.getElementById('deckNameInput'); if(el){ el.focus(); el.select(); } }, 0); }
  }

  function renderEditor(){
    var deck = S.decks.find(function(d){ return d.id === S.currentDeckId; });
    if(!deck){ goHome(); return; }
    var cards = S.editorCards || [];

    var rows = cards.length ? cards.map(function(c){
      var isReadRow = c.mode === 'read';
      var isChoiceRow = c.mode === 'choice';
      var modeTag = (isReadRow ? '<span class="mode-tag mode-tag-read">📖 Read</span>' : (isChoiceRow ? '<span class="mode-tag mode-tag-choice">🔢 Choice</span>' : '<span class="mode-tag">🔄 Flip</span>')) +
        (c.category ? ' <span class="mode-tag mode-tag-category">🏷️ '+esc(c.category)+'</span>' : '') +
        (c.isLeech ? ' <span class="mode-tag mode-tag-leech">🔁 Needs practice</span>' : '');
      var backLine = isReadRow ? (c.note ? esc(c.note) : 'No answer side — just for reading aloud') :
        (isChoiceRow ? (esc(c.back)+' · '+(c.choices||[]).length+' wrong answer'+((c.choices||[]).length===1?'':'s')) :
        (esc(c.back)+(c.note?' · '+esc(c.note):'')));
      return '' +
      '<div class="card-row">' +
        (c.photoUrl ? '<div class="cr-thumb"><img src="'+esc(c.photoUrl)+'" alt=""></div>' : '') +
        '<div class="cr-text">' +
          '<div class="cr-front">'+esc(c.front)+' '+modeTag+'</div>' +
          '<div class="cr-back">'+backLine+'</div>' +
        '</div>' +
        '<div class="cr-actions">' +
          '<button class="icon-btn" data-act="edit-card" data-card="'+c.id+'" aria-label="Edit card">✏️</button>' +
          '<button class="icon-btn" data-act="del-card" data-card="'+c.id+'" aria-label="Delete card">🗑️</button>' +
        '</div>' +
      '</div>';
    }).join('') : '<div class="empty-state">No cards yet — add the first one below! 🐚</div>';

    var emojiPicker = S.emojiPickerOpen ? ('<div class="emoji-popover">' + DECK_EMOJI.map(function(e){
      return '<button class="emoji-opt" data-emoji="'+e+'">'+e+'</button>';
    }).join('') + '</div>') : '';

    var editingCard = S.editingCardId ? cards.find(function(c){ return c.id === S.editingCardId; }) : null;
    var formTitle = editingCard ? 'Edit card' : 'Add a new card';
    var draft = S.cardFormDraft || { front:'', back:'', note:'', choices:'', category:'', photoId:'', photoUrl:'' };
    var fFront = draft.front; var fBack = draft.back; var fNote = draft.note; var fChoices = draft.choices || ''; var fCategory = draft.category || '';
    var fPhotoUrl = draft.photoUrl || '';
    var formMode = S.cardFormMode || 'flip';
    var isReadMode = formMode === 'read';
    var isChoiceMode = formMode === 'choice';

    var photoFieldHTML;
    if(S.photoUploading){
      photoFieldHTML = '<div class="field"><label>Photo (optional)</label><div class="photo-field-wrap"><span class="photo-uploading-note">📤 Uploading…</span></div></div>';
    } else if(S.assetsAvailable){
      photoFieldHTML = '' +
        '<div class="field"><label>Photo (optional, shown with the question)</label>' +
          '<div class="photo-field-wrap">' +
            (fPhotoUrl ? '<img class="photo-preview" src="'+esc(fPhotoUrl)+'" alt="">' : '') +
            '<div class="photo-field-actions">' +
              '<button type="button" class="btn btn-ghost" data-act="'+(fPhotoUrl?'replace-photo':'add-photo')+'">'+(fPhotoUrl?'🔄 Replace photo':'🖼️ Add a photo')+'</button>' +
              (fPhotoUrl ? '<button type="button" class="btn btn-ghost" data-act="remove-photo">Remove</button>' : '') +
            '</div>' +
          '</div>' +
          '<input type="file" id="cardPhotoInput" accept="image/*" style="display:none">' +
        '</div>';
    } else {
      photoFieldHTML = fPhotoUrl
        ? '<div class="field"><label>Photo</label><div class="photo-field-wrap"><img class="photo-preview" src="'+esc(fPhotoUrl)+'" alt=""><span class="photo-uploading-note">Photos can only be added or changed from the live app.</span></div></div>'
        : '<div class="field"><label>Photo</label><p class="algo-note">Photos can be added from the live app (not this offline copy).</p></div>';
    }

    var addForm = (S.addCardOpen || editingCard) ? ('' +
      '<div class="form-card">' +
        '<h3>'+formTitle+'</h3>' +
        '<div class="mode-toggle">' +
          '<button type="button" class="mode-opt '+(formMode==='flip'?'active':'')+'" data-mode="flip">🔄 Flip card<span class="mode-sub">question → answer</span></button>' +
          '<button type="button" class="mode-opt '+(formMode==='read'?'active':'')+'" data-mode="read">📖 Just read it<span class="mode-sub">no answer side</span></button>' +
          '<button type="button" class="mode-opt '+(formMode==='choice'?'active':'')+'" data-mode="choice">🔢 Multiple choice<span class="mode-sub">pick the answer</span></button>' +
        '</div>' +
        '<div class="field"><label for="cardFront">'+(isReadMode?'Word or phrase to read':'Front (question / word)')+'</label><input id="cardFront" type="text" value="'+esc(fFront)+'" placeholder="'+(isReadMode?'e.g. octopus':'e.g. 6 + 7  or  because')+'"></div>' +
        photoFieldHTML +
        (isReadMode ? '' : '<div class="field"><label for="cardBack">'+(isChoiceMode?'Correct answer':'Back (answer)')+'</label><input id="cardBack" type="text" value="'+esc(fBack)+'" placeholder="e.g. 13  or  a sentence"></div>') +
        (isChoiceMode ? '<div class="field"><label for="cardChoices">Wrong answers (comma-separated)</label><input id="cardChoices" type="text" value="'+esc(fChoices)+'" placeholder="e.g. 11, 12, 14"></div>' : '') +
        '<div class="field"><label for="cardNote">'+(isReadMode?'Hint (optional, shown small under the word)':'Fun fact / hint (optional)')+'</label><textarea id="cardNote" rows="2" placeholder="'+(isReadMode?'e.g. sounds like OCK-tuh-puss':'e.g. 6 crabs + 7 crabs = 13 crabs!')+'">'+esc(fNote)+'</textarea></div>' +
        '<div class="field"><label for="cardCategory">Topic (optional — groups cards in Progress, e.g. Addition, Sight words)</label><input id="cardCategory" type="text" maxlength="24" value="'+esc(fCategory)+'" placeholder="e.g. Addition"></div>' +
        '<div class="form-actions">' +
          '<button class="btn btn-primary" data-act="save-card">'+(editingCard?'Save changes':'Add card')+'</button>' +
          '<button class="btn btn-ghost" data-act="cancel-card">Cancel</button>' +
        '</div>' +
      '</div>') : '<button class="btn btn-coral" data-act="open-add-card">＋ Add a card</button>';

    var currentSubject = deck.subject || '';
    var subjectIsCustom = !!(currentSubject && !SUBJECTS.some(function(s){ return s.id === currentSubject; }));
    var subjectChipsHTML = '<button type="button" class="subject-chip'+(!currentSubject?' active':'')+'" data-subject-chip="">🚫 None</button>' +
      SUBJECTS.map(function(s){
        return '<button type="button" class="subject-chip'+(currentSubject===s.id?' active':'')+'" data-subject-chip="'+s.id+'">'+s.icon+' '+s.label+'</button>';
      }).join('');

    app.innerHTML = '' +
      errorBannerHTML() +
      '<div class="nav-row">' +
        '<button class="back-btn" data-act="exit-editor">⟵ Lagoon</button>' +
        ctrlRowHTML() +
      '</div>' +
      '<div class="editor-head">' +
        '<button class="emoji-btn" data-act="toggle-emoji">'+deck.emoji+'</button>' +
        '<input id="deckNameInput" class="name-input" type="text" value="'+esc(deck.name)+'" maxlength="40">' +
      '</div>' +
      emojiPicker +
      '<div class="subject-picker">' +
        '<label class="subject-picker-label">Subject</label>' +
        '<div class="subject-chip-row">'+subjectChipsHTML+'</div>' +
        '<input id="customSubjectInput" class="subject-custom-input" type="text" maxlength="24" placeholder="Or type your own, e.g. Spanish" value="'+(subjectIsCustom?esc(currentSubject):'')+'">' +
        '<p class="subject-picker-hint">Groups this deck under a tab on the deck screen, like Reading or Math.</p>' +
      '</div>' +
      '<div class="card-list">'+rows+'</div>' +
      addForm +
      '<div class="danger-zone"><button class="btn btn-danger" data-act="del-deck">Delete this deck</button></div>';

    app.querySelector('[data-act="exit-editor"]').addEventListener('click', function(){
      S.editingCardId = null;
      S.cardFormDraft = null;
      goHome();
    });
    wireCtrlRow();
    wireErrorBanner();
    app.querySelector('[data-act="toggle-emoji"]').addEventListener('click', function(){ S.emojiPickerOpen = !S.emojiPickerOpen; render(); });
    app.querySelectorAll('.emoji-opt').forEach(function(b){
      b.addEventListener('click', function(){
        S.store.updateDeck(deck.id, { emoji: b.dataset.emoji });
        S.emojiPickerOpen = false;
        render();
      });
    });
    var nameInput = document.getElementById('deckNameInput');
    nameInput.addEventListener('change', function(){
      var val = nameInput.value.trim() || 'Untitled Deck';
      S.store.updateDeck(deck.id, { name: val });
    });
    app.querySelectorAll('[data-subject-chip]').forEach(function(b){
      b.addEventListener('click', function(){
        var val = b.dataset.subjectChip;
        if(val === currentSubject) return;
        S.store.updateDeck(deck.id, { subject: val ? val : null });
        render();
      });
    });
    var customSubjectInput = document.getElementById('customSubjectInput');
    if(customSubjectInput) customSubjectInput.addEventListener('change', function(){
      var val = customSubjectInput.value.trim();
      S.store.updateDeck(deck.id, { subject: val ? val : null });
      render();
    });
    app.querySelectorAll('[data-act="edit-card"]').forEach(function(b){
      b.addEventListener('click', function(){
        var c = cards.find(function(x){ return x.id === b.dataset.card; });
        S.editingCardId = b.dataset.card;
        S.addCardOpen = false;
        S.cardFormMode = (c && c.mode === 'read') ? 'read' : ((c && c.mode === 'choice') ? 'choice' : 'flip');
        S.cardFormDraft = { front: c ? c.front : '', back: c ? (c.back||'') : '', note: c ? (c.note||'') : '', choices: c ? (c.choices||[]).join(', ') : '', category: c ? (c.category||'') : '', photoId: c ? (c.photoId||'') : '', photoUrl: c ? (c.photoUrl||'') : '' };
        S.cardFormOriginalPhotoId = c ? (c.photoId||'') : '';
        render();
      });
    });
    app.querySelectorAll('[data-act="del-card"]').forEach(function(b){
      b.addEventListener('click', function(){
        var c = cards.find(function(x){ return x.id === b.dataset.card; });
        var photoId = c && c.photoId;
        S.store.deleteCard(deck.id, b.dataset.card).then(function(){ if(photoId) Assets.remove(photoId); });
      });
    });
    var openAdd = app.querySelector('[data-act="open-add-card"]');
    if(openAdd) openAdd.addEventListener('click', function(){
      S.addCardOpen = true; S.editingCardId = null; S.cardFormMode = 'flip'; S.cardFormDraft = { front:'', back:'', note:'', choices:'', category:'', photoId:'', photoUrl:'' };
      S.cardFormOriginalPhotoId = '';
      render();
      setTimeout(function(){ var el=document.getElementById('cardFront'); if(el) el.focus(); },0);
    });
    var cancelBtn = app.querySelector('[data-act="cancel-card"]');
    if(cancelBtn) cancelBtn.addEventListener('click', function(){
      // A photo picked during this add/edit session that was never actually saved onto the card
      // is now an orphan -- clean it up. The card's ORIGINAL photo (if any) is left untouched.
      var draftPhotoId = S.cardFormDraft ? S.cardFormDraft.photoId : '';
      if(draftPhotoId && draftPhotoId !== S.cardFormOriginalPhotoId) Assets.remove(draftPhotoId);
      S.addCardOpen = false; S.editingCardId = null; S.cardFormDraft = null; S.cardFormOriginalPhotoId = ''; render();
    });
    app.querySelectorAll('[data-mode]').forEach(function(b){
      b.addEventListener('click', function(){
        var frontEl = document.getElementById('cardFront');
        var backEl = document.getElementById('cardBack');
        var noteEl = document.getElementById('cardNote');
        var choicesEl = document.getElementById('cardChoices');
        var categoryEl = document.getElementById('cardCategory');
        S.cardFormDraft = {
          front: frontEl ? frontEl.value : (draft.front||''),
          back: backEl ? backEl.value : (draft.back||''),
          note: noteEl ? noteEl.value : (draft.note||''),
          choices: choicesEl ? choicesEl.value : (draft.choices||''),
          category: categoryEl ? categoryEl.value : (draft.category||''),
          photoId: draft.photoId || '',
          photoUrl: draft.photoUrl || ''
        };
        S.cardFormMode = b.dataset.mode;
        render();
      });
    });
    function pickPhoto(){
      var input = document.getElementById('cardPhotoInput');
      if(input) input.click();
    }
    var addPhotoBtn = app.querySelector('[data-act="add-photo"]');
    if(addPhotoBtn) addPhotoBtn.addEventListener('click', pickPhoto);
    var replacePhotoBtn = app.querySelector('[data-act="replace-photo"]');
    if(replacePhotoBtn) replacePhotoBtn.addEventListener('click', pickPhoto);
    var removePhotoBtn = app.querySelector('[data-act="remove-photo"]');
    if(removePhotoBtn) removePhotoBtn.addEventListener('click', function(){
      var removedId = S.cardFormDraft ? S.cardFormDraft.photoId : '';
      S.cardFormDraft = Object.assign({}, draft, { photoId:'', photoUrl:'' });
      render();
      // Only an unsaved-this-session upload is safe to delete immediately -- if it's the card's
      // original saved photo, it stays valid until Save actually commits the removal.
      if(removedId && removedId !== S.cardFormOriginalPhotoId) Assets.remove(removedId);
    });
    var photoInput = document.getElementById('cardPhotoInput');
    if(photoInput) photoInput.addEventListener('change', function(){
      var file = photoInput.files && photoInput.files[0];
      if(!file) return;
      var priorDraftPhotoId = S.cardFormDraft ? S.cardFormDraft.photoId : '';
      S.photoUploading = true;
      render();
      downscalePhoto(file, 1600).then(function(blob){
        return Assets.upload(blob);
      }).then(function(res){
        S.cardFormDraft = Object.assign({}, draft, { photoId: res.id, photoUrl: res.url });
        S.photoUploading = false;
        render();
        // An earlier unsaved upload from this same form session, now superseded, is a clean orphan.
        if(priorDraftPhotoId && priorDraftPhotoId !== S.cardFormOriginalPhotoId) Assets.remove(priorDraftPhotoId);
      }).catch(function(err){
        console.error('[Coral Cove] photo upload failed', err);
        S.photoUploading = false;
        S.storeError = 'That photo didn\'t upload. Check your connection and try again.';
        render();
      });
    });
    var saveBtn = app.querySelector('[data-act="save-card"]');
    if(saveBtn) saveBtn.addEventListener('click', function(){
      var front = document.getElementById('cardFront').value.trim();
      var backEl = document.getElementById('cardBack');
      var back = backEl ? backEl.value.trim() : '';
      var note = document.getElementById('cardNote').value.trim();
      var choicesEl = document.getElementById('cardChoices');
      var choicesArr = choicesEl ? choicesEl.value.split(',').map(function(s){ return s.trim(); }).filter(Boolean) : [];
      var category = document.getElementById('cardCategory').value.trim();
      var mode = S.cardFormMode || 'flip';
      if(!front) return;
      if((mode === 'flip' || mode === 'choice') && !back) return;
      if(mode === 'choice' && choicesArr.length < 1) return;
      var photoId = draft.photoId || '';
      var photoUrl = draft.photoUrl || '';
      var payload = { front: front, back: back, note: note, mode: mode, choices: mode === 'choice' ? choicesArr : [], category: category, photoId: photoId, photoUrl: photoUrl };
      var origPhotoId = S.cardFormOriginalPhotoId;
      var savePromise;
      if(editingCard){
        savePromise = S.store.updateCard(deck.id, editingCard.id, payload);
        S.editingCardId = null;
      } else {
        savePromise = S.store.addCard(deck.id, payload);
        S.addCardOpen = false;
      }
      // Only once the save actually succeeds is the old photo (if replaced or removed) safe to
      // clean up -- if the save failed, the card still points at it and it must stay valid.
      if(origPhotoId && origPhotoId !== photoId){
        savePromise.then(function(){ Assets.remove(origPhotoId); }).catch(function(){});
      }
      S.cardFormDraft = null;
      S.cardFormOriginalPhotoId = '';
      render();
    });
    var delDeckBtn = app.querySelector('[data-act="del-deck"]');
    if(delDeckBtn) delDeckBtn.addEventListener('click', function(){
      if(confirm('Delete "'+deck.name+'" and all its cards? This can\'t be undone.')){
        var photoIds = cards.map(function(c){ return c.photoId; }).filter(Boolean);
        S.store.deleteDeck(deck.id).then(function(){
          photoIds.forEach(function(id){ Assets.remove(id); });
          goHome();
        });
      }
    });
  }

  /* ============ generic tap sound (delegated, covers every button not already voiced) ============ */
  document.addEventListener('click', function(e){
    var btn = e.target && e.target.closest ? e.target.closest('button') : null;
    if(!btn) return;
    if(btn.hasAttribute('data-outcome') || btn.hasAttribute('data-rating') || btn.hasAttribute('data-choice-idx') || btn.hasAttribute('data-digit')) return;
    if(btn.dataset.act === 'pin-back') return;
    Sound.tap();
  }, true);

  /* ============ boot ============ */
  // The PIN is baked in as a fixed 3207 -- there's no "create your PIN" setup screen anymore.
  // If the stored settings don't already carry that PIN's hash (fresh app, or a PIN set before
  // this change), it's forced to 3207 and re-saved right away so it stays that way from then on.
  var BAKED_PIN_HASH = pinHash('3207');
  store.init().then(function(s){
    S.store = s;
    Promise.all([S.store.getStats(), S.store.getSettings()]).then(function(results){
      S.stats = results[0];
      S.settings = Object.assign({ algorithm: 'sm2_speed', difficulty: 'medium' }, S.settings, results[1] || {});
      S.sessionActive = false; // always locked at launch — a grown-up must start each session
      S.view = 'home';
      if(S.settings.pinHash !== BAKED_PIN_HASH){
        S.settings = Object.assign({}, S.settings, { pinHash: BAKED_PIN_HASH });
        S.store.setSettings(S.settings);
      }
      S.booted = true;
      refreshDueCounts().then(render);
    });
    subscribeDecks();
  });
  // Independent of the main boot chain above -- photo upload should light up whenever it resolves
  // rather than holding up the rest of the app, and it's fine for it to arrive a beat later.
  Assets.init().then(function(){
    S.assetsAvailable = Assets.available();
    if(S.booted && S.view === 'editor') render();
  });
})();
</script>
