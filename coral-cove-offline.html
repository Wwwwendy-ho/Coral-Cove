<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800;900&display=swap">
<style>
  :root{
    --deep:#0a3d4a; --deep-2:#0d5262; --lagoon:#1c8c93; --lagoon-light:#4fb3ba;
    --foam:#f4fbf9; --foam-2:#e7f4f1; --coral:#ff7a5c; --coral-dark:#e8593c;
    --sun:#ffc94d; --sun-dark:#e8a716; --seaweed:#2f6d5c;
    --ink:#0b2b33; --ink-soft:#4a6a70;
    --surface:#ffffff; --border:#d3ece6;
    --shadow:0 10px 26px rgba(10,61,74,.14);
    --shadow-sm:0 4px 12px rgba(10,61,74,.10);
    --r-lg:28px; --r-md:18px; --r-sm:12px;
    --ok-bg:#eafaf3; --ok-ink:#1f7a5c; --bad-bg:#fdeceb; --bad-ink:#c65b46;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --foam:#07232a; --foam-2:#0c2e36; --surface:#0f3942; --border:#17515f;
      --ink:#eaf6f4; --ink-soft:#a9cbc7; --lagoon-light:#5fc2c9; --seaweed:#74d1b3;
      --shadow:0 10px 26px rgba(0,0,0,.45); --shadow-sm:0 4px 12px rgba(0,0,0,.35);
      --ok-bg:#123b2d; --ok-ink:#74d1b3; --bad-bg:#3a1f1a; --bad-ink:#ff8a72;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --foam:#07232a; --foam-2:#0c2e36; --surface:#0f3942; --border:#17515f;
    --ink:#eaf6f4; --ink-soft:#a9cbc7; --lagoon-light:#5fc2c9; --seaweed:#74d1b3;
    --shadow:0 10px 26px rgba(0,0,0,.45); --shadow-sm:0 4px 12px rgba(0,0,0,.35);
    --ok-bg:#123b2d; --ok-ink:#74d1b3; --bad-bg:#3a1f1a; --bad-ink:#ff8a72;
    color-scheme: dark;
  }

  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--foam); color:var(--ink);
    font-family:'Nunito',system-ui,-apple-system,sans-serif;
    min-height:100%;
    padding-inline: max(16px, env(safe-area-inset-left,0px)) max(16px, env(safe-area-inset-right,0px));
  }
  html,body{height:100%;}
  h1,h2,h3,.display{ font-family:'Baloo 2', system-ui, sans-serif; text-wrap:balance; }
  button{ font-family:inherit; }
  .tabular{ font-variant-numeric: tabular-nums; }
  [hidden]{ display:none !important; }
  a{ color:inherit; }

  #app{ max-width:760px; margin:0 auto; padding-block:20px 40px; position:relative; }

  /* ---------- top bar / stats ---------- */
  .topbar{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:18px; flex-wrap:wrap; }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand-title{ font-size:1.7rem; font-weight:800; color:var(--deep); margin:0; }
  :root:not([data-theme="light"]) .brand-title{ }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .brand-title{ color:var(--lagoon-light);} }
  :root[data-theme="dark"] .brand-title{ color:var(--lagoon-light); }
  .brand-tag{ margin:0; font-size:.85rem; color:var(--ink-soft); font-weight:600; }

  .stats-row{ display:flex; gap:8px; }
  .pill{
    display:flex; align-items:center; gap:6px; background:var(--surface); border:1px solid var(--border);
    padding:8px 12px; border-radius:999px; font-weight:800; font-size:.95rem; box-shadow:var(--shadow-sm);
  }
  .pill .icon{ font-size:1.05rem; }
  .pill.streak{ color:var(--coral-dark); }
  .pill.stars{ color:var(--sun-dark); }

  /* ---------- back nav ---------- */
  .nav-row{ display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  .back-btn{
    display:flex; align-items:center; gap:6px; background:var(--surface); border:1px solid var(--border);
    color:var(--ink); font-weight:800; padding:9px 14px 9px 10px; border-radius:999px; cursor:pointer; box-shadow:var(--shadow-sm);
  }
  .back-btn:hover{ background:var(--foam-2); }
  .nav-title{ font-weight:800; font-size:1.25rem; color:var(--deep); }
  :root[data-theme="dark"] .nav-title, @media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .nav-title{color:var(--lagoon-light);}}

  /* ---------- mascot ---------- */
  .mascot-wrap{ display:flex; justify-content:center; margin: 6px 0 10px; }
  .mascot{ width:104px; height:104px; animation: bob 3.2s ease-in-out infinite; filter: drop-shadow(0 6px 10px rgba(10,61,74,.18)); }
  .mascot.big{ width:150px; height:150px; }
  .mascot.celebrate{ animation: wiggle .6s ease-in-out 2; }
  @keyframes bob{ 0%,100%{ transform: translateY(0) rotate(-2deg);} 50%{ transform: translateY(-8px) rotate(2deg);} }
  @keyframes wiggle{ 0%,100%{ transform: rotate(0) scale(1);} 25%{ transform: rotate(-8deg) scale(1.05);} 75%{ transform: rotate(8deg) scale(1.05);} }
  @media (prefers-reduced-motion: reduce){ .mascot, .mascot.celebrate{ animation:none; } }

  /* ---------- decorative bubbles ---------- */
  .bubbles{ position:absolute; inset:0; overflow:hidden; pointer-events:none; z-index:0; border-radius:inherit; }
  .bubble{ position:absolute; bottom:-40px; border-radius:50%; background:radial-gradient(circle at 30% 30%, rgba(255,255,255,.85), rgba(255,255,255,.05) 70%); opacity:.5; animation: rise linear infinite; }
  @keyframes rise{ 0%{ transform:translateY(0); opacity:.55;} 90%{opacity:.35;} 100%{ transform:translateY(-380px); opacity:0; } }
  @media (prefers-reduced-motion: reduce){ .bubble{ animation:none; display:none; } }

  /* ---------- banner ---------- */
  .banner{
    background:var(--sun); color:#4a3300; font-weight:700; font-size:.88rem;
    padding:10px 14px; border-radius:var(--r-sm); margin-bottom:16px; box-shadow:var(--shadow-sm);
  }

  /* ---------- deck grid ---------- */
  .deck-grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(210px,1fr)); gap:14px; }
  .deck-card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg);
    padding:18px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:10px;
    position:relative; overflow:hidden;
  }
  .deck-emoji{ font-size:2.4rem; line-height:1; }
  .deck-name{ font-family:'Baloo 2',sans-serif; font-weight:700; font-size:1.15rem; margin:0; color:var(--deep); }
  :root[data-theme="dark"] .deck-name{ color:var(--lagoon-light); }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .deck-name{ color:var(--lagoon-light);} }
  .deck-meta{ font-size:.85rem; color:var(--ink-soft); font-weight:700; }
  .deck-badge{
    align-self:flex-start; font-size:.78rem; font-weight:800; padding:4px 10px; border-radius:999px;
    background:var(--foam-2); color:var(--seaweed);
  }
  .deck-badge.due{ background:var(--coral); color:#fff; }
  .deck-actions{ display:flex; gap:8px; margin-top:auto; }
  .btn{
    border:none; border-radius:999px; font-weight:800; cursor:pointer; padding:10px 16px; font-size:.92rem;
    transition: transform .12s ease;
  }
  .btn:active{ transform: scale(.96); }
  .btn:focus-visible, .back-btn:focus-visible, .icon-btn:focus-visible, input:focus-visible, textarea:focus-visible{
    outline: 3px solid var(--sun-dark); outline-offset: 2px;
  }
  .btn-primary{ background:var(--lagoon); color:#fff; box-shadow:0 4px 0 var(--deep); }
  .btn-primary:active{ box-shadow:0 2px 0 var(--deep); transform: translateY(2px) scale(.98); }
  .btn-ghost{ background:var(--foam-2); color:var(--ink); }
  .btn-coral{ background:var(--coral); color:#fff; box-shadow:0 4px 0 var(--coral-dark); }
  .btn-coral:active{ box-shadow:0 2px 0 var(--coral-dark); transform: translateY(2px) scale(.98); }
  .icon-btn{ background:var(--foam-2); border:none; width:38px; height:38px; border-radius:50%; cursor:pointer; font-size:1rem; }
  .icon-btn:hover{ background:var(--border); }

  .add-deck-card{
    background:transparent; border:2px dashed var(--border); border-radius:var(--r-lg); min-height:150px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; cursor:pointer; color:var(--ink-soft);
    font-weight:800; font-family:'Baloo 2',sans-serif;
  }
  .add-deck-card:hover{ border-color:var(--lagoon-light); color:var(--lagoon); }
  .add-deck-card .plus{ font-size:1.8rem; }

  /* ---------- study ---------- */
  .progress-track{ display:flex; gap:6px; justify-content:center; margin:6px 0 18px; flex-wrap:wrap; }
  .dot{ width:10px; height:10px; border-radius:50%; background:var(--border); }
  .dot.done{ background:var(--seaweed); }
  .dot.current{ background:var(--coral); transform:scale(1.3); }

  .stage{ position:relative; min-height:320px; border-radius:var(--r-lg); background:linear-gradient(180deg, var(--foam-2), var(--foam)); border:1px solid var(--border); padding:26px 16px 30px; }

  .flip-scene{ perspective: 1200px; width:min(100%,420px); margin:0 auto; }
  .flip-card{ position:relative; width:100%; min-height:220px; transform-style:preserve-3d; transition: transform .5s cubic-bezier(.4,.2,.2,1); cursor:pointer; }
  .flip-card.flipped{ transform: rotateY(180deg); }
  .face{
    position:absolute; inset:0; backface-visibility:hidden; border-radius:var(--r-md); background:var(--surface);
    box-shadow:var(--shadow); display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:26px 20px; text-align:center; gap:10px; border:1px solid var(--border);
  }
  .face-back{ transform: rotateY(180deg); background:var(--deep); color:#fff; border-color:var(--deep); }
  .face-front .card-text{ font-family:'Baloo 2',sans-serif; font-weight:700; font-size:1.7rem; color:var(--ink); }
  .face-back .card-text{ font-family:'Baloo 2',sans-serif; font-weight:700; font-size:1.5rem; }
  .card-note{ font-size:.95rem; opacity:.85; font-weight:600; }
  .card-note.dim{ color:var(--ink-soft); }
  .read-face{ position:static; box-shadow:var(--shadow); }
  .read-label{ font-size:.78rem; font-weight:800; letter-spacing:.03em; text-transform:uppercase; color:var(--lagoon); }
  .flip-hint{ font-size:.82rem; color:var(--ink-soft); font-weight:700; text-align:center; margin-top:12px; }

  .choice-row{ display:flex; flex-direction:column; gap:10px; position:relative; z-index:1; margin-top:16px; max-width:420px; margin-inline:auto; }
  .choice-btn{
    background:var(--surface); border:2px solid var(--border); border-radius:var(--r-md); padding:14px 16px;
    font-family:'Baloo 2',sans-serif; font-weight:700; font-size:1.05rem; color:var(--ink); cursor:pointer;
    text-align:left; box-shadow:var(--shadow-sm); transition: transform .12s ease;
  }
  .choice-btn:hover{ border-color:var(--lagoon-light); }
  .choice-btn:active{ transform: scale(.98); }
  .choice-btn:disabled{ cursor:default; }
  .choice-btn.correct{ border-color:var(--ok-ink); background:var(--ok-bg); color:var(--ok-ink); }
  .choice-btn.wrong{ border-color:var(--bad-ink); background:var(--bad-bg); color:var(--bad-ink); }

  .grade-row{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:20px; }
  .grade-btn{
    display:flex; flex-direction:column; align-items:center; gap:4px; padding:12px 6px; border-radius:var(--r-md);
    border:none; cursor:pointer; font-weight:800; font-size:.82rem; color:#fff; box-shadow: 0 4px 0 rgba(0,0,0,.18);
  }
  .grade-btn:active{ transform:translateY(2px); box-shadow:0 2px 0 rgba(0,0,0,.18); }
  .grade-btn .emoji{ font-size:1.5rem; }
  .grade-again{ background:#c65b46; }
  .grade-hard{ background:var(--sun-dark); }
  .grade-good{ background:var(--lagoon); }
  .grade-easy{ background:var(--seaweed); }

  /* ---------- summary ---------- */
  .summary-card{ text-align:center; background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg); box-shadow:var(--shadow); padding:32px 20px; }
  .summary-card h2{ margin:6px 0 2px; color:var(--deep); font-size:1.6rem; }
  :root[data-theme="dark"] .summary-card h2{ color:var(--lagoon-light); }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .summary-card h2{ color:var(--lagoon-light);} }
  .summary-stats{ display:flex; justify-content:center; gap:22px; margin:18px 0; flex-wrap:wrap; }
  .summary-stat{ display:flex; flex-direction:column; align-items:center; }
  .summary-stat .num{ font-family:'Baloo 2',sans-serif; font-weight:800; font-size:1.7rem; color:var(--coral-dark); }
  .summary-stat .label{ font-size:.78rem; font-weight:800; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em; }

  /* ---------- editor ---------- */
  .editor-head{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:16px; }
  .emoji-btn{ font-size:1.8rem; background:var(--foam-2); border:1px solid var(--border); border-radius:var(--r-sm); width:54px; height:54px; cursor:pointer; }
  .name-input{
    font-family:'Baloo 2',sans-serif; font-weight:700; font-size:1.25rem; color:var(--deep); border:1px solid var(--border);
    background:var(--surface); border-radius:var(--r-sm); padding:10px 12px; flex:1; min-width:160px;
  }
  :root[data-theme="dark"] .name-input{ color:var(--lagoon-light); }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .name-input{ color:var(--lagoon-light);} }
  .emoji-popover{ display:flex; flex-wrap:wrap; gap:6px; background:var(--surface); border:1px solid var(--border); border-radius:var(--r-sm); padding:10px; margin-bottom:14px; box-shadow:var(--shadow-sm); }
  .emoji-opt{ font-size:1.4rem; background:none; border:none; cursor:pointer; border-radius:8px; padding:4px; }
  .emoji-opt:hover{ background:var(--foam-2); }

  .card-list{ display:flex; flex-direction:column; gap:10px; margin-bottom:18px; }
  .card-row{ background:var(--surface); border:1px solid var(--border); border-radius:var(--r-md); padding:12px 14px; display:flex; gap:10px; align-items:center; box-shadow:var(--shadow-sm); }
  .card-row .cr-text{ flex:1; min-width:0; }
  .cr-front{ font-weight:800; color:var(--ink); display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .cr-back{ font-size:.88rem; color:var(--ink-soft); font-weight:600; white-space:normal; overflow-wrap:anywhere; }
  .cr-actions{ display:flex; gap:6px; flex-shrink:0; }
  .mode-tag{ font-size:.68rem; font-weight:800; padding:2px 8px; border-radius:999px; background:var(--foam-2); color:var(--ink-soft); white-space:nowrap; }
  .mode-tag-read{ background:var(--sun); color:#4a3300; }
  .mode-tag-choice{ background:var(--coral); color:#fff; }
  .mode-tag-leech{ background:var(--bad-bg); color:var(--bad-ink); }

  .mode-toggle{ display:grid; grid-template-columns:repeat(auto-fit, minmax(130px,1fr)); gap:8px; margin-bottom:14px; }
  .mode-opt{
    display:flex; flex-direction:column; align-items:flex-start; gap:2px; padding:10px 12px; border-radius:var(--r-sm);
    border:2px solid var(--border); background:var(--foam); color:var(--ink); font-weight:800; font-size:.9rem; cursor:pointer; text-align:left;
  }
  .mode-opt .mode-sub{ font-size:.72rem; font-weight:600; color:var(--ink-soft); }
  .mode-opt.active{ border-color:var(--lagoon); background:var(--foam-2); color:var(--lagoon); }
  .mode-opt.active .mode-sub{ color:var(--seaweed); }

  .form-card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--r-md); padding:16px; box-shadow:var(--shadow-sm); }
  .form-card h3{ margin:0 0 12px; font-size:1.05rem; color:var(--deep); }
  :root[data-theme="dark"] .form-card h3{ color:var(--lagoon-light); }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .form-card h3{ color:var(--lagoon-light);} }
  .field{ display:flex; flex-direction:column; gap:4px; margin-bottom:10px; }
  .field label{ font-size:.78rem; font-weight:800; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.03em; }
  .field input, .field textarea{
    font-family:'Nunito',sans-serif; font-size:1rem; padding:10px 12px; border-radius:var(--r-sm); border:1px solid var(--border);
    background:var(--foam); color:var(--ink); resize:vertical;
  }
  .form-actions{ display:flex; gap:8px; margin-top:6px; }
  .empty-state{ text-align:center; padding:30px 16px; color:var(--ink-soft); font-weight:700; }

  .danger-zone{ margin-top:26px; padding-top:16px; border-top:1px dashed var(--border); display:flex; justify-content:flex-end; }
  .btn-danger{ background:transparent; color:#c65b46; border:1px solid #e0a698; }

  @media (max-width:480px){
    .brand-title{ font-size:1.4rem; }
    .grade-btn{ font-size:.72rem; padding:10px 4px; }
    .summary-stats{ gap:14px; }
  }
</style>

    currentDeckId: null,
    stats: { streak:0, stars:0, lastReviewDateISO:null, totalReviews:0 },
    studyQueue: [],
    studyTotal: 0,
    sessionReviewed: 0,
    sessionStars: 0,
    unsubDecks: null,
    unsubCards: null,
    emojiPickerOpen: false,
    addCardOpen: false,
    choiceState: null
  };

  var DECK_EMOJI = ['🐢','🐬','🐳','🦀','🐠','🦈','🦞','🐙','🌊','🐚','🦑','⭐'];

  function todayISO(d){ d = d || new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function shuffle(arr){ var a = arr.slice(); for(var i=a.length-1;i>0;i--){ var j = Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }

  /* ============ rendering ============ */
  var app = document.getElementById('app');

  function render(){
    if(S.view === 'home') return renderHome();
    if(S.view === 'study') return renderStudy();
    if(S.view === 'editor') return renderEditor();
    if(S.view === 'summary') return renderSummary();
  }

  function bubblesHTML(n){
    var out = '<div class="bubbles" aria-hidden="true">';
    for(var i=0;i<n;i++){
      var size = 8 + Math.round(Math.random()*22);
      var left = Math.round(Math.random()*96);
      var dur = (6 + Math.random()*8).toFixed(1);
      var delay = (Math.random()*8).toFixed(1);
      out += '<span class="bubble" style="width:'+size+'px;height:'+size+'px;left:'+left+'%;animation-duration:'+dur+'s;animation-delay:-'+delay+'s;"></span>';
    }
    out += '</div>';
    return out;
  }

  function mascotSVG(cls){
    return '' +
    '<svg class="mascot '+(cls||'')+'" viewBox="0 0 140 140" role="img" aria-label="Coral Cove turtle mascot">' +
      '<ellipse cx="70" cy="86" rx="16" ry="10" fill="var(--seaweed)" opacity="0.55"/>' +
      '<ellipse cx="24" cy="70" rx="15" ry="10" fill="var(--lagoon)" transform="rotate(-24 24 70)"/>' +
      '<ellipse cx="116" cy="70" rx="15" ry="10" fill="var(--lagoon)" transform="rotate(24 116 70)"/>' +
      '<ellipse cx="34" cy="108" rx="13" ry="9" fill="var(--lagoon)" transform="rotate(20 34 108)"/>' +
      '<ellipse cx="106" cy="108" rx="13" ry="9" fill="var(--lagoon)" transform="rotate(-20 106 108)"/>' +
      '<ellipse cx="70" cy="82" rx="44" ry="36" fill="var(--seaweed)"/>' +
      '<ellipse cx="70" cy="80" rx="37" ry="30" fill="var(--lagoon-light)"/>' +
      '<path d="M70 54 L92 72 L84 100 L56 100 L48 72 Z" fill="var(--seaweed)" opacity="0.55"/>' +
      '<circle cx="70" cy="40" r="22" fill="var(--lagoon)"/>' +
      '<circle cx="61" cy="35" r="4.2" fill="#0b2b33"/>' +
      '<circle cx="79" cy="35" r="4.2" fill="#0b2b33"/>' +
      '<circle cx="62.4" cy="33.6" r="1.3" fill="#fff"/>' +
      '<circle cx="80.4" cy="33.6" r="1.3" fill="#fff"/>' +
      '<path d="M62 48 Q70 54 78 48" stroke="#0b2b33" stroke-width="2.4" fill="none" stroke-linecap="round"/>' +
    '</svg>';
  }

  function subscribeDecks(){
    if(S.unsubDecks) S.unsubDecks();
    S.unsubDecks = S.store.listenDecks(function(decks){
      S.decks = decks;
      if(S.view === 'home'){ refreshDueCounts().then(render); } else { render(); }
    });
  }

  function refreshDueCounts(){
    var now = Date.now();
    return Promise.all(S.decks.map(function(d){
      return S.store.getCardsOnce(d.id).then(function(cards){
        var due = cards.filter(function(c){ return (c.due||0) <= now; }).length;
        S.dueCounts[d.id] = { due: due, total: cards.length };
      });
    }));
  }

  function goHome(){
    S.view = 'home';
    S.currentDeckId = null;
    if(S.unsubCards){ S.unsubCards(); S.unsubCards = null; }
    refreshDueCounts().then(render);
  }

  /* ---------- HOME ---------- */
  function renderHome(){
    var banner = S.store.live ? '' : '<div class="banner">🌟 Offline copy — saved on this device only, and only in this browser tab (it won\'t sync with other devices).</div>';
    var deckTiles = S.decks.map(function(d){
      var dc = S.dueCounts[d.id] || { due:0, total:0 };
      var badge = dc.total === 0
        ? '<span class="deck-badge">No cards yet</span>'
        : (dc.due > 0
          ? '<span class="deck-badge due">'+dc.due+' to review</span>'
          : '<span class="deck-badge">All caught up! 🎉</span>');
      return '' +
      '<div class="deck-card">' +
        '<div class="deck-emoji">'+d.emoji+'</div>' +
        '<h3 class="deck-name">'+esc(d.name)+'</h3>' +
        '<div class="deck-meta">'+dc.total+' card'+(dc.total===1?'':'s')+'</div>' +
        badge +
        '<div class="deck-actions">' +
          '<button class="btn btn-primary" data-act="study" data-deck="'+d.id+'" '+(dc.total===0?'disabled':'')+'>Dive In</button>' +
          '<button class="icon-btn" data-act="edit-deck" data-deck="'+d.id+'" title="Edit deck" aria-label="Edit '+esc(d.name)+'">✏️</button>' +
        '</div>' +
      '</div>';
    }).join('');

    app.innerHTML = '' +
      '<div class="topbar">' +
        '<div class="brand">' +
          '<div class="brand-block">' +
            '<h1 class="brand-title">Coral Cove</h1>' +
            '<p class="brand-tag">Dive in and practice!</p>' +
          '</div>' +
        '</div>' +
        '<div class="stats-row">' +
          '<div class="pill streak"><span class="icon">🌊</span><span class="tabular">'+S.stats.streak+'</span></div>' +
          '<div class="pill stars"><span class="icon">⭐</span><span class="tabular">'+S.stats.stars+'</span></div>' +
        '</div>' +
      '</div>' +
      '<div class="mascot-wrap">'+mascotSVG('')+'</div>' +
      banner +
      '<div class="deck-grid">' +
        deckTiles +
        '<div class="add-deck-card" data-act="new-deck"><span class="plus">＋</span><span>New Deck</span></div>' +
      '</div>';

    app.querySelectorAll('[data-act="study"]').forEach(function(b){ b.addEventListener('click', function(){ startStudy(b.dataset.deck); }); });
    app.querySelectorAll('[data-act="edit-deck"]').forEach(function(b){ b.addEventListener('click', function(){ openEditor(b.dataset.deck); }); });
    var newBtn = app.querySelector('[data-act="new-deck"]');
    if(newBtn) newBtn.addEventListener('click', createDeck);
  }

  function createDeck(){
    var emoji = DECK_EMOJI[Math.floor(Math.random()*DECK_EMOJI.length)];
    S.store.addDeck({ name: 'New Deck', emoji: emoji, order: S.decks.length }).then(function(id){
      openEditor(id, true);
    });
  }

  /* ---------- STUDY ---------- */
  function startStudy(deckId){
    S.currentDeckId = deckId;
    S.store.getCardsOnce(deckId).then(function(cards){
      var now = Date.now();
      var due = cards.filter(function(c){ return (c.due||0) <= now; });
      var pool = due.length ? due : cards;
      S.studyQueue = shuffle(pool).slice(0, 20);
      S.studyTotal = S.studyQueue.length;
      S.sessionReviewed = 0;
      S.sessionStars = 0;
      S.view = 'study';
      S.cardFlipped = false;
      S.choiceState = null;
      render();
    });
  }

  var GRADE_ROW_HTML = '' +
    '<div class="grade-row" style="position:relative;z-index:1;">' +
      '<button class="grade-btn grade-again" data-grade="again"><span class="emoji">🦀</span>Oops!</button>' +
      '<button class="grade-btn grade-hard" data-grade="hard"><span class="emoji">⭐</span>Tricky</button>' +
      '<button class="grade-btn grade-good" data-grade="good"><span class="emoji">🐠</span>Got it!</button>' +
      '<button class="grade-btn grade-easy" data-grade="easy"><span class="emoji">🐬</span>Easy!</button>' +
    '</div>';

  function renderStudy(){
    var deck = S.decks.find(function(d){ return d.id === S.currentDeckId; }) || {name:'Deck', emoji:'🌊'};
    if(!S.studyQueue.length){
      finishStudy();
      return;
    }
    var card = S.studyQueue[0];
    var mode = card.mode === 'read' ? 'read' : (card.mode === 'choice' ? 'choice' : 'flip');
    var doneCount = S.sessionReviewed;
    var dots = '';
    for(var i=0;i<S.studyTotal;i++){
      dots += '<span class="dot '+(i<doneCount?'done':(i===doneCount?'current':''))+'"></span>';
    }

    var stageInner;
    if(mode === 'read'){
      stageInner = '' +
        '<div class="flip-scene" style="position:relative;z-index:1;">' +
          '<div class="face face-front read-face">' +
            '<div class="read-label">📖 Read it out loud</div>' +
            '<div class="card-text">'+esc(card.front)+'</div>' +
            (card.note?'<div class="card-note dim">'+esc(card.note)+'</div>':'') +
          '</div>' +
        '</div>' +
        '<div class="flip-hint" style="position:relative;z-index:1;">Did they read it right?</div>' +
        GRADE_ROW_HTML;
    } else if(mode === 'choice'){
      if(!S.choiceState || S.choiceState.cardId !== card.id){
        S.choiceState = { cardId: card.id, options: shuffle([card.back].concat(card.choices||[])), selected: null };
      }
      var cs = S.choiceState;
      var optsHTML = cs.options.map(function(opt, idx){
        var cls = 'choice-btn';
        if(cs.selected != null){
          if(opt === card.back) cls += ' correct';
          else if(idx === cs.selected) cls += ' wrong';
        }
        return '<button type="button" class="'+cls+'" data-choice-idx="'+idx+'" '+(cs.selected!=null?'disabled':'')+'>'+esc(opt)+'</button>';
      }).join('');
      stageInner = '' +
        '<div class="flip-scene" style="position:relative;z-index:1;">' +
          '<div class="face face-front read-face">' +
            '<div class="read-label">🔢 Pick the answer</div>' +
            '<div class="card-text">'+esc(card.front)+'</div>' +
          '</div>' +
        '</div>' +
        '<div class="choice-row">'+optsHTML+'</div>' +
        (cs.selected != null ? GRADE_ROW_HTML : '<div class="flip-hint" style="position:relative;z-index:1;">Tap an answer</div>');
    } else {
      stageInner = '' +
        '<div class="flip-scene" style="position:relative;z-index:1;">' +
          '<div class="flip-card '+(S.cardFlipped?'flipped':'')+'" id="flipCard">' +
            '<div class="face face-front"><div class="card-text">'+esc(card.front)+'</div></div>' +
            '<div class="face face-back"><div class="card-text">'+esc(card.back)+'</div>'+(card.note?'<div class="card-note">'+esc(card.note)+'</div>':'')+'</div>' +
          '</div>' +
        '</div>' +
        '<div class="flip-hint" style="position:relative;z-index:1;">'+(S.cardFlipped ? 'How did you do?' : 'Tap the card to flip it')+'</div>' +
        (S.cardFlipped ? GRADE_ROW_HTML : '');
    }

    app.innerHTML = '' +
      '<div class="nav-row">' +
        '<button class="back-btn" data-act="exit-study">⟵ Lagoon</button>' +
        '<span class="nav-title">'+deck.emoji+' '+esc(deck.name)+'</span>' +
      '</div>' +
      '<div class="progress-track">'+dots+'</div>' +
      '<div class="stage">' +
        bubblesHTML(8) +
        stageInner +
      '</div>';

    app.querySelector('[data-act="exit-study"]').addEventListener('click', goHome);
    var flip = document.getElementById('flipCard');
    if(flip){
      flip.addEventListener('click', function(){
        if(S.cardFlipped) return;
        S.cardFlipped = true;
        render();
      });
    }
    app.querySelectorAll('[data-choice-idx]').forEach(function(b){
      b.addEventListener('click', function(){
        if(S.choiceState.selected != null) return;
        S.choiceState.selected = parseInt(b.dataset.choiceIdx, 10);
        render();
      });
    });
    app.querySelectorAll('[data-grade]').forEach(function(b){
      b.addEventListener('click', function(e){ e.stopPropagation(); grade(b.dataset.grade); });
    });
  }

  function grade(rating){
    var card = S.studyQueue.shift();
    var updates = gradeCard(card, rating);
    S.store.updateCard(S.currentDeckId, card.id, updates);
    S.sessionReviewed += 1;
    S.sessionStars += STARS[rating];
    var stillLearning = updates.state === 'learning' || updates.state === 'relearning';
    if(stillLearning){
      var reinsertAt = Math.min(S.studyQueue.length, 3);
      var copy = Object.assign({}, card, updates);
      S.studyQueue.splice(reinsertAt, 0, copy);
      S.studyTotal += 1;
    }
    S.cardFlipped = false;
    S.choiceState = null;
    if(S.dueCounts[S.currentDeckId]){
      S.dueCounts[S.currentDeckId].due = Math.max(0, S.dueCounts[S.currentDeckId].due - (stillLearning?0:1));
    }
    render();
  }

  function finishStudy(){
    S.store.getStats().then(function(stats){
      var today = todayISO();
      var newStreak = stats.streak || 0;
      if(stats.lastReviewDateISO !== today){
        var y = new Date(); y.setDate(y.getDate()-1);
        newStreak = (stats.lastReviewDateISO === todayISO(y)) ? (stats.streak||0) + 1 : 1;
      }
      var newStats = {
        streak: newStreak,
        stars: (stats.stars||0) + S.sessionStars,
        lastReviewDateISO: today,
        totalReviews: (stats.totalReviews||0) + S.sessionReviewed
      };
      return S.store.setStats(newStats).then(function(){ S.stats = newStats; });
    }).then(function(){
      S.view = 'summary';
      render();
    });
  }

  function renderSummary(){
    var deck = S.decks.find(function(d){ return d.id === S.currentDeckId; }) || {name:'Deck', emoji:'🌊'};
    app.innerHTML = '' +
      '<div class="mascot-wrap">'+mascotSVG('big celebrate')+'</div>' +
      '<div class="summary-card">' +
        '<h2>Great swimming!</h2>' +
        '<div class="deck-meta">'+deck.emoji+' '+esc(deck.name)+'</div>' +
        '<div class="summary-stats">' +
          '<div class="summary-stat"><span class="num tabular">'+S.sessionReviewed+'</span><span class="label">Cards</span></div>' +
          '<div class="summary-stat"><span class="num tabular">+'+S.sessionStars+'</span><span class="label">Stars</span></div>' +
          '<div class="summary-stat"><span class="num tabular">'+S.stats.streak+'</span><span class="label">Day streak</span></div>' +
        '</div>' +
        '<button class="btn btn-primary" data-act="back-home">Back to the Lagoon</button>' +
      '</div>';
    app.querySelector('[data-act="back-home"]').addEventListener('click', goHome);
  }

  /* ---------- EDITOR ---------- */
  function openEditor(deckId, focusName){
    S.currentDeckId = deckId;
    S.view = 'editor';
    S.emojiPickerOpen = false;
    S.addCardOpen = false;
    S.editingCardId = null;
    S.cardFormDraft = null;
    S.cardFormMode = 'flip';
    if(S.unsubCards) S.unsubCards();
    S.editorCards = [];
    S.unsubCards = S.store.listenCards(deckId, function(cards){
      S.editorCards = cards.sort(function(a,b){ return (a.createdAt||0)-(b.createdAt||0); });
      if(S.view === 'editor') render();
    });
    render();
    if(focusName){ setTimeout(function(){ var el = document.getElementById('deckNameInput'); if(el){ el.focus(); el.select(); } }, 0); }
  }

  function renderEditor(){
    var deck = S.decks.find(function(d){ return d.id === S.currentDeckId; });
    if(!deck){ goHome(); return; }
    var cards = S.editorCards || [];

    var rows = cards.length ? cards.map(function(c){
      var isReadRow = c.mode === 'read';
      var isChoiceRow = c.mode === 'choice';
      var modeTag = (isReadRow ? '<span class="mode-tag mode-tag-read">📖 Read</span>' : (isChoiceRow ? '<span class="mode-tag mode-tag-choice">🔢 Choice</span>' : '<span class="mode-tag">🔄 Flip</span>')) +
        (c.isLeech ? ' <span class="mode-tag mode-tag-leech">🔁 Needs practice</span>' : '');
      var backLine = isReadRow ? (c.note ? esc(c.note) : 'No answer side — just for reading aloud') :
        (isChoiceRow ? (esc(c.back)+' · '+(c.choices||[]).length+' wrong answer'+((c.choices||[]).length===1?'':'s')) :
        (esc(c.back)+(c.note?' · '+esc(c.note):'')));
      return '' +
      '<div class="card-row">' +
        '<div class="cr-text">' +
          '<div class="cr-front">'+esc(c.front)+' '+modeTag+'</div>' +
          '<div class="cr-back">'+backLine+'</div>' +
        '</div>' +
        '<div class="cr-actions">' +
          '<button class="icon-btn" data-act="edit-card" data-card="'+c.id+'" aria-label="Edit card">✏️</button>' +
          '<button class="icon-btn" data-act="del-card" data-card="'+c.id+'" aria-label="Delete card">🗑️</button>' +
        '</div>' +
      '</div>';
    }).join('') : '<div class="empty-state">No cards yet — add the first one below! 🐚</div>';

    var emojiPicker = S.emojiPickerOpen ? ('<div class="emoji-popover">' + DECK_EMOJI.map(function(e){
      return '<button class="emoji-opt" data-emoji="'+e+'">'+e+'</button>';
    }).join('') + '</div>') : '';

    var editingCard = S.editingCardId ? cards.find(function(c){ return c.id === S.editingCardId; }) : null;
    var formTitle = editingCard ? 'Edit card' : 'Add a new card';
    var draft = S.cardFormDraft || { front:'', back:'', note:'', choices:'' };
    var fFront = draft.front; var fBack = draft.back; var fNote = draft.note; var fChoices = draft.choices || '';
    var formMode = S.cardFormMode || 'flip';
    var isReadMode = formMode === 'read';
    var isChoiceMode = formMode === 'choice';

    var addForm = (S.addCardOpen || editingCard) ? ('' +
      '<div class="form-card">' +
        '<h3>'+formTitle+'</h3>' +
        '<div class="mode-toggle">' +
          '<button type="button" class="mode-opt '+(formMode==='flip'?'active':'')+'" data-mode="flip">🔄 Flip card<span class="mode-sub">question → answer</span></button>' +
          '<button type="button" class="mode-opt '+(formMode==='read'?'active':'')+'" data-mode="read">📖 Just read it<span class="mode-sub">no answer side</span></button>' +
          '<button type="button" class="mode-opt '+(formMode==='choice'?'active':'')+'" data-mode="choice">🔢 Multiple choice<span class="mode-sub">pick the answer</span></button>' +
        '</div>' +
        '<div class="field"><label for="cardFront">'+(isReadMode?'Word or phrase to read':'Front (question / word)')+'</label><input id="cardFront" type="text" value="'+esc(fFront)+'" placeholder="'+(isReadMode?'e.g. octopus':'e.g. 6 + 7  or  because')+'"></div>' +
        (isReadMode ? '' : '<div class="field"><label for="cardBack">'+(isChoiceMode?'Correct answer':'Back (answer)')+'</label><input id="cardBack" type="text" value="'+esc(fBack)+'" placeholder="e.g. 13  or  a sentence"></div>') +
        (isChoiceMode ? '<div class="field"><label for="cardChoices">Wrong answers (comma-separated)</label><input id="cardChoices" type="text" value="'+esc(fChoices)+'" placeholder="e.g. 11, 12, 14"></div>' : '') +
        '<div class="field"><label for="cardNote">'+(isReadMode?'Hint (optional, shown small under the word)':'Fun fact / hint (optional)')+'</label><textarea id="cardNote" rows="2" placeholder="'+(isReadMode?'e.g. sounds like OCK-tuh-puss':'e.g. 6 crabs + 7 crabs = 13 crabs!')+'">'+esc(fNote)+'</textarea></div>' +
        '<div class="form-actions">' +
          '<button class="btn btn-primary" data-act="save-card">'+(editingCard?'Save changes':'Add card')+'</button>' +
          '<button class="btn btn-ghost" data-act="cancel-card">Cancel</button>' +
        '</div>' +
      '</div>') : '<button class="btn btn-coral" data-act="open-add-card">＋ Add a card</button>';

    app.innerHTML = '' +
      '<div class="nav-row">' +
        '<button class="back-btn" data-act="exit-editor">⟵ Lagoon</button>' +
      '</div>' +
      '<div class="editor-head">' +
        '<button class="emoji-btn" data-act="toggle-emoji">'+deck.emoji+'</button>' +
        '<input id="deckNameInput" class="name-input" type="text" value="'+esc(deck.name)+'" maxlength="40">' +
      '</div>' +
      emojiPicker +
      '<div class="card-list">'+rows+'</div>' +
      addForm +
      '<div class="danger-zone"><button class="btn btn-danger" data-act="del-deck">Delete this deck</button></div>';

    app.querySelector('[data-act="exit-editor"]').addEventListener('click', function(){
      S.editingCardId = null;
      S.cardFormDraft = null;
      goHome();
    });
    app.querySelector('[data-act="toggle-emoji"]').addEventListener('click', function(){ S.emojiPickerOpen = !S.emojiPickerOpen; render(); });
    app.querySelectorAll('.emoji-opt').forEach(function(b){
      b.addEventListener('click', function(){
        S.store.updateDeck(deck.id, { emoji: b.dataset.emoji });
        S.emojiPickerOpen = false;
        render();
      });
    });
    var nameInput = document.getElementById('deckNameInput');
    nameInput.addEventListener('change', function(){
      var val = nameInput.value.trim() || 'Untitled Deck';
      S.store.updateDeck(deck.id, { name: val });
    });
    app.querySelectorAll('[data-act="edit-card"]').forEach(function(b){
      b.addEventListener('click', function(){
        var c = cards.find(function(x){ return x.id === b.dataset.card; });
        S.editingCardId = b.dataset.card;
        S.addCardOpen = false;
        S.cardFormMode = (c && c.mode === 'read') ? 'read' : ((c && c.mode === 'choice') ? 'choice' : 'flip');
        S.cardFormDraft = { front: c ? c.front : '', back: c ? (c.back||'') : '', note: c ? (c.note||'') : '', choices: c ? (c.choices||[]).join(', ') : '' };
        render();
      });
    });
    app.querySelectorAll('[data-act="del-card"]').forEach(function(b){
      b.addEventListener('click', function(){ S.store.deleteCard(deck.id, b.dataset.card); });
    });
    var openAdd = app.querySelector('[data-act="open-add-card"]');
    if(openAdd) openAdd.addEventListener('click', function(){
      S.addCardOpen = true; S.editingCardId = null; S.cardFormMode = 'flip'; S.cardFormDraft = { front:'', back:'', note:'', choices:'' };
      render();
      setTimeout(function(){ var el=document.getElementById('cardFront'); if(el) el.focus(); },0);
    });
    var cancelBtn = app.querySelector('[data-act="cancel-card"]');
    if(cancelBtn) cancelBtn.addEventListener('click', function(){ S.addCardOpen = false; S.editingCardId = null; S.cardFormDraft = null; render(); });
    app.querySelectorAll('[data-mode]').forEach(function(b){
      b.addEventListener('click', function(){
        var frontEl = document.getElementById('cardFront');
        var backEl = document.getElementById('cardBack');
        var noteEl = document.getElementById('cardNote');
        var choicesEl = document.getElementById('cardChoices');
        S.cardFormDraft = {
          front: frontEl ? frontEl.value : (draft.front||''),
          back: backEl ? backEl.value : (draft.back||''),
          note: noteEl ? noteEl.value : (draft.note||''),
          choices: choicesEl ? choicesEl.value : (draft.choices||'')
        };
        S.cardFormMode = b.dataset.mode;
        render();
      });
    });
    var saveBtn = app.querySelector('[data-act="save-card"]');
    if(saveBtn) saveBtn.addEventListener('click', function(){
      var front = document.getElementById('cardFront').value.trim();
      var backEl = document.getElementById('cardBack');
      var back = backEl ? backEl.value.trim() : '';
      var note = document.getElementById('cardNote').value.trim();
      var choicesEl = document.getElementById('cardChoices');
      var choicesArr = choicesEl ? choicesEl.value.split(',').map(function(s){ return s.trim(); }).filter(Boolean) : [];
      var mode = S.cardFormMode || 'flip';
      if(!front) return;
      if((mode === 'flip' || mode === 'choice') && !back) return;
      if(mode === 'choice' && choicesArr.length < 1) return;
      var payload = { front: front, back: back, note: note, mode: mode, choices: mode === 'choice' ? choicesArr : [] };
      if(editingCard){
        S.store.updateCard(deck.id, editingCard.id, payload);
        S.editingCardId = null;
      } else {
        S.store.addCard(deck.id, payload);
        S.addCardOpen = false;
      }
      S.cardFormDraft = null;
      render();
    });
    var delDeckBtn = app.querySelector('[data-act="del-deck"]');
    if(delDeckBtn) delDeckBtn.addEventListener('click', function(){
      if(confirm('Delete "'+deck.name+'" and all its cards? This can\'t be undone.')){
        S.store.deleteDeck(deck.id).then(goHome);
      }
    });
  }

  /* ============ boot ============ */
  store.init().then(function(s){
    S.store = s;
    S.store.getStats().then(function(stats){ S.stats = stats; render(); });
    subscribeDecks();
  });
})();
</script>
</body></html>
