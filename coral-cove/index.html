    }
  }

  // The only entry point that advances a card. Answering (an outcome tap, or a choice pick) is the
  // sole trigger — there is no swipe-to-skip and no tap-anywhere-to-continue, so a card is locked in
  // place until it's actually answered. Once answered, this plays the TikTok-style exit slide on the
  // current card and locks out any further taps for that brief window before the next card lands.
  function grade(rating, skipSound){
    if(S.transitioning) return;
    S.transitioning = true;
    var stageEl = app.querySelector('.stage');
    if(stageEl) stageEl.classList.add('stage-exit');
    setTimeout(function(){
      S.transitioning = false;
      commitGrade(rating, skipSound);
    }, 140);
  }

  function commitGrade(rating, skipSound){
    if(S.view !== 'study' || !S.currentDeckId || !S.studyQueue.length) return; // cove: left mid-answer
    var card = S.studyQueue.shift();
    // 'leitner' uses its own fixed-box engine; the other two options share the SM-2 engine and only
    // differ upstream, in whether autoRating() let response time influence the rating at all. Either
    // way, the parent-set difficulty (round size aside) shapes how far a good answer is spaced out
    // and how hard a struggling card gets reinforced — see DIFFICULTIES up top.
    var algo = S.settings.algorithm || 'sm2_speed';
    var diff = currentDifficulty();
    var updates = card._practice ? {} : ((algo === 'leitner') ? gradeCardLeitner(card, rating !== 'again', Date.now(), diff) : gradeCard(card, rating, Date.now(), diff));
    // Cumulative right/wrong counters, independent of the scheduling algorithm above -- these are
    // what the Progress page's per-deck "topics" breakdown groups by category and sums.
    updates.timesSeen = (card.timesSeen || 0) + 1;
    updates.timesCorrect = (card.timesCorrect || 0) + (rating !== 'again' ? 1 : 0);
    S.store.updateCard(S.currentDeckId, card.id, updates);
    planNoteAnswer(card, rating);
    S.sessionReviewed += 1;
    S.sessionStars += STARS[rating];
    // Snapshot this card as the one swipe-back target — captured before choiceState/cardFlipped
    // reset below, and overwritten on every answer, so there's always exactly one card of "undo peek."
    var gradedMode = (CARD_MODES.indexOf(card.mode) !== -1) ? card.mode : 'flip';
    var isDragGraded = gradedMode === 'match' || gradedMode === 'blank';
    var tcGraded = gradedMode === 'timedchoice' ? S.timedChoiceState : null;
    var lsGraded = gradedMode === 'listen' ? S.listenState : (gradedMode === 'hanja' ? S.hanjaState : (gradedMode === 'numsys' ? S.numsysState : null));
    // 'timedchoice' can ask in either direction (see buildTimedChoiceRound), so the peek-back view
    // needs the actual prompt/answer text that was shown, not always card.front/card.back verbatim.
    S.lastAnsweredCard = {
      front: tcGraded ? tcGraded.prompt : (gradedMode === 'hanja' && lsGraded && lsGraded.dir === 'zh2ko' ? hanjaZh(card) : (gradedMode === 'numsys' ? (card.nsEmoji ? card.nsEmoji + ' ' : '') + card.back : card.front)),
      back: tcGraded ? tcGraded.answer : (lsGraded ? lsGraded.answer : card.back),
      note: card.note || '',
      photoUrl: card.photoUrl || '',
      mode: gradedMode,
      correct: rating !== 'again',
      rating: rating,
      choiceOptions: (gradedMode === 'choice' && S.choiceState) ? S.choiceState.options.slice() : (isDragGraded && S.dragState ? S.dragState.options.slice() : (tcGraded ? tcGraded.options.slice() : (lsGraded ? lsGraded.options.slice() : null))),
      chosenText: (gradedMode === 'choice' && S.choiceState && S.choiceState.selected != null) ? S.choiceState.options[S.choiceState.selected] : (isDragGraded && S.dragState && S.dragState.dropped != null ? S.dragState.options[S.dragState.dropped] : (tcGraded && tcGraded.selected != null ? tcGraded.options[tcGraded.selected] : (lsGraded && lsGraded.selected != null ? lsGraded.options[lsGraded.selected] : null)))
    };
    S.peeking = false;
    // The swim-progress critter frowns for a beat right after a miss, then goes back to smiling —
    // it still swims forward the same step either way, so a wrong answer never looks like no progress.
    S.lastOutcomeWrong = (rating === 'again');
    if(S.lastOutcomeWrong){
      // Swap the critter's face in place rather than re-rendering the whole screen -- a full
      // render() here used to reset whatever the child was doing on the next card (a tile mid-drag,
      // a half-slid Sound Blend shell).
      setTimeout(function(){
        S.lastOutcomeWrong = false;
        if(S.view !== 'study') return;
        var swim = app.querySelector('.critter-swim');
        if(swim){ swim.classList.remove('oops'); swim.innerHTML = critterSVG(false); }
      }, 900);
    }
    if(S.roundTally) S.roundTally[rating] = (S.roundTally[rating] || 0) + 1;
    if(!skipSound){
      if(rating === 'again') Sound.wrong();
      else if(rating === 'hard') Sound.tap();
      else Sound.correct();
    }
    if(S.sessionTally){
      S.sessionTally.reviewedCount += 1;
      S.sessionTally.starsEarned += STARS[rating];
      S.sessionTally[rating] = (S.sessionTally[rating] || 0) + 1;
      if(S.currentDeckId && S.sessionTally.decksStudied.indexOf(S.currentDeckId) === -1){
        S.sessionTally.decksStudied.push(S.currentDeckId);
      }
      S.store.setSessionTally(S.sessionTally);
    }
    // Rounds are meant to be a strict, predictable length (the chosen difficulty's roundSize) — a
    // missed card is NOT requeued into the same round (that used to inflate a round past its size).
    // It's simply due again shortly per the schedule and will resurface on the next round/Play Again.
    var stillLearning = updates.state === 'learning' || updates.state === 'relearning';
    S.cardFlipped = false;
    S.choiceState = null;
    S.dragState = null;
    S.listenState = null;
    echoReset();
    S.buildState = null;
    S.hanjaState = null;
    S.numsysState = null;
    S.currentCardId = null; // forces the next renderStudy() to treat the next card (even a re-queued one) as freshly shown
    if(S.dueCounts[S.currentDeckId] && !card._practice){
      S.dueCounts[S.currentDeckId].due = Math.max(0, S.dueCounts[S.currentDeckId].due - (stillLearning?0:1));
    }
    render();
  }

  function finishStudy(){
    // renderStudy() calls this whenever the queue is empty, and other timers (the critter's frown,
    // a sound toggle) can re-render the study screen while the saves below are still in flight --
    // without this guard a single round could be counted twice (double stars, double history).
    if(S.finishingRound) return;
    S.finishingRound = true;
    var t = S.roundTally || { again:0, hard:0, good:0, easy:0 };
    var total = S.sessionReviewed;
    var right = Math.max(0, total - t.again);
    var deck = S.decks.find(function(d){ return d.id === S.currentDeckId; });
    var historyEntry = {
      deckId: S.currentDeckId,
      deckName: deck ? deck.name : 'Deck',
      deckEmoji: deck ? deck.emoji : '🌊',
      total: total,
      right: right,
      accuracy: total > 0 ? Math.round((right / total) * 100) : 0,
      ms: S.roundStartedAt ? Date.now() - S.roundStartedAt : 0
    };
    if(S.planRun) planRecord({ total: total, right: right, accuracy: historyEntry.accuracy });
    var newStatsRef = null, coveShown = false;
    S.store.getStats().then(function(stats){
      var today = todayISO();
      var newStreak = currentStreak(stats);
      if(stats.lastReviewDateISO !== today) newStreak = newStreak + 1; // yesterday's streak grows; a gap restarts at 1 (current is 0)
      if(newStreak < 1) newStreak = 1;
      // Starts from the saved stats so fields this screen doesn't touch survive -- previously the
      // doc was rebuilt from scratch here, which erased every Word Feed sound bought with stars.
      var newStats = Object.assign({}, stats, {
        streak: newStreak,
        stars: (stats.stars||0) + S.sessionStars,
        lastReviewDateISO: today,
        totalReviews: (stats.totalReviews||0) + S.sessionReviewed,
        unlockedSounds: stats.unlockedSounds || (S.stats && S.stats.unlockedSounds) || []
      });
      reefAward(stats, newStats);
      newStatsRef = newStats;
      S.stats = newStats;
      var wp = Promise.resolve(S.store.setStats(newStats)).then(function(){ return S.store.addHistoryEntry(historyEntry); });
      S.justEarnedBadges = [];
      S.view = 'summary';
      coveShown = true;
      render();
      return wp.then(function(){
        return evaluateAndAwardBadges(newStatsRef, historyEntry);
      }).then(function(){
        S.finishingRound = false;
        coveBadgeBanner();
      });
    }).catch(function(err){
      // A failed save used to leave the round stuck on an empty study screen forever.
      console.error('[Coral Cove] saving the round failed', err);
      S.finishingRound = false;
      S.storeError = 'This round\'s results didn\'t save. Check your connection and try again.';
      if(!coveShown) S.view = 'summary';
      if(S.view === 'summary') render();
    });
  }

  // Groups a deck's cards by their optional "Topic" tag and sums each topic's cumulative right/seen
  // counts (tracked on every graded answer in commitGrade). Untagged cards are left out entirely --
  // an "Uncategorized: 100%" row would just be noise, not a useful topic breakdown. Sorted strongest
  // topic first, so a parent can see at a glance what's landed and what still needs practice.
  function categoryBreakdown(cards){
    var buckets = {};
    (cards||[]).forEach(function(c){
      var cat = (c.category||'').trim();
      var seen = c.timesSeen || 0;
      if(!cat || !seen) return;
      if(!buckets[cat]) buckets[cat] = { category: cat, seen: 0, correct: 0 };
      buckets[cat].seen += seen;
      buckets[cat].correct += (c.timesCorrect || 0);
    });
    var rows = Object.keys(buckets).map(function(k){
      var b = buckets[k];
      return { category: b.category, seen: b.seen, correct: b.correct, accuracy: b.seen > 0 ? Math.round((b.correct/b.seen)*100) : 0 };
    });
    rows.sort(function(a,b){ return b.accuracy - a.accuracy; });
    return rows;
  }

  // Aggregates raw per-round history entries into one point per calendar day (summed right/total
  // across every round finished that day), which is what the long-term trend chart plots -- a
  // per-round view gets noisy fast, but a daily view stays readable across weeks or months.
  function aggregateHistoryByDay(history){
    var byDay = {};
    (history||[]).forEach(function(h){
      var d = new Date(h.endedAt || 0);
      var iso = todayISO(d);
      if(!byDay[iso]){
        byDay[iso] = { iso: iso, ts: new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime(), right:0, total:0, rounds:0 };
      }
      byDay[iso].right += h.right || 0;
      byDay[iso].total += h.total || 0;
      byDay[iso].rounds += 1;
    });
    return Object.keys(byDay).map(function(k){ return byDay[k]; }).sort(function(a,b){ return a.ts - b.ts; });
  }

  // Hand-rolled inline SVG line+area chart (no chart library — this app stays a single dependency-
  // free file) showing accuracy by day across the ENTIRE history, not just the most recent rounds.
  // Capped to the most recent 60 days so the chart stays legible once a family has been using the
  // app for a long stretch; older days are still counted in "days of practice" below the chart.
  function renderLongTermTrend(history){
    if(!history || !history.length){
      return '<div class="trend-wrap"><div class="trend-empty">Finish a few rounds to start seeing a long-term trend! 🌊</div></div>';
    }
    var allDays = aggregateHistoryByDay(history);
    var days = allDays.slice(-60);
    var n = days.length;
    var W = 600, H = 160, padL = 30, padR = 10, padT = 10, padB = 4;
    var plotW = W - padL - padR, plotH = H - padT - padB;
    function xAt(i){ return n > 1 ? padL + (i/(n-1))*plotW : padL + plotW/2; }
    function yAt(pct){ return padT + (1 - pct/100) * plotH; }
    var pts = days.map(function(d, i){
      var pct = d.total > 0 ? Math.round((d.right/d.total)*100) : 0;
      return { x: xAt(i), y: yAt(pct), pct: pct, day: d };
    });
    var pathD = pts.map(function(p,i){ return (i===0?'M':'L')+p.x.toFixed(1)+','+p.y.toFixed(1); }).join(' ');
    var areaD = pathD + ' L'+pts[pts.length-1].x.toFixed(1)+','+(padT+plotH)+' L'+pts[0].x.toFixed(1)+','+(padT+plotH)+' Z';
    var gridHTML = [0,50,100].map(function(pct){
      var y = yAt(pct);
      return '<line x1="'+padL+'" y1="'+y.toFixed(1)+'" x2="'+(W-padR)+'" y2="'+y.toFixed(1)+'" stroke="var(--border)" stroke-width="1" stroke-dasharray="3,3"/>' +
        '<text x="2" y="'+(y+3).toFixed(1)+'" font-size="9" fill="var(--ink-soft)">'+pct+'</text>';
    }).join('');
    var ptsHTML = pts.map(function(p){
      var dd = new Date(p.day.ts);
      var label = (dd.getMonth()+1)+'/'+dd.getDate();
      var tip = esc('🗓️ '+label+' — '+p.pct+'% ('+p.day.right+'/'+p.day.total+' across '+p.day.rounds+' round'+(p.day.rounds===1?'':'s')+')');
      return '<circle class="trend-pt" cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="4" tabindex="0" data-tip="'+tip+'"/>';
    }).join('');
    var firstLabel = (function(){ var dd = new Date(days[0].ts); return (dd.getMonth()+1)+'/'+dd.getDate(); })();
    var lastLabel = (function(){ var dd = new Date(days[days.length-1].ts); return (dd.getMonth()+1)+'/'+dd.getDate(); })();
    var noteExtra = allDays.length > days.length ? ' (showing the most recent '+days.length+')' : '';
    return '' +
      '<div class="trend-wrap trend-long">' +
        '<svg class="trend-svg" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" role="img" aria-label="Accuracy by day, over time">' +
          gridHTML +
          '<path d="'+areaD+'" fill="var(--lagoon)" fill-opacity="0.14" stroke="none"/>' +
          '<path d="'+pathD+'" fill="none" stroke="var(--lagoon)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>' +
          ptsHTML +
        '</svg>' +
        (n > 1 ? '<div class="trend-axis"><span>'+firstLabel+'</span><span>'+lastLabel+'</span></div>' : '') +
        '<p class="trend-long-note">📅 '+allDays.length+' day'+(allDays.length===1?'':'s')+' of practice so far'+noteExtra+'</p>' +
      '</div>';
  }

  // Shared tooltip wiring for both the short-term bar chart and the long-term SVG points -- both
  // kinds of chart mark tell you what they need with a `data-tip` attribute.
  function wireChartTips(){
    var tip = document.getElementById('chartTip');
    if(!tip) return;
    app.querySelectorAll('.trend-bar, .trend-pt').forEach(function(b){
      function show(){
        tip.textContent = b.dataset.tip;
        var r = b.getBoundingClientRect();
        tip.style.left = (r.left + r.width/2) + 'px';
        tip.style.top = r.top + 'px';
        tip.classList.add('show');
      }
      function hide(){ tip.classList.remove('show'); }
      b.addEventListener('mouseenter', show);
      b.addEventListener('mouseleave', hide);
      b.addEventListener('focus', show);
      b.addEventListener('blur', hide);
      b.addEventListener('touchstart', function(){ show(); setTimeout(hide, 1500); }, {passive:true});
    });
  }

  function micSettingsHTML(){

    var status = !echoMicAvailable() ? Mic.msg('unsupported')
      : (st.reason ? Mic.msg(st.reason)
      : (st.ok ? '✅ The microphone works on this device.'
      : (c === 'yes' ? 'On. 🎙️ Echo cards can record.' : (c === 'no' ? 'Off. 🎙️ Echo cards play the voice and you say it aloud.' : 'Not chosen yet. 🎙️ Echo cards will ask the first time.'))));

        '<button type="button" class="algo-opt'+(c==='no'?' active':'')+'" data-mic-choice="no"><span class="algo-name">🔇 Don\'t use it'+(c==='no'?' <span class="algo-current">— current</span>':'')+'</span><span class="algo-blurb">Echo cards still work: listen, then say it out loud.</span></button>' +

      '<p class="algo-note" id="micStatus" aria-live="polite">'+esc(status)+'</p></div>';
  }
  function micTest(){
    if(S.micTest && S.micTest.running) return;
    S.micTest = { running: true }; render();
    function done(r){ S.micTest = r; if(S.view === 'settings') render(); }
    if(!echoMicAvailable()) return done({ reason: 'unsupported' });
    if(!Mic.frameAllows()) return done({ reason: 'blocked' });
    navigator.mediaDevices.getUserMedia({ audio: true }).then(function(stream){
      var ctx = null, an = null, data = null, end = Date.now() + 3000;
      try { var AC = window.AudioContext || window.webkitAudioContext; ctx = new AC(); an = ctx.createAnalyser(); an.fftSize = 512; ctx.createMediaStreamSource(stream).connect(an); data = new Uint8Array(an.fftSize); } catch(e){}
      (function tick(){
        if(an){ an.getByteTimeDomainData(data); var pk = 0; for(var k = 0; k < data.length; k++) pk = Math.max(pk, Math.abs(data[k] - 128)); var el = document.getElementById('micTestLevel'); if(el) el.style.transform = 'scaleX(' + Math.min(1, pk / 64).toFixed(3) + ')'; }
        if(Date.now() < end && S.view === 'settings') return requestAnimationFrame(tick);
        stream.getTracks().forEach(function(t){ t.stop(); }); try { if(ctx) ctx.close(); } catch(e){}
        Mic.set('yes');
        done({ ok: true });
      })();
    }, function(err){ done({ reason: Mic.why(err) }); });
  }
  function wireMicSettings(){
    app.querySelectorAll('[data-mic-choice]').forEach(function(b){ b.addEventListener('click', function(){
      var v = b.dataset.micChoice; Mic.set(v); S.micTest = null;
      if(v === 'yes') micTest(); else render(); // "yes" goes straight to the browser's own permission box
    }); });
    var t = app.querySelector('[data-act="mic-test"]'); if(t) t.addEventListener('click', micTest);
  }

  // Light (Sunlit zone) / dark (Midnight zone) / match the device, saved on the profile so it follows
  // that person to any device. Switching dives down or rises up with a wash of water, like Coral Calendar.
  function applyThemeMode(mode){
    var root = document.documentElement, want = (mode === 'light' || mode === 'dark') ? mode : '';
    if((root.dataset.theme || '') === want) return;
    if(want) root.dataset.theme = want; else delete root.dataset.theme;
  }
  function setThemeMode(mode){
    var root = document.documentElement;
    var dark = function(){ return (root.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')) === 'dark'; };
    var wasDark = dark();
    var go = function(){
      root.classList.add('theming');
      S.profile = Object.assign({}, S.profile, { themeMode: mode });
      S.store.updateProfile(S.profile.id, { themeMode: mode });
      render();
      setTimeout(function(){ root.classList.remove('theming'); }, 900);
    };
    var willDark = mode === 'dark' || (mode === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
    var reducedMo = false; try { reducedMo = matchMedia('(prefers-reduced-motion: reduce)').matches; } catch(e){}
    if(wasDark === willDark || reducedMo){ go(); return; }
    var w = document.createElement('div'); w.className = 'divewash ' + (willDark ? 'down' : 'up'); document.body.appendChild(w);
    setTimeout(go, 330); setTimeout(function(){ w.remove(); }, 1000);
  }

    app.querySelector('[data-act="exit-settings"]').addEventListener('click', goHome);
    app.querySelectorAll('[data-diff]').forEach(function(b){
      b.addEventListener('click', function(){
        var id = b.dataset.diff;

        S.store.setSettings(newSettings);
        render();
      });
    });
    app.querySelectorAll('[data-algo]').forEach(function(b){

  /* ---------- EDITOR ---------- */
  function openEditor(deckId, focusName){
    // Adult Mode never asks for the PIN. Child Mode already cleared the PIN once to reach Edit Mode
    // in the first place, so opening one specific deck from inside it needs no second PIN prompt.
    if(S.managingDecks || S.editMode){ openEditorUnlocked(deckId, focusName); return; }
    // Defensive fallback in case this is ever reached outside Edit Mode.
    S.pendingEdit = { deckId: deckId, focusName: focusName };
    S.pinInput = ''; S.pinError = ''; S.pinShake = false;
    S.pinPromptFor = 'edit';
    render();
  }

  function openEditorUnlocked(deckId, focusName){
    S.currentDeckId = deckId;
    S.store.updateDeck(deckId, { lastOpenedAt: Date.now() }); // drives the Manage Decks "most recently opened" order
    S.view = 'editor';
    S.emojiPickerOpen = false;
    S.addCardOpen = false;
    S.editingCardId = null;
    S.cardFormDraft = null;
    S.cardFormMode = 'flip';
    if(S.unsubCards) S.unsubCards();
    S.editorCards = [];
    S.unsubCards = S.store.listenCards(deckId, function(cards){
      S.editorCards = cards.sort(function(a,b){ return (a.createdAt||0)-(b.createdAt||0); });
      if(S.view === 'editor') render();
    });
    render();
    if(focusName){ setTimeout(function(){ var el = document.getElementById('deckNameInput'); if(el){ el.focus(); el.select(); } }, 0); }
  }

  /* ============ generic tap sound (delegated, covers every button not already voiced) ============ */

  /* ============ keyboard PIN entry ============ */
  // Wired once, globally, at boot -- NOT inside wirePinKeys/renderPinPad, since that function re-runs
  // on every keystroke (each digit re-renders the whole PIN screen) and a listener added there would
  // stack up a new one every time, firing a single keypress multiple times over. Guarding on
  // S.pinPromptFor and simply clicking the matching on-screen button reuses every bit of existing
  // logic (Sound.tap, error clearing, the auto-submit-at-4-digits timer, backspace, cancel) instead of
  // duplicating it -- a real keyboard press behaves exactly like tapping the pad by hand.
  document.addEventListener('keydown', function(e){
    if(!S.pinPromptFor) return;
    if(e.target && e.target.id === 'pinTypeInput') return; // the PIN field handles its own typing
    if(document.querySelector('.cc-dialog-backdrop')) return;
    if(e.key >= '0' && e.key <= '9'){
      var digitBtn = app.querySelector('[data-digit="'+e.key+'"]');
      if(digitBtn && !digitBtn.disabled){ e.preventDefault(); digitBtn.click(); }
    } else if(e.key === 'Backspace'){
      var backBtn = app.querySelector('[data-act="pin-back"]');
      if(backBtn){ e.preventDefault(); backBtn.click(); }
    } else if(e.key === 'Escape'){
      var cancelBtn = app.querySelector('[data-act="pin-cancel"]');
      if(cancelBtn){ e.preventDefault(); cancelBtn.click(); }
    }
  });

  // Down/Page Down = next card and Up/Page Up = previous card, in whichever swipe feed is on screen.
  // This is the same one-card move the wheel makes. Wired once globally, like the PIN handler above,
  // and it acts on whatever wireVerticalSwipeFeed() registered most recently. It stays quiet while a
  // PIN prompt or the sound shop is open, or while typing in a field.
  document.addEventListener('keydown', function(e){
    if(S.pinPromptFor || S.soundPickerOpen || !activeFeedSwipe) return;

    return REEF_PLACES[id] || { name: (label || 'Secret') + ' Cove', art:'🏝️', hue:'#1c8c93', ink:'#0d5262' };
  }
  // Map spots as % of the map box: [x, y] on a wide screen, then [x, y] on a narrow one.
  var REEF_SLOTS = [
    [[22,30],[27,13]], [[52,20],[73,26.5]], [[81,33],[27,40]],
    [[36,61],[73,53.5]], [[66,57],[27,67]], [[50,40],[73,80.5]]
  ];

  function reefPlaces(){
    var live = S.decks.filter(function(d){ return !d.archived; });
    var tabs = buildSubjectTabs(live);
    if(!tabs) return null;
    return tabs.slice(0, REEF_SLOTS.length).map(function(t){
      var decks = live.filter(function(d){ return (d.subject ? subjectMeta(d.subject).id : 'other') === t.id; });
      var study = decks.filter(function(d){ return !(d.feedMode || d.storyMode || d.equationMode || d.langFeedMode || d.readAlongMode || d.flashFeedMode || d.miniStoryMode); });
      var ready = 0, done = 0;
      study.forEach(function(d){
        var dc = S.dueCounts[d.id] || { due:0, total:0 };
        if(dc.total > 0 && dc.due > 0) ready++;
        else if(dc.total > 0) done++;
      });
      return { id: t.id, label: t.label, place: reefPlaceFor(t.id, t.label), decks: decks.length, studyCount: study.length, ready: ready, done: done };
    });
  }

  function reefSpotStyle(slot, i, hue){
    return '--x:'+slot[0][0]+'%;--y:'+slot[0][1]+'%;--xs:'+slot[1][0]+'%;--ys:'+slot[1][1]+'%;--i:'+i+';--hue:'+hue;
  }
  function reefPearls(p){
    if(!p.studyCount) return '';
    var n = Math.min(p.studyCount, 8), lit = Math.min(n, Math.round(p.done / p.studyCount * n));
    var s = '';
    for(var i = 0; i < n; i++) s += '<i class="'+(i < lit ? 'on' : '')+'"></i>';
    return '<span class="reef-pearls" aria-hidden="true">'+s+'</span>';
  }
  function reefMapHTML(places){
    // Shelly waits at the first place with something ready, so the next step is always obvious.
    var next = places.find(function(p){ return p.ready > 0; }) || places[0];
    var nextIdx = places.indexOf(next);
    var pts = places.map(function(p, i){ return REEF_SLOTS[i]; });
    var path = function(k){ return pts.map(function(s){ return s[k][0]+','+s[k][1]; }).join(' '); };
    var spots = places.map(function(p, i){
      var say = p.place.name + '. ' + (p.ready ? p.ready + ' ready to practice.' : (p.studyCount ? 'All done here!' : 'Tap to explore.'));
      return '' +
        '<button type="button" class="reef-spot'+(i === nextIdx ? ' next' : '')+'" data-reef-place="'+esc(p.id)+'" style="'+reefSpotStyle(REEF_SLOTS[i], i, p.place.hue)+'" aria-label="'+esc(say)+'">' +

    }).join('');
    var tally = reefTally();
    var bubble = next.ready ? 'Let\'s swim to the '+next.place.name+'!' : 'Pick a place to explore!';
    var guide = 'Shelly'; try { guide = coveSwimName() || 'Shelly'; } catch(e){}
    return '' +
      '<section class="reef-map-wrap" aria-label="Cove map">' +
        '<div class="reef-map-head">' +
          '<div class="reef-map-title"><h2>Where should we swim?</h2><p>'+esc(guide)+' says: '+esc(bubble)+'</p></div>' +
          '<button type="button" class="reef-say" data-reef-say="'+esc('Where should we swim? '+guide+' says: '+bubble)+'" aria-label="Read this aloud">🔊</button>' +
        '</div>' +
        '<div class="reef-map">' +
          '<div class="reef-rays" aria-hidden="true"></div>' +
          '<svg class="reef-path wide" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><polyline points="'+path(0)+'"/></svg>' +
          '<svg class="reef-path narrow" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><polyline points="'+path(1)+'"/></svg>' +
          '<div class="reef-sand" aria-hidden="true"></div>' +
          '<div class="reef-kelp k1" aria-hidden="true"></div><div class="reef-kelp k2" aria-hidden="true"></div><div class="reef-kelp k3" aria-hidden="true"></div>' +
          spots +
          '<span class="reef-swimmer s1" aria-hidden="true">🐠</span><span class="reef-swimmer s2" aria-hidden="true">🐟</span>' +
          '<span class="reef-deco d1" aria-hidden="true">🪸</span><span class="reef-deco d2" aria-hidden="true">🐚</span><span class="reef-deco d3" aria-hidden="true">⭐</span>' +
          '<button type="button" class="reef-spot special" data-reef-special="treasure" style="'+reefSpotStyle(REEF_SPECIAL.treasure, 7, '#c99a2e')+'" aria-label="My Treasure Reef">' +
            '<span class="reef-rock chest"><span class="reef-art">💎</span>'+(tally.found ? '<span class="reef-ready gold" aria-hidden="true">'+tally.found+'</span>' : '')+'</span>' +
            '<span class="reef-label"><b>Treasure Reef</b><small>My sea friends</small></span>' +
          '</button>' +
          '<button type="button" class="reef-spot special" data-reef-special="story" style="'+reefSpotStyle(REEF_SPECIAL.story, 8, '#3a7bd5')+'" aria-label="Story Maker">' +

  function reefPlaceHeadHTML(p){

  // Runs at the end of renderHome() for Child Mode: swaps the subject tabs for the map, or puts the
  // chosen place's banner above its decks.
  function reefHome(){
    if(!reefKid() || S.editMode) return;
    var places = reefPlaces();
    if(!places){ S.reefPlace = null; return; }
    if(S.reefPlace && !places.some(function(p){ return p.id === S.reefPlace; })){ S.reefPlace = null; S.subjectFilter = 'all'; render(); return; }
    var tabs = app.querySelector('.subject-tabs'); if(tabs) tabs.remove();
    var grid = app.querySelector('.deck-grid'), note = app.querySelector('.empty-filter-note');
    var holder = document.createElement('div');
    if(!S.reefPlace){
      if(grid) grid.hidden = true;
      if(note) note.hidden = true;
      holder.innerHTML = reefMapHTML(places);
    } else {
      holder.innerHTML = reefPlaceHeadHTML(places.find(function(p){ return p.id === S.reefPlace; }));
    }
    var el = holder.firstChild;
    if(grid) grid.parentNode.insertBefore(el, grid); else app.appendChild(el);
    if(S.reefPlace && grid){
      grid.classList.add('reef-place-grid');
      grid.style.setProperty('--hue', reefPlaceFor(S.reefPlace).hue);
    }
    el.querySelectorAll('[data-reef-place]').forEach(function(b){
      b.addEventListener('click', function(){
        Sound.bloop(520);
        var id = b.dataset.reefPlace;
        reefGo('swim', b, function(){ S.reefPlace = id; S.subjectFilter = id; render(); window.scrollTo(0, 0); });
      });
    });
    var back = el.querySelector('[data-act="reef-map"]');
    if(back) back.addEventListener('click', function(){
      Sound.bloop(420);
      reefGo('swim', back, function(){ S.reefPlace = null; S.subjectFilter = 'all'; render(); });
    });
    var chest = el.querySelector('[data-reef-special="treasure"]');
    if(chest) chest.addEventListener('click', function(){ Sound.bloop(600); reefGo('swim', chest, function(){ S.view = 'collection'; render(); window.scrollTo(0, 0); }); });
    var bottle = el.querySelector('[data-reef-special="story"]');
    if(bottle) bottle.addEventListener('click', function(){ reefGo('dive', bottle, startStoryMaker); });

  function reefWireSay(root){

  /* ---------- transitions: a silly splash into a deck, a pop back up out of it ---------- */
  var reefBusy = false;
  function reefTxHTML(kind){
    var bubbles = '';
    for(var i = 0; i < 18; i++){
      var x = Math.round(Math.random() * 100), s = 10 + Math.round(Math.random() * 34), d = (Math.random() * 0.45).toFixed(2);

    }
    var word = kind === 'dive' ? 'Splash!' : 'Pop!';
    var letters = word.split('').map(function(c, i){ return '<span style="--i:'+i+'">'+esc(c)+'</span>'; }).join('');
    return '' +
      '<div class="tx-water"><svg class="tx-crest" viewBox="0 0 1200 120" preserveAspectRatio="none"><path d="M0 70 C150 10 300 10 450 60 S750 120 900 50 S1100 0 1200 50 V120 H0 Z"/></svg></div>' +
      '<div class="tx-bubbles">'+bubbles+'</div>' +
      '<div class="tx-fish f1">🐠</div><div class="tx-fish f2">🐡</div><div class="tx-fish f3">🐟</div>' +
      '<div class="tx-shelly">'+mascotTurtleSVG('tx-shelly-svg')+'</div>' +
      '<div class="tx-word">'+letters+'</div>';
  }
  // Plays a transition and calls fn while the screen is covered. With Calm motion (or in Adult
  // Mode) fn just runs straight away.
  function reefGo(kind, fromEl, fn){
    if(!reefKid() || reefCalm() || reefBusy){ fn(); return; }
    reefBusy = true;
    var ov = document.createElement('div');
    ov.className = 'reef-tx reef-tx-' + kind;
    ov.setAttribute('aria-hidden', 'true');
    if(kind === 'swim'){
      var r = fromEl && fromEl.getBoundingClientRect ? fromEl.getBoundingClientRect() : null;
      var cx = r ? r.left + r.width / 2 : innerWidth / 2, cy = r ? r.top + r.height / 2 : innerHeight / 2;
      ov.style.setProperty('--cx', cx + 'px'); ov.style.setProperty('--cy', cy + 'px');
      ov.innerHTML = '<span class="tx-iris"></span>';
    } else {
      ov.innerHTML = reefTxHTML(kind);
      try { Sound.bubbles(5); } catch(e){}
    }
    document.body.appendChild(ov);
    var mid = kind === 'swim' ? 230 : 560, end = kind === 'swim' ? 560 : 1300;
    setTimeout(function(){ try { fn(); } catch(e){ console.error('[Coral Cove] transition', e); } }, mid);
    setTimeout(function(){ ov.remove(); reefBusy = false; }, end);
  }
  function reefInDeck(){

  /* ---------- a short tutor line on a miss: the answer, then what to try next time ---------- */
  function reefTip(answer){
    var a = String(answer || '').trim(), tip;
    if(/^-?\d+([.,]\d+)?$/.test(a)) tip = 'Next time, count up on your fingers to check.';
    else if(/[가-힣]/.test(a)) tip = 'Next time, say each block out loud, one at a time.';
    else if(/\s/.test(a)) tip = 'Next time, read it one word at a time, out loud.';
    else if(/^[A-Za-z]/.test(a)) tip = 'Next time, look at the first letter, ' + esc(a.charAt(0)) + ', and say the word slowly.';
    else tip = 'Next time, say it out loud with Shelly.';
    return '<span class="reef-tip"><span class="reef-tip-face" aria-hidden="true">🐢</span><span>' + tip + ' Shelly will bring this one back soon.</span></span>';
  }

  function reefFriend(id){ return REEF_FRIENDS.find(function(f){ return f.id === id; }) || null; }
  function reefTally(){
    var c = (S.stats && S.stats.collection) || {};

  // Adds a sea friend to newStats.collection and remembers it for the summary screen.
  function reefAward(stats, newStats){
    S.reefFind = null;
    if(!reefKid() || !S.sessionReviewed) return;
    var have = Object.assign({}, stats.collection || {});
    var fresh = REEF_FRIENDS.filter(function(f){ return !have[f.id]; });
    var pool = fresh.length ? fresh : REEF_FRIENDS;
    var pick = pool[Math.floor(Math.random() * pool.length)];
    have[pick.id] = (have[pick.id] || 0) + 1;
    newStats.collection = have;
    S.reefFind = { id: pick.id, again: !fresh.length };
  }
  function reefSummary(){
    var deck = S.decks.find(function(d){ return d.id === S.currentDeckId; }) || { name:'Deck', emoji:'🌊' };

  // Independent of the main boot chain above -- photo upload should light up whenever it resolves

    S.assetsAvailable = Assets.available();
    if(S.booted && S.view === 'editor') render();

  // Also independent of the main boot chain -- real pronunciation clips just light up whenever
  // the db handle resolves; nothing needs to wait on it, since Speech.speak() falls back to the
