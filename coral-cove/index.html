  /* ---------- DAILY PLAN (Coral Calendar, inside Coral Cove) ----------
     For profiles with planOn (Wendy). Each day gets a schedule built automatically from the profile's own
     Coral Cove decks: a warm-up (Sound Blend / Hangul Blend), review of the decks with the most cards
     due, listening, a speed round and a story, sized to the profile's daily minutes. "Start" plays the
     activities back to back; each one's results (cards, right, time, missed words) are saved to
     profiles/<id>/plan/<YYYY-MM-DD> as soon as it ends, and the daily and monthly summaries are built
     from those records plus the round history, so they're always current. The day's lineup is saved
     the first time it's shown, so it stays put for the rest of the day. */
  var PLAN_DEFAULT = { start: '19:00', minutes: 20, days: [0,1,2,3,4,5,6] };
  var PLAN_KINDS = {
    warmup:    { label: 'Warm-up',     icon: '🔥', order: 0 },
    review:    { label: 'Review',      icon: '🔁', order: 1 },
    listening: { label: 'Listening',   icon: '👂', order: 2 },
    speaking:  { label: 'Speaking',    icon: '🎙️', order: 3 },
    building:  { label: 'Sentences',   icon: '🧩', order: 4 },
    speed:     { label: 'Speed round', icon: '⏱️', order: 5 },
    story:     { label: 'Story time',  icon: '🎞️', order: 6 }
  };
  var PLAN_SEC_PER_CARD = { flip: 12, read: 12, choice: 8, match: 10, blank: 10, timedchoice: 9, blend: 12, listen: 9, echo: 25, build: 18, hanja: 14, numsys: 14 };
  var DAY_NAMES = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  var planCountdownTimer = null;

  function planOn(){ return !!(S.profile && S.profile.planOn); }
  function planSettings(){ return Object.assign({}, PLAN_DEFAULT, S.planSettings || {}); }
  function clearPlanTimer(){ if(planCountdownTimer){ clearInterval(planCountdownTimer); planCountdownTimer = null; } }
  function isoToDate(iso){ var p = iso.split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }
  function fmtClock(mins){ var h = Math.floor(mins/60) % 24, m = mins % 60; var ap = h >= 12 ? 'PM' : 'AM'; var h12 = h % 12 || 12; return h12 + ':' + String(m).padStart(2,'0') + ' ' + ap; }
  function startMinutes(){ var p = String(planSettings().start || '19:00').split(':'); return (+p[0]||0)*60 + (+p[1]||0); }
  function fmtDateLong(iso){ return isoToDate(iso).toLocaleDateString(undefined, { weekday:'long', month:'short', day:'numeric' }); }
  function fmtMins(ms){ var m = Math.round((ms||0)/60000); return m < 1 && ms > 0 ? '<1' : String(m); }

  function dominantMode(cards){
    var c = {}; cards.forEach(function(x){ var m = x.mode || 'flip'; c[m] = (c[m]||0) + 1; });
    var best = 'flip', n = -1; Object.keys(c).forEach(function(k){ if(c[k] > n){ best = k; n = c[k]; } });
    return best;
  }
  function planDeckKind(d, cards){
    if(d.miniStoryMode) return 'story';
    if(d.feedMode || d.storyMode || d.equationMode || d.langFeedMode || d.readAlongMode || d.flashFeedMode) return null; // open-ended feeds have no "done"
    if(!cards.length) return null;
    var m = dominantMode(cards);
    if(m === 'blend') return 'warmup';
    if(m === 'listen') return 'listening';
    if(m === 'echo') return 'speaking';
    if(m === 'build') return 'building';
    if(m === 'timedchoice') return 'speed';
    return 'review';
  }
  function planGenerate(date){
    var st = planSettings();
    if(!S.decks.length) return Promise.reject(new Error('decks not loaded yet'));
    var decks = S.decks.filter(function(d){ return !d.archived; });
    return Promise.all([
      Promise.all(decks.map(function(d){ return S.store.getCardsOnce(d.id).catch(function(){ return []; }); })),
      S.store.listPlanDays().catch(function(){ return []; })
    ]).then(function(res){
      var lists = res[0], past = res[1];
      var last = {};   // deckId -> most recent date it was planned
      past.forEach(function(day){ (day.blocks||[]).forEach(function(b){ var k = b.deckId || 'maker'; if(!last[k] || last[k] < day.date) last[k] = day.date; }); });
      var now = Date.now(), byKind = {};
      decks.forEach(function(d, i){
        var cards = lists[i] || [];
        var kind = planDeckKind(d, cards);
        if(!kind) return;
        var due = cards.filter(function(c){ return cardState(c) !== 'new' && (c.due||0) <= now; }).length;
        var mode = dominantMode(cards);
        var n = kind === 'story' ? 0 : Math.min(currentDifficulty().roundSize, buildStudyPool(cards).length);
        var minutes = kind === 'story' ? 3 : Math.max(2, Math.round(n * (PLAN_SEC_PER_CARD[mode] || 10) / 60));
        (byKind[kind] = byKind[kind] || []).push({ deck: d, due: due, minutes: minutes, last: last[d.id] || '' });
      });
      function pick(kind, n, byDue){
        var list = (byKind[kind] || []).slice().sort(function(a, b){
          if(byDue && b.due !== a.due) return b.due - a.due;
          if(a.last !== b.last) return a.last < b.last ? -1 : 1; // least recently planned first
          return (a.deck.order||0) - (b.deck.order||0);
        });
        return list.slice(0, n);
      }
      var review = pick('review', 2, true);
      var stories = pick('story', 1);
      var storyBlock = stories.length && (!stories[0].last || stories[0].last < todayISO(new Date(Date.now() - 3*864e5)))
        ? stories[0] : { deck: null, maker: true, minutes: 3 };
      // Priority order for fitting into the day's minutes; displayed in lesson order afterwards.
      var cand = [];
      if(review[0]) cand.push(['review', review[0]]);
      pick('warmup', 1).forEach(function(x){ cand.push(['warmup', x]); });
      pick('listening', 1).forEach(function(x){ cand.push(['listening', x]); });
      pick('speaking', 1).forEach(function(x){ cand.push(['speaking', x]); });
      pick('building', 1).forEach(function(x){ cand.push(['building', x]); });
      cand.push(['story', storyBlock]);
      if(review[1]) cand.push(['review', review[1]]);
      pick('speed', 1).forEach(function(x){ cand.push(['speed', x]); });
      var total = 0, chosen = [];
      cand.forEach(function(c){ if(!chosen.length || total + c[1].minutes <= st.minutes + 2){ chosen.push(c); total += c[1].minutes; } });
      // Short on time with few decks? Add another round of review / listening / speed (each round
      // draws fresh cards), so the session fills the minutes chosen in the schedule.
      var extra = cand.filter(function(c){ return c[0] !== 'story' && c[0] !== 'warmup'; });
      for(var round = 0; extra.length && round < 6 && total < st.minutes - 2; round++){
        var c2 = extra[round % extra.length];
        if(total + c2[1].minutes > st.minutes + 2) break;
        chosen.push([c2[0], c2[1], Math.floor(round / extra.length) + 2]); total += c2[1].minutes;
      }
      // Lesson order: warm-up, then each pass of review → listening → speed, story always last.
      chosen.sort(function(a, b){
        var sa = a[0] === 'story' ? 1 : 0, sb = b[0] === 'story' ? 1 : 0;
        if(sa !== sb) return sa - sb;
        var pa = a[0] === 'warmup' ? 0 : (a[2] || 1), pb = b[0] === 'warmup' ? 0 : (b[2] || 1);
        if(pa !== pb) return pa - pb;
        return PLAN_KINDS[a[0]].order - PLAN_KINDS[b[0]].order;
      });
      return {
        date: date,
        createdAt: Date.now(),
        blocks: chosen.map(function(c, i){
          var x = c[1];
          return x.maker
            ? { id: 'b'+i, kind: 'story', maker: true, deckId: null, name: 'Story Maker', emoji: '✨', minutes: x.minutes, done: false }
            : { id: 'b'+i, kind: c[0], deckId: x.deck.id, name: x.deck.name, emoji: x.deck.emoji || '🌊', minutes: x.minutes, done: false, pass: c[2] || 1 };
        })
      };
    });
  }
  function planLoad(date, force){
    date = date || todayISO();
    S.planLoading = true;
    return S.store.getPlanSettings().then(function(ps){
      S.planSettings = ps || null;
      return S.store.getPlanDay(date);
    }).then(function(day){
      var off = planSettings().days.indexOf(isoToDate(date).getDay()) < 0;
      if(day && !force) return day;
      if(date !== todayISO()) return day || null;      // past days are only ever read, never invented
      if(off && !force) return { date: date, off: true, blocks: [] };
      return planGenerate(date).then(function(d){ return S.store.setPlanDay(date, d).then(function(){ return d; }); });
    }).then(function(day){
      S.planLoading = false;
      if(date === todayISO()) S.planDay = day;
      return day;
    }).catch(function(e){ S.planLoading = false; console.error('[Coral Cove] plan load failed', e); return null; });
  }
  function planSave(){ if(S.planDay && !S.planDay.off) return S.store.setPlanDay(S.planDay.date, S.planDay); return Promise.resolve(); }
  function planNextIndex(day){ day = day || S.planDay; if(!day || !day.blocks) return -1; for(var i = 0; i < day.blocks.length; i++){ if(!day.blocks[i].done) return i; } return -1; }

  function planStartNext(){
    clearPlanTimer();
    var day = S.planDay;
    if(!day || day.date !== todayISO()){ planLoad().then(function(){ planStartNext(); }); return; }
    var i = planNextIndex(day);
    if(i < 0){ S.planRun = null; S.view = 'plan'; render(); return; }
    var b = day.blocks[i];
    if(!day.startedAt){ day.startedAt = Date.now(); planSave(); }
    S.planRun = { date: day.date, index: i, startedAt: Date.now(), missed: [], recorded: false };
    try { Ocean.flurry(); } catch(e){}
    if(b.maker){ startStoryMaker(); return; }
    var d = S.decks.find(function(x){ return x.id === b.deckId; });
    if(!d){ b.done = true; b.skipped = true; planSave(); planStartNext(); return; } // deck was deleted since
    if(d.miniStoryMode) startMiniStory(d.id); else startStudy(d.id);
  }
  // Saves the finished activity into today's record (called by finishStudy and the Mini Story end page).
  function planRecord(result){
    var r = S.planRun;
    if(!r || r.recorded) return;
    var day = S.planDay;
    if(!day || day.date !== r.date || !day.blocks[r.index]) return;
    var b = day.blocks[r.index];
    var seen = {};
    Object.assign(b, { done: true, ms: Date.now() - r.startedAt, endedAt: Date.now(),
      missed: r.missed.filter(function(m){ var k = m.f+'|'+m.b; if(seen[k]) return false; seen[k] = 1; return true; }).slice(0, 30) }, result || {});
    r.recorded = true;
    if(planNextIndex(day) < 0) day.finishedAt = Date.now();
    planSave();
  }
  function planNoteAnswer(card, rating){
    if(S.planRun && !S.planRun.recorded && rating === 'again') S.planRun.missed.push({ f: String(card.front||'').slice(0,60), b: String(card.back||'').slice(0,60) });
  }
  // "Next up" strip shown on the round summary and the Mini Story end page while a plan is running.
  function planNextHTML(){
    var r = S.planRun, day = S.planDay;
    if(!r || !r.recorded || !day) return '';
    var i = planNextIndex(day), doneN = day.blocks.filter(function(b){ return b.done; }).length;
    var head = '<div class="plan-next-head">📅 Today\'s plan · '+doneN+' of '+day.blocks.length+' done</div>';
    if(i < 0) return '<div class="plan-next">'+head+'<div class="plan-next-line">🎉 That was the last activity for today!</div>' +
      '<div class="plan-next-btns"><button type="button" class="btn btn-primary" data-act="plan-open">📅 See today\'s summary</button></div></div>';
    var b = day.blocks[i], k = PLAN_KINDS[b.kind] || PLAN_KINDS.review;
    return '<div class="plan-next">'+head+'<div class="plan-next-line">Next: '+k.icon+' '+k.label+' — '+esc(b.emoji)+' '+esc(b.name)+'</div>' +
      '<div class="plan-next-btns"><button type="button" class="btn btn-primary" data-act="plan-next">▶ Start now <span id="planCountdown" class="plan-count">5</span></button>' +
      '<button type="button" class="btn btn-ghost" data-act="plan-pause">⏸ Pause</button></div></div>';
  }
  function wirePlanNext(root){
    root = root || app;
    var nb = root.querySelector('[data-act="plan-next"]'), pb = root.querySelector('[data-act="plan-pause"]'), ob = root.querySelector('[data-act="plan-open"]');
    function own(el){ el.addEventListener('pointerdown', function(e){ e.stopPropagation(); }); }
    if(ob){ own(ob); ob.addEventListener('click', function(){ S.planRun = null; openPlan(); }); }
    if(pb){ own(pb); pb.addEventListener('click', function(){ clearPlanTimer(); S.planRun = null; openPlan(); }); }
    if(nb){
      own(nb);
      nb.addEventListener('click', planStartNext);
      clearPlanTimer();
      var left = 5, run = S.planRun, view = S.view;
      planCountdownTimer = setInterval(function(){
        if(S.planRun !== run || S.view !== view){ clearPlanTimer(); return; }
        left -= 1;
        var el = document.getElementById('planCountdown');
        if(el) el.textContent = left > 0 ? String(left) : '';
        if(left <= 0){ clearPlanTimer(); planStartNext(); }
      }, 1000);
    }
  }

  function openPlan(date){
    clearPlanTimer();
    S.view = 'plan';
    S.planViewDate = date || todayISO();
    S.planViewDay = null;
    render();
    planLoad(S.planViewDate).then(function(day){ S.planViewDay = day; if(S.view === 'plan') render(); });
  }
  function planDayStats(day){
    var t = { cards: 0, right: 0, ms: 0, done: 0, missed: [] };
    (day && day.blocks || []).forEach(function(b){
      if(!b.done) return;
      t.done++; t.ms += b.ms || 0; t.cards += b.total || 0; t.right += b.right || 0;
      (b.missed || []).forEach(function(m){ if(!t.missed.some(function(x){ return x.f === m.f; })) t.missed.push(m); });
    });
    t.acc = t.cards ? Math.round(t.right / t.cards * 100) : null;
    return t;
  }
  function renderPlan(){
    var date = S.planViewDate || todayISO(), isToday = date === todayISO();
    var day = isToday ? (S.planViewDay || S.planDay) : S.planViewDay;
    var st = planSettings();
    var body;
    if(!day && S.planLoading) body = '<div class="stats-section"><p>Loading the plan…</p></div>';
    else if(!day) body = '<div class="stats-section"><p>No plan was made for this day.</p></div>';
    else if(day.off) body = '<div class="stats-section"><h3>😌 No session scheduled today</h3><p class="algo-note">Today is a day off in the schedule.</p>' +
      '<button type="button" class="btn btn-primary" data-act="plan-anyway">📅 Make a plan for today anyway</button></div>';
    else {
      var t = planDayStats(day), clock = startMinutes(), nextI = planNextIndex(day);
      var rows = day.blocks.map(function(b, i){
        var k = PLAN_KINDS[b.kind] || PLAN_KINDS.review;
        var time = fmtClock(clock); clock += b.minutes || 0;
        var status = b.done
          ? (b.skipped ? '<span class="plan-status skip">skipped</span>' : '<span class="plan-status done">✅ '+(b.total ? (b.right+'/'+b.total+(S.managingDecks ? ' · '+Math.round(b.right/b.total*100)+'%' : '')) : 'done')+' · '+fmtMins(b.ms)+' min</span>')
          : (i === nextI && isToday ? '<span class="plan-status next">Up next</span>' : '<span class="plan-status"></span>');
        return '<div class="plan-row'+(b.done?' is-done':'')+(i===nextI&&isToday?' is-next':'')+'">' +
          '<div class="plan-time">'+time+'</div>' +
          '<div class="plan-what"><div class="plan-kind">'+k.label+(b.pass > 1 ? ' · round '+b.pass : '')+'</div><div class="plan-deck">'+esc(b.emoji)+' '+esc(b.name)+'</div></div>' +
          status + '</div>';
      }).join('');
      var pct = Math.round(t.done / Math.max(1, day.blocks.length) * 100);
      body = '' +
        '<div class="stats-section">' +
          '<h3>'+(isToday ? '📅 Today — ' : '📅 ')+esc(fmtDateLong(date))+'</h3>' +
          '<p class="algo-note">Starts '+fmtClock(startMinutes())+' · about '+day.blocks.reduce(function(s,b){ return s+(b.minutes||0); },0)+' min</p>' +
          '<div class="plan-bar"><span style="width:'+pct+'%"></span></div>' +
          '<div class="summary-stats plan-stats">' +
            '<div class="summary-stat"><span class="num tabular">'+t.done+'/'+day.blocks.length+'</span><span class="label">Done</span></div>' +
            '<div class="summary-stat"><span class="num tabular">'+fmtMins(t.ms)+'</span><span class="label">Minutes</span></div>' +
            '<div class="summary-stat"><span class="num tabular">'+t.cards+'</span><span class="label">Cards</span></div>' +
            (S.managingDecks ? '<div class="summary-stat"><span class="num tabular">'+(t.acc == null ? '—' : t.acc+'%')+'</span><span class="label">Right</span></div>' : '') +
          '</div>' +
          '<div class="plan-list">'+rows+'</div>' +
          (isToday ? (nextI >= 0
            ? '<button type="button" class="btn btn-primary plan-go" data-act="plan-start">▶ '+(t.done ? 'Continue' : 'Start today\'s session')+'</button>'
            : '<div class="plan-alldone">🎉 All done for today!</div>') : '') +
          (isToday && !t.done && S.managingDecks ? '<button type="button" class="btn btn-ghost" data-act="plan-redo">↻ Make a new lineup</button>' : '') +
        '</div>' +
        (t.missed.length ? '<div class="stats-section"><h3>'+(S.managingDecks ? '📝 Words to review' : '📝 Words to practice')+'</h3><div class="plan-missed">' +
          t.missed.slice(0, 24).map(function(m){ return '<span class="plan-chip"><b>'+esc(m.f)+'</b>'+(m.b ? ' · '+esc(m.b) : '')+'</span>'; }).join('') + '</div></div>' : '');
    }
    var days = st.days;
    var settingsHTML = S.planSettingsOpen ? ('' +
      '<div class="stats-section plan-settings">' +
        '<h3>⚙️ Schedule</h3>' +
        '<label class="field"><span>Start time</span><input type="time" id="planStart" value="'+esc(st.start)+'"></label>' +
        '<label class="field"><span>Minutes per day</span><select id="planMinutes">'+[10,15,20,25,30,40].map(function(m){ return '<option value="'+m+'"'+(m===+st.minutes?' selected':'')+'>'+m+' minutes</option>'; }).join('')+'</select></label>' +
        '<div class="plan-days">'+DAY_NAMES.map(function(n, i){ return '<button type="button" class="subject-chip'+(days.indexOf(i)>=0?' active':'')+'" data-plan-day="'+i+'">'+n+'</button>'; }).join('')+'</div>' +
        '<button type="button" class="btn btn-primary" data-act="plan-save-settings">Save schedule</button>' +
      '</div>') : '';
    app.innerHTML = '' +
      '<div class="nav-row">' +
        '<button class="back-btn" data-act="plan-home">⟵ Lagoon</button>' +
        '<span class="nav-title">📅 Daily Plan</span>' +
      '</div>' +
      '<div class="stats-page">' +

  function openPlanMonth(ym){
    clearPlanTimer();

    S.planMonth = ym || todayISO().slice(0,7);
    S.planMonthData = null;
    render();
    Promise.all([S.store.listPlanDays().catch(function(){ return []; }), S.store.getHistoryOnce().catch(function(){ return []; })]).then(function(res){
      S.planMonthData = { days: res[0], history: res[1] };
      if(S.view === 'planMonth') render();
    });
  }
  function renderPlanMonth(){
    var ym = S.planMonth, data = S.planMonthData;
    var y = +ym.slice(0,4), mo = +ym.slice(5,7) - 1;
    var first = new Date(y, mo, 1), nDays = new Date(y, mo+1, 0).getDate();
    var prev = todayISO(new Date(y, mo-1, 1)).slice(0,7), next = todayISO(new Date(y, mo+1, 1)).slice(0,7);
    var body = '<div class="stats-section"><p>Loading…</p></div>';
    if(data){
      var byDate = {}; data.days.forEach(function(d){ if(d.date && d.date.slice(0,7) === ym) byDate[d.date] = d; });
      var st = planSettings(), today = todayISO();
      var cells = '';
      for(var i = 0; i < first.getDay(); i++) cells += '<div class="pm-cell empty"></div>';
      var planned = 0, complete = 0, partial = 0;
      var firstPlan = data.days.reduce(function(m, d){ return d.date && d.blocks && d.blocks.length && (!m || d.date < m) ? d.date : m; }, '');
      for(var dn = 1; dn <= nDays; dn++){
        var iso = ym + '-' + String(dn).padStart(2,'0'), d = byDate[iso], cls = 'none', label = '';

        else if(!firstPlan || iso < firstPlan) cls = 'pre';
        else if(d && d.blocks && d.blocks.length){
          planned++;
          var t = planDayStats(d);
          if(t.done >= d.blocks.length){ cls = 'full'; complete++; } else if(t.done){ cls = 'part'; partial++; } else if(iso === today) cls = 'todo';
          label = t.done + '/' + d.blocks.length;
        } else if(st.days.indexOf(isoToDate(iso).getDay()) < 0) cls = 'off';
        cells += '<button type="button" class="pm-cell '+cls+(iso===today?' today':'')+'" data-pm-date="'+iso+'"'+(cls==='future'?' disabled':'')+'><span class="pm-n">'+dn+'</span><span class="pm-l">'+label+'</span></button>';
      }
      // Totals come from every round played this month (in or out of the plan), plus plan time.
      var hist = data.history.filter(function(h){ return h.endedAt && todayISO(new Date(h.endedAt)).slice(0,7) === ym; });
      var cards = 0, right = 0, perDeck = {};
      hist.forEach(function(h){
        cards += h.total || 0; right += h.right || 0;
        var k = h.deckName || 'Deck';
        var p = perDeck[k] = perDeck[k] || { emoji: h.deckEmoji || '🌊', rounds: 0, cards: 0, right: 0 };
        p.rounds++; p.cards += h.total || 0; p.right += h.right || 0;
      });
      var ms = 0, missCount = {};
      Object.keys(byDate).forEach(function(k){ var t = planDayStats(byDate[k]); ms += t.ms;
        (byDate[k].blocks||[]).forEach(function(b){ (b.missed||[]).forEach(function(m){ var key = m.f + (m.b ? ' · ' + m.b : ''); missCount[key] = (missCount[key]||0) + 1; }); }); });
      // Streak: consecutive scheduled days (back from today) whose plan was fully done; days off don't break it.
      var streak = 0, all = {}; data.days.forEach(function(d){ all[d.date] = d; });
      for(var back = 0; back < 400; back++){
        var dd = new Date(); dd.setDate(dd.getDate() - back); var iso2 = todayISO(dd), rec = all[iso2];
        if(rec && rec.blocks && rec.blocks.length && planDayStats(rec).done >= rec.blocks.length){ streak++; continue; }

        if(st.days.indexOf(dd.getDay()) < 0 && !rec) continue;

      var deckRows = Object.keys(perDeck).sort(function(a,b){ return perDeck[b].cards - perDeck[a].cards; }).map(function(k){
        var p = perDeck[k], acc = p.cards ? Math.round(p.right/p.cards*100) : 0;

      }).join('');
      var topMissed = Object.keys(missCount).sort(function(a,b){ return missCount[b]-missCount[a]; }).slice(0, 15);
      body = '' +
        '<div class="stats-section">' +
          '<div class="pm-head"><button type="button" class="icon-btn" data-pm-go="'+prev+'" aria-label="Previous month">‹</button>' +
            '<h3>'+first.toLocaleDateString(undefined, { month:'long', year:'numeric' })+'</h3>' +
            '<button type="button" class="icon-btn" data-pm-go="'+next+'" aria-label="Next month">›</button></div>' +
          '<div class="pm-grid">'+DAY_NAMES.map(function(n){ return '<div class="pm-dow">'+n.charAt(0)+'</div>'; }).join('')+cells+'</div>' +
          '<div class="pm-legend"><span class="pm-key full"></span>All done <span class="pm-key part"></span>Started <span class="pm-key none"></span>Missed <span class="pm-key off"></span>Day off</div>' +
        '</div>' +
        '<div class="stats-section">' +
          '<h3>📈 This month</h3>' +
          '<div class="summary-stats plan-stats">' +
            '<div class="summary-stat"><span class="num tabular">'+complete+'/'+planned+'</span><span class="label">Days done</span></div>' +
            '<div class="summary-stat"><span class="num tabular">'+streak+'</span><span class="label">Day streak</span></div>' +
            '<div class="summary-stat"><span class="num tabular">'+fmtMins(ms)+'</span><span class="label">Plan minutes</span></div>' +
            '<div class="summary-stat"><span class="num tabular">'+cards+'</span><span class="label">Cards</span></div>' +
            '<div class="summary-stat"><span class="num tabular">'+(cards ? Math.round(right/cards*100)+'%' : '—')+'</span><span class="label">Right</span></div>' +

      '<div class="stats-page">' +

  /* ---------- timed multiple choice ("Timed choice" mode) ----------
     A sixth per-card mode, alongside flip/read/choice/match/blank: same multiple-choice interaction
     as 'choice' mode, but a visible countdown bar forces an answer before time runs out (at which
     point the correct option highlights itself and the card is graded as a miss), plus a "+time"
     button that adds a few more seconds without penalty. Built with Korean vocab practice in mind
     (see the "Korean Speed Quiz" decks), but it's a generic mode any deck can use.

     Direction alternates in groups rather than being fixed or fully random per card: every
     TIMED_CHOICE_GROUP_SIZE cards, a coin flip decides whether the next stretch of cards asks
     "front as the question, back-side text as the answer" (fwd -- e.g. "How do you say ___ in
     Korean?" with Korean options) or the reverse (rev -- e.g. shows the Korean word, English
     options). A card's own `choices` field (if the deck author filled one in) is only used for the
     forward direction, since it was written as alternatives to `back`; the reverse direction, and
     any card with no manual choices at all, draws its wrong answers from OTHER cards in the same
     deck instead -- which is also what lets a plain flip-mode deck (like Wendy's Korean Vocabulary,
     with no choices authored at all) be quizzed as multiple choice with zero extra data entry. */
  var TIMED_CHOICE_GROUP_SIZE = 3;   // how many cards in a row share the same question direction before re-rolling
  var TIMED_CHOICE_BASE_SECONDS = 6; // starting point before the length/difficulty adjustments below
  var TIMED_CHOICE_MIN_SECONDS = 5;
  var TIMED_CHOICE_MAX_SECONDS = 15;
  var TIMED_CHOICE_ADD_SECONDS = 5;  // how much the "+time" button adds, per tap
  var TIMED_CHOICE_MAX_ADDS = 2;      // the "+time" button can only be used twice per card

  // Longer text to read (either side) earns more time to scan the options, and a card the learner
  // has actually struggled with (per the SM-2 stats every card already tracks -- lapses, leech
  // status, learning state, and the plain timesCorrect/timesSeen accuracy ratio) earns more too.
  // A short, well-known word gets the tightest timer; a long phrase the learner keeps missing gets
  // the most breathing room. Always clamped to a sane range so it never feels impossibly short or
  // pointlessly long.
  // A card can carry its own fixed countdown instead (card.tcSeconds, set from the editor's "Timer"
  // field) -- meant for longer, worked problems (e.g. a math quiz at 60 or 120 seconds) where the
  // automatic 5-15 second vocab timing makes no sense. The "+time" button then scales with it:
  // card.tcAddSeconds if set, otherwise about a quarter of the timer rounded to 5s (60s -> +15s,
  // 120s -> +30s), still capped at TIMED_CHOICE_MAX_ADDS uses per card.
  function timedChoiceCustomSeconds(card){
    var s = parseInt(card && card.tcSeconds, 10);
    return (s && s > 0) ? Math.max(5, Math.min(600, s)) : 0;
  }
  function timedChoiceAddSeconds(card){
    if(!timedChoiceCustomSeconds(card)) return TIMED_CHOICE_ADD_SECONDS;
    var a = parseInt(card.tcAddSeconds, 10);
    if(a && a > 0) return Math.min(300, a);
    return Math.max(5, Math.round(timedChoiceCustomSeconds(card) / 4 / 5) * 5);
  }
  function formatSecondsLeft(ms){
    var s = Math.max(0, Math.ceil(ms / 1000));
    return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
  }

  function timedChoiceSeconds(card, promptText, answerText){
    var custom = timedChoiceCustomSeconds(card);
    if(custom) return custom;
    var textLen = Math.max(String(promptText||'').length, String(answerText||'').length);
    var readingBonus = Math.max(0, (textLen - 6) * 0.22);
    var struggleBonus = 0;
    if(card.isLeech) struggleBonus = 4;
    else if((card.lapses||0) >= 2 || card.state === 'learning') struggleBonus = 2;
    else if(card.timesSeen){
      var acc = (card.timesCorrect||0) / card.timesSeen;
      if(acc < 0.5) struggleBonus = 3;
      else if(acc < 0.8) struggleBonus = 1;
    }
    var seconds = TIMED_CHOICE_BASE_SECONDS + readingBonus + struggleBonus;
    return Math.max(TIMED_CHOICE_MIN_SECONDS, Math.min(TIMED_CHOICE_MAX_SECONDS, Math.round(seconds)));
  }

  // Builds a fresh { direction, prompt, answer, options } for a card just entering 'timedchoice'
  // mode -- re-rolling the shared direction every TIMED_CHOICE_GROUP_SIZE cards, then sourcing wrong
  // answers from the card's own `choices` (forward direction only) or, failing that, from sibling
  // cards' opposite field in S.timedChoiceAllCards.
  function buildTimedChoiceRound(card){
    // A card with its own hand-written wrong answers is a real question (e.g. "Factor 6x² + 7x − 3"),
    // not a two-sided vocab pair -- flipping it would show the answer as the question and other cards'
    // questions as options, which is nonsense. Those cards always ask front -> back and don't use up a
    // slot in the shared direction streak. Plain vocab cards (no manual choices) mix directions as before.
    var hasManualChoices = !!(card.choices && card.choices.length);
    var direction;
    if(hasManualChoices){
      direction = 'fwd';
    } else {
      if(S.timedChoiceGroupLeft <= 0){
        S.timedChoiceDirection = Math.random() < 0.5 ? 'fwd' : 'rev';
        S.timedChoiceGroupLeft = TIMED_CHOICE_GROUP_SIZE;
      }
      S.timedChoiceGroupLeft -= 1;
      direction = S.timedChoiceDirection;
    }
    var promptText = direction === 'fwd' ? card.front : card.back;
    var answerText = direction === 'fwd' ? card.back : card.front;
    var siblingField = direction === 'fwd' ? 'back' : 'front';
    var wrongOpts = (direction === 'fwd' && card.choices && card.choices.length) ? card.choices.slice() : null;
    if(!wrongOpts || !wrongOpts.length){
      var siblings = (S.timedChoiceAllCards || []).filter(function(c){ return c.id !== card.id; });
      wrongOpts = shuffle(siblings).map(function(c){ return c[siblingField]; })
        .filter(function(v, idx, arr){ return v && v !== answerText && arr.indexOf(v) === idx; })
        .slice(0, 3);
    }
    var seconds = timedChoiceSeconds(card, promptText, answerText);
    return {
      cardId: card.id,
      direction: direction,
      prompt: promptText,
      answer: answerText,
      options: shuffle([answerText].concat(wrongOpts)),
      selected: null,
      totalSeconds: seconds,
      deadline: Date.now() + seconds*1000,
      secondsAdded: 0,
      timesAdded: 0,
      addSeconds: timedChoiceAddSeconds(card),
      custom: !!timedChoiceCustomSeconds(card),
      expired: false
    };
  }

  function timedChoiceTimerHTML(tc){
    var remaining = Math.max(0, tc.deadline - Date.now());
    var totalMs = (tc.totalSeconds + tc.secondsAdded) * 1000;
    var pct = totalMs > 0 ? Math.max(0, Math.min(100, (remaining/totalMs)*100)) : 0;
    var addsLeft = TIMED_CHOICE_MAX_ADDS - (tc.timesAdded||0);
    var addSecs = tc.addSeconds || TIMED_CHOICE_ADD_SECONDS;
    var addBtnHTML = addsLeft > 0 ?
      '<button type="button" class="btn btn-ghost tc-addtime-btn" data-act="tc-add-time">⏱️ +'+addSecs+'s</button>' :
      '<button type="button" class="btn btn-ghost tc-addtime-btn" disabled>⏱️ No more time</button>';
    return '' +
      '<div class="tc-timer-row" style="position:relative;z-index:1;">' +
        '<div class="tc-timer-track"><div class="tc-timer-fill'+(pct < 30 ? ' tc-low' : '')+'" id="tcTimerFill" style="width:'+pct+'%"></div></div>' +
        (tc.custom ? '<span class="tc-time-left" id="tcTimeLeft">'+formatSecondsLeft(remaining)+'</span>' : '') +
        addBtnHTML +
      '</div>';
  }

  // The fixed 2.5s/6s "fast/slow" thresholds are for quick vocab cards -- on a card with its own long
  // timer (e.g. 120 seconds for a worked problem) every correct answer would count as "slow". Those
  // cards scale the thresholds to their own timer instead: first 35% = fast, up to 75% = normal.
  function timedChoiceRating(tc, correct, elapsed){
    if(!correct || !tc || !tc.custom) return autoRating('timedchoice', correct, elapsed);
    var algo = S.settings.algorithm || 'sm2_speed';
    if(algo !== 'sm2_speed') return 'good';
    var total = tc.totalSeconds * 1000;
    if(elapsed <= total * 0.35) return 'easy';
    if(elapsed <= total * 0.75) return 'good';
    return 'hard';
  }

  function clearTimedChoiceTimer(){
    if(S.timedChoiceTimerHandle){ clearInterval(S.timedChoiceTimerHandle); S.timedChoiceTimerHandle = null; }
  }

  // Drives the countdown bar via direct DOM updates (not render()) every 100ms so it animates
  // smoothly without re-rendering the whole screen every tick. Self-cancels the moment anything
  // about the situation has changed underneath it (a different card, an answer already picked, the
  // view navigated away) rather than relying on every possible exit path to clear it explicitly.
  function wireTimedChoiceTimer(card){
    clearTimedChoiceTimer();
    S.timedChoiceTimerHandle = setInterval(function(){
      var tc = S.timedChoiceState;
      if(S.view !== 'study' || !tc || tc.cardId !== card.id || tc.selected != null || tc.expired){
        clearTimedChoiceTimer();
        return;
      }
      var remaining = tc.deadline - Date.now();
      var totalMs = (tc.totalSeconds + tc.secondsAdded) * 1000;
      var fillEl = document.getElementById('tcTimerFill');
      if(fillEl){
        var pct = totalMs > 0 ? Math.max(0, Math.min(100, (remaining/totalMs)*100)) : 0;
        fillEl.style.width = pct + '%';
        fillEl.classList.toggle('tc-low', pct < 30);
      }
      var leftEl = document.getElementById('tcTimeLeft');
      if(leftEl) leftEl.textContent = formatSecondsLeft(remaining);
      if(remaining <= 0){
        clearTimedChoiceTimer();
        tc.expired = true;
        Sound.wrong();
        render();
        var elapsed = (tc.totalSeconds + tc.secondsAdded) * 1000;
        setTimeout(function(){ grade(timedChoiceRating(tc, false, elapsed), true); }, 1400 + WRONG_EXTRA_MS);
      }
    }, 100);
  }

  /* ---------- sound-out blend ("Blend" mode) ----------
     A seventh per-card mode, alongside flip/read/choice/match/blank/timedchoice: front-only, like
     read mode (no grading of a specific answer -- self-reported via the usual outcome row). The
     card's front word is broken into "sound chunks" (c-a-t, or sh-i-p if a parent types those in
     manually) and shown as a row of dim letter tiles under a horizontal slider. Dragging the slider
     handle from left to right lights up each chunk in turn as the handle passes it, speaking that
     chunk's sound as it lights -- a classic "blend the sounds together" phonics exercise -- and once
     the handle reaches the far right, the whole word is spoken once to conclude it. A card's own
     `blendChunks` field (if a parent filled one in, comma-separated in the editor) is used only when
     present; otherwise chunks are auto-generated from the front text (see autoBlendChunks below), so
     -- same philosophy as Timed Choice's auto-distractors -- the mode works immediately on any card
     with zero extra setup, and can be hand-tuned later for trickier digraphs/blends. */
  // A multi-word phrase blends word-by-word (dragging through "How are you?" lights up How, then are,
  // then you?); a single word blends letter-by-letter -- Array.from() splits by Unicode code point,
  // not UTF-16 code unit, so this also gives exactly one chunk per Hangul syllable block for Korean
  // words for free (each syllable block, e.g. 안, is one code point), not a mangled half-character.
  function autoBlendChunks(word){
    var str = String(word||'').trim();
    if(!str) return [];
    if(/\s/.test(str)) return str.split(/\s+/).filter(Boolean);
    return Array.from(str);
  }
  /* ---------- Hangul Blend ----------
     A Korean word blends letter by letter (jamo), the way Hangul is taught: ㄱ + ㅏ = 가, then ㅂ + ㅏ + ㅇ
     = 방. The consonant alone has no sound of its own to say, so it just lights up; the vowel speaks
     the syllable built so far (가, 바), a final consonant speaks the finished syllable (방), and the
     whole word is said at the end. The block being built shows above the letters as it grows. Used
     automatically for any Hangul card with no hand-typed sound chunks. */
  var HANGUL_L = 'ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ'.split('');
  var HANGUL_V = 'ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ'.split('');
  var HANGUL_T = ['','ㄱ','ㄲ','ㄳ','ㄴ','ㄵ','ㄶ','ㄷ','ㄹ','ㄺ','ㄻ','ㄼ','ㄽ','ㄾ','ㄿ','ㅀ','ㅁ','ㅂ','ㅄ','ㅅ','ㅆ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
  function isHangulSyllable(ch){ var c = ch.charCodeAt(0); return c >= 0xAC00 && c <= 0xD7A3; }
  function isHangulWord(word){
    var s = String(word||'').replace(/\s+/g,'');
    return !!s && Array.from(s).every(isHangulSyllable);
  }
  function hangulCompose(l, v, t){ return String.fromCharCode(0xAC00 + (l*21 + v)*28 + (t||0)); }
  // -> { chunks:[jamo], say:[text|null], syl:[syllable index], parts:[{l,v,t}] }
  function hangulBlendPlan(word){
    var plan = { chunks: [], say: [], syl: [], parts: [] };
    Array.from(String(word||'')).forEach(function(ch){
      if(!isHangulSyllable(ch)) return;
      var code = ch.charCodeAt(0) - 0xAC00, l = Math.floor(code/588), v = Math.floor((code%588)/28), t = code % 28;
      var si = plan.parts.length;
      plan.parts.push({ l:l, v:v, t:t, ch:ch });
      plan.chunks.push(HANGUL_L[l]); plan.say.push(null); plan.syl.push(si);
      plan.chunks.push(HANGUL_V[v]); plan.say.push(hangulCompose(l, v, 0)); plan.syl.push(si);
      if(t){ plan.chunks.push(HANGUL_T[t]); plan.say.push(ch); plan.syl.push(si); }
    });
    return plan;
  }
  // What the word looks like with the first `n` letters placed: whole blocks so far, plus the block
  // being built (a lone consonant shows as itself, consonant+vowel as the open syllable).
  function hangulBuiltHTML(bd, n){
    if(!bd.hangul) return '';
    var out = '', parts = bd.hangul.parts;
    for(var si = 0; si < parts.length; si++){
      var idx = [];
      for(var i = 0; i < bd.chunks.length; i++){ if(bd.hangul.syl[i] === si) idx.push(i); }
      var got = idx.filter(function(i){ return i < n; }).length;
      if(!got) break;
      var p = parts[si];
      if(got === idx.length){ out += esc(p.ch); continue; }
      out += '<span class="partial">' + esc(got === 1 ? HANGUL_L[p.l] : hangulCompose(p.l, p.v, 0)) + '</span>';
      break;
    }
    return out;
  }

  function blendChunksFor(card){
    return (card.blendChunks && card.blendChunks.length) ? card.blendChunks.slice() : autoBlendChunks(card.front);
  }

  // Scales the word's chunk font-size and the slider's draggable width together so a short word
  // (e.g. "at", 2 chunks) gets a short slider and big letters, and a longer word (e.g. "shed",
  // 3-4 chunks, or a multi-word phrase) gets a longer slider and smaller letters -- rather than
  // every word sharing one fixed 340px track regardless of length. Stepped rather than a smooth
  // formula so it stays predictable at the handful of chunk-counts real cards actually have.
  function blendSizingFor(chunkCount){
    var n = Math.max(1, chunkCount || 1);
    var steps = [
      { max: 2, trackPx: 140, fontRem: 2.4 },
      { max: 3, trackPx: 180, fontRem: 2.0 },
      { max: 4, trackPx: 225, fontRem: 1.7 },
      { max: 5, trackPx: 270, fontRem: 1.45 },
      { max: 6, trackPx: 310, fontRem: 1.25 }
    ];
    for(var i = 0; i < steps.length; i++){ if(n <= steps[i].max) return steps[i]; }
    return { trackPx: 340, fontRem: 1.1 };
  }

  function blendSliderHTML(bd, bsz){
    bsz = bsz || blendSizingFor(bd.chunks.length);
    return '' +
      '<div class="blend-slider-row" style="position:relative;z-index:1;">' +
        '<div class="blend-slider-track'+(bd.done?' blend-done':'')+'" id="blendTrack" style="max-width:'+bsz.trackPx+'px;">' +
          '<div class="blend-slider-fill" id="blendFill" style="width:'+bd.pct+'%"></div>' +
          '<div class="blend-slider-handle'+(bd.done?' blend-handle-done':'')+'" id="blendHandle" style="left:'+bd.pct+'%">🐚</div>' +
        '</div>' +
      '</div>';
  }

  // Direct DOM updates while dragging (not render()) for the same smoothness reasons as the timed-
  // choice countdown bar -- a render() per pointermove would be both wasteful and janky. render() is
  // only called once, after the drag finishes at the far right, to swap in the outcome row.
  function wireBlendSlider(card){
    var bd = S.blendState;
    if(!bd || bd.cardId !== card.id) return;
    var track = app.querySelector('#blendTrack');
    var fill = app.querySelector('#blendFill');
    var handle = app.querySelector('#blendHandle');
    var hintEl = app.querySelector('#blendHint');
    if(!track || !fill || !handle) return;
    var activePid = null;

    // Swaps the hint/feedback line's text in place (not via render()) so a full card mode isn't
    // rebuilt mid-drag -- rebuilding would tear down and recreate #blendTrack, silently dropping
    // the pointer capture set on it and breaking the gesture already in progress.
    function setDoneUI(isDone){
      if(!hintEl) return;
      hintEl.className = isDone ? 'choice-feedback ok' : 'flip-hint';
      hintEl.textContent = isDone ? ('Nice blending! 🎉' + (bd.hangul && card.back ? ' — ' + card.back : '')) : 'Drag the shell all the way to the right 🐚';
    }

    function pctFromClientX(clientX){
      var rect = track.getBoundingClientRect();
      if(rect.width <= 0) return bd.pct;
      return Math.max(0, Math.min(100, ((clientX - rect.left) / rect.width) * 100));
    }
    function applyPct(pct){
      bd.pct = pct;
      fill.style.width = pct + '%';
      handle.style.left = pct + '%';
      var newRevealed = pct >= 100 ? bd.chunks.length : Math.floor((pct/100) * bd.chunks.length);
      if(newRevealed > bd.revealedCount){
        for(var i = bd.revealedCount; i < newRevealed; i++){
          var span = app.querySelector('[data-blend-chunk="'+i+'"]');
          if(span) span.classList.add('lit');
          // The very last chunk's sound is deliberately skipped here when the drag has already
          // reached the end -- it's spoken once, cleanly, by the speakThen-chained pair below
          // instead of twice back-to-back (Speech.speak() cancels any speech already in flight,
          // so a second, immediate call here would just cut the first one off anyway).
          var isFinalAtEnd = (pct >= 100 && i === bd.chunks.length - 1);
          if(!isFinalAtEnd){
            if(bd.hangul){ if(bd.hangul.say[i]) Speech.speak(bd.hangul.say[i]); else Sound.tap(); } // a lone consonant has no sound to say -- it just lights up
            else Speech.speak(bd.chunks[i]);
          }
        }
      } else if(newRevealed < bd.revealedCount){
        // Dragging back left un-lights the chunks past the new position, same as they'd never
        // been revealed -- dragging forward through them again re-lights and re-speaks them.
        for(var j = newRevealed; j < bd.revealedCount; j++){
          var span2 = app.querySelector('[data-blend-chunk="'+j+'"]');
          if(span2) span2.classList.remove('lit');
        }
      }
      bd.revealedCount = newRevealed;
      if(bd.hangul){ var builtEl = app.querySelector('#blendBuilt'); if(builtEl) builtEl.innerHTML = hangulBuiltHTML(bd, newRevealed); }

      if(pct >= 100 && !bd.done){
        bd.done = true;
        track.classList.add('blend-done');
        handle.classList.add('blend-handle-done');
        setDoneUI(true);
        Sound.correct();
        var elapsed = Date.now() - (S.cardShownAt || Date.now());
        bd.elapsedAtDone = elapsed;
        // No outcome buttons for Blend mode -- it grades and auto-advances itself once the whole
        // word has actually been heard, chaining speakThen calls so the grade doesn't fire until
        // playback truly finishes (not just once the drag hits 100%). A card mode is always
        // "correct" here -- there's no wrong answer to a sound-out slide, so autoRating just times
        // how long the drag took, same as it would for a self-reported right answer elsewhere.
        // doneGen guards this chain: if the child drags back left before it resolves, the cancel
        // branch below bumps doneGen and every stale callback here bails out instead of grading.
        var doneGen = (bd.doneGen = (bd.doneGen || 0) + 1);
        // Safety net on top of speakThen's own watchdog: whatever happens with the audio, the card
        // moves on a few seconds after the slide finishes, so a round can never get stuck here.
        bd.fallbackTimer = setTimeout(function(){
          if(bd.doneGen !== doneGen) return;
          if(S.view === 'study' && S.blendState === bd && S.studyQueue[0] && S.studyQueue[0].id === card.id){
            grade(autoRating('blend', true, elapsed));
          }
        }, 5000);
        var lastSay = bd.hangul ? (bd.hangul.parts.length ? bd.hangul.parts[bd.hangul.parts.length-1].ch : card.front) : bd.chunks[bd.chunks.length - 1];
        Speech.speakThen(lastSay || card.front, function(){
          if(bd.doneGen !== doneGen) return;
          Speech.speakThen(card.front, function(){
            if(bd.doneGen !== doneGen) return;
            bd.autoGradeTimer = setTimeout(function(){
              if(bd.doneGen !== doneGen) return;
              if(S.view === 'study' && S.blendState === bd && S.studyQueue[0] && S.studyQueue[0].id === card.id){
                grade(autoRating('blend', true, elapsed));
              }
            }, 450);
          });
        });
      } else if(pct < 100 && bd.done){
        // Dragged back left after finishing -- cancel the pending auto-grade/advance and let the
        // child slide through it again (e.g. to re-hear a tricky chunk) instead of locking them out.
        bd.done = false;
        bd.doneGen = (bd.doneGen || 0) + 1;
        track.classList.remove('blend-done');
        handle.classList.remove('blend-handle-done');
        setDoneUI(false);
        if(bd.autoGradeTimer){ clearTimeout(bd.autoGradeTimer); bd.autoGradeTimer = null; }
        if(bd.fallbackTimer){ clearTimeout(bd.fallbackTimer); bd.fallbackTimer = null; }
      }
    }
    // Every listener here stops the pointer event from bubbling up to the study stage's own
    // swipe-to-peek-back gesture (wireSwipe listens for pointerdown on the stage itself, and a
    // pointerdown on this track is still, structurally, a pointerdown on the stage since it
    // bubbles). Without this, starting to drag the slider also kicked off a vertical card-swipe
    // underneath it -- the "scrolling" glitch reported on Sound Blend cards.
    track.addEventListener('pointerdown', function(e){
      e.stopPropagation();
      activePid = e.pointerId;
      try { track.setPointerCapture(activePid); } catch(err){}
      applyPct(pctFromClientX(e.clientX));
    });
    track.addEventListener('pointermove', function(e){
      if(activePid == null || e.pointerId !== activePid) return;
      e.stopPropagation();
      applyPct(pctFromClientX(e.clientX));
    });
    function endDrag(e){
      if(activePid == null || (e && e.pointerId !== activePid)) return;
      e.stopPropagation();
      activePid = null;
    }
    track.addEventListener('pointerup', endDrag);
    track.addEventListener('pointercancel', endDrag);
  }

  /* ---------- Listen & Pick ("listen" card mode) ----------
     The card's front is spoken and NOT shown; the learner picks what they heard. Answers are the card's
     meaning (back) by default, or the written word itself (front) when the card says so or has no
     meaning -- that second kind is a "sound twins" drill when the wrong answers sound alike (달 / 탈 / 딸).
     With no hand-typed wrong answers, they come from other cards in the deck, preferring ones that look
     and sound most like the right one. Graded automatically, like multiple choice. */
  function listenAnswerSide(card){ return (card.listenAnswer === 'front' || !String(card.back||'').trim()) ? 'front' : 'back'; }
  function lookAlikeLetters(str){
    var out = [];
    Array.from(String(str||'').toLowerCase()).forEach(function(ch){
      if(isHangulSyllable(ch)){ var p = hangulBlendPlan(ch); out = out.concat(p.chunks); }
      else if(/\S/.test(ch)) out.push(ch);
    });
    return out;
  }
  function lookAlikeScore(a, b){
    var x = lookAlikeLetters(a), y = lookAlikeLetters(b);
    if(!x.length || !y.length) return 0;
    var pool = y.slice(), same = 0;

        e.stopPropagation();

        if(bs.placed.length >= bs.words.length) return;
        var t = bs.tiles.filter(function(x){ return x.id === b.dataset.buildTile; })[0];
        if(!t) return;
        bs.placed.push(t.id); if(bs.result === 'retry') bs.result = null;
        Speech.speak(t.t);
        if(bs.placed.length === bs.words.length) check(); else render();
      });
    });
    app.querySelectorAll('[data-build-placed]').forEach(function(b){
      b.addEventListener('click', function(e){
        e.stopPropagation();
        var i = parseInt(b.dataset.buildPlaced, 10);
        if(bs.result === 'right' || bs.result === 'shown' || bs.locked.indexOf(i) !== -1) return;
        bs.placed.splice(i, 1); render();
      });
    });
    var u = app.querySelector('[data-act="build-undo"]');
    if(u) u.addEventListener('click', function(e){ e.stopPropagation(); if(bs.placed.length > bs.locked.length){ bs.placed.pop(); render(); } });
    var h = app.querySelector('[data-act="build-hear"]');
    if(h) h.addEventListener('click', function(e){ e.stopPropagation(); if(bs.result == null || bs.result === 'retry') bs.hint = true; Speech.speak(card.front); });
  }

  /* ---------- Chinese bridge ("hanja" card mode): Korean words built from Chinese characters ----------
     For a learner who reads Chinese (Traditional first). A card carries the Korean word (front), its
     meaning (back), the Hanja as written in Korea (hanja), the Chinese in Traditional (zh, Taiwan
     standard) and Simplified (zhS), pinyin (py, one syllable per character), the Hangul those
     characters spell (sino) and a group: 'same' (Chinese uses the same word), 'helps' (the characters
     point the way, but Chinese says it differently: zhSay) or 'false' (the Chinese word exists but
     means something else). One direction per card, alternating each time the card comes round: see
     and hear the Chinese, pick the Korean; or see and hear the Korean, pick the Chinese. After
     answering, each character lines up with its Korean sound (學 → 학, xué), and each column can be
     tapped to hear the character in Mandarin, then in Korean. Mandarin comes from the voice pack
     (variant 'zh'); "Next" moves on (no timer: the bridge is the part worth reading). */
  var HANJA_GROUPS = {
    same: { icon:'🟢', label:'Same in Chinese' },
    helps: { icon:'🟡', label:'The characters help' },
    'false': { icon:'🔴', label:'False friend' }
  };
  function hanjaZh(card){ return String(card.zh || card.hanja || '').trim(); }
  function hanjaSayZh(text){ Speech.speak(text, { variant:'zh' }); }
  function hanjaRound(card){
    // directions take turns through a round; a card seen before starts from the other side next time
    S.hzTurn = (S.hzTurn || 0) + 1;
    var dir = ((S.hzTurn + (card.timesSeen || 0)) % 2) ? 'zh2ko' : 'ko2zh';
    var answer = dir === 'zh2ko' ? String(card.front || '').trim() : hanjaZh(card);
    var pool = (S.timedChoiceAllCards || []).filter(function(c){ return c.id !== card.id && c.mode === 'hanja'; });
    var seen = {}; seen[answer] = 1;
    var cand = pool.map(function(c){ return dir === 'zh2ko' ? String(c.front || '').trim() : hanjaZh(c); })
      .filter(function(v){ if(!v || seen[v]) return false; seen[v] = 1; return true; });
    // Look-alikes first (a shared character or syllable, a similar length), so the characters have to be read.
    var share = function(v){ var n = 0; Array.from(v).forEach(function(ch){ if(/\S/.test(ch) && answer.indexOf(ch) !== -1) n++; }); return n * 2 - Math.abs(Array.from(v).length - Array.from(answer).length); };
    cand.sort(function(a, b){ return share(b) - share(a); });
    var wrong = shuffle(cand.slice(0, 6)).slice(0, 3);
    return { cardId: card.id, dir: dir, answer: answer, options: shuffle([answer].concat(wrong)), selected: null, played: false };
  }
  // 學 → 학 / xué, one tappable column per character
  function hanjaBridgeHTML(card){
    var tr = Array.from(hanjaZh(card)), sp = Array.from(String(card.zhS || '')), ko = Array.from(String(card.sino || '')), py = String(card.py || '').split(/\s+/);
    if(!tr.length) return '';
    return '<div class="hz-bridge" aria-label="Character by character. Tap a character to hear it.">' + tr.map(function(t, i){
      var s = sp[i];
      return '<button type="button" class="hz-col" data-hz-ch="'+i+'" aria-label="'+esc(t)+', '+esc(py[i] || '')+' in Mandarin, '+esc(ko[i] || '')+' in Korean">' +
        '<span class="hz-ch" lang="zh-Hant">'+esc(t)+(s && s !== t ? '<small lang="zh-Hans">'+esc(s)+'</small>' : '')+'</span>' +
        '<span class="hz-ko" lang="ko">'+esc(ko[i] || '')+'</span><span class="hz-py">'+esc(py[i] || '')+'</span></button>';
    }).join('<span class="hz-plus" aria-hidden="true">+</span>') + '</div>';
  }
  function hanjaKoHTML(card){
    var w = String(card.front || ''), s = String(card.sino || '');
    var i = s ? w.indexOf(s) : -1;
    if(i < 0) return esc(w);
    return esc(w.slice(0, i)) + '<mark class="hz-mark">' + esc(s) + '</mark>' + esc(w.slice(i + s.length));
  }
  function hanjaStageHTML(card){
    if(!S.hanjaState || S.hanjaState.cardId !== card.id) S.hanjaState = hanjaRound(card);
    var hs = S.hanjaState, done = hs.selected != null, right = done && hs.options[hs.selected] === hs.answer;
    var zh = hanjaZh(card), sp = String(card.zhS || ''), kr = String(card.hanja || '');
    var extra = (sp && sp !== zh ? '<span>简 <b lang="zh-Hans">'+esc(sp)+'</b></span>' : '') + (kr && kr !== zh ? '<span>in Korea <b lang="ko">'+esc(kr)+'</b></span>' : '');
    var prompt = hs.dir === 'zh2ko'
      ? '<div class="read-label">🀄 Which Korean word?</div><div class="card-text hz-zh" lang="zh-Hant">'+esc(zh)+'</div>' +
        (card.py ? '<div class="hz-pinyin">'+esc(card.py)+'</div>' : '') + (extra ? '<div class="hz-trad">'+extra+'</div>' : '') +
        '<button type="button" class="btn btn-ghost hz-hear" data-act="hz-hear-zh" aria-label="Hear it in Mandarin">🔊 Mandarin</button>'
      : '<div class="read-label">🀄 Which Chinese characters?</div><div class="card-text" lang="ko">'+esc(card.front)+'</div>' +
        '<button type="button" class="btn btn-ghost hz-hear" data-act="hz-hear-ko" aria-label="Hear the Korean word">🔊 Korean</button>';
    var opts = hs.options.map(function(o, i){
      var cls = 'choice-btn hz-opt' + (hs.dir === 'ko2zh' ? ' hz-opt-zh' : '');
      if(done){ if(o === hs.answer) cls += ' correct'; else if(i === hs.selected) cls += ' wrong'; }
      return '<button type="button" class="'+cls+'" data-hz-idx="'+i+'" lang="'+(hs.dir === 'zh2ko' ? 'ko' : 'zh-Hant')+'"'+(done ? ' disabled' : '')+'>'+esc(o)+'</button>';
    }).join('');
    var g = HANJA_GROUPS[card.hzClass] || HANJA_GROUPS.same;
    var reveal = done ? '' +
      '<div class="hz-reveal">' +
        '<div class="hz-word" lang="ko">'+hanjaKoHTML(card)+'<span class="hz-mean">'+esc(card.back || '')+'</span></div>' +
        hanjaBridgeHTML(card) +
        '<div class="hz-group hz-'+esc(card.hzClass || 'same')+'"><span>'+g.icon+' '+g.label+'</span>' +
          (card.zhSay ? '<button type="button" class="hz-say" data-act="hz-say" aria-label="Chinese says '+esc(card.zhSay)+'. Hear it">Chinese says <b lang="zh-Hant">'+esc(card.zhSay)+'</b>'+(card.zhSayS && card.zhSayS !== card.zhSay ? ' <small lang="zh-Hans">'+esc(card.zhSayS)+'</small>' : '')+' 🔊</button>' : '') + '</div>' +
        (card.note ? '<p class="hz-note">'+esc(card.note)+'</p>' : '') +
      '</div>' : '';
    return '' +
      '<div class="flip-scene" style="position:relative;z-index:1;">' +
        '<div class="face face-front read-face hz-face">' + prompt + reveal + '</div>' +
      '</div>' +
      (done ? '' : '<div class="choice-row">'+opts+'</div>') +
      (done
        ? '<div class="choice-feedback '+(right ? 'ok' : 'no')+'">'+(right ? 'Nice reading! 🎉' : gentleMiss('Good try!', hs.answer))+'</div>' +
          '<div class="form-actions hz-next-row"><button type="button" class="btn btn-primary" data-act="hz-next">Next ▸</button></div>'
        : '<div class="flip-hint" style="position:relative;z-index:1;">'+(hs.dir === 'zh2ko' ? 'Read the characters, then pick the Korean' : 'Pick the Chinese for this Korean word')+'</div>');
  }
  function wireHanja(card){
    var hs = S.hanjaState; if(!hs) return;
    var on = function(sel, fn){ var b = app.querySelector(sel); if(b) b.addEventListener('click', function(e){ e.stopPropagation(); fn(b); }); };
    on('[data-act="hz-hear-zh"]', function(){ hanjaSayZh(hanjaZh(card)); });
    on('[data-act="hz-hear-ko"]', function(){ Speech.speak(card.front); });
    on('[data-act="hz-say"]', function(){ hanjaSayZh(String(card.zhSay || '').split('/')[0].trim()); });
    // the first time a card shows, it speaks its prompt: Mandarin for Chinese, Korean for Korean
    if(!hs.played){ hs.played = true; setTimeout(function(){ if(S.view === 'study' && S.hanjaState === hs && hs.selected == null){ if(hs.dir === 'zh2ko') hanjaSayZh(hanjaZh(card)); else Speech.speak(card.front); } }, 350); }
    var tr = Array.from(hanjaZh(card)), ko = Array.from(String(card.sino || ''));
    app.querySelectorAll('[data-hz-ch]').forEach(function(btn){
      btn.addEventListener('click', function(e){
        e.stopPropagation(); var i = parseInt(btn.dataset.hzCh, 10);
        btn.classList.remove('ping'); void btn.offsetWidth; btn.classList.add('ping');
        Speech.speakThen(tr[i], function(){ if(ko[i]) setTimeout(function(){ Speech.speak(ko[i]); }, 180); }, { variant:'zh' });
      });
    });
    app.querySelectorAll('[data-hz-idx]').forEach(function(btn){
      btn.addEventListener('click', function(){
        if(hs.selected != null || S.transitioning || S.hanjaState !== hs) return;
        hs.selected = parseInt(btn.dataset.hzIdx, 10);
        var right = hs.options[hs.selected] === hs.answer;
        hs.elapsed = Date.now() - (S.cardShownAt || Date.now());
        hs.rating = autoRating('hanja', right, hs.elapsed);
        if(right) Sound.correct(); else Sound.wrong();
        render();
        // the Korean word then the Chinese, now that the characters are lined up under it
        setTimeout(function(){ if(S.view === 'study' && S.hanjaState === hs) Speech.speakThen(card.front, function(){ setTimeout(function(){ if(S.view === 'study' && S.hanjaState === hs) hanjaSayZh(hanjaZh(card)); }, 250); }); }, 250);
        var nx = app.querySelector('[data-act="hz-next"]'); if(nx) try { nx.focus({ preventScroll:true }); } catch(err){}
      });
    });
    on('[data-act="hz-next"]', function(){ if(hs.rating) grade(hs.rating, true); });
  }

  /* ---------- Native or Sino? ("numsys" card mode): which set of numbers fits the situation ----------
     Korean has two sets of numbers: native (하나, 둘, 셋 …; 한, 두, 세, 네 before a counter) and
     Sino-Korean (일, 이, 삼 …, from Chinese 一 二 三). A card shows a situation (emoji + English, e.g.
     🕒 Three o'clock) and the learner picks the right Korean (세 시, not 삼 시 or 셋 시). After
     answering: which set it uses, the phrase in pieces (세 = 3 (셋 → 세) + 시 = o'clock), the rule in
     one line, and "All the number rules" (every rule in the deck, grouped by set). Card fields:
     front (Korean answer), back (situation), nsEmoji, choices (wrong answers), nsSys
     (native|sino|both), nsRule (the rule, one line), nsParts ([[piece, gloss], …]). */
  var NUMSYS = {
    native: { icon:'🔤', label:'Native Korean numbers', eg:'하나 둘 셋 · 한 두 세 네' },
    sino: { icon:'🀄', label:'Sino-Korean numbers', eg:'일 이 삼 사 · from 一 二 三 四' },
    both: { icon:'🔤🀄', label:'Both sets together', eg:'' }
  };
  function numsysRound(card){
    var answer = String(card.front || '').trim();
    var wrong = (card.choices || []).map(function(x){ return String(x).trim(); }).filter(function(x){ return x && x !== answer; });
    if(wrong.length < 2){ // a hand-made card with few wrong answers borrows from the deck
      var more = shuffle((S.timedChoiceAllCards || []).filter(function(c){ return c.id !== card.id && c.mode === 'numsys'; }).map(function(c){ return String(c.front || '').trim(); }));
      more.forEach(function(x){ if(wrong.length < 3 && x && x !== answer && wrong.indexOf(x) === -1) wrong.push(x); });
    }
    return { cardId: card.id, answer: answer, options: shuffle([answer].concat(wrong.slice(0, 3))), selected: null };
  }
  function numsysRulesHTML(){
    var seen = {}, by = { native: [], sino: [], both: [] };
    (S.timedChoiceAllCards || []).forEach(function(c){
      if(c.mode !== 'numsys' || !c.nsRule || seen[c.nsRule]) return;
      seen[c.nsRule] = 1; (by[c.nsSys] || by.both).push(c.nsRule);
    });
    return ['native', 'sino', 'both'].filter(function(k){ return by[k].length; }).map(function(k){
      return '<div class="ns-rgroup"><b>'+NUMSYS[k].icon+' '+NUMSYS[k].label+'</b><ul>'+by[k].map(function(r){ return '<li lang="ko">'+esc(r)+'</li>'; }).join('')+'</ul></div>';
    }).join('');
  }
  function numsysStageHTML(card){
    if(!S.numsysState || S.numsysState.cardId !== card.id) S.numsysState = numsysRound(card);
    var ns = S.numsysState, done = ns.selected != null, right = done && ns.options[ns.selected] === ns.answer;
    var sys = NUMSYS[card.nsSys] || NUMSYS.native;
    var opts = ns.options.map(function(o, i){
      var cls = 'choice-btn ns-opt';
      if(done){ if(o === ns.answer) cls += ' correct'; else if(i === ns.selected) cls += ' wrong'; }
      return '<button type="button" class="'+cls+'" data-ns-idx="'+i+'" lang="ko"'+(done ? ' disabled' : '')+'>'+esc(o)+'</button>';
    }).join('');
    var parts = (card.nsParts || []).map(function(p){
      return '<div class="ns-part"><span class="ns-piece" lang="ko">'+esc(p[0])+'</span><span class="ns-gloss">'+esc(p[1] || '')+'</span></div>';
    }).join('<span class="hz-plus" aria-hidden="true">+</span>');
    var reveal = done ? '' +
      '<div class="hz-reveal ns-reveal">' +
        '<div class="hz-word" lang="ko">'+esc(card.front)+'<button type="button" class="btn btn-ghost hz-hear" data-act="ns-hear" aria-label="Hear it again">🔊</button></div>' +
        '<div class="ns-sys ns-'+esc(card.nsSys || 'native')+'">'+sys.icon+' '+sys.label+(sys.eg ? '<small lang="ko">'+esc(sys.eg)+'</small>' : '')+'</div>' +
        (parts ? '<div class="ns-parts">'+parts+'</div>' : '') +
        (card.nsRule ? '<p class="hz-note ns-rule" lang="ko">'+esc(card.nsRule)+'</p>' : '') +
        '<details class="ns-all"><summary>📋 All the number rules</summary>'+numsysRulesHTML()+'</details>' +
      '</div>' : '';
    return '' +
      '<div class="flip-scene" style="position:relative;z-index:1;">' +
        '<div class="face face-front read-face hz-face">' +
          '<div class="read-label">🔢 Native or Sino?</div>' +
          (card.nsEmoji ? '<div class="ns-emoji" aria-hidden="true">'+esc(card.nsEmoji)+'</div>' : '') +
          '<div class="card-text">'+esc(card.back || '')+'</div>' + reveal +
        '</div>' +
      '</div>' +
      (done ? '' : '<div class="choice-row">'+opts+'</div>') +
      (done
        ? '<div class="choice-feedback '+(right ? 'ok' : 'no')+'">'+(right ? 'Nice counting! 🎉' : gentleMiss('Good try!', ns.answer))+'</div>' +
          '<div class="form-actions hz-next-row"><button type="button" class="btn btn-primary" data-act="ns-next">Next ▸</button></div>'
        : '<div class="flip-hint" style="position:relative;z-index:1;">Which one would a Korean say?</div>');
  }
  function wireNumsys(card){
    var ns = S.numsysState; if(!ns) return;
    var hear = app.querySelector('[data-act="ns-hear"]');
    if(hear) hear.addEventListener('click', function(e){ e.stopPropagation(); Speech.speak(card.front); });
    var det = app.querySelector('.ns-all');
    if(det) det.addEventListener('click', function(e){ e.stopPropagation(); }); // opening the rules isn't a tap on the card
    app.querySelectorAll('[data-ns-idx]').forEach(function(btn){
      btn.addEventListener('click', function(){
        if(ns.selected != null || S.transitioning || S.numsysState !== ns) return;
        ns.selected = parseInt(btn.dataset.nsIdx, 10);
        var right = ns.options[ns.selected] === ns.answer;
        ns.rating = autoRating('numsys', right, Date.now() - (S.cardShownAt || Date.now()));
        if(right) Sound.correct(); else Sound.wrong();
        render();
        setTimeout(function(){ if(S.view === 'study' && S.numsysState === ns) Speech.speak(card.front); }, 250);
        var nx = app.querySelector('[data-act="ns-next"]'); if(nx) try { nx.focus({ preventScroll:true }); } catch(err){}
      });
    });
    var nx = app.querySelector('[data-act="ns-next"]');
    if(nx) nx.addEventListener('click', function(e){ e.stopPropagation(); if(ns.rating) grade(ns.rating, true); });
  }

  function renderStudy(){
    var deck = S.decks.find(function(d){ return d.id === S.currentDeckId; }) || {name:'Deck', emoji:'🌊'};
    if(!S.studyQueue.length){
      finishStudy();
      return;
    }
    var card = S.studyQueue[0];
    if(S.currentCardId !== card.id){
      // A new card is on stage — reset per-card UI state and start the response-time clock.
      S.currentCardId = card.id;
      S.cardShownAt = Date.now();
      S.cardFlippedAt = null;
      S.cardFlipped = false;
      S.choiceState = null;
      S.dragState = null;
      S.timedChoiceState = null;
      clearTimedChoiceTimer();
      S.blendState = null;
      S.listenState = null;
      echoReset();
      S.buildState = null;
      S.hanjaState = null;
      S.numsysState = null;
    }
    var mode = (CARD_MODES.indexOf(card.mode) !== -1) ? card.mode : 'flip';
    var peeking = S.peeking && !!S.lastAnsweredCard;
    var doneCount = S.sessionReviewed;
    var labelCount = peeking ? doneCount : (doneCount + 1);
    var progressBase = peeking ? Math.max(0, doneCount - 1) : doneCount;
    var progressPct = S.studyTotal > 0 ? Math.min(100, Math.max(0, Math.round((progressBase / S.studyTotal) * 100))) : 0;
    // The critter bar/fill are recreated from scratch on every render() (this whole screen is one
    // big innerHTML replace), so a plain CSS width/left transition never has a "before" state to
    // animate from — it just snaps. To make it travel smoothly instead, paint the bar at wherever
    // it last visually landed, then nudge it to the real value a frame later so the CSS transition
    // (already defined on .critter-track-fill / .critter-swim) has something to interpolate between.
    var startPct = S.critterPrevPct || 0;
    var critterHTML = '' +
      '<div class="critter-label">'+(peeking ? 'Reviewing question ' : 'Question ')+labelCount+' of '+S.studyTotal+'</div>' +
      '<div class="critter-track" role="progressbar" aria-label="Round progress" aria-valuemin="0" aria-valuemax="'+S.studyTotal+'" aria-valuenow="'+progressBase+'">' +
        '<div class="critter-track-fill" style="width:'+startPct+'%"></div>' +
        (S.studyTotal > 0 && S.studyTotal <= 40 ? '<div class="cove-dots" aria-hidden="true">'+Array.apply(null, Array(S.studyTotal)).map(function(_, i){ var k = i + 1; return '<i class="'+(k <= progressBase ? 'on' : '')+(k === S.studyTotal ? ' goal' : '')+'" style="left:'+(k / S.studyTotal * 100)+'%"></i>'; }).join('')+'</div>' : '') +
        '<div class="critter-swim'+(S.lastOutcomeWrong?' oops':'')+'" style="left:'+startPct+'%">'+critterSVG(S.lastOutcomeWrong)+'</div>' +
      '</div>';

    var stageInner;
    // cove: paint the card in the state it was last SHOWN in, then turn it a frame later, so tapping
    // the card actually plays the flip instead of the whole screen re-appearing already flipped.
    var coveFlipFrom = (S.__coveFlipCard === card.id && !peeking) ? !!S.__coveFlipShown : !!S.cardFlipped;
    var coveKey = card.id + '|' + S.sessionReviewed + '|' + (peeking ? 1 : 0);
    var coveSame = S.__coveStageKey === coveKey;
    if(peeking){
      stageInner = buildPeekInner(S.lastAnsweredCard);
    } else if(mode === 'read'){
      stageInner = '' +
        '<div class="flip-scene" style="position:relative;z-index:1;">' +
          '<div class="face face-front read-face">' +
            '<div class="read-label">🗣️ Read it out loud</div>' +
            (card.photoUrl?'<img class="card-photo" src="'+esc(card.photoUrl)+'" alt="">':'') +
            '<div class="card-text">'+esc(card.front)+'</div>' +
            (card.note?'<div class="card-note dim">'+esc(card.note)+'</div>':'') +
          '</div>' +
        '</div>' +
        '<div class="flip-hint" style="position:relative;z-index:1;">'+(currentDifficulty().id === 'hard' ? 'How well did they know it?' : 'Did they read it right?')+'</div>' +
        outcomeRowHTML();
    } else if(mode === 'choice'){
      if(!S.choiceState || S.choiceState.cardId !== card.id){
        S.choiceState = { cardId: card.id, options: shuffle([card.back].concat(card.choices||[])), selected: null };
      }
      var cs = S.choiceState;
      var pickedCorrect = cs.selected != null && cs.options[cs.selected] === card.back;
      var optsHTML = cs.options.map(function(opt, idx){
        var cls = 'choice-btn';
        if(cs.selected != null){
          if(opt === card.back) cls += ' correct';
          else if(idx === cs.selected) cls += ' wrong';
        }
        return '<button type="button" class="'+cls+'" data-choice-idx="'+idx+'" '+(cs.selected!=null?'disabled':'')+'>'+esc(opt)+'</button>';
      }).join('');
      var choiceFeedback = cs.selected == null
        ? '<div class="flip-hint" style="position:relative;z-index:1;">Tap an answer</div>'
        : '<div class="choice-feedback '+(pickedCorrect?'ok':'no')+'">'+(pickedCorrect ? 'Nice job! 🎉' : gentleMiss('Good try!', card.back))+'</div>';
      stageInner = '' +
        '<div class="flip-scene" style="position:relative;z-index:1;">' +
          '<div class="face face-front read-face">' +
            '<div class="read-label">🔘 Pick the answer</div>' +
            (card.photoUrl?'<img class="card-photo" src="'+esc(card.photoUrl)+'" alt="">':'') +
            '<div class="card-text">'+esc(card.front)+'</div>' +
          '</div>' +
        '</div>' +
        '<div class="choice-row">'+optsHTML+'</div>' +
        choiceFeedback;
    } else if(mode === 'timedchoice'){
      if(!S.timedChoiceState || S.timedChoiceState.cardId !== card.id){
        S.timedChoiceState = buildTimedChoiceRound(card);
        if(reefKid()){ S.timedChoiceState.deadline = Date.now() + 864e5; S.timedChoiceState.reefCalm = true; }
      }
      var tc = S.timedChoiceState;
      var tcDone = tc.selected != null || tc.expired;

    } else if(mode === 'blend'){

      var bsz = blendSizingFor(bd.hangul ? Math.min(6, bd.chunks.length) : bd.chunks.length);

        '<div class="flip-scene" style="position:relative;z-index:1;">' +
          '<div class="face face-front read-face">' +

      } else {

      stageInner = '' +
        '<div class="flip-scene" style="position:relative;z-index:1;">' +
          '<div class="face face-front read-face">' +

        dragFeedback;
    } else {
      // A "say the word" vocab card (answer side = the word itself) shows just the word on the back,
      // spoken aloud on flip -- no definition or story sentence underneath.
      var backIsWord = String(card.back||'').trim().toLowerCase() === String(card.front||'').trim().toLowerCase();
      stageInner = '' +
        '<div class="flip-scene" style="position:relative;z-index:1;">' +
          '<div class="flip-card '+(coveFlipFrom?'flipped':'')+'" id="flipCard">' +
            '<div class="face face-front">'+(card.photoUrl?'<img class="card-photo" src="'+esc(card.photoUrl)+'" alt="">':'')+'<div class="card-text">'+esc(card.front)+'</div></div>' +
            '<div class="face face-back"><div class="card-text">'+esc(card.back)+'</div>'+(card.note && !backIsWord?'<div class="card-note">'+esc(card.note)+'</div>':'')+(Speech.isSupported()?'<button type="button" class="replay-audio-btn" data-act="replay-audio">👂 Hear it again</button>':'')+'</div>' +
          '</div>' +
        '</div>' +
        '<div class="flip-hint" style="position:relative;z-index:1;">'+(S.cardFlipped ? (currentDifficulty().id === 'hard' ? 'How well did you know it?' : 'Be honest — did you get it right?') : '<button type="button" class="cove-flipbtn" data-cove-flip>↻ Tap the card to flip it</button>')+'</div>' +
        (S.cardFlipped ? outcomeRowHTML() : '');
    }

    app.innerHTML = '' +
      '<div class="nav-row">' +
        '<button class="back-btn" data-act="exit-study">⟵ Lagoon</button>' +
        '<span class="nav-title">'+deck.emoji+' '+esc(deck.name)+'</span>' +
        ctrlRowHTML() +
      '</div>' +
      critterHTML +
      '<div class="stage'+(peeking?' stage-peek':'')+(coveSame?' cove-still':'')+'">' +
        bubblesHTML(8) +
        stageInner +
      '</div>';

    // Now that the bar exists in the DOM at startPct, bump it to the real value on the next frame
    // so the CSS transition actually plays instead of the value just appearing already-set. Double
    // rAF (rather than one) makes sure the browser has painted the starting position first — a
    // single rAF can land in the same paint as the innerHTML write and skip straight to the target.
    (function(){
      var fillEl = app.querySelector('.critter-track-fill');
      var swimEl = app.querySelector('.critter-swim');
      requestAnimationFrame(function(){

          if(swimEl) swimEl.style.left = progressPct + '%';

      });
    })();

    S.__coveStageKey = coveKey;
    (function(){
      var fc = document.getElementById('flipCard'), want = !!S.cardFlipped;

    })();

    app.querySelector('[data-act="exit-study"]').addEventListener('click', function(){
      // In Adult Mode a grown-up is already in (no PIN was needed to get here), so backing out of a
      // deck early just returns to Manage Decks. The PIN guard below is a Child Mode-only protection

    if(mode === 'build') wireBuild(card);
    if(mode === 'hanja') wireHanja(card);
    if(mode === 'numsys') wireNumsys(card);
    if(mode === 'listen'){
      var lsNow0 = S.listenState;

      app.querySelectorAll('[data-tc-idx]').forEach(function(b){

    function coveWireGrade(root){
    root.querySelectorAll('[data-outcome]').forEach(function(b){
      b.addEventListener('click', function(e){

        var elapsed = Date.now() - (clock || Date.now());
        grade(autoRating(mode, correct, elapsed));
      });
    });
    // Hard-difficulty Anki-style grading buttons (Again/Hard/Good/Easy) — the child's own tap IS
    // the rating, so this skips autoRating()'s response-time guesswork entirely.
    root.querySelectorAll('[data-rating]').forEach(function(b){
      b.addEventListener('click', function(e){
        e.stopPropagation();
        if(dragJustHappened()) return;
        if(S.transitioning) return;
        grade(b.dataset.rating);
      });
